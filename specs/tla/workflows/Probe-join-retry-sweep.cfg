\* Probe-join-retry.cfg with one recovery sweep (CX18): a sweep whose read predates a branch failing for good re-runs it after the poller revives the run, and the new row turns retry-pending after another walk passed the join gate. Finds JoinWaitsForRetry.
CONSTANTS
  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"ok", "fail", "async"}
  MaxRetries = 1
  MaxSteps = 7
  MaxSweeps = 1
  MaxCrashes = 0
  UserCancel = TRUE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  ChildRunResume = FALSE
  TaskEndNoRetry = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
  FixStepFence = TRUE
  FixCancelTree = TRUE
  FixParkSiblings = TRUE
  FixSuccessorDebt = TRUE
  FixJoinRetryPending = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS TaskGenBound
PROPERTIES JoinWaitsForRetry
CHECK_DEADLOCK FALSE
