  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"async"}
  MaxRetries = 1
  MaxSteps = 6
  MaxSweeps = 0
  MaxCrashes = 0
  UserCancel = FALSE
  UserRetry = FALSE
  InputAwait = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = FALSE
  FixPollerRunGuard = FALSE
  FixPendingRetryGate = TRUE
  FixConcurrentJoin = FALSE
  FixRecoveryRetry = FALSE
  FixUserRetryLive = FALSE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS ExecutesOnce
CHECK_DEADLOCK FALSE
