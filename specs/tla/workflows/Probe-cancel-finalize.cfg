\* CX13 control (F9 off): finalizeOrWait has no run-status guard and completes a cancelled run. Finds TerminalRunStaysQuiet. Fix-CX13.cfg turns F9 on.
CONSTANTS
  Branches = {"A", "B"}
  Converge = FALSE
  BranchOutcomes = {"ok", "async"}
  MaxRetries = 1
  MaxSteps = 7
  MaxSweeps = 0
  MaxCrashes = 0
  UserCancel = TRUE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  ChildRunResume = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = FALSE
  FixStepFence = FALSE
  FixCancelTree = FALSE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce CompletedRunQuiescent TaskGenBound
PROPERTIES TerminalRunStaysQuiet JoinWaitsForBranches
CHECK_DEADLOCK FALSE
