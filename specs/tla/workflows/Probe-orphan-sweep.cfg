\* CX15 probe (#2364): one sub-workflow branch, no crash, one periodic sweep. Case 7 snapshots a row that is running, the row parks and its failed child schedules a retry before the sweep walks the node, so the walk inserts a second row while the poller retries the first.
CONSTANTS
  Branches = {"A"}
  Converge = FALSE
  BranchOutcomes = {"async"}
  MaxRetries = 1
  MaxSteps = 3
  MaxSweeps = 1
  MaxCrashes = 0
  UserCancel = FALSE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  ChildRunResume = TRUE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
  FixStepFence = TRUE
  FixCancelTree = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce CompletedRunQuiescent TaskGenBound
PROPERTIES TerminalRunStaysQuiet JoinWaitsForBranches
CHECK_DEADLOCK FALSE
