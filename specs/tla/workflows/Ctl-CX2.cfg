\* CX2 control: Fix-CX2.cfg with F3 + F5 off. TLC finds a user retry executing a branch the live walk is running.
CONSTANTS
  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"async"}
  MaxRetries = 1
  MaxSteps = 5
  MaxSweeps = 0
  MaxCrashes = 0
  UserCancel = FALSE
  UserRetry = TRUE
  InputAwait = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = FALSE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = FALSE
  FixRecoveryRetry = FALSE
  FixUserRetryLive = FALSE
  FixJoinWaitsLive = FALSE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce
CHECK_DEADLOCK FALSE
