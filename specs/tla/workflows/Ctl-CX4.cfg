\* CX4 control: Fix-CX4.cfg with F3 off. TLC finds two completion walks executing the join twice.
CONSTANTS
  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"ok", "async"}
  MaxRetries = 1
  MaxSteps = 5
  MaxSweeps = 1
  MaxCrashes = 0
  UserCancel = FALSE
  UserRetry = FALSE
  InputAwait = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = FALSE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = FALSE
  FixRecoveryRetry = FALSE
  FixUserRetryLive = FALSE
  FixJoinWaitsLive = FALSE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce
CHECK_DEADLOCK FALSE
