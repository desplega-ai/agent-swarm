\* CX4 fix check: branches ok or async (task ok or fail), heartbeat, no user action, no crash.
\* Inv2 (AtMostOneExecuting) and Inv3 (ExecutesOnce) hold with F3 on. Ctl-CX4.cfg is the same with F3 off.
CONSTANTS
  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"ok", "async"}
  MaxRetries = 1
  MaxSteps = 5
  MaxSweeps = 1
  MaxCrashes = 0
  UserCancel = FALSE
  UserRetry = FALSE
  InputAwait = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = FALSE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = FALSE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = FALSE
  FixTaskRetry = FALSE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce
CHECK_DEADLOCK FALSE
