\* Probe-join-retry.cfg with the user retry on (CX17): retryFailedRun seeds the join with the branch it re-runs, because the reset `pending` row is not awaited, so the join runs in the same batch as that branch. Finds JoinWaitsForRetry.
CONSTANTS
  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"ok", "fail", "async"}
  MaxRetries = 1
  MaxSteps = 7
  MaxSweeps = 1
  MaxCrashes = 0
  UserCancel = TRUE
  UserRetry = TRUE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  ChildRunResume = FALSE
  TaskEndNoRetry = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
  FixStepFence = TRUE
  FixCancelTree = TRUE
  FixParkSiblings = TRUE
  FixSuccessorDebt = TRUE
  FixJoinRetryPending = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS TaskGenBound
PROPERTIES JoinWaitsForRetry
CHECK_DEADLOCK FALSE
