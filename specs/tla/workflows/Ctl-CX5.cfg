\* CX5 control: Fix-CX5.cfg with F4 off. TLC finds recovery walking A next to the poller retrying A.
\* Inv4 (CompletedRunQuiescent) is left out: it fails on the walk finalizer (CX7) that #1673 fixes.
CONSTANTS
  Branches = {"A", "B"}
  Converge = FALSE
  BranchOutcomes = {"ok", "fail"}
  MaxRetries = 1
  MaxSteps = 5
  MaxSweeps = 2
  MaxCrashes = 0
  UserCancel = FALSE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = FALSE
  FixUserRetryLive = FALSE
  FixJoinWaitsLive = FALSE
  FixTaskRetry = FALSE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce
PROPERTIES TerminalRunStaysQuiet
CHECK_DEADLOCK FALSE
