\* F10 + F11 (#2957, #2966, #2974) on current main: two async agent-task branches joining on M, no sweeps, no user cancel or retry. CompletedRunRouted: no completed run drops a routed successor. Probe-successor-debt-control.cfg turns F11 off.
CONSTANTS
  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"async"}
  MaxRetries = 1
  MaxSteps = 5
  MaxSweeps = 0
  MaxCrashes = 0
  UserCancel = FALSE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  ChildRunResume = FALSE
  TaskEndNoRetry = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
  FixStepFence = TRUE
  FixCancelTree = TRUE
  FixParkSiblings = TRUE
  FixSuccessorDebt = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce CompletedRunQuiescent TaskGenBound CompletedRunRouted
CHECK_DEADLOCK FALSE
