\* CX7 fix check: executor failures with a retry pending, retry poller, heartbeat, no user
\* actions. Checks Inv4: with FixJoinWaitsLive (F6) off, TLC finds CX7 (the walk finalizer
\* completes the run while the poller executes a step); on, it holds. F3 (the CX4 fix,
\* a separate PR) is on: without it a duplicate `M` row ends the run early.
CONSTANTS
  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"ok", "fail"}
  MaxRetries = 1
  MaxSteps = 7
  MaxSweeps = 0
  MaxCrashes = 0
  UserCancel = FALSE
  UserRetry = FALSE
  InputAwait = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = FALSE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = FALSE
  FixUserRetryLive = FALSE
  FixJoinWaitsLive = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS CompletedRunQuiescent

CHECK_DEADLOCK FALSE
