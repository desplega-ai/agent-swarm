\* F13 (#3215) crash probe: Probe-child-run-crash.cfg with agent-task branches (ChildRunResume = FALSE). Before #3215 a crash between the task insert and the park let recovery insert a second row and dispatch a second task for the same invocation (AtMostOneExecuting). CompletedRunQuiescent is left out for the same reason as in Probe-child-run-crash.cfg (an orphaned running T row).
CONSTANTS
  Branches = {"A"}
  Converge = FALSE
  BranchOutcomes = {"async"}
  MaxRetries = 1
  MaxSteps = 3
  MaxSweeps = 0
  MaxCrashes = 1
  UserCancel = FALSE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  ChildRunResume = FALSE
  TaskEndNoRetry = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
  FixStepFence = TRUE
  FixCancelTree = TRUE
  FixParkSiblings = TRUE
  FixSuccessorDebt = TRUE
  FixJoinRetryPending = TRUE
  FixTaskReclaim = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce TaskGenBound
PROPERTIES TerminalRunStaysQuiet JoinWaitsForBranches
CHECK_DEADLOCK FALSE
