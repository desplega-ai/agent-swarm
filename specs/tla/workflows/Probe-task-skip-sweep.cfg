\* #2571 recovery path: as Probe-task-skip.cfg with one heartbeat sweep, so H5/H6 route a cancelled or skipped task to H7 with no retry. The sweep also reaches the open CX12.
CONSTANTS
  Branches = {"A", "B"}
  Converge = FALSE
  BranchOutcomes = {"ok", "fail", "async"}
  MaxRetries = 1
  MaxSteps = 7
  MaxSweeps = 1
  MaxCrashes = 0
  UserCancel = FALSE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  ChildRunResume = FALSE
  TaskEndNoRetry = TRUE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
  FixStepFence = TRUE
  FixCancelTree = TRUE
  FixParkSiblings = TRUE
  FixSuccessorDebt = TRUE
  FixJoinRetryPending = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce CompletedRunQuiescent TaskGenBound
PROPERTIES TerminalRunStaysQuiet JoinWaitsForBranches
CHECK_DEADLOCK FALSE
