\* CX1 fix check: walk + retry poller + user cancel only (no async, no heartbeat, no user retry).
\* Checks Inv1 only: FixPollerRunGuard = FALSE finds CX1; TRUE holds. Inv4 still fails on CX7 (FINDINGS.md).
CONSTANTS
  Branches = {"A", "B"}
  Converge = FALSE
  BranchOutcomes = {"ok", "fail"}
  MaxRetries = 1
  MaxSteps = 7
  MaxSweeps = 0
  MaxCrashes = 0
  UserCancel = TRUE
  UserRetry = FALSE
  InputAwait = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = FALSE
  FixRecoveryRetry = FALSE
  FixUserRetryLive = FALSE
  FixJoinWaitsLive = FALSE
  FixTaskRetry = FALSE
SPECIFICATION Spec
CONSTRAINT StateBound
PROPERTIES TerminalRunStaysQuiet
CHECK_DEADLOCK FALSE
