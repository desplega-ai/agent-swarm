\* F8 (#2364) crash probe: Probe-child-run.cfg with one branch, one crash, and no sweep except the boot recovery the crash grants (a periodic sweep reaches CX15, see Probe-orphan-sweep.cfg). Before #2364 a crash between the child start and the park let recovery insert a second row and start a second child for the same invocation. CompletedRunQuiescent is left out: a crash during the trigger node T (not a sub-workflow step) reaches the open crash trace (an orphaned running T row in a completed run).
CONSTANTS
  Branches = {"A"}
  Converge = FALSE
  BranchOutcomes = {"async"}
  MaxRetries = 1
  MaxSteps = 3
  MaxSweeps = 0
  MaxCrashes = 1
  UserCancel = FALSE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  ChildRunResume = TRUE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
  FixStepFence = TRUE
  FixCancelTree = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce TaskGenBound
PROPERTIES TerminalRunStaysQuiet JoinWaitsForBranches
CHECK_DEADLOCK FALSE
