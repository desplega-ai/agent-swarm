\* RF (#1926): current-code flags, one leaf branch, no user retry, unreadable replay reads enabled. Checks TerminalNeverFails
\* only (plus the TaskGenBound sanity check), so CX8, CX13 and the open CompletedRunQuiescent traces do not mask it.
CONSTANTS
  Branches = {"A"}
  Converge = FALSE
  BranchOutcomes = {"ok", "fail", "async"}
  MaxRetries = 1
  MaxSteps = 4
  MaxSweeps = 1
  MaxCrashes = 0
  UserCancel = TRUE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = TRUE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS TaskGenBound
PROPERTIES TerminalNeverFails
CHECK_DEADLOCK FALSE
