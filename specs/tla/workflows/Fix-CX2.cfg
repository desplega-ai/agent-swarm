\* CX2 fix check: async branches whose tasks succeed or fail, one user retry, no heartbeat, no crash.
\* Inv2 (AtMostOneExecuting) and Inv3 (ExecutesOnce) hold with F3 + F5 on. Ctl-CX2.cfg is the same with both off.
CONSTANTS
  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"async"}
  MaxRetries = 1
  MaxSteps = 5
  MaxSweeps = 0
  MaxCrashes = 0
  UserCancel = FALSE
  UserRetry = TRUE
  InputAwait = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = FALSE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = FALSE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = FALSE
  FixTaskRetry = FALSE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce
CHECK_DEADLOCK FALSE
