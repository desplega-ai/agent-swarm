\* F12 (#3019) on current main (Workflows.cfg constants, no user retry, no recovery sweep): a branch pending its retry holds the join. Checks JoinWaitsForRetry only, because the join still fires while the poller runs the retry (CX8, JoinWaitsForBranches). Probe-join-retry-control.cfg turns F12 off; Probe-join-retry-sweep.cfg adds a sweep (CX18), Probe-join-retry-user.cfg a user retry (CX17).
CONSTANTS
  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"ok", "fail", "async"}
  MaxRetries = 1
  MaxSteps = 7
  MaxSweeps = 0
  MaxCrashes = 0
  UserCancel = TRUE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  ChildRunResume = FALSE
  TaskEndNoRetry = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
  FixStepFence = TRUE
  FixCancelTree = TRUE
  FixParkSiblings = TRUE
  FixSuccessorDebt = TRUE
  FixJoinRetryPending = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS TaskGenBound
PROPERTIES JoinWaitsForRetry
CHECK_DEADLOCK FALSE
