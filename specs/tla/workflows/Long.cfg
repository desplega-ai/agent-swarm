\* Long run: current main, larger constants (3 branches, maxRetries 2, one crash).
CONSTANTS
  Branches = {"A", "B", "C"}
  Converge = TRUE
  BranchOutcomes = {"ok", "fail", "async"}
  MaxRetries = 2
  MaxSteps = 10
  MaxSweeps = 2
  MaxCrashes = 1
  UserCancel = TRUE
  UserRetry = TRUE
  InputAwait = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = FALSE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = FALSE
  FixRecoveryRetry = FALSE
  FixUserRetryLive = FALSE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce CompletedRunQuiescent
PROPERTIES TerminalRunStaysQuiet JoinWaitsForAll
CHECK_DEADLOCK FALSE
