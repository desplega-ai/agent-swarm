\* Probe-join-retry.cfg with F12 off (no sweep, no user retry): the walk that failed a branch with a retry pending counts it as completed, so the join fires before the retry runs (the CX8 shape #3019 closes). Finds JoinWaitsForRetry.
CONSTANTS
  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"ok", "fail", "async"}
  MaxRetries = 1
  MaxSteps = 7
  MaxSweeps = 0
  MaxCrashes = 0
  UserCancel = TRUE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  ChildRunResume = FALSE
  TaskEndNoRetry = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
  FixStepFence = TRUE
  FixCancelTree = TRUE
  FixParkSiblings = TRUE
  FixSuccessorDebt = TRUE
  FixJoinRetryPending = FALSE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS TaskGenBound
PROPERTIES JoinWaitsForRetry
CHECK_DEADLOCK FALSE
