\* CX11 fix (F7 on, #1832): finalizeOrWait keeps the run waiting for a retry-pending row. No sweeps, so CX12 is out of reach. Holds.
CONSTANTS
  Branches = {"A", "B"}
  Converge = FALSE
  BranchOutcomes = {"ok", "fail", "async"}
  MaxRetries = 1
  MaxSteps = 7
  MaxSweeps = 0
  MaxCrashes = 0
  UserCancel = FALSE
  UserRetry = FALSE
  InputAwait = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS AtMostOneExecuting ExecutesOnce CompletedRunQuiescent TaskGenBound
PROPERTIES TerminalRunStaysQuiet JoinWaitsForBranches
CHECK_DEADLOCK FALSE
