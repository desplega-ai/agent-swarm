\* RF + CR (#2314): Probe-replay-unreadable.cfg with every async branch a sub-workflow step. resumeFromChildRun now reads
\* the sealed run context before the failed-child branch too (eF / h12 can fail closed). Checks TerminalNeverFails only.
CONSTANTS
  Branches = {"A"}
  Converge = FALSE
  BranchOutcomes = {"ok", "fail", "async"}
  MaxRetries = 1
  MaxSteps = 4
  MaxSweeps = 1
  MaxCrashes = 0
  UserCancel = TRUE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = TRUE
  ChildRunResume = TRUE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = TRUE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = TRUE
  FixUserRetryLive = TRUE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = TRUE
  FixStepFence = TRUE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS TaskGenBound
PROPERTIES TerminalNeverFails
CHECK_DEADLOCK FALSE
