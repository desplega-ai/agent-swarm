\* CX3 fix check: async branches (task ok), heartbeat, user cancel, no retries, no crash.
\* No executor failures and no user retry, so no retry-pending or orphaned `pending`
\* rows (CX1, CX5, CX7 and the fix-model gaps stay out of scope). CX2/CX4 duplicates
\* are separate fixes: F3 (the CX4 fix, a separate PR) is on so a second `M` row
\* cannot hide behind the latest-row rule, and Inv2/Inv3 are not checked here.
\* Checks Inv4 and Inv3c: with FixJoinWaitsLive (F6) off, TLC finds CX3; on, it holds.
CONSTANTS
  Branches = {"A", "B"}
  Converge = TRUE
  BranchOutcomes = {"ok", "async"}
  MaxRetries = 1
  MaxSteps = 7
  MaxSweeps = 1
  MaxCrashes = 0
  UserCancel = TRUE
  UserRetry = FALSE
  InputAwait = FALSE
  ReplayUnreadable = FALSE
  GuardActiveWalk = TRUE
  GuardConvergeSeed = TRUE
  FixPollerRunGuard = FALSE
  FixPendingRetryGate = FALSE
  FixConcurrentJoin = TRUE
  FixRecoveryRetry = FALSE
  FixUserRetryLive = FALSE
  FixJoinWaitsLive = TRUE
  FixTaskRetry = FALSE
SPECIFICATION Spec
CONSTRAINT StateBound
INVARIANTS CompletedRunQuiescent
PROPERTIES JoinWaitsForBranches
CHECK_DEADLOCK FALSE
