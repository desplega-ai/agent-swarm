{{- if and .Values.scriptRunner.enabled (not .Values.scriptRunner.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-swarm.scriptRunnerSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-swarm.labels" . | nindent 4 }}
type: Opaque
stringData:
  SCRIPT_RUNNER_TOKEN: {{ required "scriptRunner.token or scriptRunner.existingSecret is required" .Values.scriptRunner.token | quote }}
{{- end }}
