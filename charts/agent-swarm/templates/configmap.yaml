apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-swarm.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-swarm.labels" . | nindent 4 }}
data:
  MCP_BASE_URL: "http://{{ include "agent-swarm.fullname" . }}-api:{{ .Values.api.port }}"
  {{- if .Values.config.appUrl }}
  APP_URL: {{ .Values.config.appUrl | quote }}
  {{- end }}
  {{- if .Values.config.publicMcpBaseUrl }}
  PUBLIC_MCP_BASE_URL: {{ .Values.config.publicMcpBaseUrl | quote }}
  {{- else if and .Values.ingress.enabled .Values.ingress.host }}
  {{- $publicMcpScheme := ternary "https" "http" (eq (include "agent-swarm.ingressHasTls" .Values.ingress) "true") }}
  PUBLIC_MCP_BASE_URL: {{ printf "%s://%s" $publicMcpScheme .Values.ingress.host | quote }}
  {{- end }}
  {{- if .Values.config.slackAllowedEmailDomains }}
  SLACK_ALLOWED_EMAIL_DOMAINS: {{ .Values.config.slackAllowedEmailDomains | quote }}
  {{- end }}
  {{- if .Values.config.slackAllowedUserIds }}
  SLACK_ALLOWED_USER_IDS: {{ .Values.config.slackAllowedUserIds | quote }}
  {{- end }}
  {{- if .Values.config.githubBotName }}
  GITHUB_BOT_NAME: {{ .Values.config.githubBotName | quote }}
  {{- end }}
  {{- if .Values.config.githubEmail }}
  GITHUB_EMAIL: {{ .Values.config.githubEmail | quote }}
  {{- end }}
  {{- if .Values.config.githubName }}
  GITHUB_NAME: {{ .Values.config.githubName | quote }}
  {{- end }}
  {{- if .Values.config.githubUrl }}
  GITHUB_URL: {{ .Values.config.githubUrl | quote }}
  {{- end }}
  {{- if .Values.config.githubApiUrl }}
  GITHUB_API_URL: {{ .Values.config.githubApiUrl | quote }}
  {{- end }}
  {{- range $k, $v := .Values.config.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  SEED_AUTOMATIONS_ENABLED: {{ .Values.config.seedAutomationsEnabled | quote }}
  SEED_SCRIPTS_ENABLED: {{ .Values.config.seedScriptsEnabled | quote }}
  SEED_SKILLS_ENABLED: {{ .Values.config.seedSkillsEnabled | quote }}
  SEED_WORKFLOWS_ENABLED: {{ .Values.config.seedWorkflowsEnabled | quote }}
  SEED_SCHEDULES_ENABLED: {{ .Values.config.seedSchedulesEnabled | quote }}
