{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-swarm.databaseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-swarm.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- with .Values.database.queryUrl }}
  DATABASE_QUERY_URL: {{ . | quote }}
  {{- end }}
{{- end }}
