{{- if and .Values.agentFs.enabled (not .Values.agentFs.s3.existingSecret) }}
{{- $data := dict }}
{{- if .Values.agentFs.apiKey }}
{{- $_ := set $data "API_AGENT_FS_API_KEY" .Values.agentFs.apiKey }}
{{- end }}
{{- if ne .Values.agentFs.storageProvider "local" }}
{{- $_ := set $data "S3_ACCESS_KEY_ID" .Values.agentFs.s3.accessKeyId }}
{{- $_ := set $data "S3_SECRET_ACCESS_KEY" .Values.agentFs.s3.secretAccessKey }}
{{- range $k, $v := dict "S3_ENDPOINT" .Values.agentFs.s3.endpoint "S3_PUBLIC_ENDPOINT" .Values.agentFs.s3.publicEndpoint "S3_REGION" .Values.agentFs.s3.region "S3_PROVIDER" .Values.agentFs.s3.provider }}
{{- if $v }}{{ $_ := set $data $k $v }}{{ end }}
{{- end }}
{{- end }}
{{- if .Values.agentFs.embedding.apiKey }}
{{- $_ := set $data "EMBEDDING_API_KEY" .Values.agentFs.embedding.apiKey }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-swarm.agentFsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-fs
type: Opaque
stringData:
  {{- toYaml $data | nindent 2 }}
{{- end }}
