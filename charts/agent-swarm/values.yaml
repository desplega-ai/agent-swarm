# -- Override the chart name fragment used to build resource names.
nameOverride: ""
# -- Override the full release name used to build resource names.
fullnameOverride: ""

# -- Pod-level annotations to add to every pod the chart manages.
podAnnotations: {}

# -- Pod-level securityContext applied to every pod the chart manages.
podSecurityContext: {}

# -- Container-level securityContext applied to every container the chart manages.
securityContext: {}

# -- Image pull secrets used by every pod the chart manages.
imagePullSecrets: []

# Image — server (the API + scheduler).
image:
  registry: ghcr.io
  repository: desplega-ai/agent-swarm
  pullPolicy: IfNotPresent
  # -- Server image tag. Defaults to .Chart.AppVersion when unset.
  tag: ""

# Image — worker (used by every pool pod, including the lead).
workerImage:
  registry: ghcr.io
  repository: desplega-ai/agent-swarm-worker
  pullPolicy: IfNotPresent
  # -- Worker image tag. Defaults to .Chart.AppVersion when unset.
  tag: ""

# ServiceAccount for every pod managed by this chart.
# Annotations are useful for cloud workload identity (GKE Workload Identity,
# IRSA, AKS Pod Identity) — set them via `serviceAccount.annotations`.
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Authentication and credentials.
#
# Two paths:
#
#   1. Inline keys → the chart creates a Secret from these values. Suitable
#      for development / quickstart. NEVER check inline keys into source
#      control for production deployments.
#
#   2. existingSecret: <name> → operator pre-creates a Secret in the same
#      namespace, the chart references it via envFrom. Compatible with
#      External Secrets Operator, Vault, SOPS, sealed-secrets, etc.
#
# When existingSecret is set, all inline values are ignored. The pre-existing
# Secret must contain (as keys) the env vars the swarm consumes.
#
# Required (or render-time fail):
#   API_KEY                       — bearer token used between API and pool pods
# Optional, depending on configuration:
#   CLAUDE_CODE_OAUTH_TOKEN       — for the claude harness provider
#   ANTHROPIC_API_KEY             — for the pi or claude-managed provider
#   OPENAI_API_KEY                — for the codex provider
#   OPENROUTER_API_KEY            — for any provider via OpenRouter
#   GITHUB_TOKEN                  — for git operations inside agents
#   GITHUB_WEBHOOK_SECRET         — for the GitHub App integration
#   SLACK_BOT_TOKEN               — for the Slack integration
#   SLACK_APP_TOKEN               — for the Slack integration (Socket Mode)
#   SLACK_SIGNING_SECRET          — for the Slack integration
#   SECRETS_ENCRYPTION_KEY        — base64 32-byte key for at-rest encryption
auth:
  apiKey: ""
  claudeCodeOauthToken: ""
  anthropicApiKey: ""
  openaiApiKey: ""
  openrouterApiKey: ""
  githubToken: ""
  githubWebhookSecret: ""
  slackBotToken: ""
  slackAppToken: ""
  slackSigningSecret: ""
  secretsEncryptionKey: ""
  # -- Pre-existing Secret to source credentials from. When set, the
  # inline values above are ignored.
  existingSecret: ""

# Application-level config exposed as plain env vars (NOT secrets).
config:
  # -- Optional: comma-separated email domains allowed to interact with the
  # Slack bot. Empty means everyone allowed.
  slackAllowedEmailDomains: ""
  # -- Optional: comma-separated Slack user IDs always allowed.
  slackAllowedUserIds: ""
  # -- Display name for the GitHub bot user (used by the GitHub App integration).
  githubBotName: ""
  # -- Git author email used by agents for commits.
  githubEmail: ""
  # -- Git author name used by agents for commits.
  githubName: ""
  # -- Public dashboard URL referenced in Slack message links. Leave blank
  # to omit dashboard links from Slack notifications.
  appUrl: ""
  # -- Public, browser/externally-reachable API origin for OAuth redirect URIs + registered webhooks.
  # Leave blank to derive from ingress.host when ingress is enabled, otherwise
  # the app falls back to the internal mcpBaseUrl. In split deploys set to the
  # public ingress URL explicitly when the chart cannot infer it.
  publicMcpBaseUrl: ""
  # -- Free-form additional env vars layered on top of the chart defaults.
  # Useful for less-common knobs (TEMPLATE_REGISTRY_URL, SCHEDULER_INTERVAL_MS, etc.).
  extraEnv: {}
  # -- Let a freshly-seeded workflow/schedule template arrive ENABLED instead
  # of merely inventoried. This is not a blanket switch: an individual
  # template still only auto-enables when it needs no integration and no
  # required param/placeholder (so it can't fail on a stranger's cluster for
  # lack of a credential), and when the template itself doesn't recommend
  # staying off. Everything else still seeds disabled, same as before this
  # flag existed. Default true so a fresh install has its zero-config
  # automations (e.g. the daily status report, the update-check schedule)
  # running out of the box, not just present. Set false to restore the old
  # "inventory everything, enable nothing automatically" behavior.
  seedAutomationsEnabled: true

# API — single-replica StatefulSet running the SQLite-backed control plane.
# replicas is fixed at 1 (SQLite single-writer); the chart fails to render
# if you set anything else.
api:
  replicas: 1
  port: 3013
  resources: {}
  # -- Optional Kubernetes RuntimeClass for the API pod (the pod that
  # actually spawns sandboxed script subprocesses — see
  # src/utils/sandboxed-process.ts). `resources.limits` has no pids field
  # (only cpu/memory/ephemeral-storage), and neither does the RuntimeClass
  # API itself — a RuntimeClass only selects a CRI runtime handler by name,
  # it has no OCI PID-resource field. Setting this alone applies NO pids
  # ceiling. It only helps if the cluster administrator has separately
  # provisioned a specifically customized runtime handler (e.g. a `runc`
  # handler whose own config carries a tighter `pids.max`, or an
  # equivalently configured gVisor/Kata handler) and confirmed it actually
  # injects the limit — a stock handler under any of these runtimes does
  # nothing. Empty = no runtimeClassName set, i.e. zero behavior change from
  # before this field existed. See charts/agent-swarm/README.md's
  # "Sandboxed-script pids containment" section for the cluster-wide
  # alternative (kubelet `--pod-max-pids`) that works with no such
  # provisioning and should be preferred.
  runtimeClassName: ""
  storage:
    size: 10Gi
    # -- StorageClass used for the API PVC. Empty = cluster default.
    storageClassName: ""
  terminationGracePeriodSeconds: 60
  healthCheck:
    path: /health
    startup:
      initialDelaySeconds: 5
      periodSeconds: 2
      failureThreshold: 30
    liveness:
      initialDelaySeconds: 40
      periodSeconds: 30
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10

# API service — exposed inside the cluster for pool pods to reach.
service:
  type: ClusterIP

# Defaults shared by every pool. A pool may override `resources`, `storage`,
# `harnessProvider`, `modelOverride`, etc.
poolDefaults:
  # -- Baseline for outbound-polling workers. Increase requests for sustained
  # builds/browser workloads; pools.<name>.resources replaces this entire map.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 4Gi
  storage:
    # -- Default size for each pool pod's personal PVC. Override per pool
    # via `pools.<name>.storage.personalSize` if you need different sizing.
    personalSize: 20Gi
    # -- StorageClass for the personal PVC. Empty = cluster default.
    # Override per pool via `pools.<name>.storage.storageClassName`.
    storageClassName: ""
  # -- emptyDir size limits for the in-pod /workspace/shared and /logs
  # mounts. Override per pool via `pools.<name>.emptyDir.*` if a specific
  # pool needs more (e.g. coder pools that clone large repos).
  emptyDir:
    sharedSizeLimit: 1Gi
    logsSizeLimit: 1Gi
  # -- Default harness provider for new pools. Override per-pool via
  # `pools.<name>.harnessProvider`. One of: claude, codex, opencode, pi,
  # claude-managed, devin.
  harnessProvider: claude
  # -- Continue on errors inside the harness. Maps to YOLO env var.
  yolo: true
  terminationGracePeriodSeconds: 120
  # -- Pod replacement strategy during rolling updates. Pool pods are
  # interchangeable (any worker can pick up a paused task on resume) so
  # rolling several at once is safe.
  updateStrategy:
    maxUnavailable: 50%

# Pools.
#
# Each entry creates a StatefulSet whose name matches the map key. Each pod
# generates and persists a UUID on its personal PVC on first boot; identity
# is stable across restarts and travels with the PVC.
#
# Special role: `role: lead` marks the pool as the swarm coordinator. Exactly
# one pool may have `role: lead`, and it must have `replicas: 1`. The chart
# enforces both at render time.
#
# Defaults match the CLI's Full Swarm preset in src/commands/onboard/presets.ts:
# one lead and ten specialist workers, requesting 3 CPU / 6Gi in total.
# For only lead + coder, use examples/values-minimal.yaml. Helm merges pool
# maps, so set unwanted entries to null to remove them.
pools:
  lead:
    replicas: 1
    role: lead
    templateId: official/lead
    maxConcurrentTasks: 5
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 4Gi
  coder:
    replicas: 1
    role: coder
    templateId: official/coder
    maxConcurrentTasks: 3
  content-reviewer:
    replicas: 1
    role: content-reviewer
    templateId: official/content-reviewer
  content-strategist:
    replicas: 1
    role: content-strategist
    templateId: official/content-strategist
  content-writer:
    replicas: 1
    role: content-writer
    templateId: official/content-writer
  discoverability-optimizer:
    replicas: 1
    role: discoverability-optimizer
    templateId: official/discoverability-optimizer
  forward-deployed-engineer:
    replicas: 1
    role: forward-deployed-engineer
    templateId: official/forward-deployed-engineer
  researcher:
    replicas: 1
    role: researcher
    templateId: official/researcher
  reviewer:
    replicas: 1
    role: reviewer
    templateId: official/reviewer
  tester:
    replicas: 1
    role: tester
    templateId: official/tester
  ux-principles:
    replicas: 1
    role: ux-principles
    templateId: official/ux-principles

# Ingress for the API. Disabled by default — most consumers run the swarm
# cluster-internal and don't expose the API publicly.
ingress:
  enabled: false
  # -- IngressClass name. Common values: nginx, traefik, alb, gce.
  className: ""
  annotations: {}
  host: ""
  # -- Explicit TLS entries (`hosts` + `secretName`). Leave empty when using
  # `certManager` below; the chart then generates the entry for `host`.
  tls: []
  # -- HTTPS shortcut for clusters running cert-manager. Set ONE of
  # `clusterIssuer` or `issuer` to the name of an existing Issuer. The chart
  # adds the cert-manager annotation, requests a certificate for `host`
  # into the Secret `<release>-api-tls`, and derives an https public URL.
  # No TLS Secret needs to be created by hand.
  certManager:
    clusterIssuer: ""
    issuer: ""

# agent-fs — optional persistent shared filesystem service.
#
# When disabled (default) agents fall back to local-only filesystem
# operations on their personal PVC. The upstream session prompt
# auto-detects this and adapts.
#
# When enabled the chart deploys the agent-fs service alongside the swarm.
# agent-fs needs an S3-compatible bucket; provide credentials via the
# inline auth fields below or via `agentFs.s3.existingSecret`.
agentFs:
  enabled: false
  image:
    registry: ghcr.io
    repository: desplega-ai/agent-fs
    pullPolicy: IfNotPresent
    tag: 0.13.7
  port: 7433
  # -- Blob storage backend for agent-fs. `s3` (default) stores objects in
  # the bucket configured below. `local` stores objects on the agent-fs PVC
  # under /data/storage (single replica, no S3 credentials needed); the
  # `bucket` and `s3.*` values are ignored.
  storageProvider: s3
  # -- Optional API-owned bootstrap key for agent-fs. When blank, the swarm API
  # boot seeder registers a service user and persists its generated key in
  # encrypted swarm_config as API_AGENT_FS_API_KEY.
  apiKey: ""
  # -- Public app URL used by agent-fs when it emits browser-facing file links.
  appUrl: ""
  # -- Bucket name for agent-fs's object storage backend (storageProvider=s3).
  bucket: ""
  resources: {}
  storage:
    size: 10Gi
    storageClassName: ""
  # Public ingress for agent-fs. Needed when browsers open agent-fs file links
  # (signed URLs point at agent-fs itself when storageProvider=local).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []
    # -- Same semantics as `ingress.certManager`; certificate lands in
    # `<release>-agent-fs-tls`.
    certManager:
      clusterIssuer: ""
      issuer: ""
  # S3-compatible credentials (storageProvider=s3). Either inline or
  # pre-existing Secret.
  s3:
    accessKeyId: ""
    secretAccessKey: ""
    endpoint: ""
    publicEndpoint: ""
    region: ""
    provider: ""
    # -- Pre-existing Secret with keys S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
    # (optional) S3_ENDPOINT, S3_PUBLIC_ENDPOINT, S3_REGION, S3_PROVIDER,
    # API_AGENT_FS_API_KEY, EMBEDDING_API_KEY. When set, inline values are ignored.
    existingSecret: ""
  # Embeddings default to the agent-fs local provider. Set provider=openai or
  # provider=gemini and supply apiKey for semantic search backed by a hosted API.
  embedding:
    provider: local
    model: ""
    apiKey: ""

# Shared workspace volume — alternative to agent-fs.
#
# Mounts a single ReadWriteMany PVC at /workspace/shared on every pool pod.
# Provides cross-agent file sharing without running agent-fs, but lacks
# search, comments, conflict handling, and prompt awareness — agents won't
# automatically know to use the shared mount unless you configure them to.
#
# Requires storage that supports ReadWriteMany: NFS, EFS, Azure Files,
# Filestore, or any CSI driver advertising the access mode.
sharedVolume:
  # -- Name of a pre-existing PVC bound to a ReadWriteMany volume. Mounted
  # at /workspace/shared on every pool pod when set. Leave blank to use a
  # per-pod emptyDir (default — no cross-pod sharing).
  existingClaim: ""

# Litestream — optional continuous SQLite WAL replication to S3.
#
# When enabled, runs a litestream sidecar in the API pod that streams the
# WAL to an S3-compatible bucket. Restoration is documented in
# https://litestream.io/guides/restore/.
#
# Requires an S3-compatible bucket; provide credentials via the inline
# auth fields below or via `litestream.s3.existingSecret`.
litestream:
  enabled: false
  image:
    repository: litestream/litestream
    pullPolicy: IfNotPresent
    tag: 0.3.13
  bucket: ""
  path: agent-swarm
  endpoint: ""
  region: ""
  snapshotIntervalSeconds: 3600
  retentionHours: 720
  metricsPort: 9090
  resources: {}
  s3:
    accessKeyId: ""
    secretAccessKey: ""
    # -- Pre-existing Secret with keys LITESTREAM_ACCESS_KEY_ID and
    # LITESTREAM_SECRET_ACCESS_KEY. When set, inline values are ignored.
    existingSecret: ""
