# Docker Compose for Agent Swarm
#
# Usage:
#   docker-compose -f docker-compose.example.yml --env-file .env up -d
#
# What it does:
#  - Sets up an API service and multiple worker/lead agents
#  - Deploys 2 worker agents and 1 lead agent by default
#  - Uses volumes for persistent storage of logs, db and agent workspaces
#
# Port mapping:
#  Each service uses its own host port variable (LEAD_PORT, WORKER1_PORT, etc.)
#  to avoid conflicts when multiple services share the same host network.
#  The variable names and defaults below are examples — adjust them to fit your
#  setup, especially if you add more workers.
#  In isolated environments where each container has its own network namespace,
#  you may map all services to the same port (e.g. 3000:3000).
#
# Provider mapping: claude -> claude, openai -> codex, openrouter -> pi,
# bedrock -> pi (AWS Bedrock (alpha)).
# Alpha: session summaries, memory rating, spend tracking and model tiers may be missing on Bedrock.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - agent_fs_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/agentfs
      "

  agent-fs:
    image: ghcr.io/desplega-ai/agent-fs:0.13.3
    platform: linux/amd64
    pull_policy: always
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      - AGENT_FS_HOME=/data
      - HOST=0.0.0.0
      - SERVER_HOST=0.0.0.0
      - PORT=7433
      - SERVER_PORT=7433
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=${AGENT_FS_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - S3_BUCKET=agentfs
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_REGION=us-east-1
      - S3_PROVIDER=minio
      - EMBEDDING_PROVIDER=${AGENT_FS_EMBEDDING_PROVIDER:-local}
      - EMBEDDING_MODEL=${AGENT_FS_EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${AGENT_FS_EMBEDDING_API_KEY:-}
    ports:
      - "${AGENT_FS_PORT:-7433}:7433"
    volumes:
      - agent_fs_data:/data
    healthcheck:
      # The agent-fs image ships node/bun but no curl/wget; probe with node fetch.
      # Generous retries: first boot downloads the local embedding model before listening.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7433/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    image: "ghcr.io/desplega-ai/agent-swarm:latest"
    platform: linux/amd64
    pull_policy: always
    stop_grace_period: 60s
    depends_on:
      agent-fs:
        condition: service_healthy

    environment:
      - API_KEY=${API_KEY}
      - RBAC_ENABLED=${RBAC_ENABLED:-false}
      - AGENT_FS_API_URL=http://agent-fs:7433
      - API_AGENT_FS_API_KEY=${API_AGENT_FS_API_KEY:-}
      - AGENT_FS_REGISTER_EMAIL=${AGENT_FS_REGISTER_EMAIL:-swarm-admin@agent-fs.local}

      # At-rest encryption key for swarm_config isSecret=1 rows (AES-256-GCM).
      # Preferred: mount a file and point SECRETS_ENCRYPTION_KEY_FILE at it
      # (see `secrets:` block below). Fallback: set SECRETS_ENCRYPTION_KEY
      # directly as a base64-encoded 32-byte value. If neither is set, the
      # server auto-generates <data-dir>/.encryption-key only when the DB does
      # not yet contain encrypted secret rows (for example, a fresh DB or a
      # first upgrade from plaintext-only secrets); otherwise boot fails closed
      # until you restore the original key source. BACK UP AND PRESERVE THE
      # ACTUAL KEY MATERIAL alongside your SQLite DB. Losing the key means
      # losing all encrypted secrets with no recovery path. Do not switch key
      # sources unless the underlying base64 key value is identical.
      - SECRETS_ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      # - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:-}

      - MCP_BASE_URL=${MCP_BASE_URL}
      - APP_URL=${APP_URL}
      # Provider credentials are also needed by workflow LLM nodes in the API service.
      - MODEL_OVERRIDE=${MODEL_OVERRIDE:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}

      # Optional: Business-Use instrumentation
      - BUSINESS_USE_API_KEY=${BUSINESS_USE_API_KEY:-}
      - BUSINESS_USE_URL=${BUSINESS_USE_URL:-}

      # Optional: Enable Slack integration
      - SLACK_DISABLE=${SLACK_DISABLE:-false}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}

    ports:
      - "3013:3013"

    volumes:
      - swarm_api:/app

    secrets:
      - encryption_key

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:3013/health || wget -q --spider http://localhost:3013/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  lead:
    image: "ghcr.io/desplega-ai/agent-swarm-worker:latest"
    platform: linux/amd64
    pull_policy: always
    stop_grace_period: 60s

    depends_on:
      api:
        condition: service_healthy

    environment:
      - HARNESS_PROVIDER=${HARNESS_PROVIDER:-claude}
      - MODEL_OVERRIDE=${MODEL_OVERRIDE:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
