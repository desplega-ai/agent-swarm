# Docker Compose for Agent Swarm
#
# Usage:
#   docker-compose -f docker-compose.example.yml --env-file .env up -d
#
# What it does:
#  - Sets up an API service and multiple worker/lead agents
#  - Deploys 1 lead and 11 workers covering all 11 official templates
#  - Uses volumes for persistent storage of logs, db and agent workspaces
#
# Port mapping:
#  Each service uses its own host port variable (LEAD_PORT, WORKER1_PORT, etc.)
#  to avoid conflicts when multiple services share the same host network.
#  The variable names and defaults below are examples — adjust them to fit your
#  setup, especially if you add more workers.
#  In isolated environments where each container has its own network namespace,
#  you may map all services to the same port (e.g. 3000:3000).
#
# Upgrading from an install that mounted `swarm_api:/app`:
#  The API volume is now `swarm_api_data:/app/data`. The old `/app` mount
#  shadowed the image's `migrations/` directory, so the API upgraded its code
#  but kept the migrations it first booted with. Copy your database over before
#  starting, or the API comes up against an empty database:
#    docker run --rm -v swarm_api:/old -v swarm_api_data:/new alpine \
#      sh -c 'cp -a /old/data/. /new/'
#  Full procedure, including the backup to take first:
#  https://github.com/desplega-ai/agent-swarm/blob/main/skills/agent-swarm/references/upgrade.md
#
# Image version (recommended for anything you depend on):
#  The API and agent services resolve their tag from AGENT_SWARM_VERSION in
#  .env. Leaving it blank falls back to `latest`, which is rebuilt and moved on
#  EVERY commit to main — it is not a release, and `pull_policy: always` means
#  each `up -d` can silently move the deployment to a newer build.
#  Pin it to a published release instead, and keep the API and all agents on the
#  same version. Releases: https://github.com/desplega-ai/agent-swarm/releases
#    AGENT_SWARM_VERSION=1.150.0
#  Migrations are forward-only, so re-pinning to an older tag is NOT a rollback.
#  Back up the database and encryption key before upgrading. Procedure:
#  https://github.com/desplega-ai/agent-swarm/blob/main/skills/agent-swarm/references/upgrade.md
#
# HTTPS (optional):
#  Start with `--profile tls` to add a Caddy reverse proxy that obtains
#  Let's Encrypt certificates automatically for SWARM_API_DOMAIN (-> api)
#  and AGENT_FS_DOMAIN (-> agent-fs UI/API and MinIO signed previews).
#  Set both domains and point their DNS at this host. Open ports 80/443,
#  and set PUBLIC_MCP_BASE_URL=https://<api domain>.
#  Requires Docker Compose v2.23.1+ (inline `configs.content`).
#
# Provider mapping: claude -> claude, openai -> codex, openrouter -> pi,
# bedrock -> pi (AWS Bedrock (alpha)).
# Alpha: session summaries, memory rating, spend tracking and model tiers may be missing on Bedrock.

# Each agent keeps its identity on its own personal volume. Explicit IDs remain
# supported for existing installs; removing an override reuses the persisted ID.
x-agent-entrypoint: &agent-entrypoint
  - /bin/sh
  - -ec
  - |
    ID_FILE="/workspace/personal/.agent-id"
    if [ -n "$${AGENT_ID:-}" ]; then
      printf '%s\n' "$$AGENT_ID" > "$$ID_FILE"
    elif [ -s "$$ID_FILE" ]; then
      AGENT_ID=$$(cat "$$ID_FILE")
    else
      AGENT_ID=$$(cat /proc/sys/kernel/random/uuid)
      printf '%s\n' "$$AGENT_ID" > "$$ID_FILE"
    fi
    export AGENT_ID
    exec /docker-entrypoint.sh "$$@"
  - --

services:
  # Use quay.io because MinIO's Docker Hub repositories were removed.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - agent_fs_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/agentfs
      "

  agent-fs:
    image: ghcr.io/desplega-ai/agent-fs:0.13.6
    platform: linux/amd64
    pull_policy: always
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      - AGENT_FS_HOME=/data
      - HOST=0.0.0.0
      - SERVER_HOST=0.0.0.0
      - PORT=7433
      - SERVER_PORT=7433
      - S3_ENDPOINT=http://minio:9000
      # Browsers fetch signed previews directly: use the HTTPS file domain when
      # configured, otherwise local MinIO. An explicit public endpoint wins.
      - S3_PUBLIC_ENDPOINT=${AGENT_FS_S3_PUBLIC_ENDPOINT:-${AGENT_FS_DOMAIN:+https://}${AGENT_FS_DOMAIN:-http://localhost:9000}}
      - S3_BUCKET=agentfs
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_REGION=us-east-1
      - S3_PROVIDER=minio
      - EMBEDDING_PROVIDER=${AGENT_FS_EMBEDDING_PROVIDER:-local}
      - EMBEDDING_MODEL=${AGENT_FS_EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${AGENT_FS_EMBEDDING_API_KEY:-}
    ports:
      - "${AGENT_FS_PORT:-7433}:7433"
    volumes:
      - agent_fs_data:/data
    healthcheck:
      # The agent-fs image ships node/bun but no curl/wget; probe with node fetch.
      # Generous retries: first boot downloads the local embedding model before listening.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7433/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    image: "ghcr.io/desplega-ai/agent-swarm:${AGENT_SWARM_VERSION:-latest}"
    platform: linux/amd64
    pull_policy: always
    stop_grace_period: 60s
    # Independent per-container cgroup pids ceiling (containment), separate
    # from JAVASCRIPT_RUNTIME_SANDBOX_MAX_PROCS (headroom for a sandboxed
    # script's own `ulimit -u`, src/utils/sandboxed-process.ts). `ulimit -u`
    # is a per-real-UID limit shared by the API process itself *and* every
    # concurrently running sandboxed script subprocess in this container — a
    # single runaway script can otherwise starve that whole shared budget
    # before its own rlimit trips. `pids_limit` is enforced by the kernel
    # cgroup controller independently of what the sandboxed process does to
    # its own rlimits, so it holds even if a script resets them.
    #
    # Sizing arithmetic (measured 2026-09-08 in a worker container, no
    # compose/docker daemon available to validate this end-to-end — see the
    # PR description for that open item):
    #   - Idle API server (Bun HTTP server + scheduler + heartbeat + OAuth
    #     keepalive timers), isolated measurement via /proc/<pid>/task:
    #     ~29 threads.
    #   - One lightweight sandboxed `bun -e` script run, measured via the
    #     container-wide /proc thread-count delta while it executed:
    #     ~22-25 threads/procs (bash wrapper + Bun runtime boot).
    #   - Assume up to ~15 concurrent script executions for a single-replica
    #     self-host (there is no concurrency limiter on script runs today) at
    #     ~30 threads/procs each with margin: 15 * 30 = 450.
    #   - Total realistic worst-case legitimate load: 29 + 450 = 479.
    #   - pids_limit = 1024: ~2x that legitimate-load estimate (room to grow
    #     without bricking the API pod), while staying 4x tighter than the
    #     4096 `ulimit -u` ceiling so this is genuine independent containment,
    #     not a number that only ever rubber-stamps the rlimit.
    # Raise this if you run heavier concurrent script/workflow load; lower it
    # if you want tighter containment and have validated it against your own
    # traffic.
    pids_limit: 1024
    depends_on:
      agent-fs:
        condition: service_healthy

    environment:
      - API_KEY=${API_KEY}
      - RBAC_ENABLED=${RBAC_ENABLED:-false}
      - AGENT_FS_API_URL=http://agent-fs:7433
      - API_AGENT_FS_API_KEY=${API_AGENT_FS_API_KEY:-}
      - AGENT_FS_REGISTER_EMAIL=${AGENT_FS_REGISTER_EMAIL:-swarm-admin@agent-fs.local}

      # At-rest encryption key for swarm_config isSecret=1 rows (AES-256-GCM).
      # Preferred: mount a file and point SECRETS_ENCRYPTION_KEY_FILE at it
      # (see `secrets:` block below). Fallback: set SECRETS_ENCRYPTION_KEY
      # directly as a base64-encoded 32-byte value. If neither is set, the
      # server auto-generates <data-dir>/.encryption-key only when the DB does
      # not yet contain encrypted secret rows (for example, a fresh DB or a
      # first upgrade from plaintext-only secrets); otherwise boot fails closed
      # until you restore the original key source. BACK UP AND PRESERVE THE
      # ACTUAL KEY MATERIAL alongside your SQLite DB. Losing the key means
      # losing all encrypted secrets with no recovery path. Do not switch key
      # sources unless the underlying base64 key value is identical.
      - SECRETS_ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      # - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:-}

      - MCP_BASE_URL=${MCP_BASE_URL}
      - APP_URL=${APP_URL}
      # Browser/externally reachable API origin (OAuth redirects, webhooks,
      # dashboard). Required when the API is behind HTTPS (see `--profile tls`).
      - PUBLIC_MCP_BASE_URL=${PUBLIC_MCP_BASE_URL:-}
      # Blank keeps the default allowlist (app.agent-swarm.dev + localhost UI).
      # Set to your own dashboard origin when self-hosting the UI.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Provider credentials are also needed by workflow LLM nodes in the API service.
      - MODEL_OVERRIDE=${MODEL_OVERRIDE:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}

      # Optional: Business-Use instrumentation
      - BUSINESS_USE_API_KEY=${BUSINESS_USE_API_KEY:-}
      - BUSINESS_USE_URL=${BUSINESS_USE_URL:-}

      # Optional: Enable Slack integration
      - SLACK_DISABLE=${SLACK_DISABLE:-false}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}

    ports:
      - "3013:3013"

    volumes:
      # Mount ONLY the data directory. A named volume copies image content on
      # first population and then shadows that path forever, so mounting `/app`
      # freezes everything the image ships there — `migrations/`, `package.json`,
      # `extensions/`, `scripts-runtime/`, `script-types/`, `typescript-lib/`,
      # `vendored-openapi/` — at install time. The compiled binary lives outside
      # `/app` (`/usr/local/bin/agent-swarm-api`), so the code upgrades while its
      # migrations do not, and the API then queries schema no migration created.
      # `/app/data` holds everything that must persist: the SQLite database
      # (DATABASE_PATH) and `.page-session-secret` beside it.
      - swarm_api_data:/app/data
      # Slack files an agent fetches with `slack-download-file` / `slack-read`
      # from a task become task attachments (stored through the file provider),
      # so workers need no shared disk with the API. Only the no-task fallback
      # writes to the API's own disk, where workers can't see it. Uncomment to
      # expose `slack-read`'s fallback downloads to workers, under their
      # `/workspace/shared/downloads/slack/`:
      # - swarm_shared:/app/shared

    secrets:
      - encryption_key

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:3013/health || wget -q --spider http://localhost:3013/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  lead:
    image: "ghcr.io/desplega-ai/agent-swarm-worker:${AGENT_SWARM_VERSION:-latest}"
    entrypoint: *agent-entrypoint
    platform: linux/amd64
    pull_policy: always
    stop_grace_period: 60s

    depends_on:
      api:
        condition: service_healthy

    environment:
      - HARNESS_PROVIDER=${HARNESS_PROVIDER:-claude}
      - MODEL_OVERRIDE=${MODEL_OVERRIDE:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
