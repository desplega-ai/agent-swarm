  # ---------------------------------------------------------------------------
  # Optional HTTPS front door. Only starts with `docker compose --profile tls`.
  # Caddy terminates TLS with automatic Let's Encrypt certificates and proxies
  # to the API, agent-fs, and MinIO over the compose network. When you use it, stop
  # publishing 3013/7433 on a public interface (firewall or remove the `ports`
  # entries above).
  # ---------------------------------------------------------------------------
  caddy:
    # Pinned by digest: this container terminates TLS for the API, so a floating
    # tag must not pull an unreviewed image. Human-readable version: caddy 2.11.4.
    # Bump the tag and digest together (docker buildx imagetools inspect caddy:<tag>).
    image: caddy:2.11.4@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017
    profiles: ["tls"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      - SWARM_API_DOMAIN=${SWARM_API_DOMAIN:-}
      - AGENT_FS_DOMAIN=${AGENT_FS_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

configs:
  caddyfile:
    content: |
      {$$SWARM_API_DOMAIN:swarm-api.localhost} {
        reverse_proxy api:3013
      }
      {$$AGENT_FS_DOMAIN:swarm-files.localhost} {
        # Preserve the bucket path and Host for S3 signature validation.
        handle /agentfs/* {
          reverse_proxy minio:9000
        }
        handle {
          reverse_proxy agent-fs:7433
        }
      }

secrets:
  # Base64-encoded 32-byte AES-256-GCM key for swarm_config at-rest encryption.
  # Create with: `openssl rand -base64 32 > ./encryption_key` then chmod 600.
  # BACK THIS FILE UP alongside your SQLite DB — losing it means losing all
  # encrypted swarm_config secrets with no recovery path.
  encryption_key:
    file: ./encryption_key

volumes:
  agent_fs_minio:
  agent_fs_data:
  caddy_data:
  caddy_config:
  # Replaces the older `swarm_api` volume, which was mounted at `/app` and
  # shadowed the image's migrations. Upgrading an existing install requires a
  # one-time copy of `<swarm_api>/data/.` into this volume before `up -d`:
  # https://github.com/desplega-ai/agent-swarm/blob/main/skills/agent-swarm/references/upgrade.md
  swarm_api_data:
  swarm_logs:
  swarm_shared:
  swarm_lead:
  swarm_worker_1:
  swarm_worker_2:
  swarm_forward_deployed_engineer:
  swarm_tester:
  swarm_reviewer:
  swarm_researcher:
  swarm_content_writer:
  swarm_content_reviewer:
  swarm_content_strategist:
  swarm_ux_principles:
  swarm_discoverability_optimizer:
  # Uncomment if using the pi-worker service above
  # swarm_pi_worker:
  # swarm_pi_agent:
  # Uncomment if using the codex-worker service above
  # swarm_codex_worker:
  # swarm_codex_agent:
  # Uncomment if using the worker-opencode service above
  # swarm_opencode_worker:
  # swarm_opencode_agent:
