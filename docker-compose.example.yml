      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - BEDROCK_AUTH_MODE=${BEDROCK_AUTH_MODE:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AWS_PROFILE=${AWS_PROFILE:-}
      - API_KEY=${API_KEY}
      # Generate once with `uuidgen`, set LEAD_AGENT_ID in .env, and keep it stable across restarts.
      - "AGENT_ID=${LEAD_AGENT_ID:?Set LEAD_AGENT_ID in .env (generate one with uuidgen)}"

      # Important: Lead agent role
      - AGENT_ROLE=lead
      # Template for initial profile (fetched on first boot)
      - TEMPLATE_ID=official/lead

      # - MCP_BASE_URL=${MCP_BASE_URL:-http://api:3013}
      # If in the same Docker network, use the service name
      - MCP_BASE_URL=http://api:3013
      - AGENT_FS_API_URL=http://agent-fs:7433

      - BUSINESS_USE_API_KEY=${BUSINESS_USE_API_KEY:-}
      - BUSINESS_USE_URL=${BUSINESS_USE_URL:-}

      - YOLO=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_EMAIL=${GITHUB_EMAIL:-}
      - GITHUB_NAME=${GITHUB_NAME:-}
      - SWARM_URL=${SWARM_URL:-localhost}

    ports:
      - "${LEAD_PORT:-3020}:3000"

    volumes:
      - swarm_logs:/logs
      - swarm_shared:/workspace/shared
      - swarm_lead:/workspace/personal
      # AWS profile auth only: uncomment this mount. Do not expose host AWS credentials otherwise.
      # - ${HOME}/.aws:/home/worker/.aws:ro

