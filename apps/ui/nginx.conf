# Mirrors apps/ui/vercel.json.

# Connection links carry ?apiKey=..., so the log line drops the query string and referrer.
map $request_uri $ui_request_path {
    ~^(?<path>[^?]*) $path;
}
log_format ui_noquery '$remote_addr [$time_local] "$request_method $ui_request_path $server_protocol" $status $body_bytes_sent';

map $uri $ui_cache_control_by_path {
    default         "no-cache";
    /version.json   "no-cache, no-store, must-revalidate";
    ~^/assets/      "public, max-age=31536000, immutable";
}

# Link-preview bots (the list in vercel.json). They get a page's own preview on /pages/:id.
map $http_user_agent $page_share_bot {
    default 0;
    "~(Slackbot|Slack-ImgProxy|Twitterbot|LinkedInBot|facebookexternalhit|Facebot|meta-externalagent|Discordbot|WhatsApp|TelegramBot|Applebot|redditbot|Mastodon|Bluesky|Embedly|SkypeUriPreview|Pinterestbot|Iframely|vkShare|Googlebot|bingbot|DuckDuckBot|Snapchat)" 1;
}

# /pages/:id answers bots and browsers differently, so caches must key on User-Agent.
map $request_uri $page_share_vary {
    default "";
    "~^/pages/[A-Za-z0-9_-]+/?(\?|$)" "User-Agent";
}

# A bot's /pages/:id preview can turn private at any time: never stored by a shared cache.
map "$page_share_bot:$page_share_vary" $ui_cache_control {
    "1:User-Agent"  "private, no-store";
    default         $ui_cache_control_by_path;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log ui_noquery;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Locations below set no add_header, so they inherit all of these. Cache-Control has no
    # `always`: an asset 404 must not be cached as immutable during a rolling deploy.
    add_header Cache-Control $ui_cache_control;
    add_header Vary $page_share_vary;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.map$ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Page link previews. A bot asking for /pages/:id gets the swarm API's crawler view
    # (GET /p/:id/share: the page's title, description and its /p/:id/og.png card) when
    # SWARM_API_URL is set; 40-page-share.sh writes the proxy_pass include at start. With
    # no API, a private or missing page, or an API error, it gets index.html (the generic
    # card), the same as a browser.
    location ~ "^/pages/[A-Za-z0-9_-]{1,128}/?$" {
        if ($page_share_bot) {
            rewrite "^/pages/([A-Za-z0-9_-]+)/?$" /__page_share/$1 last;
        }
        try_files $uri /index.html;
    }

    location /__page_share/ {
        internal;
        set $page_share_prefix "";
        include /tmp/nginx-page-share/*.conf;
        rewrite "^/__page_share/(.*)$" $page_share_prefix/p/$1/share? break;
        log_not_found off;
        proxy_set_header Accept "text/html";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_ssl_server_name on;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 400 401 403 404 405 500 502 503 504 = /index.html;
    }

    # The dashboard's Vercel card renderer (api/og.ts) does not run here. Self-hosted page
    # cards come from the swarm API (/p/:id/og.png); this generic card answers old links.
    location = /api/og {
        try_files /og-image.png =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
