# Seed E2E_CLAUDE_CODE_OAUTH_TOKEN with `claude setup-token`.
# Seed E2E_CODEX_OAUTH from a dedicated login: `env HOME=/tmp/e2e-codex codex login`, then
# `bun scripts/e2e/codex-oauth-blob.ts /tmp/e2e-codex/.codex/auth.json | gh secret set E2E_CODEX_OAUTH`.
# Never use a developer's main login. CI refresh rotates its refresh token and breaks that login.
# The CLI rotates the Codex refresh token on every refresh and OpenAI rejects a reused one, so
# the seed only starts a chain. Each main run carries the rotated auth.json to the next night in
# the Actions cache, sealed under a key derived from the secret (scripts/e2e/codex-auth-chain.ts).
# Reseed only after the chain breaks, for example after 7 days without a main run. Reseeding
# starts a new chain. Until a chain exists, the report warns three days before the seed expires.
# The codex leg runs on main only and never sees the secret elsewhere: a dispatch on another
# ref would spend the seed before main does, or replay a used refresh token, which can make
# OpenAI revoke the whole token family. The report marks that leg SKIP off main. A lost chain
# fails the leg: a step after the save checks that the cache entry landed, and a failed save or
# check rewrites the codex result to an auth-chain failure before upload.
# E2E_OPENROUTER_API_KEY is a plain OpenRouter key.
#
# Shape: `contract` runs the deterministic scenarios once. Each `harness` leg runs one real
# LLM task through one provider. `report` merges every result file into one step summary,
# uploads it as `nightly-e2e-report`, and keeps one sticky issue open while the nightly fails.
name: Nightly E2E

on:
  schedule:
    # Off the hour: on-the-hour schedules queue for a long time on GitHub.
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  contract:
    if: github.repository == 'desplega-ai/agent-swarm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The floors guard the recorder, not the scenarios: coverage dropping to zero means
      # the HTTP or MCP recorder broke, which no scenario assertion would catch.
      - name: Run contract scenarios
        run: bun run e2e --json out/e2e-results.json --min-route-coverage 3 --min-tool-coverage 2

      - name: Upload contract results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e2e-contract
          path: out/
          if-no-files-found: warn

  harness:
    if: github.repository == 'desplega-ai/agent-swarm'
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: claude
            leg: claude
            transport: cli
          - provider: claude
            leg: claude-sdk
            transport: sdk
          - provider: codex
            leg: codex
          - provider: pi
            leg: pi
          - provider: opencode
            leg: opencode
          - provider: dsh
            leg: dsh
    name: harness (${{ matrix.leg }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/desplega-ai/agent-swarm-worker:slim
      options: --init
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      E2E_CLAUDE_TRANSPORT: ${{ matrix.transport || '' }}
      E2E_MODEL_CLAUDE: claude-haiku-4-5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Provision explicitly: slim has no dsh, and the full image may predate this PR.
      # Keep the pin aligned with Dockerfile.worker; the adapter never installs at runtime.
      - name: Install pinned dsh
        if: matrix.provider == 'dsh'
        run: |
          npm install --ignore-scripts --global --prefix "$RUNNER_TEMP/dsh" @deepseek-ai/dsh@0.2.2-alpha.2
          "$RUNNER_TEMP/dsh/bin/dsh" --version
          echo "DSH_BINARY=$RUNNER_TEMP/dsh/bin/dsh" >> "$GITHUB_ENV"

      # Only main runs carry the chain. A run on another ref writes a cache that main never
      # restores, so it would fork the chain and the next main run would hit a used token.
      - name: Restore Codex auth chain
        if: matrix.provider == 'codex' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-state/codex-auth.sealed
          key: nightly-e2e-codex-auth-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nightly-e2e-codex-auth-

      # `--only health` keeps the contract scenarios in the contract job. The retry lives in
      # the runner so both attempts land in the result file with their cost and log tail.
      # `--keep` leaves the SUT log on disk for the upload step below.
      # Only inference and exact-value log redaction receive provider credentials.
      # Keep provisioning and artifact uploads outside that scope.
      - name: Run harness leg
        if: matrix.provider != 'codex' || github.ref == 'refs/heads/main'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.provider == 'claude' && secrets.E2E_CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CODEX_OAUTH: ${{ matrix.provider == 'codex' && github.ref == 'refs/heads/main' && secrets.E2E_CODEX_OAUTH || '' }}
          E2E_CODEX_AUTH_STATE: ${{ matrix.provider == 'codex' && github.ref == 'refs/heads/main' && '.e2e-state/codex-auth.sealed' || '' }}
          OPENROUTER_API_KEY: ${{ (matrix.provider == 'pi' || matrix.provider == 'opencode' || matrix.provider == 'dsh') && secrets.E2E_OPENROUTER_API_KEY || '' }}
        run: >-
          bun run e2e --only health --harness "${{ matrix.provider }}" --harness-attempts 2
          --keep --json out/e2e-results.json

      # The artifact is readable by anyone with read access to this public repository, so the
      # copies are redacted: the provider credential this leg holds, plus common token shapes.
      # The container job runs `sh -e`, not bash: keep this POSIX (no pipefail).
      - name: Collect redacted logs
        if: always()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.provider == 'claude' && secrets.E2E_CLAUDE_CODE_OAUTH_TOKEN || '' }}
          CODEX_OAUTH: ${{ matrix.provider == 'codex' && github.ref == 'refs/heads/main' && secrets.E2E_CODEX_OAUTH || '' }}
          OPENROUTER_API_KEY: ${{ (matrix.provider == 'pi' || matrix.provider == 'opencode' || matrix.provider == 'dsh') && secrets.E2E_OPENROUTER_API_KEY || '' }}
        run: |
          mkdir -p out/logs
          ls /tmp/e2e-*.log >/dev/null 2>&1 || exit 0
          bun scripts/e2e/redact.ts --out out/logs /tmp/e2e-*.log

      # Test for the file inside the container, not with hashFiles(): the image runs as root and
      # the harness writes the file mode 600, while hashFiles() runs on the host as the runner
      # user, cannot read it, and fails the save step's condition.
      - name: Check for a Codex auth chain to save
        id: codex-chain-file
        if: always() && matrix.provider == 'codex' && github.ref == 'refs/heads/main'
        run: |
          if [ -f .e2e-state/codex-auth.sealed ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Save even when the leg failed: a refresh that rotated the token must still carry over.
      # A re-run attempt restores this save through the restore-keys prefix.
      - name: Save Codex auth chain
        id: save-codex-chain
        if: always() && steps.codex-chain-file.outputs.present == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-state/codex-auth.sealed
          key: nightly-e2e-codex-auth-${{ github.run_id }}-${{ github.run_attempt }}

      # cache/save only warns when the upload fails, and the next night would then restore a
      # chain whose refresh token this run already spent. Fail the leg instead.
      - name: Verify Codex auth chain was saved
        id: verify-codex-chain
        if: always() && steps.save-codex-chain.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-state/codex-auth.sealed
          key: nightly-e2e-codex-auth-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: true
          fail-on-cache-miss: true

      # The run step wrote its result before the save, and the report reads only result files.
      # Rewrite the codex leg to an auth-chain failure so a lost chain never reports green.
      - name: Fail the codex result when the chain was not saved
        if: always() && (steps.codex-chain-file.outcome == 'failure' || steps.save-codex-chain.outcome == 'failure' || steps.verify-codex-chain.outcome == 'failure')
        run: bun scripts/e2e/codex-chain-lost.ts out/e2e-results.json

      - name: Upload harness results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e2e-${{ matrix.leg }}
          path: out/
          if-no-files-found: warn

  report:
    needs: [contract, harness]
    if: ${{ !cancelled() && github.repository == 'desplega-ai/agent-swarm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Download job results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-e2e-*
          path: results

      # Best effort: a run that predates the report artifact, or an expired artifact, is skipped.
      - name: Download earlier reports for the cost trend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          gh run list --workflow nightly-e2e.yml --status completed --limit 15 --json databaseId \
            --jq '.[].databaseId' | while read -r run_id; do
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            gh run download "$run_id" -n nightly-e2e-report -D "previous/$run_id" 2>/dev/null || true
          done
          echo "earlier reports: $(find previous -name nightly-report.json | wc -l)"

      - name: Build the report
        id: report
        run: |
          set -euo pipefail
          bun scripts/e2e/nightly-report.ts \
            --results results \
            --previous previous \
            --out nightly-summary.md \
            --issue-out nightly-issue.md \
            --json nightly-report.json \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" > /dev/null
          cat nightly-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e2e-report
          path: |
            nightly-report.json
            nightly-summary.md
          retention-days: 90

      # One issue carries the failure state. Its body is the latest summary without worker-log
      # tails (the issue is public), each failing run adds a comment, and the first green run
      # closes it.
      - name: Update the sticky issue
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.report.outputs.ok }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- nightly-e2e -->'
          issue=$(gh issue list --state open --limit 100 --json number,body \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .number" | head -n 1)
          if [ "$OK" = "true" ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Green again: $RUN_URL"
              gh issue close "$issue"
            fi
            exit 0
          fi
          { printf '%s\n\n' "$marker"; cat nightly-issue.md; } > issue.md
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file issue.md
            gh issue comment "$issue" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "Nightly E2E is failing" --body-file issue.md
          fi

      - name: Fail when any job failed
        run: |
          if [ "${{ steps.report.outputs.ok }}" != "true" ]; then
            echo "Nightly E2E failed. See the job summary." >&2
            exit 1
          fi
