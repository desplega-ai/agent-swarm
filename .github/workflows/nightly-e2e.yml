# Seed E2E_CLAUDE_CODE_OAUTH_TOKEN with `claude setup-token`.
# Seed E2E_CODEX_OAUTH from a dedicated login: `env HOME=/tmp/e2e-codex codex login`, then
# `bun scripts/e2e/codex-oauth-blob.ts /tmp/e2e-codex/.codex/auth.json | gh secret set E2E_CODEX_OAUTH`.
# Never use a developer's main login. CI refresh rotates its refresh token and breaks that login.
# The Codex blob goes stale after its first refresh, about ten days after issue.
# E2E_OPENROUTER_API_KEY is a plain OpenRouter key.
name: Nightly E2E

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  harness:
    if: github.repository == 'desplega-ai/agent-swarm'
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, codex, pi, opencode]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/desplega-ai/agent-swarm-worker:slim
    timeout-minutes: 30
    permissions:
      contents: read
    # Each leg receives only its provider credential. The :slim tag is built and
    # published by this repo's docker-and-deploy workflow from main, so the trust
    # boundary is write access to main; scoping keeps a single leg from seeing
    # the other provider credentials.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.provider == 'claude' && secrets.E2E_CLAUDE_CODE_OAUTH_TOKEN || '' }}
      CODEX_OAUTH: ${{ matrix.provider == 'codex' && secrets.E2E_CODEX_OAUTH || '' }}
      OPENROUTER_API_KEY: ${{ (matrix.provider == 'pi' || matrix.provider == 'opencode') && secrets.E2E_OPENROUTER_API_KEY || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run harness E2E with one retry
        run: >-
          bun run e2e --harness "${{ matrix.provider }}" --json e2e-results.json --summary-md e2e-summary.md ||
          bun run e2e --harness "${{ matrix.provider }}" --json e2e-results.json --summary-md e2e-summary.md

      - name: Add E2E job summary
        if: always()
        run: test ! -f e2e-summary.md || cat e2e-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-e2e-${{ matrix.provider }}
          path: e2e-results.json
          if-no-files-found: warn
