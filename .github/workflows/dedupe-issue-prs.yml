name: Dedupe issue PRs

# Keeps one open contributor PR per issue. See scripts/dedupe-issue-prs.ts for
# the winner rules: the first claimant on the issue, else a maintainer PR,
# else the earliest PR. Label `allow-duplicate` exempts a PR.
#
# pull_request_target runs with a write token on fork PRs. It checks out the
# base branch only and never checks out or runs PR code: the script reads PR
# metadata through the API.

on:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log what would be closed, close nothing
        type: boolean
        default: true

concurrency:
  group: dedupe-issue-prs-${{ github.event.pull_request.number || 'scan' }}
  cancel-in-progress: true

permissions: {}

jobs:
  dedupe:
    name: Dedupe issue PRs
    runs-on: ubuntu-latest
    # Bot PRs never take part.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Close duplicate PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          # Repo variable kill switch: set DEDUPE_ISSUE_PRS_DRY_RUN=true to make PR events log only.
          DRY_RUN_VAR: ${{ vars.DEDUPE_ISSUE_PRS_DRY_RUN }}
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT" = "workflow_dispatch" ]; then
            args+=(--all)
            if [ "$DRY_RUN_INPUT" != "false" ]; then args+=(--dry-run); fi
          else
            args+=(--pr "$PR")
            if [ "$DRY_RUN_VAR" = "true" ]; then args+=(--dry-run); fi
          fi
          bun scripts/dedupe-issue-prs.ts "${args[@]}"
