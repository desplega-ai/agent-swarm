name: UI E2E

on:
  pull_request:
    paths:
      - "apps/ui/**"
      - "packages/ui-e2e/**"
      - "scripts/e2e/**"
      - "src/http/**"
      - "src/be/**"
      - "bun.lock"
      - "package.json"
      - "bunfig.toml"
      - ".github/workflows/ui-e2e.yml"
  push:
    branches: [main]
  # Runs on main and is reported to the tracker as a nightly run.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ui-e2e-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'desplega-ai/agent-swarm'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/ui-e2e/package.json').devDependencies['@playwright/test']")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/ui-e2e

      - name: Run UI E2E shard
        id: run
        continue-on-error: true
        run: bun run e2e:ui -- --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-blob-${{ matrix.shard }}
          path: packages/ui-e2e/blob-report
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-results-${{ matrix.shard }}
          path: packages/ui-e2e/test-results
          if-no-files-found: warn

      - name: Fail when the shard failed
        if: always()
        run: |
          if [ "${{ steps.run.outcome }}" != "success" ]; then
            echo "UI E2E shard ${{ matrix.shard }} failed. See the uploaded artifacts." >&2
            exit 1
          fi

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve run context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          same_repo="true"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            same_repo="false"
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            trigger="pr"
            sha="$PR_HEAD_SHA"
            ref="$PR_HEAD_REF"
            pr="$PR_NUMBER"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            trigger="main"
            sha="$GITHUB_SHA"
            ref="$GITHUB_REF_NAME"
            pr=""
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            trigger="nightly"
            sha="$GITHUB_SHA"
            ref="$GITHUB_REF_NAME"
            pr=""
          else
            trigger="manual"
            sha="$GITHUB_SHA"
            ref="$GITHUB_REF_NAME"
            pr=""
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              pr=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty' || true)
            fi
          fi
          target="main"
          if [ -n "$pr" ]; then
            target="pr-$pr"
          fi
          {
            echo "same_repo=$same_repo"
            echo "trigger=$trigger"
            echo "sha=$sha"
            echo "ref=$ref"
            echo "pr=$pr"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ui-e2e-blob-*
          path: packages/ui-e2e/all-blob-reports
          merge-multiple: true

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ui-e2e-results-*
          path: packages/ui-e2e/all-results
          merge-multiple: false

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html all-blob-reports
        working-directory: packages/ui-e2e

      - name: Upload HTML report
        id: html-report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-html-report
          path: packages/ui-e2e/playwright-report
          if-no-files-found: warn

      - name: Check agent-fs secrets
        id: image-secrets
        if: steps.context.outputs.same_repo == 'true'
        env:
          AGENT_FS_API_URL: ${{ secrets.E2E_AGENT_FS_API_URL }}
          AGENT_FS_API_KEY: ${{ secrets.E2E_AGENT_FS_API_KEY }}
          AGENT_FS_DEFAULT_ORG_ID: ${{ secrets.E2E_AGENT_FS_ORG_ID }}
          AGENT_FS_DEFAULT_DRIVE_ID: ${{ secrets.E2E_AGENT_FS_DRIVE_ID }}
        run: |
          set -euo pipefail
          if [ -n "$AGENT_FS_API_URL" ] && [ -n "$AGENT_FS_API_KEY" ] && [ -n "$AGENT_FS_DEFAULT_ORG_ID" ] && [ -n "$AGENT_FS_DEFAULT_DRIVE_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "agent-fs secrets are incomplete. The comment will omit images."
          fi

      - name: Publish artifacts to agent-fs
        if: steps.context.outputs.same_repo == 'true' && steps.image-secrets.outputs.available == 'true'
        env:
          AGENT_FS_API_URL: ${{ secrets.E2E_AGENT_FS_API_URL }}
          AGENT_FS_API_KEY: ${{ secrets.E2E_AGENT_FS_API_KEY }}
          AGENT_FS_DEFAULT_ORG_ID: ${{ secrets.E2E_AGENT_FS_ORG_ID }}
          AGENT_FS_DEFAULT_DRIVE_ID: ${{ secrets.E2E_AGENT_FS_DRIVE_ID }}
          RUN_TARGET: ${{ steps.context.outputs.target }}
          RUN_SHA: ${{ steps.context.outputs.sha }}
        run: |
          set -euo pipefail
          npm i -g @desplega.ai/agent-fs@0.13.5
          node --experimental-strip-types reporter/publish-artifacts.ts \
            --results all-results \
            --prefix "e2e/desplega-ai__agent-swarm/$RUN_TARGET/$RUN_SHA" \
            --artifacts-out artifacts.json \
            --images-out images.json
        working-directory: packages/ui-e2e

      - name: Build UI E2E summary
        env:
          TRACKER_URL: ${{ vars.UI_E2E_TRACKER_URL }}
        run: |
          set -euo pipefail
          node --experimental-strip-types packages/ui-e2e/reporter/comment.ts \
            --summaries packages/ui-e2e/all-results \
            --images packages/ui-e2e/images.json \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --report-artifact ui-e2e-html-report \
            --tracker-url "$TRACKER_URL" \
            --out packages/ui-e2e/comment.md
          cat packages/ui-e2e/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert sticky PR comment
        if: github.event_name == 'pull_request' && steps.context.outputs.same_repo == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.body | startswith("<!-- ui-e2e -->")) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --raw-field body="$(<packages/ui-e2e/comment.md)"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --raw-field body="$(<packages/ui-e2e/comment.md)"
          fi

      - name: Ingest into the UI E2E tracker
        if: steps.context.outputs.same_repo == 'true'
        env:
          UI_E2E_INGEST_URL: ${{ secrets.UI_E2E_INGEST_URL }}
          UI_E2E_INGEST_BEARER: ${{ secrets.UI_E2E_INGEST_BEARER }}
          UI_E2E_TRIGGER: ${{ steps.context.outputs.trigger }}
          UI_E2E_SHA: ${{ steps.context.outputs.sha }}
          UI_E2E_REF: ${{ steps.context.outputs.ref }}
          UI_E2E_PR_NUMBER: ${{ steps.context.outputs.pr }}
          REPORT_URL: ${{ steps.html-report.outputs.artifact-url }}
        run: |
          set -euo pipefail
          node --experimental-strip-types reporter/ingest.ts \
            --summaries all-results \
            --artifacts artifacts.json \
            --out ingest-payloads \
            --report-url "$REPORT_URL" \
            | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: packages/ui-e2e

      - name: Upload ingest payloads
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-ingest-payloads
          path: |
            packages/ui-e2e/ingest-payloads
            packages/ui-e2e/artifacts.json
          if-no-files-found: ignore

      - name: Fail when a UI E2E shard failed
        if: always()
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "At least one UI E2E shard failed. See the uploaded artifacts." >&2
            exit 1
          fi
