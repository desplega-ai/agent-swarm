name: UI E2E

# Pull requests and the merge queue run the suite inside Merge Gate (merge-gate.yml), which
# needs it. Every commit on main went through the queue, so main has no push run. This file is
# the nightly and manual entry.
on:
  # An external scheduler dispatches this on main daily at 03:00 UTC. A dispatch on main is
  # the nightly run and is reported to the tracker as one; a dispatch on any other ref stays a
  # manual run.
  workflow_dispatch:

concurrency:
  group: ui-e2e-${{ (github.ref == 'refs/heads/main') && 'nightly' || 'manual' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: UI E2E
    permissions:
      contents: read
    uses: ./.github/workflows/ui-e2e-shards.yml

  report:
    name: UI E2E Report
    needs: test
    # `test` runs only on the upstream repo. On a fork it is skipped, so no blob report exists.
    if: always() && needs.test.result != 'skipped'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ui-e2e-report.yml
    with:
      shards-result: ${{ needs.test.result }}
    secrets: inherit
