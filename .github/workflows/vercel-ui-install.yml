name: Vercel UI Install

# Vercel builds apps/ui on top of node_modules restored from the last deploy.
# UI Lint and Type Check installs from scratch, so it misses a stale nested
# package that only an install over the base branch's node_modules leaves.
# This job replays that: install base, switch to the PR, run apps/ui's Vercel
# installCommand, then type-check.
on:
  pull_request:
    paths:
      - "bun.lock"
      - "package.json"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "apps/ui/vercel.json"
      - "scripts/vercel-install.sh"
      - ".github/workflows/vercel-ui-install.yml"

concurrency:
  group: vercel-ui-install-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  incremental-install:
    name: Vercel UI incremental install
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install the base branch (stands in for Vercel's restored cache)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "$BASE_SHA"
          bun install --frozen-lockfile

      - name: Run the Vercel installCommand on the PR
        env:
          PR_SHA: ${{ github.sha }}
        run: |
          git checkout --detach "$PR_SHA"
          cd apps/ui
          cmd=$(jq -r '.installCommand // "bun install"' vercel.json)
          echo "installCommand: $cmd"
          sh -c "$cmd"

      - name: Type-check apps/ui
        run: bunx tsc -b
        working-directory: apps/ui
