# Informational job, not part of the merge gate. It runs the legacy-renderer scenarios twice
# (once as-is, once again under SLACK_RENDER_V2=true plus the delegated-delivery scenarios,
# which only exist under v2), renders one PNG per Slack event from the slack-mock journal, and
# uploads the result as an artifact.
# Images live on the single-commit `ci-visuals` branch (rebuilt on every run, so history never
# grows) — but publishing and commenting happen in a SEPARATE workflow,
# slack-visuals-publish.yml, triggered by `workflow_run` once this one completes. This job
# always runs with a read-only token (no `contents`/`pull-requests` permission at all), even on
# a same-repo PR, so fork PRs and same-repo PRs behave identically here: build the visuals,
# upload the artifact, done. The publish workflow runs with the base branch's trusted token and
# never checks out or executes fork-authored code — see that file for why the split is safe.
name: Slack Visuals

on:
  pull_request:
    paths:
      - "src/slack/**"
      - "src/prompts/**"
      - "scripts/e2e/**"
      - "slack-manifest.json"
      - "bun.lock"
      - ".github/workflows/slack-visuals.yml"
  workflow_dispatch:

concurrency:
  group: slack-visuals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visuals:
    if: github.repository == 'desplega-ai/agent-swarm'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ubuntu-latest ships without ffmpeg. Without it the renderer skips the step GIFs and
      # the comment reads "no ffmpeg on the runner". Signed Ubuntu packages, about 40 seconds.
      - name: Install ffmpeg for the step GIFs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      # Scenario selection is by declared group (see each scenario file's `groups` field and
      # scripts/e2e/scenarios/registry.ts), not a hardcoded name list — a new Slack scenario
      # joins these legs by tagging itself with "visuals-legacy" and/or "visuals-v2", no
      # workflow edit required.
      - name: Run legacy Slack E2E
        id: legacy
        continue-on-error: true
        run: bun run e2e --group visuals-legacy --visuals visuals/legacy --json visuals/legacy.json

      - name: Run v2 Slack E2E
        id: v2
        continue-on-error: true
        run: bun run e2e --group visuals-v2 --sut-env SLACK_RENDER_V2=true --visuals visuals/v2 --json visuals/v2.json

      - name: Render Slack visuals
        if: always()
        run: |
          set -euo pipefail
          if test -f visuals/legacy/manifest.json; then bun run e2e:visuals visuals/legacy; fi
          if test -f visuals/v2/manifest.json; then bun run e2e:visuals visuals/v2; fi

      # workflow_run does not carry the triggering PR's number for a fork-authored run the way
      # you might expect (github.event.workflow_run.pull_requests is populated from a same-repo
      # relationship and is typically empty for forks) — so the publish workflow reads it back
      # out of the artifact instead of trying to resolve it from the workflow_run event.
      - name: Write PR context for the publish workflow
        if: always() && github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p visuals
          jq -n --arg pr "$PR" --arg sha "$HEAD_SHA" \
            '{prNumber: ($pr | tonumber), headSha: $sha}' > visuals/pr-context.json
          cat visuals/pr-context.json

      - name: Upload Slack visuals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slack-visuals
          path: visuals/
          if-no-files-found: warn

      - name: Fail when Slack E2E failed
        if: always()
        run: |
          if [ "${{ steps.legacy.outcome }}" != "success" ] || [ "${{ steps.v2.outcome }}" != "success" ]; then
            echo "Slack visual E2E failed. See the uploaded artifact for partial output." >&2
            exit 1
          fi
