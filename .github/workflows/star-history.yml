name: Refresh star history chart

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: star-history-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'desplega-ai/agent-swarm'
    runs-on: ubuntu-latest
    steps:
      - name: Report authentication path
        env:
          TOKEN_SOURCE: ${{ secrets.STAR_HISTORY_TOKEN && 'STAR_HISTORY_TOKEN' || 'github.token' }}
        run: echo "Using ${TOKEN_SOURCE} for checkout, chart generation, and pull request creation."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Prefer the PAT because a PR opened with github.token does not trigger pull_request CI.
          token: ${{ secrets.STAR_HISTORY_TOKEN || github.token }}

      - name: Generate charts
        env:
          GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN || github.token }}
        run: node scripts/generate-star-history.mjs

      - name: Open refresh pull request
        env:
          GH_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN || github.token }}
        run: |
          if git diff --quiet -- assets/star-history-light.svg assets/star-history-dark.svg; then
            echo "Star history charts are already current."
            exit 0
          fi

          existing_pr=$(gh pr list --state open --search 'in:title "docs: refresh star history chart"' --json url --jq '.[0].url // ""')
          if [ -n "$existing_pr" ]; then
            echo "A star history refresh pull request is already open: $existing_pr"
            exit 0
          fi

          branch="automation/star-history-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add assets/star-history-light.svg assets/star-history-dark.svg
          git commit -m "docs: refresh star history chart"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "docs: refresh star history chart" \
            --body $'## Summary\n\n- refresh the committed light and dark star history charts from the authenticated GitHub stargazers API\n\n## Validation\n\n- `node scripts/generate-star-history.mjs`'
