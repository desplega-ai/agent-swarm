# Companion to slack-visuals.yml, split out so the write side (push to `ci-visuals`, upsert the
# PR comment) runs with a trusted token on EVERY PR, fork-authored included.
#
# `workflow_run` jobs always run against the base branch's default token — GitHub does not
# downgrade it the way it downgrades a `pull_request` job's token for a fork head — so this is
# the standard safe pattern for "do a privileged thing after a fork PR's checks finish" without
# resorting to `pull_request_target` (which would need to check out and run fork-authored code
# under a privileged token; that trade is worse than the gap this file closes).
#
# Security invariant: this job NEVER checks out the PR head and NEVER runs anything from the PR
# branch. It checks out the workflow file's own ref (the base branch), downloads the visuals
# artifact slack-visuals.yml already built (data only — PNGs, GIFs, JSON), and runs
# repo-trusted scripts from that checkout against that data. Keep it that way.
#
# Trust model for the downloaded artifact (this job's real attack surface):
# the producing job (slack-visuals.yml) runs with the PR-branch copy of that workflow file for
# a `pull_request` trigger, so for a fork PR the artifact's CONTENTS — including
# visuals/pr-context.json — are attacker-controlled, even though this job's own token is not.
# `workflow_run.head_sha` is the one piece of trusted event metadata we get for free, so every
# other value is treated as a hint that must be corroborated against it and against the GitHub
# API before it is allowed to drive a privileged action:
#   1. Run-provenance gate on the job `if`: the completed run must belong to this repository.
#   2. pr-context.json is schema-validated (exact key set, prNumber decimal, headSha 40-hex)
#      before anything reads it.
#   3. The artifact's headSha must equal the trusted `workflow_run.head_sha` — this is the
#      cross-check that demotes the artifact from authority to hint.
#   4. The artifact's prNumber is resolved through `gh api pulls/$PR` (trusted server-side
#      lookup) and that PR's head.sha/base.repo.full_name must match the trusted head_sha and
#      this repository. A mismatch means the artifact pointed at a PR it does not own — reject.
# Any failed check aborts the job instead of silently continuing.
name: Slack Visuals Publish

on:
  workflow_run:
    workflows: ["Slack Visuals"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      # No `ref:` override — this checks out whatever commit the workflow file itself lives on
      # (the base branch), never the PR head.
      - name: Checkout repository (base branch only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # visuals-comment.ts only imports node:util, so no `bun install` — just the runtime.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Download Slack visuals artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slack-visuals
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: visuals

      - name: Read PR context
        id: pr
        if: steps.download.outcome == 'success'
        env:
          TRUSTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ ! -f visuals/pr-context.json ]; then
            echo "No visuals/pr-context.json in the artifact (non-pull_request run, or the" >&2
            echo "producing workflow failed before writing it). Nothing to publish." >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exact-schema check first: the artifact is fork-controlled, so this is read as an
          # untrusted hint, never as authority. Reject anything but exactly {headSha, prNumber}.
          actual_keys=$(jq -r 'keys_unsorted | sort | join(",")' visuals/pr-context.json)
          if [ "$actual_keys" != "headSha,prNumber" ]; then
            echo "Unexpected keys in pr-context.json: $actual_keys" >&2
            exit 1
          fi

          pr_number=$(jq -r '.prNumber' visuals/pr-context.json)
          head_sha=$(jq -r '.headSha' visuals/pr-context.json)

          if ! [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "prNumber is not a decimal integer for an existing PR: $pr_number" >&2
            exit 1
          fi
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "headSha is not exactly 40 lowercase hex characters: $head_sha" >&2
            exit 1
          fi

          # The one piece of trusted metadata this event carries for free: cross-check the
          # artifact's claimed headSha against it. This is what demotes the artifact from
          # authority to hint — everything downstream keys off TRUSTED_HEAD_SHA, not the file.
          if [ "$head_sha" != "$TRUSTED_HEAD_SHA" ]; then
            echo "pr-context.json headSha ($head_sha) != triggering run's head_sha ($TRUSTED_HEAD_SHA)" >&2
            exit 1
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Verify PR identity against trusted API metadata
        id: verify
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr_number }}
          TRUSTED_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Derive the PR identity from the commit itself rather than trusting the artifact's
          # prNumber outright — a commit's associated-PRs lookup is scoped to this repository, so
          # every PR it returns already belongs here regardless of what the artifact claimed.
          # (Using pulls/$PR directly would instead compare against the PR's CURRENT head, which
          # can have legitimately moved on by the time this job runs — a false rejection, not a
          # security property.)
          associated=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TRUSTED_HEAD_SHA/pulls")
          match_count=$(printf '%s' "$associated" | jq --argjson pr "$PR" '[.[] | select(.number == $pr)] | length')
          if [ "$match_count" -ne 1 ]; then
            echo "Commit $TRUSTED_HEAD_SHA is not associated with exactly one PR numbered $PR in this repository (found $match_count)." >&2
            exit 1
          fi
          base_repo=$(printf '%s' "$associated" | jq -r --argjson pr "$PR" '.[] | select(.number == $pr) | .base.repo.full_name')
          if [ "$base_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "PR #$PR's base repo ($base_repo) is not this repository ($GITHUB_REPOSITORY)." >&2
            exit 1
          fi

      - name: Publish Slack visuals
        if: steps.pr.outputs.found == 'true'
        id: publish
        env:
          PR: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          publish_output=$(bash scripts/e2e/visuals-publish.sh visuals "$PR" "$HEAD_SHA")
          printf '%s\n' "$publish_output"
          base_url=$(printf '%s\n' "$publish_output" | tail -n 1)
          echo "base_url=${base_url#base_url=}" >> "$GITHUB_OUTPUT"

      - name: Post Slack visual preview
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_URL: ${{ steps.publish.outputs.base_url }}
        run: |
          set -euo pipefail
          bun scripts/e2e/visuals-comment.ts \
            --base-url "$BASE_URL" \
            --profile legacy=visuals/legacy \
            --profile v2=visuals/v2 \
            --out comment.md \
            --run-url "${{ github.event.workflow_run.html_url }}" \
            --sha "$HEAD_SHA"
          # --paginate emits one JSON array per page; --jq runs per page, so take the first id.
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.body | startswith("<!-- slack-visuals -->")) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --raw-field body="$(<comment.md)"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --raw-field body="$(<comment.md)"
          fi
