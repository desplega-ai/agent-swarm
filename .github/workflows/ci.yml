name: CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock*"
      - "bunfig.toml"
      - "apps/ui/package.json"
      - "apps/templates-ui/package.json"
      - "apps/evals/package.json"
      - "konsistent.json"
      - "tsconfig.json"
      - "biome.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome linter
        run: bun run lint

      - name: Run TypeScript type check
        run: bun run tsc:check

      - name: Run structural consistency lint
        continue-on-error: true
        env:
          KONSISTENT_NO_UPDATE_CHECK: "true"
        run: bun run lint:structure

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        # apps/evals/ excluded from the root run via bunfig.toml pathIgnorePatterns
        # (separate bun package with its own deps + CI test step).
        run: bun run test:root -- --timeout 10000
