name: Ranking entry

# Checks community/ranking/<domain>.json PRs (see community/ranking/README.md):
# the file's shape, and that the telemetry proxy saw an install send this exact
# domain and claim. Runs PR code with a read-only token and no secrets; a
# Desplega maintainer still reviews and merges every entry.
on:
  pull_request:
    branches:
      - main
    paths:
      - "community/ranking/**"

concurrency:
  group: ranking-entry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ranking-entry:
    name: Ranking entry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check ranking entries
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/check-ranking-entry.ts --base "origin/$BASE_REF"
