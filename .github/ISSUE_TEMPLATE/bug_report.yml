name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Write short, direct sentences for a human reader. The sections match the PR template, so a fix can reuse them.

  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: What is wrong, what should happen instead, and who it affects. Stay high level.
      placeholder: "Scheduled tasks stop running after an API restart. They should resume. Every deployment with schedules is affected."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Numbered steps that show the bug.
      placeholder: |
        1. Start the API server with `bun run start:http`
        2. Create a schedule that runs every minute
        3. Restart the API server
        4. The schedule does not run again
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Where the bug happens.
      placeholder: |
        - Version or commit: v1.154.0
        - Deployment: local / Docker Compose / Helm / cloud
        - Agent roster: 1 lead, 2 workers
        - Harness providers: claude, codex
    validations:
      required: true

  - type: textarea
    id: proof
    attributes:
      label: Proof
      description: Logs, screenshots, or recordings that show the bug. Put logs in a code block. Remove secrets and tokens first.
    validations:
      required: false

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options:
        - asap
        - this week
        - nice to have
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API Server
        - Worker / Runner / Harness provider
        - Lead Agent
        - Dashboard UI
        - CLI (`bunx @desplega.ai/agent-swarm`)
        - Integrations (Slack, GitHub, Linear, Jira, AgentMail)
        - Memory System
        - Workflows / Schedules
        - Scripts / Swarm Apps / Extensions
        - Docker / Helm / Deployment
        - Other
    validations:
      required: false
