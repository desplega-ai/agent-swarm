name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Agent Swarm better? Write short, direct sentences for a human reader. The sections match the PR template, so the implementation can reuse them.

  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: The problem or need, who has it, and why it matters now. Describe the need, not only a solution.
      placeholder: "Operators cannot see which worker ran a task after the worker is deleted. They need this to audit costs."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal & trade-offs
      description: How it could work. Alternatives you considered, and what each one costs.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it is done? One observable outcome per line.
      placeholder: |
        - An operator can ...
        - The API returns ...
    validations:
      required: false

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options:
        - asap
        - this week
        - nice to have
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API Server
        - Worker / Runner / Harness provider
        - Lead Agent
        - Dashboard UI
        - CLI
        - Integrations (Slack, GitHub, Linear, Jira, AgentMail)
        - Memory System
        - Workflows / Schedules
        - Scripts / Swarm Apps / Extensions
        - Docker / Helm / Deployment
        - Documentation
        - Other
    validations:
      required: false
