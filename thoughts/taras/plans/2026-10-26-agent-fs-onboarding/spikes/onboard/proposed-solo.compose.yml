# Docker Compose for Agent Swarm
# Generated by `agent-swarm onboard`
#
# Usage:
#   docker compose --env-file .env up -d
#
# Image version: set AGENT_SWARM_VERSION in .env to a published release.
# Blank falls back to `latest`, which moves on every commit to main and is
# not a release. Releases: https://github.com/desplega-ai/agent-swarm/releases
# Upgrade/rollback (migrations are forward-only, so back up first):
# https://github.com/desplega-ai/agent-swarm/blob/main/skills/agent-swarm/references/upgrade.md

services:
  swarm-api:
    image: "ghcr.io/desplega-ai/agent-swarm:${AGENT_SWARM_VERSION:-latest}"
    container_name: swarm-api
    pull_policy: always
    stop_grace_period: 60s

    environment:
      - API_KEY=${API_KEY}
      - INSTALL_METHOD=${INSTALL_METHOD}
      - INSTALL_PRESET=${INSTALL_PRESET:-}
      - MEMORY_HYBRID_SEARCH=${MEMORY_HYBRID_SEARCH-1}
      - MEMORY_GRAPH_EXPANSION=${MEMORY_GRAPH_EXPANSION-1}
      - MEMORY_RATERS=${MEMORY_RATERS-implicit-citation,explicit-self}
      - MEMORY_DEMOTION_FLOOR=${MEMORY_DEMOTION_FLOOR-1.0}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MCP_BASE_URL=http://localhost:3013
      - APP_URL=https://app.agent-swarm.dev
      - AGENT_FS_API_URL=http://agent-fs:7433
      - AGENT_FS_PUBLIC_URL=${AGENT_FS_PUBLIC_URL:-http://localhost:7433}
      - COMB_ENABLED=${COMB_ENABLED:-true}
      - EMBEDDING_API_BASE_URL=http://tei:80/v1
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-local-tei}
      - ALLOW_PRIVATE_NETWORK_URLS=true

    depends_on:
      agent-fs:
        condition: service_healthy
      tei:
        condition: service_healthy

    ports:
      - "3013:3013"

    volumes:
      - swarm_data:/app/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3013/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

  worker-coder:
    image: "ghcr.io/desplega-ai/agent-swarm-worker:${AGENT_SWARM_VERSION:-latest}"
    container_name: swarm-worker-coder
    pull_policy: always
    stop_grace_period: 60s

    depends_on:
      swarm-api:
        condition: service_healthy

    environment:
      - HARNESS_PROVIDER=${HARNESS_PROVIDER}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - API_KEY=${API_KEY}
      - MEMORY_RATERS=${MEMORY_RATERS-implicit-citation,explicit-self}
      - AGENT_ID=87dfb7ee-6a8a-4081-be61-003cfbc85c5c
      - AGENT_NAME=Coder
      - AGENT_ROLE=worker
      - TEMPLATE_ID=official/coder
      - MCP_BASE_URL=http://swarm-api:3013
      - YOLO=true
      - SWARM_URL=http://swarm-api:3013
      - AGENT_FS_API_URL=http://agent-fs:7433
      - MAX_CONCURRENT_TASKS=1

    ports:
      - "3201:3000"

    volumes:
      - swarm_logs:/app/logs
      - swarm_shared:/app/shared
      - swarm_worker_coder:/app/agent

    restart: unless-stopped

  agent-fs:
    image: "ghcr.io/desplega-ai/agent-fs:0.18.5"
    container_name: swarm-agent-fs
    pull_policy: always
    environment:
      - AGENT_FS_HOME=/data
      - AGENT_FS_STORAGE_PROVIDER=local
      - AGENT_FS_LOCAL_ROOT=/data/storage
      - HOST=0.0.0.0
      - SERVER_HOST=0.0.0.0
      - PORT=7433
      - SERVER_PORT=7433
      - EMBEDDING_PROVIDER=${AGENT_FS_EMBEDDING_PROVIDER:-local}
      - EMBEDDING_MODEL=${AGENT_FS_EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${AGENT_FS_EMBEDDING_API_KEY:-}
      - AGENT_FS_PUBLIC_URL=${AGENT_FS_PUBLIC_URL:-http://localhost:7433}
    ports:
      - "${AGENT_FS_PORT:-7433}:7433"
    volumes:
      - agent_fs_data:/data
    healthcheck:
      # No curl/wget in the agent-fs image (oven/bun slim). Probe with node fetch.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7433/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  tei:
    # Per-arch tag cannot live in Compose: onboard writes TEI_IMAGE to .env on arm64.
    image: "${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}"
    container_name: swarm-tei
    pull_policy: always
    command: ["--model-id", "${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1.5}"]
    volumes:
      - tei_data:/data
    healthcheck:
      # The TEI image ships curl (verified on cpu-arm64-1.9.4).
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

volumes:
  agent_fs_data:
  tei_data:
  swarm_data:
  swarm_logs:
  swarm_shared:
  swarm_worker_coder:
