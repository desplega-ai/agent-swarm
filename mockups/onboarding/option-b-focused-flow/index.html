<!doctype html>
<!--
  Option B, "Focused Flow", round 2. One step owns the whole screen: an 800px centered column,
  a single linear progress bar, and a slim six-name step overview under it.
  Trade-off: maximum focus per step. The overview row is deliberately terse, so the full
  per-step detail only exists on the step itself or in the minimized home checklist.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Swarm · Onboarding · Focused Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../session-logs/demo-shared.css" />
<style>
/* ============ shell ============ */
body{overflow-x:hidden}
#app{min-height:100dvh;display:flex;flex-direction:column}
#full,#min{flex:1;min-height:100dvh;display:flex;flex-direction:column}
#full[hidden],#min[hidden]{display:none}
.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:9px 18px;background:color-mix(in oklch,var(--background) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.hdr .mark{width:22px;height:22px;flex:none;display:block}
.hdr .nm{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.hdr .kick{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);border-left:1px solid var(--border);padding-left:10px;margin-left:2px;white-space:nowrap}
.hdr .sp{flex:1}

/* ============ logos ============ */
/* The harness/provider marks are single-path currentColor files. Loaded through <img> they
   paint black, so dark mode inverts them. Inline marks below follow currentColor directly. */
.plogo{display:block;width:20px;height:20px;flex:none;object-fit:contain;opacity:.88}
html.dark .plogo{filter:invert(1);opacity:.92}
.mk{display:block;width:20px;height:20px;flex:none}
.plogo.s16,.mk.s16{width:16px;height:16px}
.plogo.s18,.mk.s18{width:18px;height:18px}
.plogo.s22,.mk.s22{width:22px;height:22px}
.btn,.chip{flex:none}
.footnote{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ progress bar ============ */
.progwrap{width:100%;max-width:840px;margin:0 auto;padding:13px 20px 0}
.pbar{display:flex;height:5px;border-radius:999px;background:var(--border);overflow:hidden}
.pslice{flex:1;min-width:0;height:100%;position:relative}
.pslice+.pslice{box-shadow:inset 1px 0 0 color-mix(in oklch,var(--background) 65%,transparent)}
.pslice i{display:block;height:100%;width:0;background:var(--primary);transition:width .4s cubic-bezier(.2,0,0,1)}
.pslice.cur{background:color-mix(in oklch,var(--primary) 17%,transparent)}
.pslice.done i{width:100%}
.pslice.failed i{width:100%;background:var(--error)}
.pslice.skipped i{width:100%;background-color:color-mix(in oklch,var(--neutral) 20%,transparent);
  background-image:repeating-linear-gradient(115deg,color-mix(in oklch,var(--neutral) 60%,transparent) 0 1.5px,transparent 1.5px 5px)}

/* ============ compact step overview ============ */
.ovrow{display:flex;gap:0;width:100%;max-width:840px;margin:0 auto;padding:7px 14px 9px}
.ovi{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;padding:4px 6px;border:0;border-radius:7px;background:none;cursor:pointer;font-family:var(--font-sans);font-size:11px;line-height:1.2;color:var(--muted-foreground);text-align:left;-webkit-tap-highlight-color:transparent}
.ovi:hover{background:var(--accent);color:var(--foreground)}
.ovi:focus-visible{outline:2px solid var(--ring);outline-offset:-1px}
.ovi .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovi .nu{display:none;font-family:var(--font-mono);font-size:11px}
.ovi.done,.ovi.cur{color:var(--foreground)}
.ovi.cur{font-weight:600}
.gl{width:15px;height:15px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid color-mix(in oklch,var(--border) 100%,transparent);color:var(--muted-foreground);background:transparent}
.gl svg{width:9px;height:9px;stroke-width:3.4}
.ovi.cur .gl{border-color:var(--primary);box-shadow:0 0 0 2.5px color-mix(in oklch,var(--primary) 22%,transparent)}
.ovi.done .gl,.poprow.done .gl{border-color:color-mix(in oklch,var(--success) 55%,transparent);background:color-mix(in oklch,var(--success) 15%,transparent);color:var(--success-strong)}
.ovi.failed .gl,.poprow.failed .gl{border-color:color-mix(in oklch,var(--error) 55%,transparent);background:color-mix(in oklch,var(--error) 13%,transparent);color:var(--error-strong)}
.ovi.skipped .gl,.poprow.skipped .gl{border-color:color-mix(in oklch,var(--neutral) 42%,transparent);
  background-image:repeating-linear-gradient(115deg,color-mix(in oklch,var(--neutral) 48%,transparent) 0 1.5px,transparent 1.5px 4px)}

/* ============ stage ============ */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;justify-content:safe center;padding:14px 20px 22px}
.col{width:100%;max-width:800px;margin:0 auto}
.kicker{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);margin:0 0 7px}
.kicker .of{color:var(--muted-foreground)}
h2.title{margin:0 0 6px;font-size:26px;line-height:1.14;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
p.sub{margin:0 0 16px;color:var(--muted-foreground);font-size:14px;line-height:1.5;max-width:70ch}
@keyframes inF{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}
.col.in-f{animation:inF .22s cubic-bezier(.2,0,0,1) both}
.col.in-b{animation:inB .22s cubic-bezier(.2,0,0,1) both}
.col.out{opacity:0;transform:translateY(-7px);transition:opacity .12s cubic-bezier(.2,0,0,1),transform .12s cubic-bezier(.2,0,0,1)}
.col.out-b{opacity:0;transform:translateY(7px);transition:opacity .12s,transform .12s}

/* ============ cards + fields ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.card+.card,.card+.note,.note+.card,.card+.linkrow{margin-top:12px}
.cardh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--muted) 24%,var(--card))}
.cardh h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.cardh .sp{flex:1}
.cardb{padding:16px}
.hint+.acts,details.more+.acts,.codeblk+.acts,.field+.field,.field+.acts,.acts+.result,.field+.result,.result+.result,.field+.frow,.frow+.field,.frow+.frow,.frow+.acts,.field+.details2,.frow+.details2,.details2+.acts,.result+.acts{margin-top:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow>.field+.field{margin-top:0}
.lbl{display:block;font-size:11.5px;font-weight:500;letter-spacing:.025em;text-transform:uppercase;color:var(--muted-foreground);margin:0 0 6px}
.lbl.env{font-family:var(--font-mono);font-size:11px;text-transform:none;letter-spacing:.01em}
.lbl .plogo,.lbl .mk{display:inline-block;vertical-align:-3px;margin-right:3px}
.lbl .req{font-family:var(--font-sans);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-left:6px}
.lbl .opt{font-family:var(--font-sans);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin-left:6px;opacity:.8}
.fhead{display:flex;align-items:center;gap:10px;margin:0 0 7px}
.fhead .lbl{margin:0}
.fhead .sp{flex:1}
.inp{width:100%;height:36px;padding:0 11px;font-family:var(--font-sans);font-size:14px;color:var(--foreground);background:transparent;border:1px solid var(--border);border-radius:8px;transition:border-color .12s,box-shadow .12s}
.inp::placeholder{color:color-mix(in oklch,var(--muted-foreground) 70%,transparent)}
.inp:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 45%,transparent)}
.inp:disabled{background:color-mix(in oklch,var(--muted) 45%,transparent);color:var(--muted-foreground);cursor:not-allowed}
.inp.mono{font-family:var(--font-mono);font-size:12.5px}
.inrow{display:flex;gap:6px;align-items:center}
.inrow .inp{flex:1;min-width:0}
.inrow .icon-btn{width:36px;height:36px;flex:none}
.hint{margin:6px 0 0;font-size:12px;line-height:1.45;color:var(--muted-foreground)}
.hint code,code.k{font-family:var(--font-mono);font-size:11.5px;background:var(--code-bg);border:1px solid color-mix(in oklch,var(--border) 60%,transparent);border-radius:5px;padding:.1em .35em}
.acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acts .sp{flex:1}
.note{font-size:12.5px;color:var(--muted-foreground);line-height:1.5;margin:10px 2px 0}
.linkrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--primary);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font-family:var(--font-sans);text-align:left}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk svg{width:13px;height:13px;flex:none}
.quiet{color:var(--muted-foreground)}
.quiet:hover{color:var(--foreground)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}

/* ============ chips + results ============ */
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;font-family:var(--font-sans);font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--border);color:var(--muted-foreground);white-space:nowrap}
.chip.ok{border-color:color-mix(in oklch,var(--success) 38%,transparent);color:var(--success-strong)}
.chip.run{border-color:color-mix(in oklch,var(--active) 45%,transparent);color:var(--active-strong)}
.chip.err{border-color:color-mix(in oklch,var(--error) 38%,transparent);color:var(--error-strong)}
.chip.skip{border-color:color-mix(in oklch,var(--neutral) 38%,transparent);color:var(--neutral)}
.chip.info{border-color:color-mix(in oklch,var(--info) 38%,transparent);color:var(--info-strong)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.result{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:13px;line-height:1.45}
.result svg{width:15px;height:15px;flex:none;margin-top:1px}
.result b{font-weight:600}
.result .mono{display:block;margin-top:3px;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);word-break:break-word}
.result.ok{border-color:color-mix(in oklch,var(--success) 32%,transparent);background:color-mix(in oklch,var(--success) 9%,transparent);color:var(--success-strong)}
.result.err{border-color:color-mix(in oklch,var(--error) 32%,transparent);background:color-mix(in oklch,var(--error) 8%,transparent);color:var(--error-strong)}
.result.warn{border-color:color-mix(in oklch,var(--active) 38%,transparent);background:color-mix(in oklch,var(--active) 10%,transparent);color:var(--active-strong)}
.result.info{border-color:color-mix(in oklch,var(--info) 30%,transparent);background:color-mix(in oklch,var(--info) 8%,transparent);color:var(--info-strong)}
.result.plain{color:var(--muted-foreground);background:color-mix(in oklch,var(--muted) 40%,transparent)}
.spin{width:14px;height:14px;flex:none;border-radius:50%;border:2px solid color-mix(in oklch,var(--primary) 22%,transparent);border-top-color:var(--primary);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ code block ============ */
.codeblk{position:relative;background:var(--code-bg);border:1px solid var(--border);border-radius:9px;padding:11px 42px 11px 12px;font-family:var(--font-mono);font-size:11.5px;line-height:1.65;color:color-mix(in oklch,var(--foreground) 88%,var(--muted-foreground));white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.codeblk.flat{padding-right:12px}
.codeblk.scroll{max-height:212px;overflow:auto;line-height:1.5;font-size:10.5px}
.codeblk .cp{position:absolute;top:7px;right:7px}

/* ============ step 2 preview ============ */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.two .card+.card{margin-top:0}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);cursor:pointer;padding:0;position:relative;transition:transform .12s}
.sw:hover{transform:scale(1.08)}
.sw.on{box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--foreground)}
.pv{padding:13px;background:var(--surface)}
.pvside{border:1px solid var(--border);border-radius:9px;background:var(--card);overflow:hidden}
.pvhead{display:flex;align-items:center;gap:9px;padding:10px 11px;border-bottom:1px solid var(--border)}
.pvmark{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;overflow:hidden}
.pvmark svg{width:16px;height:16px}
.pvmark img{width:100%;height:100%;object-fit:cover}
.pvname{font-size:12.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvsub{font-size:10px;color:var(--muted-foreground);line-height:1.2;margin-top:2px}
.pvnav{padding:7px}
.pvrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;font-size:11.5px;color:var(--muted-foreground)}
.pvrow i{width:13px;height:13px;border-radius:4px;background:currentColor;opacity:.45;flex:none}
.pvrow.on{font-weight:600}

/* ============ accordion (providers) ============ */
.acc{border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.acc+.acc{margin-top:8px}
.acc.open{border-color:color-mix(in oklch,var(--primary) 40%,var(--border))}
.acch{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;background:none;border:0;cursor:pointer;text-align:left;font-family:var(--font-sans);color:var(--foreground)}
.acch:hover{background:color-mix(in oklch,var(--accent) 60%,transparent)}
.pmark{width:76px;flex:none;display:flex;align-items:center;gap:7px;color:color-mix(in oklch,var(--foreground) 86%,transparent)}
.pname{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.25}
.pname em{display:block;font-style:normal;font-size:11.5px;font-weight:400;color:var(--muted-foreground);margin-top:2px}
.chev{width:15px;height:15px;color:var(--muted-foreground);transition:transform .15s cubic-bezier(.2,0,0,1);flex:none}
.acc.open .chev{transform:rotate(180deg)}
.accb{padding:14px 14px 14px 90px;border-top:1px solid var(--border)}
.seg2{display:inline-flex;padding:2px;gap:2px;background:var(--muted);border:1px solid var(--border);border-radius:9px}
.seg2 button{height:28px;padding:0 11px;border:0;background:none;border-radius:7px;font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--muted-foreground);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg2 button.on{background:var(--card);color:var(--foreground);box-shadow:var(--shadow)}
.seg2 button .rec{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--primary)}

/* ============ codex device code ============ */
.devwrap{border:1px solid color-mix(in oklch,var(--primary) 28%,var(--border));border-radius:10px;padding:14px;background:color-mix(in oklch,var(--primary) 4%,transparent)}
.devcode{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 8px 12px}
.devcode span{font-family:var(--font-mono);font-size:29px;font-weight:700;letter-spacing:.18em;color:var(--foreground);text-indent:.18em}
.devsteps{margin:0;padding:0 0 0 18px;font-size:13px;line-height:1.7;color:color-mix(in oklch,var(--foreground) 85%,var(--muted-foreground))}
.devsteps a{color:var(--primary);font-weight:500;text-underline-offset:3px}
.poll{display:flex;align-items:center;gap:9px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--foreground)}
.poll .sp2{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
details.more{margin-top:12px;border-top:1px solid var(--border);padding-top:11px}
details.more.plain2{border-top:0;padding-top:0;margin-top:12px}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--muted-foreground);list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{width:13px;height:13px;flex:none;transition:transform .15s}
details.more[open] summary svg{transform:rotate(90deg)}
details.more summary:hover{color:var(--foreground)}
.moreb{padding-top:11px}

/* ============ step 4 presets ============ */
.pchips{display:flex;gap:7px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;gap:7px;height:33px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:transparent;cursor:pointer;font-family:var(--font-sans);font-size:12.5px;font-weight:500;color:var(--foreground);white-space:nowrap}
.pchip:hover{background:var(--accent)}
.pchip.on{border-color:var(--primary);background:color-mix(in oklch,var(--primary) 8%,transparent);color:var(--primary)}
.reuse{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;border:1px dashed color-mix(in oklch,var(--primary) 45%,transparent);color:var(--primary);background:none;font-family:var(--font-sans);font-size:11.5px;font-weight:500;cursor:pointer}
.reuse:hover{background:color-mix(in oklch,var(--primary) 8%,transparent)}
.ro{display:flex;gap:10px;align-items:center;padding:7px 11px;font-size:12px}
.ro span{width:74px;flex:none;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.ro b{font-family:var(--font-mono);font-size:11.5px;font-weight:400;word-break:break-all}

/* ============ step 5 split view ============ */
.split{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;align-items:start}
.ilist{border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.irow{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;background:none;border:0;border-top:1px solid var(--border);cursor:pointer;font-family:var(--font-sans);font-size:13px;color:var(--foreground);text-align:left}
.irow:first-child{border-top:0}
.irow:hover{background:var(--accent)}
.irow.on{background:color-mix(in oklch,var(--primary) 9%,transparent);box-shadow:inset 2px 0 0 var(--primary)}
.irow .nm2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .lchip{font-family:var(--font-sans);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);white-space:nowrap}
.irow.ok .lchip{color:var(--success-strong)}
.irow.run .lchip{color:var(--active-strong)}
.imore{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-top:1px solid var(--border);font-size:11px;line-height:1.45;color:var(--muted-foreground);background:color-mix(in oklch,var(--muted) 24%,transparent)}
.imore b{display:block;font-weight:600;color:var(--muted-foreground);font-size:11.5px;margin-bottom:2px}
.ipane{border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.ipaneh{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--muted) 24%,var(--card))}
.ipaneh .who{flex:1;min-width:0}
.ipaneh h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em}
.ipaneh em{display:block;font-style:normal;font-size:11.5px;color:var(--muted-foreground);margin-top:2px}
.ipaneb{padding:16px}
.stepline{display:flex;gap:9px;align-items:baseline;font-size:12.5px;color:var(--muted-foreground);line-height:1.5;margin:0 0 8px}
.stepline b{flex:none;width:16px;height:16px;border-radius:5px;display:inline-grid;place-items:center;font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:var(--primary);background:color-mix(in oklch,var(--primary) 12%,transparent);align-self:flex-start;margin-top:1px}
.stepline span{min-width:0}
.stepline a{color:var(--primary);font-weight:500;text-underline-offset:3px}

/* ============ step 6 agents ============ */
.leadrow{display:flex;align-items:center;gap:10px;font-size:13px;padding:11px 16px;border-bottom:1px solid var(--border)}
.leadrow b{font-weight:600}
.shimbar{position:relative;height:3px;border-radius:0;background:color-mix(in oklch,var(--active) 16%,transparent);overflow:hidden}

@keyframes shim{0%{background-position:-60% 0}100%{background-position:160% 0}}
.wdot{width:8px;height:8px;border-radius:50%;background:var(--active);flex:none;box-shadow:0 0 0 0 color-mix(in oklch,var(--active) 55%,transparent);animation:orb2 1.6s ease-out infinite}
.wdot.ok{background:var(--success);animation:none}

.arow{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px}

.arow.off{color:var(--muted-foreground)}
.rb{flex:none;font-family:var(--font-mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--border);color:var(--muted-foreground);width:54px;text-align:center}

.aname{font-family:var(--font-mono);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .plogo,.arow .mk{color:var(--muted-foreground)}
.ahb{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground);white-space:nowrap;min-width:72px;text-align:right}
.tl{list-style:none;margin:12px 0 0;padding:0}
.tl li{position:relative;padding:0 0 11px 22px;font-size:12.5px;color:var(--muted-foreground)}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:3px;top:4px;width:8px;height:8px;border-radius:50%;border:2px solid var(--border);background:var(--card)}
.tl li::after{content:"";position:absolute;left:6.5px;top:14px;bottom:0;width:1px;background:var(--border)}

.tl li.hit{color:var(--foreground)}
.tl li.hit::before{border-color:var(--success);background:var(--success)}
.tl li.now::before{border-color:var(--active);background:var(--active)}
.tl li time{float:right;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}
.party{position:relative}
.party i{position:absolute;bottom:-2px;width:5px;height:5px;border-radius:1px;opacity:0;animation:pop .75s cubic-bezier(.2,0,0,1) forwards}

/* ============ footer ============ */
.foot{position:sticky;bottom:0;z-index:30;border-top:1px solid var(--border);background:color-mix(in oklch,var(--background) 92%,transparent);backdrop-filter:blur(10px)}
.footin{display:flex;align-items:center;gap:10px;width:100%;max-width:840px;margin:0 auto;padding:11px 20px}
.footin .sp{flex:1}
.footnote{font-size:11.5px;color:var(--muted-foreground)}
.btn.lg{height:36px;padding:0 15px;font-size:13.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted-foreground)}
.btn.ghost:hover{background:var(--accent);color:var(--foreground)}

/* ============ minimized home shell ============ */
.shell{display:flex;min-height:100dvh}
.side{width:216px;flex:none;border-right:1px solid var(--border);background:color-mix(in oklch,var(--muted) 30%,var(--background));display:flex;flex-direction:column}
.side .sh{display:flex;align-items:center;gap:9px;padding:13px 14px;border-bottom:1px solid var(--border)}
.side nav{padding:9px 8px;display:flex;flex-direction:column;gap:2px}
.nrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:13px;color:var(--muted-foreground);cursor:pointer;background:none;border:0;font-family:var(--font-sans);text-align:left;width:100%}
.nrow svg{width:15px;height:15px}
.nrow:hover{background:var(--accent);color:var(--foreground)}
.nrow.on{background:color-mix(in oklch,var(--primary) 12%,transparent);color:var(--primary);font-weight:600}
.side .foot2{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono)}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border)}
.crumb{font-size:13px;color:var(--muted-foreground)}
.crumb b{color:var(--foreground);font-weight:600}

.pill:hover{background:var(--accent)}
.pill.open{border-color:color-mix(in oklch,var(--primary) 50%,transparent);background:color-mix(in oklch,var(--primary) 8%,transparent)}
.ring{width:17px;height:17px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.bell{position:relative}
.bell::after{content:"";position:absolute;top:6px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--primary);border:1.5px solid var(--card)}
.pop{position:absolute;top:calc(100% + 9px);right:0;width:312px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px oklch(0 0 0/.06),0 18px 44px -18px oklch(0 0 0/.34);z-index:60;overflow:hidden}
.poph{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--muted) 24%,var(--card))}
.poph b{font-size:13px;font-weight:600}
.poph .sp{flex:1}
.poprow{display:flex;align-items:center;gap:9px;width:100%;padding:8px 13px;border:0;border-top:1px solid color-mix(in oklch,var(--border) 60%,transparent);background:none;cursor:pointer;font-family:var(--font-sans);font-size:12.5px;color:var(--foreground);text-align:left}
.poprow:first-of-type{border-top:0}
.poprow:hover{background:var(--accent)}

.poprow .w{font-size:10.5px;color:var(--muted-foreground);white-space:nowrap}
.poprow.done .nm2{color:var(--muted-foreground)}

.popf .sp{flex:1}
.main{padding:22px 20px 40px;max-width:900px;width:100%}
.hello{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0 0 3px}
.hellosub{margin:0 0 18px;font-size:13.5px;color:var(--muted-foreground)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:12px 13px}
.stat .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}

.setup .cardh{padding:13px 15px}
.prog{height:4px;border-radius:999px;background:var(--border);overflow:hidden;margin:0 15px}

.srow:first-of-type{border-top:0}

.sttl{flex:1;min-width:0;font-size:13px;font-weight:500;color:var(--foreground)}

.srow.done .sttl{color:var(--muted-foreground)}

.dev{position:fixed;left:12px;bottom:12px;z-index:70;display:none;gap:6px;flex-wrap:wrap;align-items:center;max-width:min(620px,92vw);padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--card);box-shadow:var(--shadow)}

  .arow,.leadrow{padding:9px 13px}

}

function svg(name, cls){
  return '<svg class="' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + "</svg>";
}
function btn(id, label, kind, extra){
  return '<button class="btn ' + (kind || "") + '" id="' + id + '"' + (extra || "") + ">" + label + "</button>";
}
function copyBtn(id, text, cls, label){
  return '<button class="btn ' + (cls || "icon-btn") + ' cp" data-copy="' + esc(text) + '" id="' + id + '" title="Copy"' +
    (label ? ">" + svg("copy") + label : ' aria-label="Copy">' + svg("copy")) + "</button>";
}
function bindCopies(root){
  $$(".cp", root).forEach((b) => {
    b.addEventListener("click", () => {
      const text = b.getAttribute("data-copy") || "";
      try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (e) { /* file:// may refuse */ }
      const old = b.innerHTML;
      b.innerHTML = svg("check") + (b.classList.contains("icon-btn") ? "" : "Copied");
      setTimeout(() => { b.innerHTML = old; }, 1300);
    });
  });
}
function resultRow(kind, title, mono){
  const ic = kind === "ok" ? "check" : kind === "err" ? "x" : "alert";
  return '<div class="result ' + kind + '">' + svg(ic) + "<div><b>" + title + "</b>" + (mono ? '<span class="mono">' + mono + "</span>" : "") + "</div></div>";
}
function pendingRow(label){
  return '<div class="result plain"><span class="spin"></span><div>' + label + "</div></div>";
}
function fld(id, label, ph, o){
  o = o || {};
  return '<div class="field"><label class="lbl ' + (o.plain ? "" : "env") + '" for="' + id + '">' + label +
    (o.req ? '<span class="req">required</span>' : "") + (o.opt ? '<span class="opt">optional</span>' : "") + "</label>" +
    '<input class="inp mono" id="' + id + '" type="' + (o.type || "text") + '" placeholder="' + esc(ph || "") + '"' +
    (o.val != null ? ' value="' + esc(o.val) + '"' : "") + (o.dis ? " disabled" : "") + ' spellcheck="false">' +
    (o.hint ? '<p class="hint">' + o.hint + "</p>" : "") + "</div>";
}
function apiUrl(){ return state.conn.url.replace(/\/+$/, ""); }

/* ---------- status plumbing ---------- */
function setStatus(i, s){ state.status[i] = s; renderNav(); renderFoot(); syncUrl(); }
const STATUS_WORD = { todo:"To do", done:"Verified", skipped:"Skipped", failed:"Failed" };

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.classList.toggle("dark", t === "dark");
  const b = $("#theme"); if (b) b.innerHTML = svg(t === "dark" ? "sun" : "moon");
  const b2 = $("#theme2"); if (b2) b2.innerHTML = svg(t === "dark" ? "sun" : "moon");
  syncUrl();
}
function theme(){ return document.documentElement.classList.contains("dark") ? "dark" : "light"; }

/* ---------- url sync ---------- */
function syncUrl(){
  const p = new URLSearchParams();
  p.set("step", String(state.step));
  if (theme() === "dark") p.set("theme", "dark");
  if (state.view === "min") p.set("state", "minimized");
  history.replaceState(null, "", location.pathname + "?" + p.toString());
}

/* ---------- progress bar + compact overview ---------- */
function buildProgress(){
  $("#pbar").innerHTML = STEPS.map(() => '<span class="pslice"><i></i></span>').join("");
}
function glyph(st, cur){
  if (st === "done") return '<span class="gl">' + svg("check") + "</span>";
  if (st === "failed") return '<span class="gl">' + svg("x") + "</span>";
  return '<span class="gl"></span>';
}
function renderNav(){
  $$("#pbar .pslice").forEach((el, i) => {
    el.className = "pslice " + state.status[i] + (state.step === i + 1 ? " cur" : "");
  });
  const row = $("#ovrow");
  row.innerHTML = STEPS.map((s, i) => {
    const st = state.status[i], cur = state.step === i + 1;
    return '<button class="ovi ' + st + (cur ? " cur" : "") + '" data-go="' + (i + 1) + '" type="button"' +
      ' title="' + (i + 1) + ". " + esc(s.nav) + " · " + STATUS_WORD[st] + '"' +
      ' aria-label="Step ' + (i + 1) + ": " + esc(s.nav) + ", " + STATUS_WORD[st] + '"' +
      (cur ? ' aria-current="step"' : "") + ">" +
      glyph(st) + '<span class="tx">' + esc(s.nav) + '</span><span class="nu">' + (i + 1) + "</span></button>";
  }).join("");
  $$(".ovi", row).forEach((b) => b.addEventListener("click", () => {
    const n = Number(b.getAttribute("data-go"));
    gotoStep(n, n > state.step ? 1 : -1);
  }));
}

/* ---------- footer ---------- */
function renderFoot(){
  const i = state.step - 1;
  const last = state.step === 6;
  const st = state.status[i];
  let note = "";
  if (st === "done") note = "This step is verified.";
  else if (st === "skipped") note = "Skipped. You can come back to it.";
  else if (state.step === 4) note = "Skipping leaves memory off.";
  else note = "Nothing is saved until a check passes.";
  $("#footin").innerHTML =
    btn("back", svg("left") + " Back", "lg ghost", state.step === 1 ? " disabled" : "") +
    '<span class="sp"></span>' +
    '<span class="footnote">' + note + "</span>" +
    btn("skip", st === "skipped" ? "Skipped" : "Skip", "lg ghost", st === "skipped" ? " disabled" : "") +
    btn("next", last ? "Finish" : "Continue " + svg("right"), "lg primary");
  $("#back").addEventListener("click", () => gotoStep(Math.max(1, state.step - 1), -1));
  $("#skip").addEventListener("click", () => {
    setStatus(i, "skipped");
    renderStep(1);
    later(() => gotoStep(Math.min(6, state.step + 1), 1), 260);
  });
  $("#next").addEventListener("click", () => {
    if (last) { minimize(); return; }
    gotoStep(state.step + 1, 1);
  });
}

/* ---------- stage ---------- */
function gotoStep(n, dir){
  if (n === state.step) return;
  clearLater();
  const col = $("#col");
  col.classList.remove("in-f", "in-b");
  col.classList.add(dir > 0 ? "out" : "out-b");
  setTimeout(() => { state.step = n; renderStep(dir); renderNav(); renderFoot(); syncUrl(); }, 120);
}
function renderStep(dir){
  const i = state.step - 1, s = STEPS[i], col = $("#col");
  col.className = "col " + (dir < 0 ? "in-b" : "in-f");
  col.innerHTML =
    '<p class="kicker">Step ' + state.step + ' <span class="of">of 6</span></p>' +
    '<h2 class="title">' + esc(s.title) + "</h2>" +
    '<p class="sub">' + esc(s.sub) + "</p>" +
    '<div id="body"></div>';
  const body = $("#body", col);
  ({ connect:step1, brand:step2, provider:step3, memory:step4, integrations:step5, task:step6 })[s.key](body);
  bindCopies(body);
}

function step1(root){
  const c = state.conn;
  root.innerHTML =

          '<input class="inp mono" id="c-url" value="' + esc(c.url) + '" spellcheck="false">' +

      "</div>" +
      '<div class="field"><label class="lbl" for="c-key">API key</label><div class="inrow">' +
        '<input class="inp mono" id="c-key" type="' + (c.shown ? "text" : "password") + '" value="' + esc(c.key) + '" spellcheck="false">' +
        '<button class="btn icon-btn" id="c-eye" title="' + (c.shown ? "Hide key" : "Show key") + '">' + svg(c.shown ? "eyeoff" : "eye") + "</button>" +
      '</div><p class="hint">The value of <code>AGENT_SWARM_API_KEY</code> on the server. Kept in this browser only.</p></div>' +
      '<div class="acts">' + btn("c-test", "Test connection", "primary") +
        '<span class="footnote" id="c-probe">GET ' + esc(apiUrl()) + "/health</span></div>" +
      '<div id="c-out">' + connOut() + "</div>" +
    "</div></div>";

  $("#c-name", root).addEventListener("input", (e) => { c.name = e.target.value; });
  $("#c-url", root).addEventListener("input", (e) => {
    c.url = e.target.value;
    $("#c-probe", root).textContent = "GET " + apiUrl() + "/health";
  });
  $("#c-key", root).addEventListener("input", (e) => { c.key = e.target.value; });
  $("#c-eye", root).addEventListener("click", () => { c.shown = !c.shown; step1(root); bindCopies(root); });
  $("#c-test", root).addEventListener("click", () => {
    const valid = /^https?:\/\/\S+/.test(c.url.trim());
    c.phase = "run"; $("#c-out", root).innerHTML = pendingRow("Probing " + esc(apiUrl()) + "/health");
    later(() => {
      c.phase = valid ? "ok" : "err"; c.ok = valid;
      setStatus(0, valid ? "done" : "failed");
      step1(root); bindCopies(root);
    }, 850);
  });
}
function connOut(){
  const c = state.conn;
  if (c.phase === "ok") return resultRow("ok", "Server answered. Connection saved.", "200 OK · agent-swarm v1.154.0 · 34 ms · " + esc(c.name || "amber-badger-41"));
  if (c.phase === "err") return resultRow("err", "Could not reach that address.", "The URL must start with http:// or https://");
  return "";
}

function fmt(s){ const m = Math.floor(s / 60), r = s % 60; return m + ":" + String(r).padStart(2, "0"); }
function codexBody(){
  const c = state.prov.codex;

    "<div><b>Turn on device code login first.</b><span class=\"mono\">ChatGPT Settings → Security → Allow device code login. Workspace accounts need an admin to enable it.</span></div></div>";

      '<div class="acts">' + btn("cx-start", c.phase === "starting" ? "Requesting a code" : "Start device login", "primary", c.phase === "starting" ? " disabled" : "") + "</div>" +
      (c.phase === "starting" ? '<div style="margin-top:12px">' + pendingRow("Requesting a device code from auth.openai.com") + "</div>" : "");
  } else if (c.phase === "polling"){
    core = '<div class="devwrap">' +
      '<div class="devcode"><span>ABCD-EFGH</span>' + copyBtn("cx-cp", "ABCD-EFGH") + "</div>" +
      '<ol class="devsteps">' +

        "<li>Approve the request. This page updates on its own.</li>" +
      "</ol>" +
      '<div class="poll"><span class="spin"></span> Waiting for you to approve the code' +
        '<span class="sp2" id="cx-left">expires in ' + fmt(c.left) + "</span></div>" +
    "</div>";
  } else {
    core = resultRow("ok", "Codex is signed in.", "token stored as codex_oauth_1 · workers refresh it per task");
  }
  const cli = "npx @desplega.ai/agent-swarm codex-login --api-url " + apiUrl();
  const fallback = '<details class="more"><summary>' + svg("chevr") + "Other ways to sign in</summary>" +
    '<div class="moreb">' +
      '<p class="hint" style="margin:0 0 8px">Run the CLI login on the machine that already holds your Codex session.</p>' +
      '<div class="codeblk">' + esc(cli) + copyBtn("cx-cp2", cli) + "</div>" +
    "</div></details>";
  return note + core + fallback;

function bindCodex(root){
  const start = $("#cx-start", root);
  if (start) start.addEventListener("click", () => {
    const c = state.prov.codex;
    c.phase = "starting"; step3(root); bindCopies(root);
    later(() => {
      c.phase = "polling"; c.left = 899; step3(root); bindCopies(root); tickCodex(root);
      later(() => {
        if (state.prov.codex.phase !== "polling") return;
        state.prov.codex.phase = "ok";
        if (anyProvider()) setStatus(2, "done");
        step3(root); bindCopies(root);
      }, 4600);
    }, 700);
  });
  if (state.prov.codex.phase === "polling" && $("#cx-left", root)) tickCodex(root);
}
function tickCodex(root){
  const el = $("#cx-left", root);
  if (!el || state.prov.codex.phase !== "polling") return;
  later(() => {
    const c = state.prov.codex;
    if (c.phase !== "polling") return;
    c.left = Math.max(0, c.left - 1);
    const e2 = $("#cx-left", root);
    if (e2){ e2.textContent = "expires in " + fmt(c.left); tickCodex(root); }
  }, 1000);
}

function chosenProvider(){ return PROV_KEYS.find((p) => state.prov[p].phase === "ok") || "claude"; }

function agentRows(){

  const rows = [
    { role:"Lead",   name:"swarm-lead",  harness:h,

      hb: ready ? (busy ? "now" : "4s ago") : "no heartbeat" },

    case 4: { const on = connectedIntgs(); return on.length ? on.join(", ") + " connected" : "Nothing connected"; }

    if (v === "min") return state.view === "min" ? resume(state.step) : minimize();

    if (v === "worker"){ state.task.lead = true; if (state.view === "full" && state.step === 6) renderStep(1); return; }
    if (v === "reset"){ location.href = location.pathname; return; }
    if (state.view === "min") resume(Number(v)); else gotoStep(Number(v), Number(v) > state.step ? 1 : -1);
    renderDev();
  }));
}

(function init(){
  const q = new URLSearchParams(location.search);
  applyTheme(q.get("theme") === "dark" ? "dark" : "light");
  $("#hdrmark").style.color = state.brand.color;
  $("#theme").addEventListener("click", () => applyTheme(theme() === "dark" ? "light" : "dark"));
  $("#minimize").addEventListener("click", minimize);
  applyPreset("openai");

  const step = Math.min(6, Math.max(1, Number(q.get("step") || 1)));
  const minimized = q.get("state") === "minimized";

  /* Deep links land mid-flow, so seed plausible progress for the steps behind you. */
  if (minimized){
    state.status = ["done","done","done","skipped","todo","todo"];
    state.conn.ok = true; state.conn.phase = "ok";
    state.brand.phase = "ok"; state.brand.name = "Hive Field";
    state.prov.claude.phase = "ok"; state.prov.open = "claude";
    state.step = 5;
  } else if (step > 1){
    for (let i = 0; i < step - 1; i++) state.status[i] = i === 1 ? "skipped" : "done";
    state.conn.ok = true; state.conn.phase = "ok";
    state.brand.name = "Hive Field";
    if (step > 3){ state.prov.claude.phase = "ok"; state.prov.openrouter.phase = "ok"; }
    if (step > 4){ state.mem.phase = "ok"; }
  }
  $("#hdrname").textContent = state.brand.name || "Your Swarm";
  if (q.get("provider") && PROV[q.get("provider")]) state.prov.open = q.get("provider");
  if (q.get("codex") === "polling"){ state.prov.codex.phase = "polling"; state.prov.open = "codex"; }
  if (q.get("integration") && INTG[q.get("integration")]) state.intg.open = q.get("integration");
  if (q.get("worker") === "1") state.task.lead = true;
  if (q.get("popover") === "1") state.popover = true;

  state.step = minimized ? state.step : step;
  buildProgress();
  renderNav(); renderStep(1); renderFoot(); renderDev();
  if (minimized) minimize(); else syncUrl();
  if (q.get("dev") === "1") $("#devpanel").classList.add("show");

  document.addEventListener("click", (e) => {
    if (state.view !== "min" || !state.popover) return;
    if (e.target.closest && e.target.closest(".pillwrap")) return;
    state.popover = false; renderMin();
  });
  document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (e.key === "d" && !typing){ $("#devpanel").classList.toggle("show"); return; }
    if (e.key === "Escape" && state.view === "min" && state.popover){ state.popover = false; renderMin(); return; }
    if (state.view !== "full" || typing) return;
    if (e.key === "ArrowRight" && state.step < 6) gotoStep(state.step + 1, 1);
    if (e.key === "ArrowLeft" && state.step > 1) gotoStep(state.step - 1, -1);
  });
})();
</script>
</body>
</html>
