<!doctype html>
<!--
  Option C, "Channels + threads": every group is a channel in a team-chat rail (Groups, Slack and Telegram Sources, Shared with me), the center is that group's feed of conversation cards with the newest at the bottom and a composer under it, and a session opens as a wide thread panel on the right with tabs and one split.
  Trade-off: Slack users feel at home and two-way Slack threads read naturally, but three columns leave the session less room than a two-pane layout, so the split view has to collapse the feed and scanning many groups at once is slower than in a dense mail-style list.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Swarm · Sessions v2 · Channels + threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../session-logs/demo-shared.css" />
<style>
/* ============ base ============ */
:root{--rail:256px;--feed:clamp(360px,31vw,460px);--pf:oklch(0.985 0 0);--snappy:cubic-bezier(.2,0,0,1)}
html.dark{--pf:oklch(0.21 0.006 285.885)}
[hidden]{display:none !important}
html,body{overflow:hidden}
body{font-size:14px}
button,input,textarea{font-family:var(--font-sans);color:inherit}
button{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:where(button,[tabindex],a,input,textarea):focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.btn.primary{color:var(--pf)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;gap:6px}
.btn.sm svg{width:14px;height:14px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted-foreground)}
.btn.ghost:hover{background:var(--accent);color:var(--foreground)}
.btn.danger{color:var(--error-strong);border-color:color-mix(in oklch,var(--error) 35%,var(--border))}
.btn.danger:hover{background:color-mix(in oklch,var(--error) 10%,transparent)}
.ib{width:28px;height:28px;flex:none;display:inline-grid;place-items:center;padding:0;border:0;border-radius:7px;background:none;color:var(--muted-foreground)}
.ib:hover{background:var(--accent);color:var(--foreground)}
.ib svg{width:15px;height:15px}
.ib.sm{width:22px;height:22px;border-radius:6px}
.ib.sm svg{width:13px;height:13px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;font-family:var(--font-mono);font-size:10.5px;line-height:1;color:var(--muted-foreground);background:var(--card);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;white-space:nowrap}
.bl{display:inline-block;width:12px;height:12px;flex:none;vertical-align:-1px}
.dsep{width:3px;height:3px;border-radius:50%;background:var(--muted-foreground);opacity:.6;flex:none}

/* ============ glyphs ============ */
.gl{width:14px;height:14px;flex:none;display:inline-grid;place-items:center}
.gl i{display:block;border-radius:50%}
.gl.unr i{width:8px;height:8px;background:var(--muted-foreground)}
.gl.need i{width:8px;height:8px;background:var(--primary);box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 24%,transparent)}
.gl.run svg{width:13px;height:13px;fill:none;stroke-width:2.2;stroke-linecap:round;animation:spin 1.1s linear infinite}
.gl.run circle{stroke:color-mix(in oklch,var(--active) 28%,transparent)}
.gl.run path{stroke:var(--active-strong)}
.gl.pop i{animation:pop .26s var(--snappy)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--border);color:var(--muted-foreground);white-space:nowrap;flex:none}
.chip.run{border-color:color-mix(in oklch,var(--active) 45%,transparent);color:var(--active-strong)}
.chip.ok{border-color:color-mix(in oklch,var(--success) 40%,transparent);color:var(--success-strong)}
.chip.err{border-color:color-mix(in oklch,var(--error) 40%,transparent);color:var(--error-strong)}
.chip.pause{border-color:color-mix(in oklch,var(--paused) 40%,transparent);color:var(--paused-strong)}
.chip.need{border-color:color-mix(in oklch,var(--primary) 50%,transparent);color:var(--primary);background:color-mix(in oklch,var(--primary) 8%,transparent)}
.cnt{min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:inline-grid;place-items:center;font-family:var(--font-mono);font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.cnt.u{background:var(--muted);color:var(--foreground);border:1px solid var(--border)}
.cnt.n{background:var(--primary);color:var(--pf)}

/* ============ avatars ============ */
.av{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--foreground);background:var(--muted);border:1px solid var(--border);line-height:1}
.av.h{border-radius:50%}
.av.a{border-radius:8px;font-family:var(--font-mono);background:var(--card)}
.av.s20{width:20px;height:20px;font-size:8.5px}
.av.s20.a{border-radius:6px}
.av.s16{width:16px;height:16px;font-size:7.5px}
.av.s16.a{border-radius:5px}
.stack{display:inline-flex;align-items:center;gap:3px}

/* ============ app shell ============ */
#app{height:100dvh;display:flex;flex-direction:column}
.hdr{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;border-bottom:1px solid var(--border);background:var(--background);position:relative;z-index:20}
.hdr .mark{width:22px;height:22px;flex:none}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted-foreground);white-space:nowrap}
.crumb b{color:var(--foreground);font-weight:600}
.crumb svg{width:13px;height:13px}
.hdr .sp{flex:1}
.kbtn{display:inline-flex;align-items:center;gap:8px;height:32px;width:min(340px,30vw);padding:0 6px 0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted-foreground);font-size:13px;text-align:left}
.kbtn:hover{background:var(--accent);color:var(--foreground)}
.kbtn svg{width:14px;height:14px;flex:none}
.kbtn .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hlink{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:500;color:var(--muted-foreground);white-space:nowrap}
.hlink:hover{background:var(--accent);color:var(--foreground)}
.hlink svg{width:14px;height:14px}
.mrail{display:none}

#nv{flex:1;min-height:0;display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
#nv.has-thread{grid-template-columns:var(--rail) var(--feed) minmax(0,1fr)}
#nv.is-split{grid-template-columns:var(--rail) 48px minmax(0,1fr)}

/* ============ rail ============ */
.rail{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface)}
.rchips{flex:none;padding:10px 10px 10px;border-bottom:1px solid var(--border)}
.rchips .lab{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin:0 2px 7px}
.rchips .row{display:flex;flex-wrap:wrap;gap:5px}
.fchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 7px;border:1px solid var(--border);border-radius:7px;background:transparent;font-size:12px;font-weight:500;color:var(--muted-foreground);white-space:nowrap}
.fchip:hover{background:var(--accent);color:var(--foreground)}
.fchip .bx{width:13px;height:13px;border-radius:4px;border:1.5px solid color-mix(in oklch,var(--muted-foreground) 70%,transparent);display:grid;place-items:center;flex:none}
.fchip .bx svg{width:9px;height:9px;stroke-width:3.4;opacity:0}
.fchip[aria-pressed="true"]{color:var(--foreground);border-color:color-mix(in oklch,var(--primary) 42%,var(--border));background:color-mix(in oklch,var(--primary) 8%,var(--card))}
.fchip[aria-pressed="true"] .bx{background:var(--primary);border-color:var(--primary);color:var(--pf)}
.fchip[aria-pressed="true"] .bx svg{opacity:1}
.fchip .bl{width:11px;height:11px}
.rscroll{flex:1;min-height:0;overflow:auto;padding:4px 6px 16px}
.rsec{display:flex;align-items:center;gap:6px;height:30px;padding:12px 6px 0 8px;box-sizing:content-box;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.rsec span{flex:1}
.rhint{margin:2px 8px 4px;font-size:12px;line-height:1.45;color:var(--muted-foreground)}
.gr{position:relative;display:flex;align-items:center;height:30px;margin:1px 0;padding-left:calc(var(--d,0) * 14px);border-radius:7px;color:var(--muted-foreground)}
.gr:hover{background:var(--accent);color:var(--foreground)}
.gr.on{background:color-mix(in oklch,var(--primary) 12%,transparent);color:var(--foreground)}
.gr.on .ico{color:var(--primary)}
.gr.unread .nm{color:var(--foreground);font-weight:650}
.gr .tw{width:18px;height:22px;flex:none;display:grid;place-items:center;padding:0;border:0;background:none;color:var(--muted-foreground);border-radius:5px}
.gr .tw:hover{color:var(--foreground)}
.gr .tw svg{width:12px;height:12px;transition:transform .15s var(--snappy)}
.gr .tw[aria-expanded="true"] svg{transform:rotate(90deg)}
.gr .tw.sp{pointer-events:none}
.gsel{flex:1;min-width:0;height:30px;display:flex;align-items:center;gap:6px;padding:0 4px 0 2px;border:0;background:none;font-size:13.5px;text-align:left;color:inherit;border-radius:6px}
.gsel:focus-visible{outline-offset:-2px}
.gr .ico{width:16px;flex:none;display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;color:var(--muted-foreground)}
.gr .ico svg{width:14px;height:14px}
.gr .ico .bl{width:13px;height:13px}
.gr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr .bdg{display:inline-flex;align-items:center;gap:4px;flex:none}
.gr .gm{width:22px;height:22px;margin-right:3px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:none;color:var(--muted-foreground);opacity:0}
.gr .gm svg{width:13px;height:13px}
.gr:hover .gm,.gr .gm:focus-visible,.gr .gm[aria-expanded="true"]{opacity:1}
.gr .gm:hover{background:color-mix(in oklch,var(--foreground) 8%,transparent);color:var(--foreground)}
.gr.drop{background:color-mix(in oklch,var(--primary) 12%,transparent);box-shadow:inset 0 0 0 1.5px var(--primary);color:var(--foreground)}
.gr.nodrop{cursor:not-allowed}
.gr.nodrop::after{content:"Read-only";position:absolute;right:30px;font-size:10.5px;color:var(--muted-foreground)}
.ginp{flex:1;min-width:0;height:24px;padding:0 7px;border:1px solid var(--ring);border-radius:6px;background:var(--card);font-family:var(--font-mono);font-size:12.5px;color:var(--foreground);outline:none;box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 30%,transparent);margin-right:6px}
.gr.new{padding-right:0}
.ghelp{margin:2px 8px 6px calc(38px + var(--d,0)*14px);font-size:11px;color:var(--muted-foreground)}

/* ============ feed ============ */
.feed{position:relative;min-width:0;min-height:0;border-right:1px solid var(--border);background:var(--background)}
#nv:not(.has-thread) .feed{border-right:0}
.finner{height:100%;min-height:0;display:flex;flex-direction:column;background:var(--background)}
.fstrip{display:none}
.fh{flex:none;padding:12px 18px 11px;border-bottom:1px solid var(--border)}
.fwrap{width:100%;max-width:880px;margin:0 auto}
.fcrumb{display:flex;align-items:center;gap:4px;min-height:16px;font-size:12px;color:var(--muted-foreground);margin-bottom:1px}
.fcrumb button{border:0;background:none;padding:0 2px;border-radius:4px;font-size:12px;color:var(--muted-foreground)}
.fcrumb button:hover{color:var(--foreground);text-decoration:underline;text-underline-offset:2px}
.fcrumb svg{width:11px;height:11px}
.ftrow{display:flex;align-items:center;gap:10px}
.ftitle{flex:1;min-width:0;display:flex;align-items:center;gap:7px;margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.ftitle .hash{font-family:var(--font-mono);font-weight:400;color:var(--muted-foreground)}
.ftitle .bl{width:16px;height:16px}
.ftitle .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftitle svg.lead{width:17px;height:17px;color:var(--muted-foreground);flex:none}
.facts{display:flex;align-items:center;gap:4px;flex:none}
.fsub{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:3px;font-size:12px;color:var(--muted-foreground)}
.fsub .key{font-family:var(--font-mono);font-size:11px}
.subchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.subchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:var(--card);font-size:12.5px;color:var(--foreground)}
.subchip:hover{background:var(--accent)}
.subchip .hash{font-family:var(--font-mono);color:var(--muted-foreground)}
.togdone{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:none;font-size:12px;color:var(--muted-foreground);white-space:nowrap}
.togdone:hover{background:var(--accent);color:var(--foreground)}
.togdone[aria-pressed="true"]{color:var(--foreground);border-color:color-mix(in oklch,var(--primary) 40%,var(--border))}
.togdone svg{width:13px;height:13px}
.flist{flex:1;min-height:0;overflow:auto;padding:4px 14px 14px;outline:none;scrollbar-gutter:stable;display:flex;flex-direction:column}
.flist>#fw{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end}
.flist:focus-visible{outline:none}
.day{display:flex;align-items:center;gap:10px;margin:16px 0 10px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted-foreground)}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--border)}
.day span{padding:2px 10px;border:1px solid var(--border);border-radius:999px;background:var(--background)}

.cv{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:11px 12px 11px 11px;margin-bottom:8px;border:1px solid var(--border);border-radius:11px;background:var(--card);cursor:pointer;transition:border-color .12s}
.cv:hover{border-color:color-mix(in oklch,var(--foreground) 22%,var(--border))}
.cv.ext{background:var(--surface)}
.cv.open{border-color:color-mix(in oklch,var(--primary) 32%,var(--border));background:color-mix(in oklch,var(--primary) 3%,var(--card));box-shadow:inset 3px 0 0 var(--primary)}
.cv.sel{background:color-mix(in oklch,var(--primary) 7%,var(--card));border-color:color-mix(in oklch,var(--primary) 40%,var(--border))}
.flist:focus .cv.cur,.flist:focus-within .cv.cur{outline:2px solid var(--ring);outline-offset:1px}
.cv.tri{opacity:.7}
.cv.dragging{opacity:.45}
.cv .gut{position:relative;display:flex;justify-content:center;padding-top:3px}
.cv .ck{position:absolute;top:1px;left:0;width:18px;height:18px;display:none;place-items:center;cursor:pointer}
.cv .ck input{width:15px;height:15px;margin:0;accent-color:var(--primary);cursor:pointer}
.cv:hover .ck,.cv.sel .ck,.selmode .cv .ck{display:grid}
.cv:hover .gut .gl,.cv.sel .gut .gl,.selmode .cv .gut .gl{visibility:hidden}
.cv .t1{display:flex;align-items:center;gap:7px;min-width:0}
.cv .ttl{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500;line-height:1.35}
.cv.unread .ttl{font-weight:650}
.cv .tm{margin-left:auto;padding-left:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);white-space:nowrap;flex:none}
.src{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border:1px solid var(--border);border-radius:5px;background:var(--card);font-size:10.5px;font-weight:600;color:var(--foreground);white-space:nowrap;flex:none}
.src .bl{width:10px;height:10px}
.own{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;flex:none}
.cv .pv{margin-top:3px;font-size:13px;line-height:1.45;color:var(--muted-foreground);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cv .pv b{color:var(--foreground);font-weight:600}
.cv .pv .via{font-size:11px;font-weight:600;letter-spacing:.02em}
.cv .t3{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--muted-foreground);min-width:0}
.cv .t3 .mono{font-size:11.5px;white-space:nowrap}
.forkchip{display:inline-flex;align-items:center;gap:5px;height:22px;margin-left:auto;padding:0 6px 0 7px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:11.5px;font-weight:600;color:var(--foreground);white-space:nowrap}
.forkchip:hover{background:var(--accent)}
.forkchip svg{width:12px;height:12px}
.forkchip .cvx{transition:transform .15s var(--snappy);color:var(--muted-foreground)}
.forkchip[aria-expanded="true"]{border-color:color-mix(in oklch,var(--primary) 45%,var(--border))}
.forkchip[aria-expanded="true"] .cvx{transform:rotate(180deg)}
.forks{margin:10px 0 -3px;padding-top:6px;border-top:1px solid var(--border)}
.fk{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px 0 6px;border-radius:7px;font-size:12.5px;cursor:pointer}
.fk:hover{background:var(--accent)}
.fk.on{background:color-mix(in oklch,var(--primary) 9%,transparent)}
.fk.tri{opacity:.65}
.fk .fkt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fk .fkm svg{width:12px;height:12px;color:var(--muted-foreground);display:block}
.fk .tm{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.tools{position:absolute;top:-13px;right:10px;display:none;gap:1px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--card);box-shadow:0 1px 2px oklch(0 0 0/.06),0 6px 16px -8px oklch(0 0 0/.25);z-index:3}
.cv:hover .tools,.cv:focus-within .tools,.cv .tools.keep{display:flex}
.tools .ib{width:26px;height:26px}
.tools .ib svg{width:14px;height:14px}
.fempty{max-width:420px;margin:auto;padding:24px 0;text-align:center;color:var(--muted-foreground);font-size:13.5px;line-height:1.5}
.fempty .ei{width:40px;height:40px;margin:0 auto 12px;border:1px solid var(--border);border-radius:11px;display:grid;place-items:center;background:var(--card);color:var(--muted-foreground)}
.fempty .ei svg{width:18px;height:18px}
.fempty b{display:block;color:var(--foreground);font-size:14.5px;font-weight:600;margin-bottom:4px}
.fempty .btn{margin-top:12px}

.bulk{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-top:1px solid var(--border);background:color-mix(in oklch,var(--primary) 6%,var(--card))}
.bulk .n{font-size:13px;font-weight:600;margin-right:auto;white-space:nowrap}
.fcomp{flex:none;padding:10px 14px 12px;background:var(--background)}
.cbox{border:1px solid var(--border);border-radius:11px;background:var(--card);box-shadow:0 1px 2px oklch(0 0 0/.04);transition:border-color .12s,box-shadow .12s}
.cbox:focus-within{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 30%,transparent)}
.cbox textarea{display:block;width:100%;min-height:42px;max-height:150px;padding:11px 12px 4px;border:0;background:transparent;resize:none;outline:none;font-size:14px;line-height:1.45;color:var(--foreground)}
.cbox textarea::placeholder{color:var(--muted-foreground)}
.cbar{display:flex;align-items:center;gap:8px;padding:4px 6px 6px 12px;min-width:0}
.cbar .ch{flex:1;min-width:0;font-size:11.5px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .ch b{color:var(--foreground);font-weight:600}
.cbar .ch .bl{width:11px;height:11px;margin-right:3px}
.cbar .btn{flex:none}
.notice{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px dashed var(--border);border-radius:11px;background:var(--surface);font-size:12.5px;line-height:1.45;color:var(--muted-foreground)}
.notice svg{width:15px;height:15px;flex:none;margin-top:1px}
.notice b{color:var(--foreground);font-weight:600}
.khint{display:flex;gap:10px;height:18px;margin-top:7px;padding:0 2px;overflow:hidden;font-size:11px;line-height:18px;color:var(--muted-foreground);white-space:nowrap;visibility:hidden}
.khint>span{display:inline-flex;align-items:center;gap:3px;flex:none}
.khint .kbd{height:16px;min-width:16px;font-size:10px}
.finner.kfocus .khint{visibility:visible}

/* collapsed feed in split */
.is-split .feed .finner{display:none}
.is-split .feed .fstrip{display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;padding:10px 0;background:var(--surface)}
.fstrip .fsname{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;font-weight:600;color:var(--foreground);white-space:nowrap;max-height:260px;overflow:hidden;text-overflow:ellipsis}
.fstrip .bdg{display:flex;flex-direction:column;align-items:center;gap:5px}
.is-split.peek .feed .finner{display:flex;position:absolute;top:0;left:48px;bottom:0;width:min(440px,42vw);z-index:35;border-right:1px solid var(--border);box-shadow:16px 0 40px -24px oklch(0 0 0/.4);animation:peekin .2s var(--snappy)}
@keyframes peekin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.peekx{display:none}
.is-split.peek .peekx{display:inline-grid}

/* ============ threads ============ */
#threads{display:none;position:relative;min-width:0;min-height:0;flex-direction:column;background:var(--background)}
.has-thread #threads{display:flex}
.tabbar{height:40px;flex:none;display:flex;align-items:flex-end;gap:2px;padding:0 8px 0 6px;border-bottom:1px solid var(--border);background:var(--surface);min-width:0}
.tabs{display:flex;align-items:flex-end;gap:2px;min-width:0;flex:1}
.tab{position:relative;top:1px;height:33px;flex:0 1 210px;min-width:84px;display:flex;align-items:center;gap:7px;padding:0 4px 0 10px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;font-size:12.5px;color:var(--muted-foreground);cursor:pointer;user-select:none}
.tab:hover{background:var(--accent);color:var(--foreground)}
.tab.on{background:var(--background);border-color:var(--border);color:var(--foreground);font-weight:500}
.tab.unread .tt{color:var(--foreground);font-weight:650}
.tab .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .tx{width:20px;height:20px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:none;color:var(--muted-foreground);opacity:0}
.tab .tx svg{width:12px;height:12px}
.tab:hover .tx,.tab.on .tx,.tab .tx:focus-visible{opacity:1}
.tab .tx:hover{background:color-mix(in oklch,var(--foreground) 9%,transparent);color:var(--foreground)}
.is-split .tabbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;padding-right:0}
#splittab{display:flex;align-items:flex-end;min-width:0;padding:0 8px;height:100%}
.is-split #splittab{border-left:1px solid var(--border)}
.tab.splt{flex:0 1 260px;border-color:var(--border);background:var(--background);color:var(--foreground);font-weight:500}
.tab.splt .tx{opacity:1}
.tab.splt .sic{width:13px;height:13px;flex:none;color:var(--muted-foreground)}
.tab.dragging{opacity:.5}
.tadd{align-self:center;width:26px;height:26px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:6px;background:none;color:var(--muted-foreground)}
.tadd:hover{background:var(--accent);color:var(--foreground)}
.tadd svg{width:14px;height:14px}
.mback{display:none}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.is-split .panes{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.pane+.pane{border-left:1px solid var(--border)}
.ph{flex:none;padding:13px 20px 11px;border-bottom:1px solid var(--border)}
.ph .r1{display:flex;align-items:flex-start;gap:9px}
.ph .r1 .gl{margin-top:4px}
.ph h2{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.005em;overflow-wrap:anywhere}
.ph .pacts{display:flex;gap:2px;flex:none;margin:-3px -6px 0 0}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:7px;font-size:12px;color:var(--muted-foreground)}
.pmeta .gcr{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:12px;font-weight:500;color:var(--foreground)}
.pmeta .gcr:hover{background:var(--accent)}
.pmeta .gcr .hash{font-family:var(--font-mono);color:var(--muted-foreground)}
.pmeta .ags{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pmeta .mono{font-size:11.5px;white-space:nowrap}
.forkbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;min-width:0}
.forkbar .fl{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);flex:none}
.forkbar .fl svg{width:12px;height:12px}
.fpill{display:inline-flex;align-items:center;gap:6px;height:26px;max-width:240px;flex:none;padding:0 9px 0 7px;border:1px solid var(--border);border-radius:7px;background:var(--card);font-size:12px;color:var(--muted-foreground)}
.fpill:hover{background:var(--accent);color:var(--foreground)}
.fpill.on{border-color:color-mix(in oklch,var(--primary) 50%,var(--border));background:color-mix(in oklch,var(--primary) 8%,var(--card));color:var(--foreground);font-weight:500}
.fpill .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{flex:1;min-height:0;overflow:auto;padding:14px 20px 18px;scrollbar-gutter:stable}
.tlw{max-width:780px;margin:0 auto}
.tlstart{display:flex;align-items:flex-start;gap:8px;margin:2px 0 12px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font-size:12px;line-height:1.45;color:var(--muted-foreground)}
.tlstart .bl,.tlstart svg{width:13px;height:13px;flex:none;margin-top:2px}
.tlstart b{color:var(--foreground);font-weight:600}

.msg{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;padding:9px 10px;margin:0 -10px 2px;border-radius:9px}
.msg:hover{background:color-mix(in oklch,var(--accent) 60%,transparent)}
.msg .av{margin-top:1px}
.mh{display:flex;align-items:center;flex-wrap:wrap;gap:3px 7px;font-size:13px;min-height:20px}
.mh .who{font-weight:600;color:var(--foreground)}
.mh .at{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.mt{margin-top:2px;font-size:14px;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}
.mtools{position:absolute;top:-12px;right:10px;display:none;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--card);box-shadow:0 1px 2px oklch(0 0 0/.06),0 6px 16px -8px oklch(0 0 0/.25);z-index:2}
.msg:hover .mtools,.msg:focus-within .mtools{display:flex}
.mtools button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:0;border-radius:6px;background:none;font-size:12px;font-weight:500;color:var(--foreground);white-space:nowrap}
.mtools button:hover{background:var(--accent)}
.mtools svg{width:13px;height:13px}
.msg.ext{background:var(--surface);border:1px solid color-mix(in oklch,var(--border) 80%,transparent);margin-bottom:6px}
.msg.ext:hover{background:color-mix(in oklch,var(--accent) 70%,var(--surface))}
.msg.ext .who{color:var(--muted-foreground)}
.msg.ext .mt{color:var(--muted-foreground)}
.msg.ext .av{background:transparent;color:var(--muted-foreground);border-style:dashed}
.xtag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border:1px solid var(--border);border-radius:5px;background:var(--card);font-size:10.5px;font-weight:600;color:var(--muted-foreground);white-space:nowrap}
.xtag .bl{width:10px;height:10px}
.attrib{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:11.5px;color:var(--muted-foreground)}
.attrib .bl{width:11px;height:11px}
.shim{background:linear-gradient(90deg,var(--muted-foreground) 0%,var(--muted-foreground) 35%,var(--foreground) 50%,var(--muted-foreground) 65%,var(--muted-foreground) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimx 1.8s linear infinite}
@keyframes shimx{from{background-position:100% 0}to{background-position:-150% 0}}
.working{display:inline-flex;align-items:center;gap:7px;margin-top:4px;font-size:13px;font-weight:500}
.appr{margin-top:8px;padding:11px 12px;border:1px solid color-mix(in oklch,var(--primary) 45%,var(--border));border-radius:10px;background:color-mix(in oklch,var(--primary) 6%,var(--card))}
.appr .q{font-size:14px;line-height:1.5;font-weight:500}
.appr .acts{display:flex;gap:8px;margin-top:10px}
.appr.done{border-color:var(--border);background:var(--surface)}
.appr .res{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted-foreground)}
.appr .res svg{width:13px;height:13px;color:var(--success-strong)}
.forkcard{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;margin:0 0 10px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.forkcard .fi{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;color:var(--muted-foreground)}
.forkcard .fi svg{width:15px;height:15px}
.forkcard .fh2{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.forkcard .fh2 .at{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--muted-foreground)}
.forkcard p{margin:4px 0 0;font-size:13px;line-height:1.55;color:color-mix(in oklch,var(--foreground) 88%,var(--muted-foreground))}
.lnk{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:0;border:0;background:none;font-size:12.5px;font-weight:500;color:var(--primary)}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk svg{width:12px;height:12px}
.sumcard{padding:14px 16px;border:1px solid var(--border);border-radius:11px;background:var(--card)}
.sumcard .sh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.sumcard .sh svg{width:14px;height:14px;color:var(--muted-foreground)}
.sumcard p{margin:4px 0 12px;font-size:12.5px;color:var(--muted-foreground)}
.sumg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;margin:0}
.sumg dt{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-foreground)}
.sumg dd{margin:3px 0 0;font-size:13px}
.prun{flex:none}
.runbar{display:flex;align-items:center;gap:9px;padding:7px 20px;border-top:1px solid var(--border);font-size:12.5px}
.runbar .orb{width:8px;height:8px;border-radius:50%;background:var(--active);flex:none;animation:orb 1.6s ease-out infinite}
.runbar .rm{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.pcomp{flex:none;padding:10px 20px 14px}
.pcomp .inner{max-width:780px;margin:0 auto}
.cnote{display:flex;align-items:center;gap:6px;margin:7px 2px 0;font-size:11.5px;color:var(--muted-foreground);line-height:1.4}
.cnote .bl{width:11px;height:11px}
.dz{position:absolute;top:48px;right:8px;bottom:8px;width:40%;display:none;place-items:center;border:2px dashed var(--primary);border-radius:12px;background:color-mix(in oklch,var(--primary) 9%,color-mix(in oklch,var(--background) 80%,transparent));z-index:30;font-size:13.5px;font-weight:600;color:var(--primary);text-align:center;padding:20px}
.dz svg{display:block;width:22px;height:22px;margin:0 auto 8px}
.dz.hot{background:color-mix(in oklch,var(--primary) 16%,var(--background))}
body.drag-tab .dz,body.drag-conv #nv.has-thread .dz{display:grid}

/* ============ overlays ============ */
.ov{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;background:oklch(0.141 0.005 285.823 / .22)}
html.dark .ov{background:oklch(0 0 0 / .5)}
.pal{width:min(640px,92vw);background:var(--card);border:1px solid var(--border);border-radius:13px;box-shadow:0 2px 4px oklch(0 0 0/.06),0 28px 64px -24px oklch(0 0 0/.45);overflow:hidden;animation:palin .15s var(--snappy)}
@keyframes palin{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.pin{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-bottom:1px solid var(--border)}
.pin svg{width:16px;height:16px;color:var(--muted-foreground);flex:none}
.pin input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:15px;color:var(--foreground)}
.pin input::placeholder{color:var(--muted-foreground)}
.pmode{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;background:color-mix(in oklch,var(--primary) 10%,transparent);color:var(--primary);font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.plist{max-height:min(430px,58vh);overflow:auto;padding:6px}
.pgh{padding:9px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.pit{display:flex;align-items:center;gap:10px;min-height:38px;padding:4px 10px;border-radius:8px;font-size:13.5px;cursor:pointer}
.pit.on{background:var(--accent)}
.pit .pli{width:18px;flex:none;display:grid;place-items:center;color:var(--muted-foreground);font-family:var(--font-mono)}
.pit .pli svg{width:15px;height:15px}
.pit .pli .bl{width:13px;height:13px}
.pit .pl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pit .pl mark{background:none;color:var(--primary);font-weight:600}
.pit .ps{flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted-foreground)}
.pit .ps .off{color:var(--muted-foreground);font-style:italic}
.pempty{padding:26px 12px;text-align:center;font-size:13px;color:var(--muted-foreground)}
.pfoot{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--muted-foreground)}
.pfoot span{display:inline-flex;align-items:center;gap:5px}
.menu{position:fixed;z-index:90;min-width:220px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 2px 4px oklch(0 0 0/.06),0 18px 44px -18px oklch(0 0 0/.4);animation:palin .15s var(--snappy)}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:31px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:13px;text-align:left;color:var(--foreground)}
.mi:hover,.mi:focus{background:var(--accent);outline:none}
.mi svg{width:14px;height:14px;color:var(--muted-foreground);flex:none}
.mi .k{margin-left:auto}
.mi.danger,.mi.danger svg{color:var(--error-strong)}
.mi[aria-disabled="true"]{opacity:.5;cursor:default}
.msep{height:1px;margin:4px 2px;background:var(--border)}
.mnote{padding:6px 8px 4px;font-size:11.5px;line-height:1.4;color:var(--muted-foreground);max-width:240px}
.dlg{width:min(440px,92vw);margin-top:8vh;padding:18px 20px 16px;background:var(--card);border:1px solid var(--border);border-radius:13px;box-shadow:0 28px 64px -24px oklch(0 0 0/.45);animation:palin .2s var(--snappy)}
.dlg h3{margin:0 0 6px;font-size:16px;font-weight:600}
.dlg p{margin:0 0 16px;font-size:13.5px;line-height:1.5;color:var(--muted-foreground)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.toasts{position:fixed;left:12px;bottom:12px;z-index:95;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;width:max-content;max-width:min(calc(var(--rail) - 20px),92vw);line-height:1.4;padding:7px 7px 7px 13px;border:1px solid var(--border);border-radius:10px;background:var(--card);box-shadow:0 2px 4px oklch(0 0 0/.06),0 16px 36px -18px oklch(0 0 0/.4);font-size:13px;animation:palin .2s var(--snappy)}
.toast .tm2{min-width:0}
.toast .ib{width:24px;height:24px}

/* ============ legacy replica ============ */
#lv{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr)}
#lv.lcol{grid-template-columns:minmax(0,1fr)}
.lside{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:color-mix(in oklch,var(--card) 40%,transparent)}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 6px}
.lhead h2,.lsec h2{margin:0;font-family:var(--font-mono);font-size:11px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.lib{width:24px;height:24px;display:grid;place-items:center;padding:0;border:0;border-radius:6px;background:none;color:var(--muted-foreground)}
.lib:hover{background:var(--accent);color:var(--foreground)}
.lib svg{width:14px;height:14px}
.lsearch{display:flex;align-items:center;gap:4px;padding:0 12px 8px;position:relative}
.lsw{position:relative;flex:1;min-width:0}
.lsw svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted-foreground)}
.lsw input{width:100%;height:32px;padding:0 8px 0 28px;border:1px solid transparent;border-radius:8px;background:color-mix(in oklch,var(--muted) 40%,transparent);font-size:12px;color:var(--foreground);outline:none}
.lsw input:focus{background:var(--card);border-color:var(--border)}
.lf{width:32px;height:32px;position:relative}
.lf.on{color:var(--primary)}
.lf.on::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.ldrop{position:absolute;top:40px;right:12px;z-index:10;width:224px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow)}
.ldrop .lbl2{padding:6px 8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);border-bottom:1px solid var(--border);margin-bottom:4px}
.ldrop label{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;font-size:13px;cursor:pointer}
.ldrop label:hover{background:var(--accent)}
.lscroll2{flex:1;min-height:0;overflow:auto}
.llist{list-style:none;margin:0;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px}
.lrow{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;min-width:0;text-decoration:none}
.lrow:hover{background:color-mix(in oklch,var(--muted) 50%,transparent)}
.lrow.on{background:var(--muted)}
.ldot{margin-top:6px;width:6px;height:6px;border-radius:50%;flex:none;background:color-mix(in oklch,var(--muted-foreground) 30%,transparent)}
.ldot.run{background:var(--primary);animation:lp 2s cubic-bezier(.4,0,.6,1) infinite}
.ldot.err{background:var(--error)}
.ldot.act{background:color-mix(in oklch,var(--primary) 70%,transparent)}
@keyframes lp{50%{opacity:.5}}
.lrow .lb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow .lt{font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:color-mix(in oklch,var(--foreground) 90%,transparent)}
.lrow.on .lt{font-weight:500;color:var(--foreground)}
.lrow .lm{font-size:11px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsec h2{padding:8px 12px 6px}
.lmain{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.lph{flex:none;padding:14px 24px 12px;border-bottom:1px solid var(--border)}
.lph h1{margin:0;font-size:16px;font-weight:600}
.lph .lmeta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12px;color:var(--muted-foreground)}
.lbody{flex:1;min-height:0;overflow:auto;padding:24px}
.ltl{max-width:768px;margin:0 auto}
.lub{display:flex;justify-content:flex-end;padding:0 0 12px 40px}
.lub .in{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:85%}
.lub .hd{padding:0 4px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.lub .bb{padding:10px 16px;border-radius:16px 4px 16px 16px;background:var(--muted);font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.ltc{display:flex;gap:12px;padding-bottom:24px}
.ltc .av{width:28px;height:28px;border-radius:50%}
.ltc .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ltc .hd{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px}
.ltc .hd b{font-weight:500}
.ltc .hd span{color:var(--muted-foreground)}
.ltc .tx{font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.lempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.lempty h2{margin:0;font-size:20px;font-weight:600}
.ldock{flex:none;padding:12px 24px 16px}
.ldock .inner{max-width:768px;margin:0 auto}
.lopen{position:absolute;top:12px;left:12px;z-index:5}

/* ============ compact fallback ============ */
@media (max-width:1023px){
  #nv,#nv.has-thread,#nv.is-split{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  #nv.rail-open .rail{display:flex;position:fixed;top:48px;left:0;bottom:0;width:min(300px,86vw);z-index:60;box-shadow:16px 0 40px -20px oklch(0 0 0/.45)}
  .mrail{display:inline-grid}
  .kbtn{width:auto}
  .kbtn .lbl,.kbtn .kbd{display:none}
  .is-split .feed .finner{display:flex}
  .is-split .feed .fstrip{display:none}
  .has-thread #threads{position:fixed;top:48px;left:0;right:0;bottom:0;z-index:40}
  #nv.m-hide #threads{display:none}
  .is-split .panes{grid-template-columns:minmax(0,1fr)}
  #paneB{display:none}
  .mback{display:inline-grid;align-self:center}
  .tab.splt{display:none}
  #lv{grid-template-columns:minmax(0,1fr)}
  .lside{display:none}
  .hlink .tx2{display:none}
}
@media (prefers-reduced-motion: reduce){
  .gl.run svg,.shim,.runbar .orb,.ldot.run{animation:none}
  .shim{color:var(--muted-foreground);background:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <button class="ib mrail" id="mrail" aria-label="Show groups" title="Show groups"></button>
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20.5 7v10L12 22 3.5 17V7z" fill="currentColor" opacity=".16"/><path d="M12 2 20.5 7v10L12 22 3.5 17V7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg>
    <nav class="crumb" aria-label="Breadcrumb" id="crumb"></nav>
    <span class="sp"></span>
    <button class="kbtn" id="kbtn" aria-keyshortcuts="Meta+K" title="Search sessions and groups"></button>
    <button class="hlink" id="legacyLink"></button>
    <button class="ib" id="themeBtn" aria-label="Toggle theme" title="Toggle theme"></button>
  </header>

  <main id="nv" aria-label="Sessions">
    <aside class="rail" aria-label="Groups and sources">
      <div class="rchips" id="rchips"></div>
      <div class="rscroll" id="rtree"></div>
    </aside>

    <section class="feed" id="feed" aria-label="Group feed">
      <div class="fstrip" id="fstrip"></div>
      <div class="finner" id="finner">
        <header class="fh"><div class="fwrap" id="fhead"></div></header>
        <div class="flist" id="flist" tabindex="0" role="listbox" aria-label="Conversations" aria-multiselectable="true"><div class="fwrap" id="fw"></div></div>
        <div class="bulk" id="bulk" hidden></div>
        <div class="fcomp"><div class="fwrap"><div id="fcomp"></div><div class="khint" id="khint"></div></div></div>
      </div>
    </section>

    <section id="threads" aria-label="Open sessions">
      <div class="tabbar">
        <button class="ib mback" data-act="mback" aria-label="Back to the feed" title="Back to the feed"></button>
        <div class="tabs" id="tabs" role="tablist" aria-label="Open sessions"></div>
        <div id="splittab"></div>
      </div>
      <div class="panes">
        <section class="pane" id="paneA" data-which="A" aria-label="Session"><header class="ph"></header><div class="pb"><div class="tlw"></div></div><div class="prun"></div><div class="pcomp"></div></section>
        <section class="pane" id="paneB" data-which="B" aria-label="Split session" hidden><header class="ph"></header><div class="pb"><div class="tlw"></div></div><div class="prun"></div><div class="pcomp"></div></section>
      </div>
      <div class="dz" id="dz"></div>
    </section>
  </main>

  <main id="lv" aria-label="Legacy Sessions" hidden>
    <aside class="lside" id="lside"></aside>
    <section class="lmain" id="lmain"></section>
  </main>
</div>

<div class="ov" id="palov" hidden>
  <div class="pal" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="pin"><span id="palico"></span><span id="palmode"></span><input id="palq" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="pallist" aria-autocomplete="list" /></div>
    <div class="plist" id="pallist" role="listbox" aria-label="Results"></div>
    <div class="pfoot" id="palfoot"></div>
  </div>
</div>
<div class="ov" id="dlgov" hidden><div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgt"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="../demo-data.js"></script>
<script>
"use strict";
/* ============================================================
   Option C, Channels + threads. Mockup only: all state is local,
   every server call is faked. Data comes from window.SV2.
   ============================================================ */
const D = window.SV2;
const ME = D.me;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const tms = (iso) => new Date(iso).getTime();
const iso = () => new Date().toISOString();
const clip = (t, n) => { t = String(t || ""); return t.length > n ? t.slice(0, n).trimEnd() + "…" : t; };
const plural = (n, a, b) => n + " " + (n === 1 ? a : (b || a + "s"));
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

/* ---------- icons (lucide paths) ---------- */
const ICON = {
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  plus:'<path d="M5 12h14M12 5v14"/>',
  chevr:'<path d="m9 18 6-6-6-6"/>',
  chevd:'<path d="m6 9 6 6 6-6"/>',
  chevl:'<path d="m15 18-6-6 6-6"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  columns:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/>',
  dots:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M9 13h6M12 10l3 3-3 3"/>',
  branch:'<circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/>',
  pencil:'<path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  send:'<path d="m5 12 7-7 7 7M12 19V5"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M12 3a6.4 6.4 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M14 9l3 3-3 3"/>',
  filter:'<path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>',
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  history:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>',
  back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  square:'<rect x="3" y="3" width="18" height="18" rx="3"/>',
};
function ic(name, cls){ return '<svg class="' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + "</svg>"; }
const BRAND = {
  slack:'<path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/>',
  telegram:'<path fill-rule="evenodd" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm5.56 8.16-1.97 9.3c-.15.66-.54.82-1.09.51l-3-2.21-1.45 1.4c-.16.16-.3.3-.6.3l.21-3.05 5.56-5.02c.24-.21-.05-.33-.37-.12l-6.87 4.33-2.96-.92c-.64-.2-.66-.64.13-.95l11.57-4.46c.54-.2 1.01.13.84.89Z"/>',
};
function brand(name, cls){ return '<svg class="bl ' + (cls || "") + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + BRAND[name] + "</svg>"; }
const SRC_NAME = { slack: "Slack", telegram: "Telegram" };

/* ---------- people, agents ---------- */
const person = (id) => D.people[id] || { name: id, initials: String(id).slice(0, 2).toUpperCase() };
const agentName = (id) => (D.agents[id] || { name: id }).name;
function pav(id, sz){ const p = person(id); return '<span class="av h ' + (sz || "") + '" title="' + esc(p.name) + '" aria-hidden="true">' + esc(p.initials) + "</span>"; }
function aav(id, sz){ const a = D.agents[id] || { name: id, initials: "AG" }; return '<span class="av a ' + (sz || "") + '" title="' + esc(a.name) + '" aria-hidden="true">' + esc(a.initials) + "</span>"; }
function stack(ids, kind, sz){ return '<span class="stack">' + ids.map((i) => (kind === "p" ? pav(i, sz || "s20") : aav(i, sz || "s20"))).join("") + "</span>"; }
function listNames(names){ return names.length > 1 ? names.slice(0, -1).join(", ") + " and " + names[names.length - 1] : (names[0] || ""); }

/* ---------- time ---------- */
function dayStart(){ const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function bucket(t){ const s = dayStart(); if (t >= s) return "Today"; if (t >= s - 86400000) return "Yesterday"; return "Earlier"; }
function hm(t){ return new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false }); }
function cardTime(t){ return bucket(t) === "Earlier" ? new Date(t).toLocaleDateString([], { month: "short", day: "numeric" }) : hm(t); }
function stamp(t){ const b = bucket(t); if (b === "Today") return hm(t); if (b === "Yesterday") return "Yesterday " + hm(t); return new Date(t).toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + hm(t); }
function rel(t){ const m = Math.max(0, Math.round((Date.now() - t) / 60000)); if (m < 1) return "just now"; if (m < 60) return m + "m ago"; const h = Math.round(m / 60); if (h < 24) return h + "h ago"; return Math.round(h / 24) + "d ago"; }
const absTime = (t) => new Date(t).toLocaleString();

/* ============ state ============ */
function splitKey(key){
  const segs = key.split("/").filter(Boolean);
  const last = segs[segs.length - 1];
  if (last && last.includes(":")) return { g: segs.slice(0, -1).join("/") + "/", leaf: last };
  return { g: key, leaf: null };
}
const S = {
  convs: D.conversations.map((c) => {
    const k = splitKey(c.key);
    return Object.assign({}, c, { gkey: k.g, home: k.g, leaf: k.leaf, sessions: c.sessions.map((s) => Object.assign({}, s, { noTl: !s.timeline, timeline: s.timeline ? s.timeline.map((x) => Object.assign({}, x)) : [] })) });
  }),
  saved: new Set(D.savedGroups),
  chips: { dashboard: true, shared: true, slack: false, telegram: false },
  group: "shared/northwind/pricing/",
  folds: new Set(["shared/swarm-app/"]),
  expanded: new Set(["cv1"]),
  tabs: [], active: null, split: null,
  sel: new Set(), cursor: null,
  inbox: {}, showDone: false,
  renaming: null, creating: null,
  peek: false, mHide: false,
  legacy: false, legacySel: null, lcol: false, lsys: false, lq: "", ldrop: false,
  fdraft: {}, seq: 1, lastGroup: null,
};

function findS(id){ for (const c of S.convs) for (const s of c.sessions) if (s.id === id) return { s, c }; return null; }
const convOf = (id) => S.convs.find((c) => c.id === id);
const convLast = (c) => Math.max.apply(null, c.sessions.map((s) => tms(s.last)));
const activeSess = (c) => c.sessions.filter((s) => !S.inbox[s.id]);
const GP = { needs: 3, running: 2, unread: 1, none: 0 };
function convGlyph(c, list){ let g = "none"; (list || activeSess(c)).forEach((s) => { if (GP[s.glyph] > GP[g]) g = s.glyph; }); return g; }

/* ---------- group model ---------- */
function gkind(p){
  if (p === "shared/") return "none";
  if (/^shared\/(slack|telegram)\//.test(p)) return "source";
  if (p.indexOf("personal/" + ME + "/") === 0) return "mine";
  if (p.indexOf("personal/") === 0) return "others";
  return "user";
}
const srcOf = (p) => (p.indexOf("shared/slack/") === 0 ? "slack" : p.indexOf("shared/telegram/") === 0 ? "telegram" : null);
const segsOf = (p) => p.split("/").filter(Boolean);
function gparent(p){
  const k = gkind(p), s = segsOf(p);
  if (k === "user") return s.length > 2 ? s.slice(0, -1).join("/") + "/" : null;
  if (k === "mine") return s.length > 3 ? s.slice(0, -1).join("/") + "/" : null;
  if (k === "others") return s.length > 2 ? s.slice(0, -1).join("/") + "/" : null;
  return null;
}
const rawParent = (p) => segsOf(p).slice(0, -1).join("/") + "/";
function gshort(p){
  const k = gkind(p), s = segsOf(p);
  if (k === "none") return "No group";
  if (k === "source") { const l = D.labels[p] || p; const parts = l.split(" › "); return parts.slice(1).join(" › ") || l; }
  if (k === "mine") { const rest = s.slice(2); return rest.length === 1 ? "~/" + rest[0] : rest[rest.length - 1]; }
  if (k === "others") { const rest = s.slice(2); return rest.length ? rest[rest.length - 1] : person(s[1]).name; }
  return s[s.length - 1];
}
function gname(p){
  const k = gkind(p), sh = gshort(p);
  if (k === "user") return "#" + sh;
  if (k === "mine") return sh.indexOf("~/") === 0 ? sh : "#" + sh;
  return sh;
}
function gcrumbs(p){
  const k = gkind(p), s = segsOf(p), out = [];
  if (k === "none") return [{ label: "No group", p }];
  if (k === "source") { const l = (D.labels[p] || p).split(" › "); return [{ label: l[0] }, { label: l.slice(1).join(" › "), p }]; }
  if (k === "user") { for (let i = 2; i <= s.length; i++) { const q = s.slice(0, i).join("/") + "/"; out.push({ label: gshort(q), p: q }); } return out; }
  if (k === "mine") { for (let i = 3; i <= s.length; i++) { const q = s.slice(0, i).join("/") + "/"; out.push({ label: gshort(q), p: q }); } return out; }
  out.push({ label: "Shared with me" });
  for (let i = 2; i <= s.length; i++) { const q = s.slice(0, i).join("/") + "/"; out.push({ label: gshort(q), p: q }); }
  return out;
}
const gpathText = (p) => gcrumbs(p).map((x) => x.label).join(" › ");
const canCreateIn = (p) => ["user", "mine", "none"].indexOf(gkind(p)) >= 0;
const canManage = (p) => gkind(p) === "user" || gkind(p) === "mine";
function groupsAll(){
  const set = new Set();
  const add = (p) => { if (!p || p === "shared/") return; set.add(p); const par = gparent(p); if (par) add(par); };
  S.convs.forEach((c) => add(c.gkey)); S.saved.forEach(add);
  return Array.from(set);
}
const kids = (p, all) => all.filter((g) => gparent(g) === p).sort((a, b) => gshort(a).localeCompare(gshort(b)));

/* ---------- visibility + counts ---------- */
function visChips(c){
  if (c.source === "slack" || c.source === "telegram") return !!S.chips[c.source] || (c.moved && gkind(c.gkey) !== "source");
  if (c.owner !== ME) return S.chips.shared;
  return S.chips.dashboard;
}
const inFeed = (c) => visChips(c) && (S.showDone || activeSess(c).length > 0);
const ownSess = (p) => S.convs.filter((c) => c.gkey === p && visChips(c)).flatMap(activeSess);
const subSess = (p) => (p === "shared/" ? ownSess(p) : S.convs.filter((c) => c.gkey.indexOf(p) === 0 && visChips(c)).flatMap(activeSess));
function counts(list){ const r = { needs: 0, unread: 0, running: 0 }; list.forEach((s) => { if (r[s.glyph] !== undefined) r[s.glyph]++; }); return r; }
function glyph(g, extra){
  if (g === "running") return '<span class="gl run ' + (extra || "") + '" title="Running"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 5.5 5.5"/></svg><span class="sr">Running</span></span>';
  if (g === "needs") return '<span class="gl need ' + (extra || "") + '" title="Needs you"><i></i><span class="sr">Needs you</span></span>';
  if (g === "unread") return '<span class="gl unr ' + (extra || "") + '" title="Unread"><i></i><span class="sr">Unread</span></span>';
  return '<span class="gl" aria-hidden="true"></span>';
}
function badges(list){
  const c = counts(list); let h = "";
  if (c.running) h += glyph("running");
  if (c.needs) h += '<span class="cnt n" title="' + plural(c.needs, "needs you", "need you") + '">' + c.needs + "</span>";
  if (c.unread) h += '<span class="cnt u" title="' + c.unread + ' unread">' + c.unread + "</span>";
  return h;
}
const STATUS = { running: ["Running", "run"], completed: ["Completed", "ok"], paused: ["Paused", "pause"], failed: ["Failed", "err"] };

/* ============ theme + url ============ */
function theme(){ return document.documentElement.classList.contains("dark") ? "dark" : "light"; }
function applyTheme(t){ document.documentElement.classList.toggle("dark", t === "dark"); $("#themeBtn").innerHTML = ic(t === "dark" ? "sun" : "moon"); syncUrl(); }
function shortGroup(p){ if (p === "shared/") return "none"; return p.indexOf("shared/") === 0 ? p.slice(7, -1) : p.slice(0, -1); }
function longGroup(v){ if (!v) return null; if (v === "none") return "shared/"; const p = v.replace(/\/?$/, "/"); return p.indexOf("personal/") === 0 || p.indexOf("shared/") === 0 ? p : "shared/" + p; }
function syncUrl(){
  const p = new URLSearchParams();

  if (S.tabs.length) p.set("open", [S.active].concat(S.tabs.filter((t) => t !== S.active)).join(","));
  if (S.split) p.set("split", S.split);
  const on = Object.keys(S.chips).filter((k) => S.chips[k]);
  if (on.join() !== "dashboard,shared") p.set("chips", on.join(",") || "none");
  p.set("group", shortGroup(S.group));

/* ============ toasts ============ */
function toast(msg, action){
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = '<span class="tm2">' + msg + "</span>" + (action ? '<button class="btn sm">' + esc(action.label) + "</button>" : "") + '<button class="ib" aria-label="Dismiss">' + ic("x") + "</button>";
  const kill = () => t.remove();
  if (action) t.querySelector(".btn").addEventListener("click", () => { kill(); action.run(); });
  t.querySelector(".ib").addEventListener("click", kill);
  const box = $("#toasts"); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(kill, action ? 6500 : 4200);
}

/* ============ snapshot / undo ============ */
function snapshot(){ return { g: S.convs.map((c) => [c.id, c.gkey, c.key, c.moved]), saved: Array.from(S.saved), group: S.group, folds: Array.from(S.folds) }; }
function restore(sn){
  sn.g.forEach((r) => { const c = convOf(r[0]); if (c) { c.gkey = r[1]; c.key = r[2]; c.moved = r[3]; } });
  S.saved = new Set(sn.saved); S.group = sn.group; S.folds = new Set(sn.folds);
  renderAll();
}

/* ============ actions: open, tabs, split ============ */
function markRead(sid){ const f = findS(sid); if (f && f.s.glyph === "unread") f.s.glyph = "none"; }
function ensureVisible(c){
  if ((c.source === "slack" || c.source === "telegram") && !S.chips[c.source] && !(c.moved && gkind(c.gkey) !== "source")) { S.chips[c.source] = true; toast(SRC_NAME[c.source] + " is on, so " + esc(gname(c.gkey)) + " shows in Sources."); }
  if (c.source === "dashboard" && c.owner !== ME && !S.chips.shared) { S.chips.shared = true; toast("Shared is on again."); }
  if (c.source === "dashboard" && c.owner === ME && !S.chips.dashboard) { S.chips.dashboard = true; toast("Dashboard is on again."); }
}
function openSession(sid, how){
  const f = findS(sid); if (!f) return;
  ensureVisible(f.c);
  S.mHide = false;
  if (how === "split") return openSplit(sid);
  if (S.split === sid) { if (how === "current" || how === "newtab") { markRead(sid); renderAll(); } return; }
  const at = S.tabs.indexOf(sid);
  if (how === "current") {
    if (at >= 0) S.active = sid;
    else if (!S.active) { S.tabs.push(sid); S.active = sid; }
    else { S.tabs[S.tabs.indexOf(S.active)] = sid; S.active = sid; }
  } else {
    if (at < 0) { const i = S.active ? S.tabs.indexOf(S.active) + 1 : S.tabs.length; S.tabs.splice(i, 0, sid); }
    if (how === "newtab" || !S.active) S.active = sid;
    if (how === "bg" && S.active !== sid) toast("Opened in a background tab: " + esc(clip(f.s.title, 48)));
  }
  if (S.active === sid) markRead(sid);
  S.peek = false;
  renderAll();
}
function openSplit(sid){
  if (!S.tabs.length) return openSession(sid, "current");
  if (S.split === sid) return;
  if (S.active === sid) {
    if (S.tabs.length < 2) { toast("Open a second session first. The split shows two sessions side by side."); return; }
    const i = S.tabs.indexOf(sid); S.tabs.splice(i, 1); S.active = S.tabs[Math.max(0, i - 1)];
    markRead(S.active);
  } else {
    const i = S.tabs.indexOf(sid); if (i >= 0) S.tabs.splice(i, 1);
  }
  if (S.split) S.tabs.push(S.split);
  S.split = sid; markRead(sid); S.peek = false;
  renderAll();
}
function closeTab(sid){
  const i = S.tabs.indexOf(sid); if (i < 0) return;
  S.tabs.splice(i, 1);
  if (S.active === sid) S.active = S.tabs[i] || S.tabs[i - 1] || null;
  if (!S.tabs.length && S.split) { S.tabs = [S.split]; S.active = S.split; S.split = null; }
  if (S.active) markRead(S.active);
  renderAll();
}
function closeSplit(){ S.split = null; S.peek = false; renderAll(); }
function closePaneA(){
  if (!S.split) return closeTab(S.active);
  const i = S.tabs.indexOf(S.active); S.tabs.splice(i, 1);
  S.tabs.splice(Math.max(0, i), 0, S.split); S.active = S.split; S.split = null; S.peek = false;
  renderAll();
}
function latestSess(c){ const list = (S.showDone ? c.sessions : activeSess(c)); return list.slice().sort((a, b) => tms(b.last) - tms(a.last))[0] || c.sessions[0]; }
function openConv(c, how){ openSession(latestSess(c).id, how); }
function openFromAnywhere(sid, how){
  const f = findS(sid); if (!f) return;
  ensureVisible(f.c);
  if (S.group !== f.c.gkey) { S.group = f.c.gkey; S.sel.clear(); revealGroup(S.group); }
  S.cursor = f.c.id;
  openSession(sid, how);
}

/* ============ actions: triage ============ */
function setInbox(sids, state, label){
  const prev = sids.map((id) => [id, S.inbox[id]]);
  sids.forEach((id) => { if (state) S.inbox[id] = state; else delete S.inbox[id]; });
  renderAll();
  if (label) toast(label, { label: "Undo", run: () => { prev.forEach((r) => { if (r[1]) S.inbox[r[0]] = r[1]; else delete S.inbox[r[0]]; }); renderAll(); } });
}
function triageConvs(ids, state){
  const convs = ids.map(convOf).filter(Boolean);
  const sids = convs.flatMap((c) => (state ? activeSess(c) : c.sessions).map((s) => s.id));
  if (!sids.length) return;
  const what = convs.length === 1 ? '"' + esc(clip(convs[0].title, 44)) + '"' : convs.length + " conversations";
  advanceCursor(ids);
  S.sel.clear();
  setInbox(sids, state, state === "done" ? "Done: " + what + "." : state === "later" ? "Moved to Later: " + what + "." : "Back in the feed: " + what + ".");
}
function advanceCursor(ids){
  const list = feedConvs(S.group).map((c) => c.id);
  const i = list.indexOf(S.cursor);
  if (ids.indexOf(S.cursor) < 0) return;
  const rest = list.filter((id) => ids.indexOf(id) < 0);
  S.cursor = rest[Math.min(i, rest.length - 1)] || null;
}
function toggleRead(ids){
  const convs = ids.map(convOf).filter(Boolean);
  const anyUnread = convs.some((c) => activeSess(c).some((s) => s.glyph === "unread"));
  convs.forEach((c) => {
    if (anyUnread) c.sessions.forEach((s) => { if (s.glyph === "unread") s.glyph = "none"; });
    else { const s = latestSess(c); if (s.glyph === "none") s.glyph = "unread"; }
  });
  renderAll();
}
function markAllRead(p){ const n = subSess(p).filter((s) => s.glyph === "unread"); n.forEach((s) => { s.glyph = "none"; }); renderAll(); toast(n.length ? "Marked " + plural(n.length, "session") + " in " + esc(gname(p)) + " as read." : "Nothing unread in " + esc(gname(p)) + "."); }

/* ============ actions: move + groups ============ */
const droppable = (p) => ["user", "mine", "none"].indexOf(gkind(p)) >= 0;
function moveConvs(ids, target){
  const convs = ids.map(convOf).filter(Boolean);
  if (!convs.length || !droppable(target)) return;
  const sn = snapshot();
  convs.forEach((c) => { if (c.gkey !== target) { if (gkind(c.gkey) === "source") c.moved = true; c.gkey = target; c.key = target + c.leaf + "/"; } });
  S.sel.clear();
  renderAll();
  const what = convs.length === 1 ? '"' + esc(clip(convs[0].title, 40)) + '"' : convs.length + " conversations";

}
function validName(v){ return /^[a-z0-9][a-z0-9._-]*$/.test(v); }
const normName = (v) => String(v || "").trim().toLowerCase().replace(/\s+/g, "-");
function renameGroup(p, raw){
  const name = normName(raw);
  if (!validName(name)) { toast("Use a to z, 0 to 9, dot, dash, or underscore."); return false; }
  const np = rawParent(p) + name + "/";
  if (np === p) return true;
  if (groupsAll().indexOf(np) >= 0) { toast(esc(gname(np)) + " already exists here."); return false; }
  const sn = snapshot();
  const swap = (g) => (g.indexOf(p) === 0 ? np + g.slice(p.length) : g);
  S.convs.forEach((c) => { c.gkey = swap(c.gkey); c.key = c.gkey + c.leaf + "/"; });
  S.saved = new Set(Array.from(S.saved).map(swap));
  S.folds = new Set(Array.from(S.folds).map(swap));
  S.group = swap(S.group);
  toast("Renamed to " + esc(gname(np)) + ".", { label: "Undo", run: () => restore(sn) });
  return true;
}
function createGroup(parent, raw){
  const name = normName(raw);
  if (!validName(name)) { toast("Use a to z, 0 to 9, dot, dash, or underscore."); return false; }
  const np = parent + name + "/";
  if (groupsAll().indexOf(np) >= 0) { toast(esc(gname(np)) + " already exists."); return false; }
  S.saved.add(np); S.folds.delete(parent);

}
function askDelete(p){

  confirmDlg({
    title: "Delete " + esc(gname(p)) + "?",
    body: (affected.length ? "Its " + plural(affected.length, "conversation") + " move to No group. " : "It has no sessions. ") + (subs.length ? "Its " + plural(subs.length, "subgroup") + " go too. " : "") + "Agents and sessions are not deleted.",

    },
  });
}

/* ============ actions: compose, fork, approve ============ */
function newConv(text){
  const p = S.group; if (!canCreateIn(p)) return;
  if (!S.chips.dashboard) { S.chips.dashboard = true; toast("Dashboard is on again, so the new session shows."); }
  const n = S.seq++, id = "n" + n, sid = "n" + n + "s", at = iso();
  const title = clip(text.replace(/\s+/g, " ").trim(), 64);
  S.convs.push({ id, key: p + "conv:" + id + "/", gkey: p, home: p, leaf: "conv:" + id, title, source: "dashboard", owner: ME,
    sessions: [{ id: sid, title, status: "running", glyph: "running", agents: ["lead"], tasks: 1, cost: 0, created: at, last: at, noTl: false,
      timeline: [{ kind: "human", who: ME, at, text }, { kind: "task", agent: "lead", at, status: "running", text: "" }] }] });

  const fl = $("#flist"); fl.scrollTop = fl.scrollHeight;
}
function sendInPane(which, text){
  const sid = which === "B" ? S.split : S.active; const f = findS(sid); if (!f) return;
  const s = f.s, c = f.c, at = iso();
  s.timeline.push({ kind: c.source === "dashboard" ? "human" : "reply", who: ME, at, text });
  s.timeline.push({ kind: "task", agent: s.agents[0] || "lead", at, status: "running", text: "" });
  s.status = "running"; s.glyph = "running"; s.last = at; s.tasks += 1;
  renderAll(true);
  const pb = $("#pane" + which + " .pb"); pb.scrollTop = pb.scrollHeight;

}
function forkFrom(sid, idx, which){
  const f = findS(sid); if (!f) return;
  const s = f.s, c = f.c;
  const tl = s.timeline;
  const item = idx != null && tl[idx] ? tl[idx] : tl[tl.length - 1];
  const snippet = clip(item ? item.text || s.title : s.title, 34);
  const before = item ? tl.slice(0, tl.indexOf(item) + 1) : [];
  const ask = before.find((x) => x.kind === "human" || x.kind === "slack");
  const outs = before.filter((x) => x.kind === "task").length;
  const summary = (ask ? 'the session started from "' + clip(ask.text, 70) + '". ' : "") + "It has " + plural(before.length, "item") + " up to this point, " + plural(outs, "agent output") + ". The fork keeps a pointer to the parent and starts with a clean context.";
  const id = "f" + S.seq++, at = iso();

    forkedFrom: { session: s.id, at: snippet },
    timeline: [{ kind: "fork", at, parent: s.id, text: 'Forked from "' + s.title + '" at "' + snippet + '". Summary: ' + summary }, { kind: "task", agent: "lead", at, status: "running", text: "" }] };
  c.sessions.push(ns);
  S.expanded.add(c.id);
  if (which === "B") { S.split = id; renderAll(); } else openSession(id, "current");
  toast("Forked. The conversation now has " + plural(c.sessions.length, "fork") + ".");
}
function resolveApproval(sid, idx, ok){
  const f = findS(sid); if (!f) return;
  const it = f.s.timeline[idx]; it.resolved = ok ? "approved" : "rejected"; it.by = ME; it.when = iso();
  if (ok) { f.s.status = "running"; f.s.glyph = "running"; f.s.timeline.push({ kind: "task", agent: it.agent, at: iso(), status: "running", text: "" }); }
  else { f.s.glyph = "none"; }
  f.s.last = iso();
  renderAll(true);
  toast(ok ? "Approved. Lead continues." : "Rejected. Lead stops here.");
}

function renderRail(){

/* ============ render: feed ============ */

  if (S.legacy) { const ids = D.legacy.map((x) => x.id); S.legacySel = ids.indexOf(S.active) >= 0 ? S.active : null; }
  document.documentElement.classList.toggle("dark", q.get("theme") === "dark");
  $("#themeBtn").innerHTML = ic(theme() === "dark" ? "sun" : "moon");
  renderAll();
})();
</script>
