<!doctype html>
<!--
  Option A, "Mail triage". Sessions work like a fast email client: a group tree on the left, a dense
  conversation list with triage glyphs and one-key actions in the middle, and the open session on the right
  with tabs and one split. Trade-off: three fixed panes make triage and resume one keystroke each, but they
  spend about 600 px on navigation, so the session detail (and each half of a split) gets the narrowest
  reading width of the three directions.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Swarm · Sessions · Mail triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../session-logs/demo-shared.css" />
<style>
/* ============ local tokens ============ */
:root{
  --hover: oklch(0.943 0.003 286.375);
  --border-subtle: oklch(0.945 0.003 286);
  --on-primary: oklch(0.985 0 0);
  --tree-w: 240px;
  --list-w: 360px;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --ov: oklch(0.141 0.005 285.823 / 0.28);
}
html.dark{
  --hover: oklch(0.274 0.006 286.033);
  --border-subtle: oklch(1 0 0 / 8%);
  --ov: oklch(0 0 0 / 0.5);
}
html,body{height:100%;overflow:hidden}
body{font-size:14px}
button{font-family:inherit;color:inherit}
kbd{font-family:var(--font-mono);font-size:10.5px;line-height:1;padding:3px 5px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--muted-foreground);white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:15px;height:15px;flex:none}
.smk{width:13px;height:13px;flex:none;display:inline-block;vertical-align:-2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.btn.sm{height:28px;padding:0 10px;font-size:12px;gap:6px}
.btn.sm svg{width:13px;height:13px}
.btn.danger{color:var(--error-strong);border-color:color-mix(in oklch,var(--error) 35%,var(--border))}
.btn.danger:hover{background:color-mix(in oklch,var(--error) 10%,transparent)}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:none;border-radius:7px;color:var(--muted-foreground);cursor:pointer;flex:none;transition:background .15s var(--ease),color .15s var(--ease)}
.ib:hover{background:var(--hover);color:var(--foreground);transition-duration:0s}
.ib:focus-visible,.btn:focus-visible,.schip:focus-visible,.tab:focus-visible,.lnk:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.ib svg{width:15px;height:15px}
.ib.on{color:var(--foreground);background:var(--hover)}
.lnk{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;font-size:12.5px;font-weight:500;color:var(--primary);cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}

/* ============ app shell ============ */
#app{height:100dvh;display:flex;flex-direction:column}
.hdr{flex:none;height:46px;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;border-bottom:1px solid var(--border);background:var(--background);min-width:0}
.hdr .mark{width:20px;height:20px;flex:none;color:var(--foreground)}
.hdr .crumb{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.hdr .crumb span{color:var(--muted-foreground);font-weight:400}
.hdr .kick{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);border-left:1px solid var(--border);padding-left:10px;white-space:nowrap}
.hdr .sp{flex:1}
.kbtn{display:flex;align-items:center;gap:8px;height:30px;width:280px;max-width:32vw;padding:0 6px 0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted-foreground);font-size:12.5px;cursor:pointer;min-width:0}
.kbtn:hover{border-color:color-mix(in oklch,var(--muted-foreground) 40%,var(--border))}
.kbtn span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .lnk{color:var(--muted-foreground);font-size:12.5px;padding:0 6px;height:30px}
.hdr .lnk:hover{color:var(--foreground)}

.shell{flex:1;min-height:0;display:grid;grid-template-columns:var(--tree-w) var(--list-w) minmax(0,1fr)}
#tree{min-height:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border)}
#mid{min-height:0;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--background)}
#right{min-height:0;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--background)}
.is-legacy .shell{display:none}
#legacy{display:none}
.is-legacy #legacy{display:grid}

/* ============ pane 1: sources + tree ============ */
.tsrc{flex:none;padding:10px 10px 10px;border-bottom:1px solid var(--border-subtle)}
.lab{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.tsrc .lab{display:block;margin:0 2px 7px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.schip{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 7px;border-radius:7px;border:1px dashed color-mix(in oklch,var(--muted-foreground) 35%,transparent);background:transparent;color:var(--muted-foreground);font-size:12px;font-weight:500;cursor:pointer;min-width:0;transition:background .15s var(--ease)}
.schip span{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.schip .bx{width:13px;height:13px;border-radius:4px;border:1.5px solid color-mix(in oklch,var(--muted-foreground) 55%,transparent);display:grid;place-items:center;flex:none}
.schip .bx svg{width:9px;height:9px;stroke-width:3.4;opacity:0}
.schip:hover{background:var(--hover)}
.schip[aria-pressed="true"]{border:1px solid var(--border);background:var(--card);color:var(--foreground)}
.schip[aria-pressed="true"] .bx{border-color:var(--foreground);background:var(--foreground);color:var(--background)}
.schip[aria-pressed="true"] .bx svg{opacity:1}
.schip .smk{width:12px;height:12px;color:var(--muted-foreground)}
.schip[aria-pressed="true"] .smk{color:var(--foreground)}

.tscroll{flex:1;min-height:0;overflow-y:auto;padding:6px 0 14px;overscroll-behavior:contain}
.tscroll::-webkit-scrollbar{width:8px}
.tscroll::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 25%,transparent);border-radius:9px}
.tsec{display:flex;align-items:center;gap:6px;padding:14px 14px 4px 16px}
.tsec .lab{flex:1}
.tsec .ib{width:22px;height:22px;border-radius:6px}
.tsec .ib svg{width:13px;height:13px}
.tr{position:relative;display:flex;align-items:center;gap:6px;height:28px;margin:0 6px;padding:0 6px 0 calc(6px + var(--lv,0) * 14px);border-radius:6px;font-size:13px;color:var(--foreground);cursor:pointer;user-select:none;transition:background .2s var(--ease) .05s}
.tr:hover{background:var(--hover);transition:none}
.tr.on{background:var(--hover);font-weight:600}
.tr.on::before{content:"";position:absolute;left:-6px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--primary)}
.tr .tic,.tr .tchev{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--muted-foreground)}
.tr .tchev{border:0;background:none;padding:0;border-radius:4px;cursor:pointer}
.tr .tchev:hover{color:var(--foreground);background:color-mix(in oklch,var(--muted-foreground) 14%,transparent)}
.tr .tchev svg{width:13px;height:13px;transition:transform .15s var(--ease)}
.tr .tchev.open svg{transform:rotate(90deg)}
.tr .tic svg{width:14px;height:14px}
.tr .tic .smk{width:13px;height:13px}
.tlbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlbl .smk{margin-right:6px;vertical-align:-2px}
.tlbl .ownav{display:inline-grid;margin-right:6px;vertical-align:-3px}
.tlbl em{font-style:normal;color:var(--muted-foreground);font-weight:400}
.tr .tmore{display:none;position:absolute;right:4px;top:3px;width:22px;height:22px;border-radius:5px;border:0;background:var(--hover);color:var(--muted-foreground);place-items:center;cursor:pointer}
.tr .tmore svg{width:14px;height:14px}
.tr:hover .tmore,.tr .tmore:focus-visible{display:grid}
.tr .tmore:hover{color:var(--foreground);background:color-mix(in oklch,var(--muted-foreground) 18%,var(--hover))}
.tr .num{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.tr.ro .tlbl{color:var(--foreground)}
.tinp{flex:1;min-width:0;height:22px;padding:0 6px;border:1px solid var(--ring);border-radius:5px;background:var(--background);color:var(--foreground);font:inherit;font-size:12.5px;font-weight:500;outline:none;box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 35%,transparent)}
.drag-row .tr[data-drop="1"]::after{content:"";position:absolute;inset:1px;border:1px dashed color-mix(in oklch,var(--primary) 55%,transparent);border-radius:6px;pointer-events:none}
.tr.dz-hot{background:color-mix(in oklch,var(--primary) 12%,transparent)}
.tr.dz-hot::after{border-style:solid !important;border-color:var(--primary) !important}

/* counts + glyphs */
.cns{margin-left:auto;display:inline-flex;align-items:center;gap:7px;flex:none}
.cn{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.cn i{display:block;width:6px;height:6px;border-radius:50%}
.cn.needs{color:var(--active-strong);font-weight:700}
.cn.needs i{background:var(--primary)}
.cn.unread i{background:var(--neutral)}
.cn.run i{width:8px;height:8px;background:none;border:1.5px solid color-mix(in oklch,var(--primary) 25%,transparent);border-top-color:var(--primary);border-right-color:var(--primary)}
.gly{position:relative;width:14px;height:14px;flex:none;display:grid;place-items:center}
.gly.run::before{content:"";position:absolute;inset:1px;border-radius:50%;border:1.6px solid color-mix(in oklch,var(--primary) 22%,transparent);border-top-color:var(--primary);border-right-color:var(--primary);animation:spin 1.1s linear infinite}
.gd{display:block;width:7px;height:7px;border-radius:50%}
.gd.needs{width:8px;height:8px;background:var(--primary);box-shadow:0 0 0 2.5px color-mix(in oklch,var(--primary) 24%,transparent)}
.gd.unread{background:var(--neutral)}
.gly.run .gd{width:5px;height:5px;box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ pane 2: list ============ */
#midhead{flex:none;position:relative;border-bottom:1px solid var(--border)}
.mh{padding:11px 12px 0 14px}
.mh1{display:flex;align-items:center;gap:8px;min-height:28px}
.mh1 .gi{color:var(--muted-foreground);display:grid;place-items:center;width:18px}
.mh1 .gi svg{width:16px;height:16px}
.mh1 .gi .smk{width:15px;height:15px}
.mh1 h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh2{display:flex;align-items:center;gap:8px;margin:2px 0 0 26px;font-size:12px;color:var(--muted-foreground);min-width:0}
.mh2 .sub{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rotag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--border);font-size:11px;font-weight:500;color:var(--muted-foreground);white-space:nowrap}
.rotag svg{width:12px;height:12px}
.gcomp{display:flex;align-items:center;gap:8px;margin:10px 0 12px;height:34px;padding:0 6px 0 10px;border:1px solid var(--border);border-radius:8px;background:var(--background);transition:border-color .12s,box-shadow .12s}
.gcomp:focus-within{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 35%,transparent)}
.gcomp svg{width:14px;height:14px;color:var(--muted-foreground)}
.gcomp input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:13px;color:var(--foreground)}
.gcomp input::placeholder{color:var(--muted-foreground)}
.ronote{display:flex;align-items:flex-start;gap:8px;margin:10px 0 12px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border-subtle);font-size:12px;line-height:1.45;color:var(--muted-foreground)}
.ronote svg{width:13px;height:13px;flex:none;margin-top:2px}
.mh-pad{height:12px}
.gselect{display:none}

.bulk{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:6px;height:58px;padding:0 8px 0 14px;background:color-mix(in oklch,var(--primary) 7%,var(--background));border-bottom:1px solid color-mix(in oklch,var(--primary) 30%,var(--border))}
.bulk .cnt{font-size:12.5px;font-weight:600;margin-right:auto;white-space:nowrap}
.bulk .btn kbd{padding:2px 4px;font-size:10px}

#list{flex:1;min-height:0;overflow-y:auto;outline:none;position:relative;overscroll-behavior:contain}
#list::-webkit-scrollbar{width:8px}
#list::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 25%,transparent);border-radius:9px}
.sec{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;height:28px;padding:0 12px 0 14px;background:var(--background);border-bottom:1px solid var(--border-subtle)}
.sec .lab{flex:1}
.sec .mono{font-size:11px;color:var(--muted-foreground)}
.row{position:relative;display:flex;align-items:flex-start;gap:7px;padding:8px 10px 8px 8px;border-bottom:1px solid var(--border-subtle);cursor:pointer;user-select:none;transition:background .2s var(--ease) .05s}
.row:hover{background:color-mix(in oklch,var(--hover) 65%,transparent);transition:none}
.row .ck{width:16px;height:16px;flex:none;margin-top:1px;border-radius:4px;border:1.5px solid color-mix(in oklch,var(--muted-foreground) 50%,transparent);display:grid;place-items:center;opacity:0;cursor:pointer;background:var(--background)}
.row .ck svg{width:10px;height:10px;stroke-width:3.4;opacity:0}
.row:hover .ck,.selmode .row .ck,.lf .row.focus .ck{opacity:1}
.row.sel .ck{background:var(--primary);border-color:var(--primary);color:var(--on-primary);opacity:1}
.row.sel .ck svg{opacity:1}
.row .gly{margin-top:2px}
.rm{flex:1;min-width:0}
.l1{display:flex;align-items:center;gap:6px;min-width:0;height:18px}
.ttl{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--foreground)}
.row.news .ttl{font-weight:600}
.row.quiet .ttl{color:var(--muted-foreground)}
.l1 .grow{flex:1;min-width:6px}
.tm{flex:none;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.row.news .tm{color:var(--foreground)}
.l2{margin-top:2px;font-size:12px;line-height:17px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2 b{font-weight:600;color:var(--foreground)}
.l2 .needs{color:var(--active-strong);font-weight:600}
.l2 .fail{color:var(--error-strong);font-weight:600}
.gtag{flex:none;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground);max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcm{display:inline-grid;place-items:center;flex:none;width:18px;height:18px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--foreground)}
.srcm .smk{width:11px;height:11px}
.ownav{width:17px;height:17px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:8.5px;font-weight:700;letter-spacing:.02em;background:var(--muted);border:1px solid var(--border);color:var(--foreground)}
.fk{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 5px;border-radius:5px;border:1px solid var(--border);background:var(--background);color:var(--muted-foreground);font-family:var(--font-mono);font-size:10.5px;cursor:pointer;flex:none}
.fk svg{width:11px;height:11px;transition:transform .15s var(--ease)}
.fk:hover{color:var(--foreground);border-color:color-mix(in oklch,var(--muted-foreground) 45%,var(--border))}
.fk.open{color:var(--foreground);background:var(--hover)}
.row .rmenu{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--muted-foreground);display:none;place-items:center;cursor:pointer}
.row .rmenu svg{width:14px;height:14px}
.row:hover .rmenu{display:grid}
.row .rmenu:hover{color:var(--foreground)}
.row.open{background:var(--hover)}
.row.sel{background:color-mix(in oklch,var(--primary) 8%,var(--background))}
.row.sel.open{background:color-mix(in oklch,var(--primary) 12%,var(--hover))}
.lf .row.focus{box-shadow:inset 2px 0 0 var(--ring),inset 0 0 0 1px color-mix(in oklch,var(--ring) 28%,transparent)}
.row.fork{padding:5px 10px 5px 8px;align-items:center}
.row.fork .ck{margin-top:0}
.row.fork .gly{margin-top:0}
.row.fork .stem{width:14px;height:28px;margin:-5px -2px -5px 2px;flex:none;position:relative}
.row.fork .stem::before{content:"";position:absolute;left:6px;top:0;bottom:50%;border-left:1px solid var(--border);border-bottom:1px solid var(--border);width:7px;border-bottom-left-radius:5px}
.row.fork .stem.mid::after{content:"";position:absolute;left:6px;top:50%;bottom:0;border-left:1px solid var(--border)}
.row.fork .ttl{font-size:12.5px}
.row.fork .fico{width:12px;height:12px;color:var(--muted-foreground);flex:none}
.empty{padding:40px 24px;text-align:center;color:var(--muted-foreground);font-size:13px;line-height:1.5}
.empty b{display:block;color:var(--foreground);font-size:14px;margin-bottom:4px}

#midfoot{flex:none;border-top:1px solid var(--border);background:var(--surface)}
.nextup{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px 0 14px;border:0;border-bottom:1px solid var(--border-subtle);background:none;font-size:12.5px;cursor:pointer;text-align:left;min-width:0}
.nextup:hover{background:var(--hover)}
.nextup .lab{flex:none}
.nextup .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.nextup.zero{cursor:default;color:var(--muted-foreground)}
.nextup.zero:hover{background:none}
.legend{display:flex;align-items:center;gap:10px;height:30px;padding:0 14px;font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend kbd{padding:2px 4px;font-size:10px}
.legend.off{font-style:normal}

/* ============ pane 3: tabs + detail ============ */
.tabs{flex:none;display:flex;align-items:flex-end;gap:2px;height:38px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;top:1px;display:flex;align-items:center;gap:7px;height:31px;flex:0 1 184px;min-width:96px;padding:0 4px 0 10px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;font-size:12.5px;color:var(--muted-foreground);cursor:pointer;user-select:none;background:none}
.tab:hover{color:var(--foreground);background:color-mix(in oklch,var(--hover) 60%,transparent)}
.tab .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tab.unread .tt{font-weight:600;color:var(--foreground)}
.tab.shown{background:var(--background);border-color:var(--border);color:var(--foreground)}
.tab.fp::before{content:"";position:absolute;left:8px;right:8px;top:-1px;height:2px;border-radius:0 0 2px 2px;background:var(--primary)}
.tab .tx{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;border:0;background:none;color:var(--muted-foreground);cursor:pointer;flex:none;opacity:.0}
.tab:hover .tx,.tab.shown .tx{opacity:1}
.tab .tx:hover{background:var(--hover);color:var(--foreground)}
.tab .tx svg{width:12px;height:12px}
.tab .spl{width:12px;height:12px;color:var(--muted-foreground);flex:none}
.tabhint{align-self:center;margin-left:8px;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.panes.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;position:relative}
.panes.two .pane+.pane{border-left:1px solid var(--border)}
.panes.two .pane.fp .dh::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--primary)}
.dh{position:relative;flex:none;padding:12px 18px 10px 20px;border-bottom:1px solid var(--border)}
.dh1{display:flex;align-items:center;gap:6px;min-height:28px;min-width:0}
.dcrumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);text-align:left}
.dcrumb svg{width:12px;height:12px}
.dcrumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcrumb:hover span{color:var(--foreground);text-decoration:underline;text-underline-offset:3px}
.dacts{display:flex;align-items:center;gap:1px;flex:none}
.dacts .sep{width:1px;height:16px;background:var(--border);margin:0 4px}
.back{display:none}
.dtitle{margin:4px 0 0;font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.015em;overflow-wrap:anywhere}
.dmeta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:7px;font-size:12px;color:var(--muted-foreground)}
.dmeta .mono{font-size:11.5px}
.avs{display:inline-flex;gap:3px}
.av{width:20px;height:20px;flex:none;display:grid;place-items:center;font-size:8.5px;font-weight:700;letter-spacing:.02em;border:1px solid var(--border);background:var(--muted);color:var(--foreground)}
.av.ag{border-radius:6px}
.av.pp{border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--border);color:var(--muted-foreground);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{border-color:color-mix(in oklch,var(--success) 38%,transparent);color:var(--success-strong)}
.chip.run{border-color:color-mix(in oklch,var(--active) 45%,transparent);color:var(--active-strong)}
.chip.err{border-color:color-mix(in oklch,var(--error) 38%,transparent);color:var(--error-strong)}
.chip.pause{border-color:color-mix(in oklch,var(--paused) 38%,transparent);color:var(--paused-strong)}
.chip.ext{border-style:dashed}
.ownr{display:inline-flex;align-items:center;gap:6px}
.ownr .av{width:18px;height:18px}
.forks{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px;min-width:0}
.forks::-webkit-scrollbar{display:none}
.forks .lab{flex:none;display:inline-flex;align-items:center;gap:5px}
.forks .lab svg{width:12px;height:12px}
.fpill{display:inline-flex;align-items:center;gap:6px;height:26px;max-width:min(230px,100%);min-width:0;padding:0 9px 0 6px;border-radius:7px;border:1px solid var(--border);background:var(--background);font-size:12px;color:var(--muted-foreground);cursor:pointer;flex:none}
.fpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fpill:hover{color:var(--foreground);background:var(--hover)}
.fpill.on{color:var(--foreground);border-color:color-mix(in oklch,var(--foreground) 35%,var(--border));font-weight:600}

.tls{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.tls::-webkit-scrollbar{width:9px}
.tls::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 25%,transparent);border-radius:9px}
.tl{max-width:760px;margin:0 auto;padding:22px 24px 28px;display:flex;flex-direction:column;gap:18px}
.ti{position:relative;min-width:0}
.fkb{position:absolute;top:-6px;right:0;z-index:2;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--foreground);font-size:11.5px;font-weight:500;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(2px);transition:opacity .1s var(--ease),transform .1s var(--ease);box-shadow:0 1px 2px oklch(0 0 0 / .06)}
.fkb svg{width:12px;height:12px;color:var(--primary)}
.ti:hover>.fkb,.fkb:focus-visible{opacity:1;pointer-events:auto;transform:none;transition-duration:.15s}
.fkb:hover{border-color:color-mix(in oklch,var(--primary) 45%,var(--border))}
.ti-me .fkb{right:auto;left:0}
.ti-me{display:flex;justify-content:flex-end;padding-left:48px}
.mew{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:85%;min-width:0}
.tmeta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);padding:0 2px}
.bub{padding:9px 14px;border-radius:16px 4px 16px 16px;background:var(--muted);font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.via{display:flex;align-items:flex-start;gap:6px;max-width:100%;font-size:11.5px;line-height:1.4;color:var(--muted-foreground);text-align:right}
.via .smk{margin-top:1px}
.ti-task,.ti-ext{display:flex;gap:11px}
.ti .av{width:24px;height:24px;font-size:9px;margin-top:-1px}
.tb{flex:1;min-width:0}
.th{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;font-size:12px;color:var(--muted-foreground);min-height:20px}
.th b{font-weight:600;color:var(--foreground)}
.tx{margin-top:3px;font-size:14px;line-height:1.55;color:var(--foreground);overflow-wrap:anywhere}
.wk{display:inline-flex;align-items:center;gap:7px;margin-top:7px;font-size:12.5px;font-weight:500}
.wk .pip{width:7px;height:7px;border-radius:50%;background:var(--primary);position:relative;flex:none}
.wk .pip::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--primary);opacity:.5;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
.shim{background:linear-gradient(90deg,var(--muted-foreground) 0%,var(--foreground) 45%,var(--muted-foreground) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.8s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.ti-ext .ebox{flex:1;min-width:0;padding:9px 12px 10px;border-radius:10px;border:1px dashed color-mix(in oklch,var(--muted-foreground) 32%,transparent);background:var(--surface)}
.ti-ext .tx{color:var(--muted-foreground);font-size:13.5px}
.ti-ext .th b{color:var(--muted-foreground)}
.av.ext{border-style:dashed;background:var(--surface);color:var(--muted-foreground)}
.av.ext .smk{width:12px;height:12px}
.ti-ext .fkb{top:-8px}
.ask{flex:1;min-width:0;padding:11px 14px 13px;border-radius:10px;border:1px solid color-mix(in oklch,var(--primary) 45%,var(--border));background:color-mix(in oklch,var(--primary) 5%,var(--background))}
.ask .tx{font-weight:500}
.askb{display:flex;gap:8px;margin-top:11px}
.ask.done{border-color:var(--border);background:var(--surface)}
.ask.done .tx{font-weight:400;color:var(--muted-foreground)}
.chip.needs{border-color:color-mix(in oklch,var(--primary) 55%,transparent);color:var(--active-strong);background:color-mix(in oklch,var(--primary) 9%,transparent)}
.forkc{padding:11px 14px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.forkc .fh{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted-foreground);flex-wrap:wrap}
.forkc .fh svg{width:13px;height:13px;color:var(--primary)}
.forkc .fh b{color:var(--foreground);font-weight:600}
.forkc .fq{margin-top:6px;font-size:13.5px;line-height:1.5;color:var(--foreground)}
.forkc .fs{margin-top:6px;font-size:13.5px;line-height:1.55;color:var(--muted-foreground)}
.forkc .fs b{color:var(--foreground);font-weight:600}
.forkc .lnk{margin-top:8px;font-size:12px}
.tnote{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-foreground);padding-left:35px}
.tnote svg{width:13px;height:13px;color:var(--success-strong)}
.tgap{font-size:11.5px;color:var(--muted-foreground);text-align:center;font-family:var(--font-mono);letter-spacing:.04em}

.cmp{flex:none;padding:10px 18px 14px 20px}
.cmpb{max-width:760px;margin:0 auto;border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .04);transition:border-color .12s,box-shadow .12s}
.cmpb:focus-within{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 32%,transparent)}
.cmpto{display:flex;align-items:center;gap:7px;padding:8px 12px 0;font-size:11.5px;color:var(--muted-foreground);line-height:1.35}
.cmpb textarea{display:block;width:100%;resize:none;border:0;outline:0;background:none;padding:10px 12px 4px;font:inherit;font-size:14px;line-height:1.5;color:var(--foreground);min-height:44px;max-height:140px}
.cmpb textarea::placeholder{color:var(--muted-foreground)}
.cmpf{display:flex;align-items:center;gap:8px;padding:4px 6px 6px 12px;font-size:11px;color:var(--muted-foreground)}
.cmpf .sp{flex:1}
.panes.two .cmpf>span:not(.sp){display:none}
.cmpro{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--muted-foreground)}
.cmpro svg{width:13px;height:13px}
.nopane{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted-foreground);font-size:13px;padding:24px}
.nopane b{display:block;color:var(--foreground);font-size:15px;margin-bottom:6px}

.splitdz{position:absolute;top:38px;right:0;bottom:0;width:44%;z-index:20;padding:12px;opacity:0;pointer-events:none;transition:opacity .12s var(--ease)}
.drag-tab .splitdz,.drag-row .splitdz{opacity:1;pointer-events:auto}
.splitdz div{height:100%;border:1.5px dashed color-mix(in oklch,var(--primary) 50%,transparent);border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--primary);background:color-mix(in oklch,var(--primary) 5%,var(--background))}
.splitdz.hot div{border-style:solid;background:color-mix(in oklch,var(--primary) 12%,var(--background))}

/* ============ overlays ============ */
.menu{position:fixed;z-index:80;min-width:208px;padding:5px;border-radius:9px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -14px oklch(0 0 0 / .3);animation:pop .15s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:13px;text-align:left;cursor:pointer}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi svg{width:14px;height:14px;color:var(--muted-foreground)}
.mi span{flex:1}
.mi kbd{padding:2px 5px;font-size:10px}
.mi.dz{color:var(--error-strong)}
.mi.dz svg{color:var(--error-strong)}
.msep{height:1px;margin:4px 2px;background:var(--border-subtle)}
.mlab{padding:6px 8px 4px;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}

.ovl{position:fixed;inset:0;z-index:90;background:var(--ov);display:flex;justify-content:center;align-items:flex-start;animation:fade .15s var(--ease)}
@keyframes fade{from{opacity:0}}
.pal{margin-top:12vh;width:min(620px,calc(100vw - 32px));max-height:72vh;display:flex;flex-direction:column;border-radius:13px;border:1px solid var(--border);background:var(--card);box-shadow:0 2px 4px oklch(0 0 0 / .06),0 30px 70px -24px oklch(0 0 0 / .45);overflow:hidden;animation:pop .18s var(--ease)}
.palin{flex:none;display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-bottom:1px solid var(--border)}
.palin svg{width:16px;height:16px;color:var(--muted-foreground)}
.palin input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--foreground)}
.palin input::placeholder{color:var(--muted-foreground)}
.palmode{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;background:var(--hover);font-size:12px;font-weight:600;white-space:nowrap}
.pallist{flex:1;min-height:0;overflow-y:auto;padding:6px}
.psec{padding:8px 8px 4px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.pi{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:7px;cursor:pointer;font-size:13.5px;min-width:0}
.pi.on{background:var(--hover)}
.pi .pic{width:18px;display:grid;place-items:center;color:var(--muted-foreground);flex:none}
.pi .pic svg{width:15px;height:15px}
.pi .pl{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .ps{flex:1 1 auto;min-width:0;font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi kbd{flex:none}
.pi .pl .smk{margin-right:5px}
.pi .gly{margin:0 auto}
.pi mark{background:none;color:var(--primary);font-weight:600}
.palfoot{flex:none;display:flex;gap:14px;align-items:center;height:34px;padding:0 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted-foreground);background:var(--surface)}
.palfoot span{display:inline-flex;align-items:center;gap:5px}
.palfoot kbd{padding:2px 4px;font-size:10px}
.pempty{padding:26px 12px;text-align:center;font-size:13px;color:var(--muted-foreground)}

.dlg{margin-top:22vh;width:min(420px,calc(100vw - 32px));padding:20px 20px 16px;border-radius:13px;border:1px solid var(--border);background:var(--card);box-shadow:0 30px 70px -24px oklch(0 0 0 / .45);animation:pop .2s var(--ease)}
.dlg h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.dlg p{margin:8px 0 0;font-size:13.5px;line-height:1.55;color:var(--muted-foreground)}
.dlgb{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

#toast{position:fixed;left:calc(var(--tree-w) + var(--list-w) + (100vw - var(--tree-w) - var(--list-w)) / 2);bottom:112px;z-index:95;transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100vw - 32px));padding:8px 8px 8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 18px 40px -18px oklch(0 0 0 / .4);font-size:13px;animation:pop .18s var(--ease)}
#toast[hidden]{display:none}
#toast .tmsg{min-width:0}
#toast .btn{flex:none}

/* ============ legacy replica ============ */
#legacy{flex:1;min-height:0;grid-template-columns:300px minmax(0,1fr)}
.lg-side{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:color-mix(in oklch,var(--card) 40%,transparent)}
.lg-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px}
.lg-h h2{margin:0;font-family:var(--font-mono);font-size:11px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.lg-h .ib{width:24px;height:24px}
.lg-h .ib svg{width:14px;height:14px}
.lg-s{display:flex;align-items:center;gap:4px;padding:0 12px 8px}
.lg-s label{position:relative;flex:1;min-width:0}
.lg-s label svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted-foreground)}
.lg-s input{width:100%;height:32px;padding:0 8px 0 28px;border-radius:8px;border:1px solid transparent;background:color-mix(in oklch,var(--muted) 40%,transparent);font:inherit;font-size:12px;color:var(--foreground);outline:none}
.lg-s .ib{width:32px;height:32px}
.lg-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px}
.lg-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;min-width:0;border:0;background:none;text-align:left;width:100%}
.lg-row:hover{background:color-mix(in oklch,var(--muted) 50%,transparent)}
.lg-row.on{background:var(--muted)}
.lg-dot{width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none;background:color-mix(in oklch,var(--muted-foreground) 30%,transparent)}
.lg-dot.run{background:var(--primary);animation:lgp 2s cubic-bezier(.4,0,.6,1) infinite}
.lg-dot.err{background:var(--error)}
.lg-dot.act{background:color-mix(in oklch,var(--primary) 70%,transparent)}
@keyframes lgp{50%{opacity:.5}}
.lg-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.lg-t b{font-size:14px;font-weight:400;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--foreground)}
.lg-row.on .lg-t b{font-weight:500}
.lg-t span{font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-main{min-height:0;min-width:0;display:flex;flex-direction:column}
.lg-head{flex:none;padding:14px 24px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;min-width:0}
.lg-head h1{margin:0;font-size:16px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-head .mono{font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}
.lg-tl{flex:1;min-height:0;overflow-y:auto}
.lg-tl .inner{max-width:768px;margin:0 auto;padding:24px}
.lg-me{display:flex;justify-content:flex-end;padding-left:40px;padding-bottom:12px}
.lg-me .w{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:85%}
.lg-me .m{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);padding:0 4px}
.lg-me .b{border-radius:16px 4px 16px 16px;background:var(--muted);padding:10px 16px;font-size:14px;line-height:1.6}
.lg-task{display:flex;gap:12px;padding-bottom:24px}
.lg-task .av{width:24px;height:24px;border-radius:50%;font-size:9px}
.lg-task .h{font-size:12px;color:var(--muted-foreground);display:flex;gap:8px;align-items:center}
.lg-task .h b{color:var(--foreground);font-weight:500}
.lg-task .x{margin-top:6px;font-size:14px;line-height:1.6}
.lg-cmp{flex:none;padding:12px 24px 16px}
.lg-cmp .box{max-width:768px;margin:0 auto;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:10px 12px;display:flex;align-items:flex-end;gap:8px}
.lg-cmp textarea{flex:1;border:0;outline:0;resize:none;background:none;font:inherit;font-size:14px;color:var(--foreground);height:44px}

@media (prefers-reduced-motion: reduce){
  .gly.run::before{animation:none}
  .shim{animation:none;color:var(--foreground);background:none}
  .wk .pip::after{animation:none}
  .menu,.pal,.dlg,#toast,.ovl{animation:none}
}

/* ============ narrower desktops ============ */
@media (max-width:1359px){
  :root{--tree-w:228px;--list-w:324px}
  .kbtn{width:220px}
  .schip .smk{display:none}
  .tsrc{padding:10px 9px}
  .tl{padding:20px 20px 24px}
}
/* ============ compact single-column fallback ============ */
@media (max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr)}
  #tree{display:none}
  #mid{border-right:0}
  #right{display:none}
  .cdetail #mid{display:none}
  .cdetail #right{display:flex}
  .tabs,.splitdz{display:none !important}
  .panes.two{grid-template-columns:minmax(0,1fr)}
  .panes.two .pane+.pane{display:none}
  .back{display:inline-grid}
  #toast{left:50%;bottom:18px}
  .gselect{display:block;width:100%;height:32px;margin:10px 0 0;border:1px solid var(--border);border-radius:8px;background:var(--background);color:var(--foreground);font:inherit;font-size:13px;padding:0 8px}
  .hdr .kick,.hdr .lnk span{display:none}
  .kbtn{width:auto;flex:1;max-width:none}
  #legacy{grid-template-columns:minmax(0,1fr)}
  .lg-side{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20.5 7v10L12 22 3.5 17V7z" fill="currentColor" opacity=".16"/><path d="M12 2 20.5 7v10L12 22 3.5 17V7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg>
    <span class="crumb" id="hcrumb">Sessions</span>

const smk = (src, cls) => '<svg class="smk ' + (cls || "") + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + MARK[src] + "</svg>";

/* ---------- time ---------- */
function ago(t) {
  const m = Math.max(0, Math.round((Date.now() - Date.parse(t)) / 60000));
  if (m < 1) return "now";
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h";
  return Math.floor(h / 24) + "d";
}
const agoLong = (t) => (ago(t) === "now" ? "just now" : ago(t) + " ago");
function bucket(t) {
  const d = new Date(t), n = new Date();
  const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (same(d, n)) return "Today";
  const y = new Date(n); y.setDate(n.getDate() - 1);

}

  if (h > 0) return h === 1 ? "1 hour ago" : h + " hours ago";
  if (m > 0) return m === 1 ? "1 minute ago" : m + " minutes ago";
  return "just now";
}

/* ---------- data (deep copy, plus triage state) ---------- */
const CONVS = D.conversations.map((c) => ({
  id: c.id, key: c.key, title: c.title, source: c.source, owner: c.owner, shared: c.shared || null, triage: null,
  sessions: c.sessions.map((s) => ({
    ...s, cid: c.id, read: s.glyph !== "unread", needs: s.glyph === "needs",
    timeline: s.timeline ? s.timeline.map((t) => ({ ...t })) : null,
  })),
}));
const SESS = {};
CONVS.forEach((c) => c.sessions.forEach((s) => { SESS[s.id] = s; }));
const convById = (id) => CONVS.find((c) => c.id === id);
const convOf = (s) => convById(s.cid);

/* ---------- key paths ---------- */
const segs = (p) => p.split("/").filter(Boolean);
const leafOf = (key) => segs(key).pop();
const groupOf = (key) => { const s = segs(key); s.pop(); return s.join("/") + "/"; };
const isSourcePath = (p) => /^shared\/(slack|telegram)\//.test(p);
const isNoGroup = (p) => p === "shared/" || p === "personal/" + ME + "/";

const agent = (id) => D.agents[id] || { name: id, initials: id.slice(0, 2).toUpperCase() };

function crumbParts(p) {
  if (isNoGroup(p)) return ["No group"];
  if (isSourcePath(p)) {
    const base = segs(p).slice(0, 3).join("/") + "/";
    const lab = D.labels[base] || (SRC_LABEL[segs(p)[1]] + " › " + segs(p)[2]);
    return lab.split(" › ").concat(segs(p).slice(3));
  }
  if (isOtherPersonal(p)) return ["Shared with me", person(segs(p)[1]).name].concat(segs(p).slice(2));
  const s = segs(p);
  if (s[0] === "personal") return ["~/" + s[2]].concat(s.slice(3));
  return s.slice(1);
}

const shortName = (p) => { const c = crumbParts(p); return c[c.length - 1]; };

/* ---------- state ---------- */
const S = {
  chips: { dashboard: true, shared: true, slack: false, telegram: false },
  group: "inbox",
  saved: D.savedGroups.slice(),
  folds: { "shared/swarm-app/": true },
  expanded: {},
  tabs: [],
  active: 0,
  splitIdx: null,
  focusPane: "primary",
  focusRow: null,
  anchor: null,
  sel: new Set(),
  flat: [],
  listOrder: [],
  drafts: {},
  pal: null,
  menu: null,
  confirm: null,
  renaming: null,
  creating: null,

  legacySel: null,

/* ---------- visibility, glyphs, counts ---------- */
const chipFor = (c) => (c.owner !== ME ? "shared" : c.source);

  const f = { needs: false, running: false, unread: false };
  c.sessions.forEach((s) => { const g = sFlags(s); f.needs = f.needs || g.needs; f.running = f.running || g.running; f.unread = f.unread || g.unread; });
  return f;
}
const hasNews = (f) => f.needs || f.unread || f.running;
function glyph(f) {
  const t = [f.needs && "Needs you", f.running && "Running", f.unread && "Unread"].filter(Boolean).join(", ");
  const inner = f.needs ? '<i class="gd needs"></i>' : f.unread ? '<i class="gd unread"></i>' : "";

}

  return c.sessions.find((s) => s.needs) || c.sessions.find((s) => !s.read) || c.sessions[0];
}

/* ---------- tree model ---------- */

  const set = new Set(S.saved);
  CONVS.forEach((c) => { const g = groupOf(c.key); if (isUserPath(g)) set.add(g); });

    const s = segs(p), min = s[0] === "personal" ? 3 : 2;

}

  else {

/* ---------- panes ---------- */
const primarySid = () => S.tabs[S.active] || null;

const paneSids = () => [primarySid(), splitSid()].filter(Boolean);

/* ============================================================
   actions
   ============================================================ */
function revealSource(c) {
  const ch = chipFor(c);
  if (!S.chips[ch]) { S.chips[ch] = true; toast("Showing " + (ch === "shared" ? "Shared" : SRC_LABEL[ch]) + " sessions so the open one stays in the list."); }
}

function openSession(sid, where) {
  const s = SESS[sid]; if (!s) return;
  const c = convOf(s);
  revealSource(c);
  where = where || "current";
  const at = S.tabs.indexOf(sid);

    if (at < 0) S.tabs.push(sid);
    if (!S.tabs[S.active]) S.active = S.tabs.indexOf(sid);
  } else if (where === "newtab") {
    if (at < 0) { S.tabs.push(sid); S.active = S.tabs.length - 1; } else if (at !== S.splitIdx) S.active = at;

    s.read = true;
  } else if (where === "split") {
    if (!S.tabs.length) { S.tabs = [sid]; S.active = 0; s.read = true; }
    else if (at === S.active) { toast("That session is already open on the left."); }
    else {
      if (at >= 0) S.splitIdx = at; else { S.tabs.push(sid); S.splitIdx = S.tabs.length - 1; }
      S.focusPane = "split"; s.read = true;
    }
  } else {
    if (!S.tabs.length) { S.tabs = [sid]; S.active = 0; }
    else if (at >= 0) { if (at === S.splitIdx) S.focusPane = "split"; else { S.active = at; S.focusPane = "primary"; } }
    else { const idx = S.focusPane === "split" && S.splitIdx != null ? S.splitIdx : S.active; S.tabs[idx] = sid; }
    s.read = true;
    S.compactDetail = true;
  }

  S.focusRow = c.sessions.length > 1 ? "s:" + sid : "c:" + c.id;
  render();
}

function closeTab(i) {
  S.tabs.splice(i, 1);
  const fix = (x) => (x == null ? null : x > i ? x - 1 : x);
  if (S.splitIdx === i) S.splitIdx = null;
  else S.splitIdx = fix(S.splitIdx);
  if (S.active === i) {
    if (S.splitIdx != null) { S.active = S.splitIdx; S.splitIdx = null; }
    else S.active = Math.max(0, Math.min(i, S.tabs.length - 1));
  } else S.active = fix(S.active);

  render();
}
function closePane(which) {
  if (which === "split") S.splitIdx = null;
  else if (S.splitIdx != null) { S.active = S.splitIdx; S.splitIdx = null; }
  S.focusPane = "primary";
  render();
}
function splitTab(i) {
  if (i === S.active) {
    const other = S.tabs.findIndex((_, j) => j !== i && j !== S.splitIdx);
    if (other < 0) { toast("Open a second tab first, then drag one to the right edge."); return; }
    S.active = other;
  }
  S.splitIdx = i; S.focusPane = "split";
  render();
}

function setRead(sids, val) {
  sids.forEach((id) => { if (SESS[id]) SESS[id].read = val; });
  render();
}
function toggleRead(keys) {
  const sids = keysToSids(keys);
  const anyUnread = sids.some((id) => !SESS[id].read);
  setRead(sids, anyUnread);
  toast(anyUnread ? "Marked read." : "Marked unread.");
}

function triage(keys, kind) {
  const cids = keysToCids(keys);
  if (!cids.length) return;
  const convs = cids.map(convById);
  const allIn = convs.every((c) => c.triage === kind);
  const prev = convs.map((c) => [c, c.triage]);
  const before = S.flat.map((r) => r.k);
  const fi = before.indexOf(S.focusRow);
  const openHit = convs.some((c) => c.sessions.some((s) => s.id === currentSid()));
  convs.forEach((c) => { c.triage = allIn ? null : kind; });
  S.sel.clear();
  // Keep the cursor where it was: the next row slides up under it, mail style.
  const after = computeFlat().map((r) => r.k);
  let next = null;
  for (let j = fi; j < before.length && j >= 0; j++) { if (after.includes(before[j])) { next = before[j]; break; } }
  if (!next && after.length) next = after[Math.min(Math.max(fi, 0), after.length - 1)];
  S.focusRow = next;
  if (openHit && next && !allIn) {
    const c = rowKeyToConv(next);
    const sid = next.startsWith("s:") ? next.slice(2) : preferred(c).id;
    render();
    openSession(sid);
    S.focusRow = next;
  }
  render();
  const n = convs.length, what = n === 1 ? "Conversation" : n + " conversations";
  const msg = allIn ? what + " moved back to the inbox." : kind === "done" ? what + " marked Done." : what + " moved to Later.";
  toast(msg, "Undo", () => { prev.forEach(([c, t]) => { c.triage = t; }); render(); });
}

function moveConvs(cids, target) {
  const convs = cids.map(convById).filter(Boolean);
  const blocked = convs.filter((c) => c.shared === "view");
  const ok = convs.filter((c) => c.shared !== "view");
  if (!ok.length) { toast("View-only sessions cannot move."); return; }
  const prev = ok.map((c) => [c, c.key]);
  const base = target === "nogroup" ? "shared/" : target;
  ok.forEach((c) => { c.key = base + leafOf(c.key) + "/"; });
  S.sel.clear();
  render();
  const name = target === "nogroup" ? "No group" : hashName(target);
  toast("Moved " + (ok.length === 1 ? "1 conversation" : ok.length + " conversations") + " to " + name + "." + (blocked.length ? " View-only ones stayed." : ""), "Undo", () => { prev.forEach(([c, k]) => { c.key = k; }); render(); });
}

function forkFrom(sid, i) {
  const s = SESS[sid]; if (!s) return;
  const c = convOf(s);
  const tl = timelineOf(s);
  const item = tl[Math.min(i, tl.length - 1)];
  const at = clip(item.text, 46);
  const first = tl.find((t) => t.kind === "human" || t.kind === "slack") || tl[0];
  const firstWho = first.who ? person(first.who).name + " asked" : agent(first.agent).name + " said";
  const n = ++S.seq;
  const id = "fork" + n;
  const summary = firstWho + ': "' + clip(first.text, 90) + '"' + (item !== first ? " At the fork point: " + clip(item.text, 120) : "");
  const ns = {
    id, cid: c.id, title: "Fork: " + clip(s.title, 44), status: "new", glyph: "none", agents: [s.agents[0]], tasks: 0, cost: 0,
    created: nowIso(), last: nowIso(), read: true, needs: false, forkedFrom: { session: sid, at },
    timeline: [{ kind: "fork", at: nowIso(), text: 'Forked from "' + s.title + '" at "' + at + '". Summary: ' + summary }],
  };
  c.sessions.push(ns); SESS[id] = ns;
  S.expanded[c.id] = true;
  openSession(id);
  toast("Fork created in the same conversation. It starts from a summary, not the full history.");
}

function newSessionIn(path, text) {
  const n = ++S.seq, cid = "new" + n, sid = "ns" + n;
  const base = !path || path === "inbox" || path === "nogroup" ? "shared/" : path;
  const s = {
    id: sid, cid, title: clip(text, 64), status: "running", glyph: "running", agents: ["lead"], tasks: 1, cost: 0,
    created: nowIso(), last: nowIso(), read: true, needs: false,
    timeline: [
      { kind: "human", who: ME, at: nowIso(), text },
      { kind: "task", agent: "lead", at: nowIso(), status: "running", text: "Picked up. Reading the request." },
    ],
  };
  CONVS.unshift({ id: cid, key: base + "conv:" + cid + "/", title: s.title, source: "dashboard", owner: ME, shared: null, triage: null, sessions: [s] });
  SESS[sid] = s;
  S.chips.dashboard = true;
  openSession(sid);
  toast("Session started in " + (base === "shared/" ? "No group" : hashName(base)) + ".");
}

function sendInSession(sid, text) {
  const s = SESS[sid]; if (!s) return;
  const c = convOf(s);
  if (!s.timeline) s.timeline = timelineOf(s).map((t) => ({ ...t }));
  if (c.source === "slack") s.timeline.push({ kind: "reply", who: ME, at: nowIso(), text });
  else s.timeline.push({ kind: "human", who: ME, at: nowIso(), text });
  s.timeline.push({ kind: "task", agent: s.agents[0] || "lead", at: nowIso(), status: "running", text: "Picked up. Working on it." });
  s.status = "running"; s.last = nowIso(); s.tasks += 1;
  S.drafts[sid] = "";
  render();
  if (c.source === "slack") toast("Posted to the Slack thread by the swarm bot, attributed to you.");
}

function approve(sid, i, ok) {
  const s = SESS[sid];
  s.timeline[i].resolved = ok ? "approved" : "rejected";
  s.needs = false;
  s.timeline.push({ kind: "note", at: nowIso(), text: (ok ? "Approved" : "Rejected") + " by " + person(ME).name + "." });
  s.status = ok ? "running" : "paused";
  s.last = nowIso();
  render();
}

/* ---------- groups ---------- */
function rekeyPrefix(oldP, newP) {
  CONVS.forEach((c) => { if (c.key.startsWith(oldP)) c.key = newP + c.key.slice(oldP.length); });
  S.saved = S.saved.map((p) => (p.startsWith(oldP) ? newP + p.slice(oldP.length) : p));
  const nf = {};
  Object.keys(S.folds).forEach((p) => { nf[p.startsWith(oldP) ? newP + p.slice(oldP.length) : p] = S.folds[p]; });
  S.folds = nf;
  if (S.group.startsWith(oldP)) S.group = newP + S.group.slice(oldP.length);
}
function renameGroup(path, name) {
  const sl = slug(name);
  S.renaming = null; S.treeDraft = null;
  if (!sl) { render(); return; }
  const s = segs(path); s[s.length - 1] = sl;
  const np = s.join("/") + "/";
  if (np === path) { render(); return; }
  if (userPathSet().has(np)) { render(); toast("A group with that name already exists."); return; }
  const old = hashName(path);
  rekeyPrefix(path, np);
  render();
  toast("Renamed " + old + " to " + hashName(np) + ".", "Undo", () => { rekeyPrefix(np, path); render(); });
}
function createGroup(parent, name) {
  const sl = slug(name);
  S.creating = null; S.treeDraft = null;
  if (!sl) { render(); return; }
  const p = parent + sl + "/";
  if (!userPathSet().has(p)) S.saved.push(p);
  S.folds[parent] = false;
  S.group = p;
  render();
  toast("Group " + hashName(p) + " created. Drag rows onto it, or press m on a row.");
}
function deleteGroup(path) {
  const root = path.startsWith("personal/") ? "personal/" + ME + "/" : "shared/";
  const moved = CONVS.filter((c) => groupOf(c.key).startsWith(path));
  const prevKeys = moved.map((c) => [c, c.key]);
  const prevSaved = S.saved.slice();
  moved.forEach((c) => { c.key = root + leafOf(c.key) + "/"; });
  S.saved = S.saved.filter((p) => !p.startsWith(path));
  if (S.group.startsWith(path)) S.group = "nogroup";
  S.confirm = null;
  render();
  toast("Deleted " + hashName(path) + ". " + (moved.length === 1 ? "1 conversation" : moved.length + " conversations") + " moved to No group.", "Undo", () => {
    prevKeys.forEach(([c, k]) => { c.key = k; }); S.saved = prevSaved; render();
  });
}

/* ---------- next unread ---------- */
function nextUnread() {
  const order = S.listOrder.map(convById);
  const cur = S.focusRow ? rowKeyToConv(S.focusRow) : null;
  const start = cur ? order.indexOf(cur) : -1;
  const openSid = currentSid();
  const isNews = (c) => c.sessions.some((s) => (s.needs || !s.read) && s.id !== openSid);
  for (let j = 1; j <= order.length; j++) {
    const c = order[(start + j + order.length) % order.length];
    if (c && isNews(c)) return c;
  }
  const rest = inboxConvs().filter(isNews).sort((a, b) => (convLast(a) < convLast(b) ? 1 : -1));
  return rest[0] || null;
}
function goNextUnread() {
  const c = nextUnread();
  if (!c) { toast("Nothing unread. Inbox clear."); return; }
  if (!S.listOrder.includes(c.id)) S.group = "inbox";
  const s = c.sessions.find((x) => x.needs && x.id !== currentSid()) || c.sessions.find((x) => !x.read) || preferred(c);
  openSession(s.id);
}

}
function captureFocus() {
  const a = document.activeElement;
  if (!a || !a.id || a === document.body) return null;
  return { id: a.id, s: a.selectionStart, e: a.selectionEnd };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el) return;
  if (document.activeElement !== el) el.focus({ preventScroll: true });
  if (f.s != null && el.setSelectionRange) { try { el.setSelectionRange(f.s, f.e); } catch (e) { /* not a text field */ } }
}
function captureScroll() {
  const m = {};
  $$(".pane[data-sid]").forEach((p) => {
    const sc = $(".tls", p); if (!sc) return;
    m[p.dataset.pane] = { sid: p.dataset.sid, top: sc.scrollTop, bottom: sc.scrollHeight - sc.scrollTop - sc.clientHeight < 24 };
  });
  return m;
}
function restoreScroll(m) {
  $$(".pane[data-sid]").forEach((p) => {
    const sc = $(".tls", p); if (!sc) return;
    const prev = m[p.dataset.pane];
    if (prev && prev.sid === p.dataset.sid && !prev.bottom) sc.scrollTop = prev.top;
    else sc.scrollTop = sc.scrollHeight;
  });
}

function renderChips() {

    : '<span class="tic">' + (o.icon || svg("hash")) + "</span>";

}
function renderUserNode(set, p, level, out) {
  const kids = childrenOf(set, p).sort(byActivity);
  const folded = kids.length > 0 && !!S.folds[p];
  const n = kids.length && !folded ? counts(under(p, true)) : counts(under(p, false));
  const parts = crumbParts(p);
  const label = parts[parts.length - 1];
  out.push(treeRow({ id: p, level, label, labelHTML: esc(label), kids: kids.length > 0, folded, right: countsHTML(n), editable: true, drop: true }));
  if (S.creating && S.creating.parent === p) out.push(createRow(level + 1));
  if (!folded) kids.forEach((k) => renderUserNode(set, k, level + 1, out));
}
function renderTree() {
  const out = [];
  const inbox = inboxConvs();
  out.push(treeRow({ id: "inbox", label: "Inbox", labelHTML: "Inbox", icon: svg("inbox"), right: countsHTML(counts(inbox)) }));
  const nLater = CONVS.filter((c) => convVisible(c) && c.triage === "later").length;
  const nDone = CONVS.filter((c) => convVisible(c) && c.triage === "done").length;
  out.push(treeRow({ id: "later", label: "Later", labelHTML: "Later", icon: svg("clock"), right: nLater ? '<span class="num">' + nLater + "</span>" : "" }));
  out.push(treeRow({ id: "done", label: "Done", labelHTML: "Done", icon: svg("done"), right: nDone ? '<span class="num">' + nDone + "</span>" : "" }));

  out.push('<div class="tsec"><span class="lab">My groups</span><button class="ib" type="button" id="tree-add" aria-label="New group" title="New group">' + svg("plus") + "</button></div>");
  if (S.creating && S.creating.parent === "shared/") out.push(createRow(0));
  const set = userPathSet();
  topUser(set).sort(byActivity).forEach((p) => renderUserNode(set, p, 0, out));

  // external sources: one parent per source, channels under it
  const srcs = ["slack", "telegram"].filter((s) => S.chips[s]);
  if (srcs.length) {
    out.push('<div class="tsec"><span class="lab">Sources</span></div>');
    srcs.forEach((src) => {
      const paths = Array.from(new Set(CONVS.filter((c) => c.source === src && isSourcePath(groupOf(c.key))).map((c) => segs(groupOf(c.key)).slice(0, 3).join("/") + "/"))).sort(byActivity);
      const id = "src:" + src;
      const folded = !!S.folds[id];
      const n = folded ? counts(under("shared/" + src + "/", false)) : { needs: 0, running: 0, unread: 0 };
      out.push(treeRow({ id, label: SRC_LABEL[src], labelHTML: smk(src) + SRC_LABEL[src], kids: paths.length > 0, folded, right: countsHTML(n), ro: true }));
      if (!folded) paths.forEach((p) => {
        const name = crumbParts(p)[1] || p;
        out.push(treeRow({ id: p, level: 1, label: name, labelHTML: esc(name), icon: smk(src), right: countsHTML(counts(under(p, false))), ro: true }));
      });
    });
  }

  // shared with me: personal/<owner>/... keys
  if (S.chips.shared) {
    const owners = Array.from(new Set(CONVS.filter((c) => isOtherPersonal(groupOf(c.key))).map((c) => segs(c.key)[1])));
    if (owners.length) {
      out.push('<div class="tsec"><span class="lab">Shared with me</span></div>');
      owners.forEach((o) => {

        const folded = !!S.folds[id];

        out.push(treeRow({ id, label: person(o).name, labelHTML: '<span class="ownav" aria-hidden="true">' + esc(person(o).initials) + "</span>" + esc(person(o).name), kids: true, folded, right: countsHTML(n), ro: true }));

      });
    }
  }

  out.push('<div class="tsec"><span class="lab">Unsorted</span></div>');
  out.push(treeRow({ id: "nogroup", label: "No group", labelHTML: "No group", icon: svg("nogroup"), right: countsHTML(counts(inbox.filter((c) => isNoGroup(groupOf(c.key))))), drop: true }));

  $("#tscroll").innerHTML = '<div role="tree" aria-label="Groups">' + out.join("") + "</div>";
}

  if (g === "done") return { icon: svg("done"), title: "Done", sub: "", note: "Finished conversations. Press e on a row to move it back." };
  if (g === "nogroup") return { icon: svg("nogroup"), title: "No group", sub: "", target: "shared/" };

  if (isSourcePath(g)) { const s = segs(g)[1]; return { icon: smk(s), title: crumbParts(g)[1], sub: crumb(g), ro: "source", src: s }; }
  if (g.startsWith("sw:")) return { icon: svg("users"), title: person(g.slice(3)).name, sub: "", ro: "shared" };
  if (isOtherPersonal(g)) return { icon: svg("users"), title: shortName(g), sub: crumb(g), ro: "shared" };

}

/* fuzzy: subsequence match, bonus for word starts and runs */
function fuzzy(q, text) {
  q = q.trim().toLowerCase();
  if (!q) return 1;
  const t = text.toLowerCase();
  if (t.includes(q)) return 100 - t.indexOf(q);
  let ti = 0, score = 0, prev = -2;
  for (const ch of q.replace(/\s+/g, "")) {
    const i = t.indexOf(ch, ti);
    if (i < 0) return 0;
    score += (i === prev + 1 ? 3 : 1) + (i === 0 || /[\s›/#:~-]/.test(t[i - 1]) ? 2 : 0);
    prev = i; ti = i + 1;
  }
  return score;
}
function sessItem(s) {
  const c = convOf(s);
  return {
    sect: "Sessions", score: 0, sid: s.id,
    icon: glyph(sFlags(s)), label: (c.source !== "dashboard" ? smk(c.source) + " " : "") + esc(s.title), sub: esc(crumb(groupOf(c.key))) + (c.sessions.length > 1 ? " · " + c.sessions.length + " sessions" : ""),
    text: s.title + " " + crumb(groupOf(c.key)),
    run: (shift) => { closePalette(); openSession(s.id, shift ? "split" : "current"); },
  };
}
function groupTargets(includeNoGroup) {
  const list = Array.from(userPathSet()).sort((a, b) => crumb(a).localeCompare(crumb(b))).map((p) => ({ path: p, label: crumb(p) }));
  if (includeNoGroup) list.push({ path: "nogroup", label: "No group" });
  return list;
}
function palItems() {

      sect: "Groups", icon: svg(g.path === "nogroup" ? "nogroup" : "hash"), label: esc(g.label), text: g.label,
      run: () => { const P0 = S.pal; closePalette(); pickGroup(P0, g.path); },
    }));
    const sl = slug(q);
    const items = all.map((x) => ({ ...x, score: fuzzy(q, x.text) })).filter((x) => x.score > 0).sort((a, b) => b.score - a.score);
    if (sl && !userPathSet().has("shared/" + sl + "/")) items.push({ sect: "Create", icon: svg("plus"), label: 'Create group "#' + esc(sl) + '"', score: 1, run: () => { const P0 = S.pal; closePalette(); const p = "shared/" + sl + "/"; S.saved.push(p); pickGroup(P0, p); } });
    return items;
  }
  if (P.mode === "split") {
    return Object.values(SESS).filter((s) => !paneSids().includes(s.id)).map(sessItem)
      .map((x) => ({ ...x, sect: "Open in split", run: () => { closePalette(); openSession(x.sid, "split"); }, score: fuzzy(q, x.text) }))
      .filter((x) => x.score > 0).sort((a, b) => b.score - a.score);
  }
  const cur = currentSid() && SESS[currentSid()];
  const cc = cur && convOf(cur);
  const A = [];
  A.push({ icon: svg("plus"), label: "New session in group…", run: () => { S.pal = { mode: "group", purpose: "new", q: "", idx: 0 }; renderOverlay(); $("#pal-in").focus(); } });
  if (cur) A.push({ icon: svg("move"), label: "Move to group…", sub: esc(clip(cc.title, 40)), kbd: "m", run: () => { S.pal = { mode: "group", purpose: "move", keys: ["c:" + cc.id], q: "", idx: 0 }; renderOverlay(); $("#pal-in").focus(); } });
  if (cur && cc.shared !== "view") { const tl = timelineOf(cur); A.push({ icon: svg("fork"), label: "Fork from here", sub: "at the latest message of " + esc(clip(cur.title, 30)), run: () => { closePalette(); forkFrom(cur.id, tl.length - 1); } }); }
  A.push({ icon: svg("split"), label: "Open in split…", kbd: "v", run: () => { S.pal = { mode: "split", q: "", idx: 0 }; renderOverlay(); $("#pal-in").focus(); } });
  if (S.splitIdx != null) A.push({ icon: svg("x"), label: "Close the split", run: () => { closePalette(); closePane("split"); } });
  if (cur) A.push({ icon: svg(cur.read ? "mail" : "mailopen"), label: cur.read ? "Mark unread" : "Mark read", sub: esc(clip(cur.title, 40)), kbd: "u", run: () => { closePalette(); setRead([cur.id], !cur.read); } });
  if (cur) A.push({ icon: svg("done"), label: cc.triage === "done" ? "Move to inbox" : "Mark Done", sub: esc(clip(cc.title, 40)), kbd: "e", run: () => { closePalette(); triage(["c:" + cc.id], "done"); } });
  if (cur) A.push({ icon: svg("clock"), label: cc.triage === "later" ? "Move to inbox" : "Later", sub: esc(clip(cc.title, 40)), kbd: "l", run: () => { closePalette(); triage(["c:" + cc.id], "later"); } });
  A.push({ icon: svg("history"), label: "Open Legacy Sessions", run: () => { closePalette(); setLegacy(true); } });
  A.push({ icon: svg(document.documentElement.classList.contains("dark") ? "sun" : "moon"), label: document.documentElement.classList.contains("dark") ? "Switch to light theme" : "Switch to dark theme", run: () => { closePalette(); toggleTheme(); } });
  A.forEach((a) => all.push({ ...a, sect: "Actions", text: a.label }));
  if (!q.trim()) {
    const recent = Object.values(SESS).filter((s) => convOf(s).triage === null).sort((a, b) => {
      const na = (a.needs || !a.read) ? 1 : 0, nb = (b.needs || !b.read) ? 1 : 0;
      if (na !== nb) return nb - na;
      return a.last < b.last ? 1 : -1;
    }).slice(0, 6);
    return all.map((x) => ({ ...x, score: 1 })).concat(recent.slice(0, 5).map((s) => ({ ...sessItem(s), sect: "Jump to", score: 1 })));
  }
  const acts = all.map((x) => ({ ...x, score: fuzzy(q, x.text) })).filter((x) => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 4);
  const ss = Object.values(SESS).map((s) => ({ ...sessItem(s), score: fuzzy(q, s.title + " " + crumb(groupOf(convOf(s).key))) })).filter((x) => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 8);
  const gs = groupTargets(false).concat(
    Array.from(new Set(CONVS.map((c) => groupOf(c.key)).filter((p) => isSourcePath(p) || isOtherPersonal(p)))).map((p) => ({ path: p, label: crumb(p) }))
  ).map((g) => ({ sect: "Groups", icon: isSourcePath(g.path) ? smk(segs(g.path)[1]) : svg("hash"), label: esc(g.label), score: fuzzy(q, g.label), run: () => { closePalette(); selectGroup(g.path); } }))
    .filter((x) => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 5);
  return ss.concat(gs, acts);
}
function renderPalList() {

function palKey(e) {
  const P = S.pal; if (!P) return;

});

function setFocusPane(p) {
  if (S.focusPane === p) return;
  S.focusPane = p;
  $$(".pane").forEach((el) => el.classList.toggle("fp", S.splitIdx != null && el.dataset.pane === p));
  $$(".tab").forEach((el) => { const i = +el.dataset.tab; el.classList.toggle("fp", (i === S.active && p === "primary") || (i === S.splitIdx && p === "split")); });
}
$("#panes").addEventListener("mousedown", (e) => { const p = e.target.closest(".pane[data-pane]"); if (p) setFocusPane(p.dataset.pane); });
$("#panes").addEventListener("focusin", (e) => { const p = e.target.closest(".pane[data-pane]"); if (p) setFocusPane(p.dataset.pane); });
$("#panes").addEventListener("click", (e) => {
  const pane = e.target.closest(".pane[data-sid]"); if (!pane) return;
  const sid = pane.dataset.sid, which = pane.dataset.pane, s = SESS[sid], c = convOf(s);
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "forkat") forkFrom(sid, +a.dataset.i);
  else if (act === "forklast") forkFrom(sid, timelineOf(s).length - 1);
  else if (act === "approve") approve(sid, +a.dataset.i, true);
  else if (act === "reject") approve(sid, +a.dataset.i, false);
  else if (act === "read") { setRead([sid], !s.read); toast(s.read ? "Marked read." : "Marked unread."); }
  else if (act === "done") triage(["c:" + c.id], "done");
  else if (act === "later") triage(["c:" + c.id], "later");
  else if (act === "move") openPalette("group", { purpose: "move", keys: ["c:" + c.id] });
  else if (act === "closepane") closePane(which);
  else if (act === "crumb") { const gp = groupOf(c.key); selectGroup(isNoGroup(gp) ? "nogroup" : gp); }
  else if (act === "sib") openSession(a.dataset.sid);
  else if (act === "openparent") openSession(s.forkedFrom.session);
  else if (act === "send") { const ta = $("#cmp-" + which); const v = ta.value.trim(); if (v) sendInSession(sid, v); }
  else if (act === "back") { S.compactDetail = false; render(); }
});
$("#panes").addEventListener("input", (e) => { if (e.target.matches(".cmpb textarea")) { S.drafts[e.target.dataset.sid] = e.target.value; autoGrow(e.target); } });
$("#panes").addEventListener("keydown", (e) => {
  if (!e.target.matches(".cmpb textarea")) return;
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); const v = e.target.value.trim(); if (v) sendInSession(e.target.dataset.sid, v); }
});

// legacy
$("#legacy").addEventListener("click", (e) => { const r = e.target.closest("[data-lg]"); if (r) { S.legacySel = r.dataset.lg; render(); } });

// menus + overlays
$("#menu").addEventListener("click", (e) => {
  const b = e.target.closest("[data-mi]"); if (!b) return;
  const m = S.menu; S.menu = null; renderMenu();
  const a = b.dataset.mi;
  if (m.type === "row") {
    const k = m.k;
    if (a === "open") openRow(k);
    if (a === "newtab") openRow(k, "newtab");
    if (a === "split") openRow(k, "split");
    if (a === "read") toggleRead([k]);
    if (a === "done") triage([k], "done");
    if (a === "later") triage([k], "later");
    if (a === "move") openPalette("group", { purpose: "move", keys: [k] });
  } else {
    if (a === "sub") { S.creating = { parent: m.path }; S.renaming = null; S.treeDraft = null; S.treeFocus = true; S.folds[m.path] = false; render(); }
    if (a === "rename") { S.renaming = m.path; S.creating = null; S.treeDraft = null; S.treeFocus = true; render(); }
    if (a === "delete") { S.confirm = { path: m.path }; render(); $("#dlg-cancel").focus(); }
  }
});
document.addEventListener("mousedown", (e) => {
  if (S.menu && !e.target.closest(".menu")) { S.menu = null; renderMenu(); }
});
$("#overlay").addEventListener("mousedown", (e) => {
  if (e.target.dataset && e.target.dataset.ovl) { e.preventDefault(); if (S.pal) closePalette(); if (S.confirm) { S.confirm = null; render(); } }
});
$("#overlay").addEventListener("click", (e) => {
  if (e.target.closest("#dlg-cancel")) { S.confirm = null; render(); listEl.focus({ preventScroll: true }); }
  else if (e.target.closest("#dlg-ok")) { deleteGroup(S.confirm.path); listEl.focus({ preventScroll: true }); }
  const pi = e.target.closest("[data-pi]");
  if (pi && S.pal) { const it = S.pal.items[+pi.dataset.pi]; if (it) it.run(e.shiftKey); }
});
$("#overlay").addEventListener("mousemove", (e) => {
  const pi = e.target.closest("[data-pi]");
  if (pi && S.pal && +pi.dataset.pi !== S.pal.idx) { S.pal.idx = +pi.dataset.pi; $$(".pi").forEach((x) => x.classList.toggle("on", +x.dataset.pi === S.pal.idx)); }
});


/* ---------- keyboard ---------- */
document.addEventListener("keydown", (e) => {
  // Cmd+K / Ctrl+K: the one global shortcut (the dashboard already owns it).
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if (S.pal) closePalette(); else if (!S.legacy) openPalette();
    return;
  }
  if (S.pal) return;
  if (e.key === "Escape") {
    if (S.confirm) { S.confirm = null; render(); listEl.focus({ preventScroll: true }); return; }
    if (S.menu) { S.menu = null; renderMenu(); return; }
  }
  if (S.confirm) return;
  // list keys: only when the list itself has focus, never inside an input
  if (document.activeElement !== listEl || typing(document.activeElement)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const flat = S.flat;
  const i = flat.findIndex((r) => r.k === S.focusRow);
  const cur = flat[i];
  const targetKeys = () => (S.sel.size ? Array.from(S.sel) : cur ? [cur.k] : []);
  const move = (d) => {
    if (!flat.length) return;
    const ni = i < 0 ? 0 : Math.max(0, Math.min(flat.length - 1, i + d));
    S.focusRow = flat[ni].k;
    renderList();
    const el = $(".row.focus", listEl); if (el) el.scrollIntoView({ block: "nearest" });
  };
  switch (e.key) {
    case "j": case "ArrowDown": move(1); break;
    case "k": case "ArrowUp": move(-1); break;
    case "Enter": case "o": if (cur) openRow(cur.k); break;
    case "x": if (cur) toggleSel(cur.k); break;
    case "e": if (targetKeys().length) triage(targetKeys(), "done"); break;
    case "l": if (targetKeys().length) triage(targetKeys(), "later"); break;
    case "u": if (targetKeys().length) { toggleRead(targetKeys()); S.sel.clear(); render(); } break;
    case "m": if (targetKeys().length) openPalette("group", { purpose: "move", keys: targetKeys() }); break;
    case "v": if (cur) openRow(cur.k, "split"); break;
    case "t": if (cur) openRow(cur.k, "newtab"); break;
    case "n": goNextUnread(); break;
    case "ArrowRight": if (cur && !cur.sid && convById(cur.cid).sessions.length > 1) { S.expanded[cur.cid] = true; render(); } break;
    case "ArrowLeft": if (cur) { if (cur.sid) S.focusRow = "c:" + cur.cid; S.expanded[cur.cid] = false; render(); } break;
    case "Escape": if (S.sel.size) { S.sel.clear(); render(); } break;
    default: return;
  }
  e.preventDefault();
});

window.addEventListener("resize", () => { if (S.menu) { S.menu = null; renderMenu(); } });

/* ============================================================
   boot
   ============================================================ */
(function boot() {
  const q = new URLSearchParams(location.search);
  applyTheme(q.get("theme") === "dark" ? "dark" : "light");
  (q.get("chips") || "").split(",").map((x) => x.trim().toLowerCase()).filter(Boolean).forEach((t) => {
    const off = t.startsWith("-"), k = off ? t.slice(1) : t;
    if (k in S.chips) S.chips[k] = !off;
  });
  if (q.get("group")) S.group = q.get("group");
  const open = SESS[q.get("open")] ? q.get("open") : "s1";
  const bgFinisher = Object.values(SESS).find((s) => s.finishesInSeconds);
  S.tabs = [open];
  if (bgFinisher && bgFinisher.id !== open) S.tabs.push(bgFinisher.id);
  S.active = 0;
  SESS[open].read = true;
  revealSourceQuiet(convOf(SESS[open]));
  const sp = q.get("split");
  if (sp && SESS[sp] && sp !== open) {
    const at = S.tabs.indexOf(sp);
    if (at >= 0) S.splitIdx = at; else { S.tabs.push(sp); S.splitIdx = S.tabs.length - 1; }
    SESS[sp].read = true;
    revealSourceQuiet(convOf(SESS[sp]));
  }
  const oc = convOf(SESS[open]);
  if (oc.sessions.length > 1) { S.expanded[oc.id] = true; S.focusRow = "s:" + open; } else S.focusRow = "c:" + oc.id;
  S.legacy = q.get("legacy") === "1";
  if (S.legacy) S.legacySel = D.legacy.some((x) => x.id === open) ? open : D.legacy[0].id;
  render();
  if (!S.legacy) { listEl.focus({ preventScroll: true }); renderMidFoot(); }

  // A background session finishes about 8 s after load: its tab and row light up as unread.
  if (bgFinisher) {
    setTimeout(() => {
      const s = bgFinisher;
      s.status = "completed"; s.last = nowIso();
      const visible = paneSids().includes(s.id) && !S.legacy;
      s.read = visible;
      render();
      if (!visible && !S.legacy) toast('"' + s.title + '" finished.', "Open", () => openSession(s.id));
    }, (bgFinisher.finishesInSeconds || 8) * 1000);
  }
})();
function revealSourceQuiet(c) { const ch = chipFor(c); if (!S.chips[ch]) S.chips[ch] = true; }
</script>
