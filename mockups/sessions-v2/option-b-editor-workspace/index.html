<!doctype html>
<!--
  Option B, "Editor workspace". Sessions behave like files in a code editor: one explorer tree holds groups,
  conversations, and sessions (forks branch off like git branches), and the editor area holds session tabs,
  one split with two tab strips, and a breadcrumb above each timeline.
  A thin status bar keeps live counts (running, needs you, unread) that double as quick filters, so several
  sessions stay open and in view at once.
  Trade-off: it optimizes for parallel work and forks, not for triage at volume. Rows are one line with no
  preview, titles truncate deep in the tree, and the editor vocabulary (tabs, split, breadcrumb) assumes a
  desktop power user.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Swarm · Sessions v2 · Editor workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../session-logs/demo-shared.css" />
<style>
/* ============ local tokens ============ */
:root{
  --border-subtle: oklch(0.945 0.003 286);
  --accent: oklch(0.943 0.003 286.375);
  --guide: oklch(0.905 0.004 286);
  --graph: oklch(0.7 0.012 286);
  --cur: color-mix(in oklch, var(--primary) 11%, var(--surface));
  --vis: color-mix(in oklch, var(--primary) 5%, var(--surface));
  --sel: color-mix(in oklch, var(--primary) 7%, var(--surface));
  --ease-snappy: cubic-bezier(.2,0,0,1);
  --ease-swift: cubic-bezier(.32,.72,0,1);
  --exp-w: clamp(284px, 21vw, 312px);
  --primary-foreground: oklch(0.985 0 0);
}
html.dark{
  --border-subtle: oklch(1 0 0 / 8%);
  --accent: oklch(0.274 0.006 286.033);
  --guide: oklch(1 0 0 / 9%);
  --graph: oklch(0.56 0.012 286);
  --primary-foreground: oklch(0.21 0.006 285.885);
}

/* ============ base ============ */
body{overflow:hidden;font-size:13px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.i{width:16px;height:16px;flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font-family:var(--font-mono);font-size:10.5px;line-height:1;padding:3px 5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;background:var(--card);color:var(--muted-foreground);white-space:nowrap}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.btn{height:32px;font-size:12.5px}
.btn.sm{height:28px;padding:0 10px;font-size:12px;gap:6px}
.btn.sm svg{width:14px;height:14px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted-foreground)}
.btn.ghost:hover{background:var(--accent);color:var(--foreground)}
.btn.primary{color:var(--primary-foreground)}
.btn.danger{background:var(--error-strong);border-color:transparent;color:oklch(0.985 0 0)}
.btn.danger:hover{filter:brightness(1.05);background:var(--error-strong)}
.ib{width:26px;height:26px;flex:none;display:inline-grid;place-items:center;padding:0;border:0;border-radius:6px;background:none;color:var(--muted-foreground);cursor:pointer}
.ib:hover{background:var(--accent);color:var(--foreground)}
.ib .i{width:15px;height:15px}
.ib.on{color:var(--primary)}

/* ============ shell ============ */
#app{height:100dvh;display:grid;grid-template-rows:44px minmax(0,1fr) 26px;overflow:hidden}
#app.is-legacy{grid-template-rows:44px minmax(0,1fr)}
#app.is-legacy .statusbar{display:none}
.appbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:0 10px 0 14px;border-bottom:1px solid var(--border);background:var(--background);min-width:0}
.ab-l,.ab-r{display:flex;align-items:center;gap:8px;min-width:0}
.ab-r{justify-content:flex-end;gap:4px}
.appbar .pg{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.appbar .kick{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);border-left:1px solid var(--border);padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ktrigger{display:inline-flex;align-items:center;gap:8px;height:30px;width:min(440px,34vw);padding:0 5px 0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted-foreground);font-size:12.5px;cursor:pointer}
.ktrigger:hover{background:var(--accent);color:var(--foreground)}
.ktrigger .i{width:14px;height:14px}
.ktrigger .lbl{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xtoggle{display:none}
.work{display:grid;grid-template-columns:48px var(--exp-w) minmax(0,1fr);min-height:0;min-width:0}
#app.is-legacy .work{grid-template-columns:48px minmax(0,1fr)}
#app.is-legacy .explorer,#app.is-legacy .editor{display:none}

/* activity bar (the dashboard sidebar, collapsed) */
.actbar{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;border-right:1px solid var(--border);background:var(--surface)}
.actbar .logo{width:30px;height:30px;display:grid;place-items:center;color:var(--foreground);margin-bottom:6px}
.actbar .logo .i{width:22px;height:22px}
.abtn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;background:none;border-radius:8px;color:var(--muted-foreground);cursor:default}
.abtn:hover{background:var(--accent);color:var(--foreground)}
.abtn .i{width:18px;height:18px}
.abtn.on{color:var(--primary);background:color-mix(in oklch,var(--primary) 11%,transparent)}
.abtn.on::before{content:"";position:absolute;left:-6px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--primary)}
.actbar .sp{flex:1}
.me{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;font-weight:700;background:var(--muted);border:1px solid var(--border);color:var(--foreground)}

/* ============ explorer ============ */
.explorer{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border-right:1px solid var(--border)}
.xhead{display:flex;align-items:center;gap:1px;height:38px;padding:0 6px 0 14px;flex:none}
.xhead h2{margin:0;flex:1;font-family:var(--font-mono);font-size:11px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.xchips{display:flex;flex-wrap:wrap;gap:3px;padding:0 8px 9px;flex:none;border-bottom:1px solid var(--border-subtle)}
.schip{position:relative;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 6px;border-radius:6px;border:1px dashed var(--border);background:none;font-size:11px;font-weight:500;color:var(--muted-foreground);cursor:pointer;white-space:nowrap}
.schip:hover{background:var(--accent);color:var(--foreground)}
.schip.on{border-style:solid;background:var(--card);color:var(--foreground);box-shadow:0 1px 1px oklch(0 0 0 / .04)}
.schip .i{width:11px;height:11px}
.schip .nd{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--muted-foreground);box-shadow:0 0 0 2px var(--surface)}
.xnote{display:flex;align-items:center;gap:8px;margin:8px 10px 0;padding:6px 6px 6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:12px;color:var(--muted-foreground);flex:none}
.xnote .i{width:13px;height:13px}
.xnote span{flex:1;min-width:0}
.xnote b{color:var(--foreground);font-weight:600}
.xnote .btn{height:24px;padding:0 8px;font-size:11.5px}
.tree{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 0 14px;outline:none}
.tree::-webkit-scrollbar{width:9px}
.tree::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 26%,transparent);border-radius:99px;border:2px solid var(--surface)}
.temp{padding:24px 18px;font-size:12.5px;color:var(--muted-foreground);line-height:1.5}

.row{position:relative;display:flex;align-items:center;height:28px;padding-right:8px;color:var(--foreground);cursor:pointer;user-select:none;-webkit-user-select:none;font-size:13px}
.row:hover{background:var(--accent)}
.row .gd{position:absolute;top:0;bottom:0;left:calc(24px + var(--i) * 14px + 7.5px);width:1px;background:var(--guide);pointer-events:none}
.row .gut{width:24px;height:28px;flex:none;display:grid;place-items:center}
.row .ind{width:calc(var(--d) * 14px);flex:none}
.row .chev{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--muted-foreground)}
.row .chev .i{width:14px;height:14px}
.row[aria-expanded="true"] .chev .i{transform:rotate(90deg)}
.row .ico{width:16px;height:16px;flex:none;display:grid;place-items:center;margin:0 6px 0 2px;color:var(--muted-foreground)}
.row .ico .i{width:15px;height:15px}
.row .ico .mk{width:13px;height:13px}
.row .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lab .sl{font-style:normal;color:var(--muted-foreground);margin:0 3px}
.row .lab .lk{display:inline-block;width:11px;height:11px;margin-left:5px;vertical-align:-1px;color:var(--muted-foreground)}
.row .lab .emp,.row .lab .path{margin-left:6px;font-size:11px;color:var(--muted-foreground)}
.r-group .lab{font-weight:500}
.r-group.k-src .lab,.r-group.k-later .lab,.r-group.k-done .lab{font-weight:400}
.row.unread .lab{font-weight:600}
.row .tail{display:flex;align-items:center;gap:7px;flex:none;margin-left:6px}
.row .acts{position:absolute;right:4px;top:1px;display:none;align-items:center;gap:1px;padding-left:6px;background:inherit}
.row:hover .acts{display:flex}
.row:hover .acts~.tail{visibility:hidden}
.row .acts .ib{width:24px;height:24px}
.row .acts .ib .i{width:14px;height:14px}
.row .graph{width:40px;height:28px;flex:none;display:block}
.graph .ln{stroke:var(--graph);stroke-width:1.5;fill:none}
.graph .nd{fill:var(--surface);stroke:var(--graph);stroke-width:1.5}
.graph .nd.root{fill:var(--graph)}
.graph .nd.hd{fill:var(--primary);stroke:var(--primary)}
.r-bucket{height:24px;cursor:default}
.r-bucket:hover{background:none}
.r-bucket .bl{margin-left:3px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);padding-top:4px}
.row.cur{background:var(--cur)}
.row.cur::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;border-radius:2px;background:var(--primary)}
.row.cur .lab{font-weight:600}
.row.vis{background:var(--vis)}
.row.sel{background:var(--sel)}
.row.drop{background:color-mix(in oklch,var(--primary) 9%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--primary)}
.tree.kbd:focus .row.focus{box-shadow:inset 0 0 0 1.5px var(--ring)}
.tree.kbd:focus .row.focus.drop{box-shadow:inset 0 0 0 1.5px var(--primary)}
.row.flash{animation:lit 1.5s var(--ease-snappy)}
@keyframes lit{0%{background-color:color-mix(in oklch,var(--primary) 24%,var(--surface))}100%{background-color:transparent}}
.cb{width:14px;height:14px;border-radius:4px;border:1.5px solid color-mix(in oklch,var(--muted-foreground) 75%,transparent);display:grid;place-items:center;color:transparent;background:var(--card);opacity:0;cursor:pointer}
.cb .i{width:10px;height:10px;stroke-width:3.5}
.row:hover .cb,.tree.selecting .cb,.row.sel .cb{opacity:1}
.row.sel .cb{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.rin{flex:1;min-width:0;height:22px;margin-right:4px;padding:0 6px;border:1px solid var(--ring);border-radius:5px;background:var(--background);color:var(--foreground);font:inherit;font-size:13px;outline:none;box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 25%,transparent)}
.rerr{position:absolute;left:58px;right:10px;top:27px;z-index:6;padding:5px 8px;border-radius:6px;background:var(--card);border:1px solid color-mix(in oklch,var(--error) 45%,var(--border));color:var(--error-strong);font-size:11.5px;box-shadow:var(--shadow)}
.fkb{display:inline-flex;align-items:center;gap:2px;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.fkb .i{width:12px;height:12px}
.bulk{display:flex;align-items:center;gap:3px;padding:8px 6px 8px 12px;border-top:1px solid var(--border);background:var(--card);flex:none}
.bulk[hidden]{display:none}
.bulk .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--muted-foreground);white-space:nowrap}
.bulk .n b{color:var(--foreground);font-family:var(--font-mono)}
.bulk .btn{height:26px;padding:0 7px;font-size:12px;gap:5px}
.bulk .btn svg{width:13px;height:13px}
.bulk .ib{width:24px;height:24px}
.sash{position:absolute;top:0;bottom:0;right:-3px;width:6px;cursor:col-resize;z-index:7}
.sash:hover,.sash.on{background:color-mix(in oklch,var(--primary) 40%,transparent)}

/* ============ triage glyphs ============ */
.g{width:14px;height:14px;flex:none;display:inline-grid;place-items:center}
.g-unread::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted-foreground)}
.g-needs::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2.5px color-mix(in oklch,var(--primary) 26%,transparent)}
.g-dirty::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--foreground)}
.g-run svg{width:13px;height:13px;color:var(--active-strong);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cnt{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.cnt .g{width:10px;height:12px}
.cnt .g-unread::before{width:6px;height:6px}
.cnt .g-needs::before{width:6px;height:6px;box-shadow:0 0 0 2px color-mix(in oklch,var(--primary) 26%,transparent)}
.cnt .g-run svg{width:11px;height:11px}
.cnt.cn-needs{color:var(--primary);font-weight:700}

/* ============ editor ============ */
.editor{position:relative;display:flex;min-width:0;min-height:0;background:var(--background)}
.egroup{flex:1 1 0;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
.egroup+.egroup{border-left:1px solid var(--border)}
.tabs{display:flex;align-items:stretch;height:36px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.tablist{display:flex;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tablist::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:7px;flex:0 1 auto;min-width:96px;max-width:220px;height:36px;padding:0 5px 0 11px;border-right:1px solid var(--border-subtle);color:var(--muted-foreground);font-size:12.5px;cursor:pointer;user-select:none;-webkit-user-select:none;background:transparent;outline-offset:-2px}
.tab:hover{color:var(--foreground);background:var(--accent)}
.tab.on{background:var(--background);color:var(--foreground)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--background)}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--border)}
.egroup.focused .tab.on::before{background:var(--primary)}
.tab .ti{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--muted-foreground)}
.tab .ti .i{width:14px;height:14px}
.tab .ti .mk{width:12px;height:12px}
.tab .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.unread .tt{font-weight:600;color:var(--foreground)}
.tab.t-new .tt{font-style:italic}
.tab .slot{position:relative;width:20px;height:20px;flex:none;display:grid;place-items:center}
.tab .slot .x{position:absolute;inset:0;display:grid;place-items:center;border:0;padding:0;border-radius:5px;background:none;color:var(--muted-foreground);cursor:pointer;opacity:0}
.tab .slot .x .i{width:13px;height:13px}
.tab .slot .x:hover{background:color-mix(in oklch,var(--muted-foreground) 18%,transparent);color:var(--foreground)}
.tab.on .slot .x,.tab:hover .slot .x,.tab .slot .x:focus-visible{opacity:1}
.tab.has-g:not(:hover):not(:focus-within) .slot .x{opacity:0}
.tab.has-g:hover .slot .g,.tab.has-g:focus-within .slot .g{opacity:0}
.tab.ins-b{box-shadow:inset 2px 0 0 var(--primary)}
.tab.ins-a{box-shadow:inset -2px 0 0 var(--primary)}
.tab.flash{animation:lit 1.5s var(--ease-snappy)}
.tab.dragsrc{opacity:.5}
.tabacts{display:flex;align-items:center;gap:1px;padding:0 6px;flex:none}
.crumbs{display:flex;align-items:center;gap:0;height:30px;padding:0 10px;flex:none;border-bottom:1px solid var(--border-subtle);min-width:0;overflow:hidden;font-size:12px;color:var(--muted-foreground)}
.seg{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 5px;border:0;border-radius:5px;background:none;font-size:12px;color:inherit;cursor:pointer;min-width:22px;flex:0 1 auto;white-space:nowrap}
.seg>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg .i{width:13px;height:13px}
.seg .mk{width:12px;height:12px}
.seg:hover{background:var(--accent);color:var(--foreground)}
.seg.last{color:var(--foreground);font-weight:500;min-width:60px;flex-shrink:.4}
.seg .dd{width:12px;height:12px;color:var(--muted-foreground)}
.csep{width:12px;height:12px;flex:none;color:var(--muted-foreground)}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;container-type:inline-size}
.phead{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 10px 24px;flex:none}
.phead .pt{flex:1;min-width:0}
.phead h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.phead .tin{width:100%;height:28px;padding:0 7px;margin-left:-8px;border:1px solid var(--ring);border-radius:6px;background:var(--background);color:var(--foreground);font:inherit;font-size:15px;font-weight:600;outline:none;box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 22%,transparent)}
.pmeta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:12px;color:var(--muted-foreground)}
.pmeta .dotsep{color:var(--muted-foreground)}
.pmeta.orig{margin-top:4px}
.pmeta .own{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pmeta .own .i{width:13px;height:13px}
.pmeta .own .mk{width:12px;height:12px}
.pacts{display:flex;align-items:center;gap:1px;flex:none}
.pacts .ib{width:28px;height:28px}
.tlwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.tlwrap::-webkit-scrollbar{width:10px}
.tlwrap::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 26%,transparent);border-radius:99px;border:3px solid var(--background)}
.tl{max-width:740px;margin:0 auto;padding:6px 24px 20px}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--border);color:var(--muted-foreground);white-space:nowrap;flex:none}
.chip.run{border-color:color-mix(in oklch,var(--active) 50%,transparent);color:var(--active-strong)}
.chip.ok{border-color:color-mix(in oklch,var(--success) 40%,transparent);color:var(--success-strong)}
.chip.err{border-color:color-mix(in oklch,var(--error) 40%,transparent);color:var(--error-strong)}
.chip.pau{border-color:color-mix(in oklch,var(--paused) 40%,transparent);color:var(--paused-strong)}
.chip.needs{border-color:color-mix(in oklch,var(--primary) 45%,transparent);color:var(--primary);background:color-mix(in oklch,var(--primary) 7%,transparent)}
.chip .g{width:8px;height:8px}
.chip .g-needs::before{width:6px;height:6px;box-shadow:none}

/* avatars */
.av{display:inline-grid;place-items:center;flex:none;width:20px;height:20px;border-radius:6px;background:var(--muted);border:1px solid var(--border);font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--muted-foreground);letter-spacing:0}
.av.av-p{border-radius:50%;color:var(--foreground)}
.av.s16{width:16px;height:16px;font-size:7.5px}
.avs{display:inline-flex}
.avs{gap:2px}
.av.lg{width:28px;height:28px;border-radius:8px;font-size:10px}
.av.lg.av-p{border-radius:50%}
.av.live{border-color:color-mix(in oklch,var(--active) 70%,transparent);box-shadow:0 0 0 2px color-mix(in oklch,var(--active) 22%,transparent);color:var(--active-strong)}

/* timeline items */
.tli{position:relative;padding:8px 10px;margin:0 -10px;border-radius:10px}
.tli+.tli{margin-top:4px}
.tli:hover,.tli:focus-within{background:var(--surface)}
.fk{position:absolute;top:6px;right:8px;z-index:2;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--foreground);font-size:11.5px;font-weight:500;cursor:pointer;opacity:0;box-shadow:0 1px 2px oklch(0 0 0 / .06);transition:opacity .1s var(--ease-snappy)}
.fk .i{width:12px;height:12px;color:var(--primary)}
.fk:hover{border-color:color-mix(in oklch,var(--primary) 50%,var(--border))}
.tli:hover .fk,.tli:focus-within .fk{opacity:1}
.t-human{display:flex;flex-direction:column;align-items:flex-end}
.t-human .fk{right:auto;left:8px}
.t-human .meta{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin:0 2px 4px}
.bubble{max-width:85%;background:var(--muted);border-radius:16px 16px 4px 16px;padding:9px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.t-reply .via{display:flex;align-items:center;gap:6px;margin:5px 2px 0;font-size:11.5px;color:var(--muted-foreground);text-align:right;max-width:85%}
.t-reply .via .mk{width:11px;height:11px;flex:none}
.t-task,.t-ext,.t-appr{display:grid;grid-template-columns:28px minmax(0,1fr);gap:11px}
.bd{min-width:0}
.hd{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font-size:12px;color:var(--muted-foreground);min-height:20px}
.hd b{font-weight:600;color:var(--foreground)}
.tx{margin-top:2px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.stats{margin-top:3px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted-foreground)}
.t-ext .av{background:transparent;border-style:dashed;color:var(--muted-foreground);position:relative}
.t-ext .av .srcb{position:absolute;right:-4px;bottom:-4px;width:14px;height:14px;border-radius:50%;background:var(--background);display:grid;place-items:center;color:var(--muted-foreground)}
.t-ext .av .srcb .mk{width:9px;height:9px}
.t-ext .hd b{color:var(--muted-foreground)}
.t-ext .tx{color:var(--muted-foreground);font-size:13.5px}
.xtag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;border:1px solid var(--border);font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground);background:var(--surface)}
.xtag .mk{width:9px;height:9px}
.t-appr .card,.t-fork .card{border-radius:12px;padding:11px 14px 12px}
.t-appr .card{border:1px solid color-mix(in oklch,var(--primary) 42%,var(--border));background:color-mix(in oklch,var(--primary) 5%,var(--background))}
.t-appr .card.res{border-color:var(--border);background:var(--surface)}
.acts2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.resl{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:500}
.resl .i{width:13px;height:13px}
.resl.approved{color:var(--success-strong)}
.resl.rejected{color:var(--error-strong)}
.t-fork .card{border:1px solid var(--border);background:var(--surface)}
.t-fork .hd .i{width:14px;height:14px;color:var(--primary)}
.t-fork .hd .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--foreground)}
.t-fork p{margin:6px 0 0;font-size:13.5px;line-height:1.55}
.t-fork p.sm{color:var(--muted-foreground)}
.t-fork p.sm b{color:var(--foreground);font-weight:600}
.lnk{display:inline;padding:0;border:0;background:none;font:inherit;color:var(--primary);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in oklch,var(--primary) 40%,transparent)}
.lnk:hover{text-decoration-color:var(--primary)}
.runfoot{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border:1px solid var(--border-subtle);border-radius:10px;font-size:12.5px;color:var(--foreground)}
.runfoot .rm{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.bars{display:inline-flex;gap:3px;align-items:flex-end;height:13px;flex:none}
.bars i{width:3px;height:13px;border-radius:2px;background:var(--active);transform-origin:bottom;animation:bar 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}
.bars i:nth-child(3){animation-delay:.3s}
@keyframes bar{0%,100%{transform:scaleY(.4);opacity:.45}50%{transform:scaleY(1);opacity:.95}}
.shim{background:linear-gradient(90deg,var(--muted-foreground) 0%,var(--foreground) 45%,var(--muted-foreground) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimtext 1.8s linear infinite;font-weight:500}
@keyframes shimtext{0%{background-position:120% 0}100%{background-position:-120% 0}}

/* composer */
.comp{flex:none;padding:6px 16px 14px}
.cbox{max-width:740px;margin:0 auto;border:1px solid var(--border);border-radius:16px;background:var(--card);box-shadow:0 1px 2px oklch(0.141 0.005 285 / .05)}
.cbox:focus-within{border-color:color-mix(in oklch,var(--primary) 40%,var(--border));box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 14%,transparent)}
.cbox textarea{display:block;width:100%;min-height:44px;max-height:160px;resize:none;border:0;background:transparent;padding:12px 14px 2px;font:inherit;font-size:14px;line-height:1.45;color:var(--foreground);outline:none}
.cbox textarea::placeholder{color:var(--muted-foreground)}
.crow{display:flex;align-items:center;gap:8px;padding:2px 8px 8px 13px}
.route{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted-foreground);min-width:0;white-space:nowrap;overflow:hidden}
.route span{overflow:hidden;text-overflow:ellipsis}
.route .rd{width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none}
.route .mk{width:11px;height:11px;flex:none}
.crow .sp{flex:1}
.hint{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.send{height:30px;min-width:30px;border-radius:999px;border:0;background:var(--primary);color:var(--primary-foreground);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
.send.wide{padding:0 13px 0 11px}
.send .i{width:15px;height:15px}
.send .mk{width:12px;height:12px}
.send:hover{filter:brightness(1.06)}
.ro{display:flex;align-items:center;justify-content:center;gap:8px;max-width:740px;margin:0 auto;padding:11px 14px;border:1px dashed var(--border);border-radius:14px;font-size:12.5px;color:var(--muted-foreground)}
.ro .i{width:14px;height:14px}
@container (max-width:560px){.hint{display:none}.phead{padding-left:18px}.tl{padding:6px 18px 18px}}
@container (max-width:470px){.pacts .ib.opt{display:none}}

/* new session tab */
.newwrap{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px}
.newcard{width:100%;max-width:640px}
.newcard .kicker{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);margin:0 0 8px}
.newcard h2{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.015em}
.newcard h2 .hash{color:var(--primary)}
.newcard .sub{margin:0 0 16px;font-size:13.5px;color:var(--muted-foreground);line-height:1.5}
.newcard .comp{padding:0}
.newcard .cbox textarea{min-height:88px}
.gpick{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);font-size:12px;color:var(--foreground);cursor:pointer;white-space:nowrap;max-width:260px}
.gpick span{overflow:hidden;text-overflow:ellipsis}
.gpick .i{width:13px;height:13px;color:var(--muted-foreground)}
.gpick:hover{background:var(--accent)}

/* watermark (empty editor group) */
.wm{flex:1;display:grid;place-items:center;padding:24px;color:var(--muted-foreground)}
.wm-in{text-align:center;max-width:360px}
.wm-in .big{width:44px;height:44px;margin:0 auto 12px;color:var(--border)}
.wm-in p{margin:0 0 14px;font-size:13.5px}
.wm dl{display:grid;grid-template-columns:auto auto;gap:7px 14px;justify-content:center;margin:0;font-size:12px;text-align:left}
.wm dt{text-align:right}
.wm dd{margin:0}

/* drop zone */
.dz{position:absolute;z-index:20;pointer-events:none;display:grid;place-items:center;border:2px dashed color-mix(in oklch,var(--primary) 60%,transparent);background:color-mix(in oklch,var(--primary) 8%,transparent);border-radius:10px;margin:6px}
.dz[hidden]{display:none}
.dz span{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--foreground);box-shadow:var(--shadow)}

/* ============ status bar ============ */
.statusbar{display:flex;align-items:center;gap:2px;padding:0 8px;border-top:1px solid var(--border);background:var(--surface);font-size:11.5px;color:var(--muted-foreground);min-width:0;overflow:hidden}
.sb{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border:0;border-radius:5px;background:none;font-size:11.5px;color:inherit;cursor:pointer;white-space:nowrap}
.sb:hover{background:var(--accent);color:var(--foreground)}
.sb b{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;color:var(--foreground)}
.sb .i{width:13px;height:13px}
.sb .g{width:10px}
.sb .g-run svg{width:11px;height:11px}
.sb .g-unread::before,.sb .g-needs::before{width:6px;height:6px}
.sb.n-needs b{color:var(--primary)}
.sb[aria-pressed="true"]{background:color-mix(in oklch,var(--primary) 14%,transparent);color:var(--primary)}
.sb[aria-pressed="true"] b{color:var(--primary)}
.statusbar .sp{flex:1}
.sbt{display:inline-flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap}
.sbt .i{width:13px;height:13px}
.sbdiv{width:1px;height:12px;background:var(--border);margin:0 4px}

/* ============ palette ============ */
.pal-back{position:fixed;inset:0;z-index:90;background:oklch(0.141 0.005 285 / .26);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
html.dark .pal-back{background:oklch(0 0 0 / .5)}
.pal-back[hidden]{display:none}
.pal{width:min(640px,92vw);background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px oklch(0 0 0 / .06),0 24px 60px -20px oklch(0 0 0 / .4);overflow:hidden;animation:popIn .16s var(--ease-snappy) both}
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
.pal-in{display:flex;align-items:center;gap:9px;padding:0 14px;height:50px;border-bottom:1px solid var(--border)}
.pal-in>.i{width:16px;height:16px;color:var(--muted-foreground)}
.pal-in input{flex:1;min-width:0;height:100%;border:0;background:none;font:inherit;font-size:14.5px;color:var(--foreground);outline:none}
.pal-in input::placeholder{color:var(--muted-foreground)}
.pal-mode{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;background:color-mix(in oklch,var(--primary) 12%,transparent);color:var(--primary);font-size:12px;font-weight:600;white-space:nowrap}
.pal-mode[hidden]{display:none}
.pal-list{max-height:min(430px,58vh);overflow-y:auto;padding:4px 6px 6px}
.pal-sec{padding:9px 10px 4px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.pi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:5px 10px;border:0;border-radius:8px;background:none;font-size:13px;color:var(--foreground);text-align:left;cursor:pointer}
.pi[aria-selected="true"]{background:var(--accent)}
.pi .pic{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--muted-foreground)}
.pi .pic .i{width:15px;height:15px}
.pi .pic .mk{width:13px;height:13px}
.pi .pl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pi .pl b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .pl em{font-style:normal;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi mark{background:none;color:var(--primary);font-weight:700}
.pi .pk{font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.pal-empty{padding:22px 12px;text-align:center;font-size:13px;color:var(--muted-foreground)}
.pal-foot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface);font-size:11.5px;color:var(--muted-foreground)}
.pal-foot .sp{flex:1}
.pal-foot span{display:inline-flex;gap:5px;align-items:center}

/* ============ menu, popovers, toasts, dialog ============ */
.menu{position:fixed;z-index:95;min-width:232px;max-width:320px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px oklch(0 0 0 / .06),0 16px 40px -16px oklch(0 0 0 / .35);transform-origin:top left;animation:menuIn .15s var(--ease-snappy) both}
.menu[hidden]{display:none}
@keyframes menuIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:13px;color:var(--foreground);text-align:left;cursor:pointer}
.mi .i,.mi .mk{width:15px;height:15px;color:var(--muted-foreground)}
.mi .mk{width:13px;height:13px;margin:0 1px}
.mi .ml{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi:hover,.mi:focus{background:var(--accent);outline:none}
.mi[aria-disabled="true"]{opacity:.5;cursor:default}
.mi.danger,.mi.danger .i{color:var(--error-strong)}
.mi.on .ml{font-weight:600}
.msep{height:1px;background:var(--border-subtle);margin:4px 2px}
.mhead{padding:6px 8px 5px;font-size:11.5px;color:var(--muted-foreground);line-height:1.4}
.keys{position:fixed;right:10px;bottom:34px;z-index:94;width:300px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px -16px oklch(0 0 0 / .35);animation:popIn .15s var(--ease-snappy) both}
.keys[hidden]{display:none}
.keys h3{margin:0 0 8px;font-size:13px;font-weight:600}
.keys dl{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:0;font-size:12.5px}
.keys dt{text-align:right}
.keys dd{margin:0;color:var(--foreground)}
.keys p{margin:10px 0 0;font-size:11.5px;color:var(--muted-foreground);line-height:1.45}
.toasts{position:fixed;left:58px;bottom:38px;z-index:96;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:380px;padding:8px 6px 8px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -16px oklch(0 0 0 / .35);font-size:13px;animation:popIn .2s var(--ease-snappy) both}
.toast span{flex:1;min-width:0}
.toast .tb{border:0;background:none;color:var(--primary);font-size:12.5px;font-weight:600;cursor:pointer;padding:5px 8px;border-radius:6px;white-space:nowrap}
.toast .tb:hover{background:color-mix(in oklch,var(--primary) 10%,transparent)}
dialog.confirm{border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--foreground);padding:0;width:min(440px,92vw);box-shadow:0 24px 60px -20px oklch(0 0 0 / .4)}
dialog.confirm[open]{animation:popIn .2s var(--ease-snappy) both}
dialog.confirm::backdrop{background:oklch(0.141 0.005 285 / .3)}
.cf-b{padding:18px 20px 6px}
.cf-b h3{margin:0 0 6px;font-size:15px;font-weight:600}
.cf-b p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted-foreground)}
.cf-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px}

/* ============ legacy replica ============ */
.legacy{grid-column:2/-1;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0;min-width:0;background:var(--background)}
.legacy[hidden]{display:none}
.lg-side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:color-mix(in oklch,var(--card) 40%,var(--background))}
.lg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 6px}
.lg-h h2{margin:0;font-family:var(--font-mono);font-size:11px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.lg-h .ib{width:24px;height:24px}
.lg-h .ib .i{width:14px;height:14px}
.lg-s{display:flex;align-items:center;gap:4px;padding:0 12px 8px}
.lg-s .sw{position:relative;flex:1;min-width:0}
.lg-s .sw .i{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted-foreground)}
.lg-s input{width:100%;height:32px;padding:0 8px 0 28px;border:1px solid transparent;border-radius:8px;background:color-mix(in oklch,var(--muted) 40%,transparent);font:inherit;font-size:12px;color:var(--foreground);outline:none}
.lg-s input:focus{background:var(--card);border-color:var(--border)}
.lg-s .ib{width:32px;height:32px}
.lg-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 12px}
.lg-list ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lg-sec{padding:8px 4px 6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.lg-row{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer;color:var(--foreground);min-width:0}
.lg-row:hover{background:color-mix(in oklch,var(--muted) 50%,transparent)}
.lg-row.on{background:var(--muted)}
.lg-dot{margin-top:6px;width:6px;height:6px;border-radius:50%;flex:none;background:color-mix(in oklch,var(--muted-foreground) 30%,transparent)}
.lg-row:hover .lg-dot{background:color-mix(in oklch,var(--muted-foreground) 60%,transparent)}
.lg-dot.run{background:var(--primary);animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
.lg-dot.fail{background:var(--error)}
.lg-row.on .lg-dot:not(.run):not(.fail){background:color-mix(in oklch,var(--primary) 70%,transparent)}
@keyframes pulse{50%{opacity:.5}}
.lg-row .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.lg-row .t b{font-weight:400;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-row.on .t b{font-weight:500}
.lg-row .t em{font-style:normal;font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.lg-head{display:flex;flex-direction:column;gap:4px;padding:16px 24px 12px;border-bottom:1px solid var(--border)}
.lg-head .r1{display:flex;align-items:center;gap:12px}
.lg-head h1{margin:0;font-size:20px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg-head .pen{opacity:0;border:0;background:none;color:var(--muted-foreground);cursor:pointer;padding:2px;flex:none}
.lg-head:hover .pen{opacity:1}
.lg-head .pen .i{width:14px;height:14px}
.lg-head .r1 .sp{flex:1}
.lg-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12px;color:var(--muted-foreground)}
.lg-meta .eye{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.lg-meta .eye .i{width:12px;height:12px}
.lg-tl{flex:1;min-height:0;overflow-y:auto;padding:24px}
.lg-tl .in{max-width:768px;margin:0 auto}
.lg-u{display:flex;justify-content:flex-end;padding:0 0 12px 40px}
.lg-u .w{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:85%}
.lg-u .m{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);padding:0 4px}
.lg-u .b{border-radius:16px 4px 16px 16px;background:var(--muted);padding:10px 16px;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.lg-t{display:flex;gap:12px;padding-bottom:24px}
.lg-t .avc{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--muted);font-size:11px;font-weight:600;color:var(--foreground);margin-top:2px}
.lg-t .avc.run{box-shadow:0 0 0 2px color-mix(in oklch,var(--primary) 40%,transparent);animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
.lg-t .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lg-t .h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px}
.lg-t .h b{font-weight:500}
.lg-t .h span{color:var(--muted-foreground)}
.lg-t .x{font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.lg-comp{padding:8px 16px 16px}
.lg-comp .cbox{max-width:768px}
.lg-hero{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.lg-hero .in{display:flex;flex-direction:column;align-items:center;gap:24px;max-width:576px;width:100%;text-align:center}
.lg-hero h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
.lg-hero p{margin:0;font-size:14px;color:var(--muted-foreground)}
.lg-hero .cbox{width:100%;text-align:left}

/* ============ narrow fallback ============ */
@media (max-width:1023px){
  .work{grid-template-columns:minmax(0,1fr)}
  #app.is-legacy .work{grid-template-columns:minmax(0,1fr)}
  .actbar,.sash{display:none}
  .explorer{position:fixed;top:44px;bottom:26px;left:0;width:min(340px,88vw);z-index:60;transform:translateX(-102%);transition:transform .25s var(--ease-swift);box-shadow:var(--shadow)}
  #app.xopen .explorer{transform:none;transition-duration:.4s}
  .egroup+.egroup{display:none}
  .appbar .kick{display:none}
  .xtoggle{display:inline-grid}
  .ktrigger{width:auto}
  .ktrigger .lbl{display:none}
  .legacy{grid-column:1/-1;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .lg-side{max-height:36vh;border-right:0;border-bottom:1px solid var(--border)}
  .sbt.opt{display:none}
}
@media (prefers-reduced-motion: reduce){
  .g-run svg,.bars i,.shim,.lg-dot.run,.lg-t .avc.run{animation:none}
  .shim{color:var(--foreground);background:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="appbar">
    <div class="ab-l">
      <button class="ib xtoggle" id="xToggle" aria-label="Show the sessions explorer" title="Sessions explorer"></button>
      <span class="pg">Sessions</span>
      <span class="kick">Mockup B · Editor workspace</span>
    </div>
    <button class="ktrigger" id="kTrigger" aria-label="Open the command palette" aria-keyshortcuts="Meta+K">
      <span id="kIcon"></span><span class="lbl">Search sessions, groups, and actions</span><kbd aria-hidden="true">⌘K</kbd>
    </button>
    <div class="ab-r">
      <button class="btn sm ghost" id="legacyBtn"></button>
      <button class="ib" id="themeBtn" aria-label="Toggle theme" title="Toggle theme"></button>
    </div>
  </header>

  <div class="work" id="work">
    <nav class="actbar" aria-label="Dashboard" id="actbar"></nav>

    <aside class="explorer" id="explorer" aria-label="Sessions explorer">
      <div class="xhead">
        <h2 id="xTitle">Sessions</h2>
        <button class="ib" data-act="x-new" id="xNew" aria-label="New session" title="New session in the focused group"></button>
        <button class="ib" data-act="x-group" id="xGroup" aria-label="New group" title="New group"></button>
        <button class="ib" data-act="x-collapse" id="xCollapse" aria-label="Collapse all" title="Collapse all"></button>
        <button class="ib" data-act="x-more" id="xMore" aria-label="More explorer actions" title="More"></button>
      </div>
      <div class="xchips" id="xchips" role="group" aria-label="Sources"></div>
      <div id="xnotes"></div>
      <div class="tree" id="tree" role="tree" tabindex="0" aria-label="Sessions" aria-multiselectable="true"></div>
      <div class="bulk" id="bulk" hidden></div>
      <div class="sash" id="sash" role="separator" aria-orientation="vertical" aria-label="Resize the explorer" title="Drag to resize. Double-click to reset."></div>
    </aside>

    <main class="editor" id="editor" aria-label="Open sessions"></main>
    <section class="legacy" id="legacy" aria-label="Legacy Sessions" hidden></section>
  </div>

  <footer class="statusbar" id="statusbar" aria-label="Status"></footer>
</div>

<div class="pal-back" id="palBack" hidden>
  <div class="pal" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="pal-in">
      <span id="palIcon"></span>
      <span class="pal-mode" id="palMode" hidden></span>
      <input id="palInput" role="combobox" aria-expanded="true" aria-controls="palList" aria-autocomplete="list" autocomplete="off" spellcheck="false" />
    </div>
    <div class="pal-list" id="palList" role="listbox" aria-label="Results"></div>
    <div class="pal-foot" id="palFoot"></div>
  </div>
</div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="keys" id="keys" role="dialog" aria-label="Keyboard shortcuts" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog class="confirm" id="confirm" aria-labelledby="cfTitle">
  <div class="cf-b"><h3 id="cfTitle"></h3><p id="cfBody"></p></div>
  <div class="cf-f"><button class="btn sm" id="cfCancel">Cancel</button><button class="btn sm danger" id="cfOk"></button></div>
</dialog>

  S.flash.add(sid);
  render();
  if (!visible) flashRow(rowIdOf(sid));
  setTimeout(() => { S.flash.delete(sid); }, 1600);
  toast(`“${shorten(s.title, 40)}” finished.`, visible ? null : { label: "Open", run: () => openSession(sid) });
}

/* ---------- init from the URL ---------- */
(function init() {
  const q = new URLSearchParams(location.search);
  if (q.get("theme") === "dark") document.documentElement.classList.add("dark");
  (q.get("chips") || "").split(",").map((x) => x.trim().toLowerCase()).filter(Boolean).forEach((x) => {
    const off = x.startsWith("-"), k = x.replace(/^-/, "");
    if (k in S.chips) S.chips[k] = !off;
  });
  const has = (sid) => sid && findS(sid);
  const def = ["s1", "s3", "s4"];
  let open = has(q.get("open")) ? q.get("open") : "s1";
  const tabs = def.includes(open) ? def : [open, ...def.slice(1)];
  S.groups[0].tabs = tabs.map((sid) => mkTab({ type: "session", sid }));
  S.groups[0].active = S.groups[0].tabs[tabs.indexOf(open)];
  const sp = q.get("split");
  if (has(sp)) { const id = mkTab({ type: "session", sid: sp }); S.groups.push({ tabs: [id], active: id }); }
  [open, sp].forEach((sid) => { if (has(sid)) { const c = findS(sid).c; S.chips[visClass(c)] = true; placement(c.key).forEach((n) => S.folds.delete("g:" + n.id)); } });
  S.focus = rowIdOf(open);
  if (q.get("legacy") === "1") { S.legacy = true; $("#app").classList.add("is-legacy"); $("#legacy").hidden = false; S.legacyOpen = legacyList().some((x) => x.s.id === open) ? open : null; }
  applyThemeIcon();
  renderLegacyBtn();
  render();
  S.convs.forEach((c) => c.sessions.forEach((s) => { if (s.finishesInSeconds) setTimeout(() => finishSession(s.id), s.finishesInSeconds * 1000); }));
})();
})();
</script>
