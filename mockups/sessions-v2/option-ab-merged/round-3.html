<!doctype html>
<!--
  Round 3, "A+B merged": A's mail-triage sidebar and two-line session list, with B's editor-style session tabs, one split, and a status bar whose live counts double as quick filters. A new session opens as its own tab with a "Start in" picker, and every group row in the sidebar has a "+" that opens it with that group picked.
  Triage stays one keystroke away while several sessions stay open, and a split folds the list to a thin rail so both panes keep a readable width. Starting a session costs one more step than a composer at the top of the list, but the list stays quiet and the composer gets the whole pane.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Swarm · Sessions · A+B merged</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../session-logs/demo-shared.css" />
<style>
/* ============ local tokens ============ */
:root{
  --hover: oklch(0.943 0.003 286.375);
  --border-subtle: oklch(0.945 0.003 286);
  --on-primary: oklch(0.985 0 0);
  --tree-w: 240px;
  --list-w: 360px;
  --rail-w: 44px;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --ov: oklch(0.141 0.005 285.823 / 0.28);
}
html.dark{
  --hover: oklch(0.274 0.006 286.033);
  --border-subtle: oklch(1 0 0 / 8%);
  --on-primary: oklch(0.21 0.006 285.885);
  --ov: oklch(0 0 0 / 0.5);
}
html.dark .btn.primary{color:var(--on-primary)}
html,body{height:100%;overflow:hidden}
body{font-size:14px}
button{font-family:inherit;color:inherit}
kbd{font-family:var(--font-mono);font-size:11px;line-height:1;padding:3px 5px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--muted-foreground);white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:15px;height:15px;flex:none}
.smk{width:13px;height:13px;flex:none;display:inline-block;vertical-align:-2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.btn.sm{height:28px;padding:0 10px;font-size:12px;gap:6px}
.btn.sm svg{width:13px;height:13px}
.btn.danger{color:var(--error-strong);border-color:color-mix(in oklch,var(--error) 35%,var(--border))}
.btn.danger:hover{background:color-mix(in oklch,var(--error) 10%,transparent)}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:none;border-radius:7px;color:var(--muted-foreground);cursor:pointer;flex:none;transition:background .15s var(--ease),color .15s var(--ease)}
.ib:hover{background:var(--hover);color:var(--foreground);transition-duration:0s}
.ib:focus-visible,.btn:focus-visible,.tab:focus-visible,.lnk:focus-visible,.sb:focus-visible,.srcsec:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.ib svg{width:15px;height:15px}
.lnk{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;font-size:12.5px;font-weight:500;color:var(--primary);cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}

/* ============ app shell ============ */
#app{height:100dvh;display:grid;grid-template-rows:46px minmax(0,1fr) 28px;min-width:0}
#app.is-legacy{grid-template-rows:46px minmax(0,1fr)}
.hdr{display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;border-bottom:1px solid var(--border);background:var(--background);min-width:0}
.hdr .mark{width:20px;height:20px;flex:none;color:var(--foreground)}
.hdr .crumb{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.hdr .kick{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);border-left:1px solid var(--border);padding-left:10px;white-space:nowrap}
.hdr .sp{flex:1}
.kbtn{display:flex;align-items:center;gap:8px;height:30px;width:280px;max-width:32vw;padding:0 6px 0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted-foreground);font-size:12.5px;cursor:pointer;min-width:0}
.kbtn:hover{border-color:color-mix(in oklch,var(--muted-foreground) 40%,var(--border))}
.kbtn span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .lnk{color:var(--muted-foreground);font-size:12.5px;padding:0 6px;height:30px}
.hdr .lnk:hover{color:var(--foreground)}

.shell{min-height:0;min-width:0;display:grid;grid-template-columns:var(--tree-w) var(--list-w) minmax(0,1fr)}
.shell.lc{grid-template-columns:var(--tree-w) var(--rail-w) minmax(0,1fr)}
#tree{min-height:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border)}
#mid{min-height:0;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--background)}
#right{min-height:0;min-width:0;display:flex;position:relative;background:var(--background)}
.is-legacy .shell,.is-legacy .statusbar{display:none}
#legacy{display:none}
.is-legacy #legacy{display:grid}

/* ============ pane 1: sidebar ============ */
.tscroll{flex:1;min-height:0;overflow-y:auto;padding:6px 0 14px;overscroll-behavior:contain}
.tscroll::-webkit-scrollbar{width:8px}
.tscroll::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 25%,transparent);border-radius:9px}
.lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.tsec{display:flex;align-items:center;gap:6px;padding:14px 14px 4px 16px}
.tsec .lab{flex:1}
.tsec .ib{width:22px;height:22px;border-radius:6px}
.tsec .ib svg{width:13px;height:13px}
.tdiv{height:1px;margin:10px 14px 6px;background:var(--border-subtle)}
.srcsec{display:flex;align-items:center;gap:6px;width:calc(100% - 12px);height:28px;margin:8px 6px 2px;padding:0 8px 0 7px;border:0;border-radius:6px;background:none;color:var(--muted-foreground);cursor:pointer;text-align:left;transition:background .2s var(--ease) .05s}
.srcsec:hover{background:var(--hover);transition:none}
.srcsec .chv{width:13px;height:13px;flex:none;transition:transform .15s var(--ease)}
.srcsec[aria-expanded="true"] .chv{transform:rotate(90deg)}
.srcsec .smk{width:12px;height:12px;color:var(--foreground)}
.srcsec .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcsec .lk{width:12px;height:12px;flex:none}
.tr{position:relative;display:flex;align-items:center;gap:6px;height:28px;margin:0 6px;padding:0 6px 0 calc(6px + var(--lv,0) * 14px);border-radius:6px;font-size:13px;color:var(--foreground);cursor:pointer;user-select:none;transition:background .2s var(--ease) .05s}
.tr:hover{background:var(--hover);transition:none}
.tr.on{background:var(--hover);font-weight:600}
.tr.on::before{content:"";position:absolute;left:-6px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--primary)}
.tr .tic,.tr .tchev{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--muted-foreground)}
.tr .tchev{border:0;background:none;padding:0;border-radius:4px;cursor:pointer}
.tr .tchev:hover{color:var(--foreground);background:color-mix(in oklch,var(--muted-foreground) 14%,transparent)}
.tr .tchev svg{width:13px;height:13px;transition:transform .15s var(--ease)}
.tr .tchev.open svg{transform:rotate(90deg)}
.tr .tic svg{width:14px;height:14px}
.tr .tic .smk{width:13px;height:13px}
.tlbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlbl .smk{margin-right:6px;vertical-align:-2px}
.tlbl .ownav{display:inline-grid;margin-right:6px;vertical-align:-3px}
/* row actions: "..." group menu and "+" new session. Shown on hover and on keyboard focus. */
.tr .tacts{position:absolute;right:3px;top:3px;display:flex;gap:1px;padding-left:4px;border-radius:5px;background:var(--hover);opacity:0;pointer-events:none}
.tr:hover .tacts,.tr:focus-within .tacts{opacity:1;pointer-events:auto}
.tr.has-acts:hover .cns,.tr.has-acts:focus-within .cns{visibility:hidden}
.tbtn{width:22px;height:22px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:none;color:var(--muted-foreground);cursor:pointer}
.tbtn svg{width:14px;height:14px}
.tbtn:hover{color:var(--foreground);background:color-mix(in oklch,var(--muted-foreground) 18%,var(--hover))}
.tbtn:focus-visible{outline:2px solid var(--ring);outline-offset:-1px}
.tbtn[data-act="gnew"]{color:var(--foreground)}
.tr .num{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.tinp{flex:1;min-width:0;height:22px;padding:0 6px;border:1px solid var(--ring);border-radius:5px;background:var(--background);color:var(--foreground);font:inherit;font-size:12.5px;font-weight:500;outline:none;box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 35%,transparent)}
.dragging .tr[data-drop="1"]::after{content:"";position:absolute;inset:1px;border:1px dashed color-mix(in oklch,var(--primary) 55%,transparent);border-radius:6px;pointer-events:none}
.tr.dz-hot{background:color-mix(in oklch,var(--primary) 12%,transparent)}
.tr.dz-hot::after{border-style:solid !important;border-color:var(--primary) !important}

/* counts + glyphs */
.cns{margin-left:auto;display:inline-flex;align-items:center;gap:7px;flex:none}
.cn{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.cn i{display:block;width:6px;height:6px;border-radius:50%}
.cn.needs{color:var(--active-strong);font-weight:700}
.cn.needs i{background:var(--primary)}
.cn.unread i{background:var(--neutral)}
.cn.run i{width:8px;height:8px;background:none;border:1.5px solid color-mix(in oklch,var(--primary) 25%,transparent);border-top-color:var(--primary);border-right-color:var(--primary)}
.gly{position:relative;width:14px;height:14px;flex:none;display:grid;place-items:center}
.gly.run::before{content:"";position:absolute;inset:1px;border-radius:50%;border:1.6px solid color-mix(in oklch,var(--primary) 22%,transparent);border-top-color:var(--primary);border-right-color:var(--primary);animation:spin 1.1s linear infinite}
.gd{display:block;width:7px;height:7px;border-radius:50%}
.gd.needs{width:8px;height:8px;background:var(--primary);box-shadow:0 0 0 2.5px color-mix(in oklch,var(--primary) 24%,transparent)}
.gd.unread{background:var(--neutral)}
.gly.run .gd{width:5px;height:5px;box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lit{0%{background-color:color-mix(in oklch,var(--primary) 22%,transparent)}100%{background-color:transparent}}

/* ============ pane 2: list ============ */
#midhead{flex:none;position:relative;border-bottom:1px solid var(--border)}
.mh{padding:11px 10px 0 14px}
.mh1{display:flex;align-items:center;gap:6px;min-height:28px}
.mh1 .gi{color:var(--muted-foreground);display:grid;place-items:center;width:18px;flex:none}
.mh1 .gi svg{width:16px;height:16px}
.mh1 .gi .smk{width:15px;height:15px}
.mh1 h2{margin:0 0 0 2px;font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh2{display:flex;align-items:center;gap:8px;margin:2px 0 0 26px;font-size:12px;color:var(--muted-foreground);min-width:0}
.mh2 .sub{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rotag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--border);font-size:11px;font-weight:500;color:var(--muted-foreground);white-space:nowrap;flex:none}
.rotag svg{width:12px;height:12px}
.ronote{display:flex;align-items:flex-start;gap:9px;margin:10px 4px 12px 0;padding:9px 11px;border-radius:9px;background:var(--surface);border:1px dashed var(--border);font-size:12px;line-height:1.45;color:var(--muted-foreground)}
.ronote svg{width:14px;height:14px;flex:none;margin-top:1px}
.ronote b{color:var(--foreground);font-weight:600}
.ronote kbd{padding:1px 4px}
.qnote{display:flex;align-items:center;gap:8px;margin:0 4px 10px 0;height:32px;padding:0 4px 0 10px;border-radius:8px;border:1px solid color-mix(in oklch,var(--primary) 40%,var(--border));background:color-mix(in oklch,var(--primary) 6%,var(--background));font-size:12.5px}
.qnote svg{width:13px;height:13px;color:var(--primary)}
.qnote span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-pad{height:12px}
.gselect{display:none}

.bulk{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:6px;height:58px;padding:0 8px 0 14px;background:color-mix(in oklch,var(--primary) 7%,var(--background));border-bottom:1px solid color-mix(in oklch,var(--primary) 30%,var(--border))}
.bulk .cnt{font-size:12.5px;font-weight:600;margin-right:auto;white-space:nowrap}
.bulk .btn kbd{padding:2px 4px;font-size:11px}

#list{flex:1;min-height:0;overflow-y:auto;outline:none;position:relative;overscroll-behavior:contain}
#list::-webkit-scrollbar{width:8px}
#list::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 25%,transparent);border-radius:9px}
.sec{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;height:28px;padding:0 12px 0 14px;background:var(--background);border-bottom:1px solid var(--border-subtle)}
.sec .lab{flex:1}
.sec .mono{font-size:11px;color:var(--muted-foreground)}
.row{position:relative;display:flex;align-items:flex-start;gap:7px;padding:8px 10px 8px 8px;border-bottom:1px solid var(--border-subtle);cursor:pointer;user-select:none;transition:background .2s var(--ease) .05s}
.row:hover{background:color-mix(in oklch,var(--hover) 65%,transparent);transition:none}
.row .ck{width:16px;height:16px;flex:none;margin-top:1px;border-radius:4px;border:1.5px solid color-mix(in oklch,var(--muted-foreground) 50%,transparent);display:grid;place-items:center;opacity:0;cursor:pointer;background:var(--background)}
.row .ck svg{width:10px;height:10px;stroke-width:3.4;opacity:0}
.row:hover .ck,.selmode .row .ck,.lf .row.focus .ck{opacity:1}
.row.sel .ck{background:var(--primary);border-color:var(--primary);color:var(--on-primary);opacity:1}
.row.sel .ck svg{opacity:1}
.row .gly{margin-top:2px}
.rm{flex:1;min-width:0}
.l1{display:flex;align-items:center;gap:6px;min-width:0;height:18px}
.ttl{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--foreground)}
.row.news .ttl{font-weight:600}
.row.quiet .ttl{color:var(--muted-foreground)}
.l1 .grow{flex:1;min-width:6px}
.tm{flex:none;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.row.news .tm{color:var(--foreground)}
.l2{margin-top:2px;font-size:12px;line-height:17px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2 b{font-weight:600;color:var(--foreground)}
.l2 .needs{color:var(--active-strong);font-weight:600}
.l2 .fail{color:var(--error-strong);font-weight:600}
.gtag{flex:none;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcm{display:inline-grid;place-items:center;flex:none;width:18px;height:18px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--foreground)}
.srcm .smk{width:11px;height:11px}
.ownav{width:17px;height:17px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:8.5px;font-weight:700;letter-spacing:.02em;background:var(--muted);border:1px solid var(--border);color:var(--foreground)}
.row .rmenu{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--muted-foreground);display:none;place-items:center;cursor:pointer}
.row .rmenu svg{width:14px;height:14px}
.row:hover .rmenu{display:grid}
.row .rmenu:hover{color:var(--foreground)}
.row.open{background:var(--hover)}
.row.sel{background:color-mix(in oklch,var(--primary) 8%,var(--background))}
.row.sel.open{background:color-mix(in oklch,var(--primary) 12%,var(--hover))}
.lf .row.focus{box-shadow:inset 2px 0 0 var(--ring),inset 0 0 0 1px color-mix(in oklch,var(--ring) 28%,transparent)}
.row.flash{animation:lit 1.5s var(--ease)}
/* nested thread group (2+ root sessions in one Slack thread) */
.row.thr{background:var(--surface)}
.row.thr .tchev{margin-top:1px}
.row.thr .tchev{width:16px;height:16px;flex:none;display:grid;place-items:center;border:0;padding:0;border-radius:4px;background:none;color:var(--muted-foreground);cursor:pointer}
.row.thr .tchev:hover{color:var(--foreground);background:color-mix(in oklch,var(--muted-foreground) 14%,transparent)}
.row.thr .tchev svg{width:13px;height:13px;transition:transform .15s var(--ease)}
.row.thr .tchev.open svg{transform:rotate(90deg)}
.row.thr .ttl{font-weight:600;color:var(--foreground)}
.row.thr.quiet .ttl{color:var(--foreground)}
.row.child{padding-left:32px}
.row.child::before{content:"";position:absolute;left:24px;top:0;bottom:0;border-left:1px solid var(--border)}
.row.child.lastc::before{bottom:auto;height:17px}
.row.child::after{content:"";position:absolute;left:24px;top:17px;width:5px;border-top:1px solid var(--border)}
.empty{padding:40px 24px;text-align:center;color:var(--muted-foreground);font-size:13px;line-height:1.5}
.empty b{display:block;color:var(--foreground);font-size:14px;margin-bottom:4px}

#midfoot{flex:none;border-top:1px solid var(--border);background:var(--surface)}
.nextup{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px 0 14px;border:0;border-bottom:1px solid var(--border-subtle);background:none;font-size:12.5px;cursor:pointer;text-align:left;min-width:0}
.nextup:hover{background:var(--hover)}
.nextup .lab{flex:none}
.nextup .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.nextup.zero{cursor:default;color:var(--muted-foreground)}
.nextup.zero:hover{background:none}
.legend{display:flex;align-items:center;gap:10px;height:30px;padding:0 14px;font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend kbd{padding:2px 4px;font-size:11px}

/* collapsed list rail */
#midrail{display:none;flex:1;min-height:0;flex-direction:column;align-items:center;gap:8px;padding:8px 0 10px;background:var(--surface)}
.shell.lc #midhead,.shell.lc #list,.shell.lc #midfoot{display:none}
.shell.lc #midrail{display:flex}
#midrail .ib{width:32px;height:32px;border:1px solid var(--border);background:var(--background)}
#midrail .ib:hover{border-color:color-mix(in oklch,var(--muted-foreground) 45%,var(--border))}
#midrail .rc .cns{flex-direction:column;align-items:center;gap:8px;margin:4px 0 0}
.vlab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:8px;padding:8px 0;border:0;background:none;font-size:12.5px;font-weight:600;color:var(--muted-foreground);cursor:pointer;white-space:nowrap;overflow:hidden;max-height:60vh}
.vlab:hover{color:var(--foreground)}

/* ============ pane 3: editor (tabs + split) ============ */
.egroup{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.egroup+.egroup{border-left:1px solid var(--border)}
.tabs{flex:none;display:flex;align-items:stretch;height:38px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.tstrip{display:flex;align-items:stretch;flex:1;min-width:0}
.tablist{display:flex;align-items:stretch;flex:0 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabnew{align-self:center;margin:0 2px 0 4px;width:26px;height:26px}
.tabnew svg{width:14px;height:14px}
.tablist::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:7px;flex:0 1 auto;min-width:104px;max-width:224px;height:38px;padding:0 5px 0 11px;border-right:1px solid var(--border-subtle);color:var(--muted-foreground);font-size:12.5px;cursor:pointer;user-select:none;background:transparent;outline-offset:-2px;transition:background .2s var(--ease) .05s}
.tab:hover{color:var(--foreground);background:color-mix(in oklch,var(--hover) 70%,transparent);transition:none}
.tab.on{background:var(--background);color:var(--foreground)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--background)}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--border)}
.egroup.focused .tab.on::before{background:var(--primary)}
.tab .tic{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--muted-foreground)}
.tab .tic svg{width:13px;height:13px}
.tab.on .tic{color:var(--foreground)}
.tab .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.unread .tt{font-weight:600;color:var(--foreground)}
.tab .slot{position:relative;width:20px;height:20px;flex:none;display:grid;place-items:center}
.tab .slot .x{position:absolute;inset:0;display:grid;place-items:center;border:0;padding:0;border-radius:5px;background:none;color:var(--muted-foreground);cursor:pointer;opacity:0}
.tab .slot .x svg{width:12px;height:12px}
.tab .slot .x:hover{background:color-mix(in oklch,var(--muted-foreground) 18%,transparent);color:var(--foreground)}
.tab.on .slot .x,.tab:hover .slot .x,.tab .slot .x:focus-visible{opacity:1}
.tab.has-g:not(:hover):not(:focus-within) .slot .x{opacity:0}
.tab.has-g:hover .slot .gly,.tab.has-g:focus-within .slot .gly{opacity:0}
.tab.ins-b{box-shadow:inset 2px 0 0 var(--primary)}
.tab.ins-a{box-shadow:inset -2px 0 0 var(--primary)}
.tab.dragsrc{opacity:.5}
.tab.flash{animation:lit 1.5s var(--ease)}
.tabhint{align-self:center;padding:0 12px;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabacts{display:flex;align-items:center;gap:1px;padding:0 6px;flex:none;border-left:1px solid var(--border-subtle)}
.tabacts .ib{width:26px;height:26px}
.tabacts .ib svg{width:14px;height:14px}

.pane{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.dh{position:relative;flex:none;padding:12px 16px 10px 20px;border-bottom:1px solid var(--border)}
.dh1{display:flex;align-items:center;gap:6px;min-height:28px;min-width:0}
.dcrumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);text-align:left}
.dcrumb svg{width:12px;height:12px}
.dcrumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcrumb:hover span{color:var(--foreground);text-decoration:underline;text-underline-offset:3px}
.dacts{display:flex;align-items:center;gap:1px;flex:none}
.back{display:none}
.dtitle{margin:4px 0 0;font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.015em;overflow-wrap:anywhere}
.dmeta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:7px;font-size:12px;color:var(--muted-foreground)}
.dmeta .mono{font-size:11.5px}
.dmeta .lnk{font-size:12px}
.dmeta .lnk svg{width:12px;height:12px}
.avs{display:inline-flex;gap:3px}
.av{width:20px;height:20px;flex:none;display:grid;place-items:center;font-size:8.5px;font-weight:700;letter-spacing:.02em;border:1px solid var(--border);background:var(--muted);color:var(--foreground)}
.av.ag{border-radius:6px}
.av.pp{border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--border);color:var(--muted-foreground);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{border-color:color-mix(in oklch,var(--success) 38%,transparent);color:var(--success-strong)}
.chip.run{border-color:color-mix(in oklch,var(--active) 45%,transparent);color:var(--active-strong)}
.chip.err{border-color:color-mix(in oklch,var(--error) 38%,transparent);color:var(--error-strong)}
.chip.pause{border-color:color-mix(in oklch,var(--paused) 38%,transparent);color:var(--paused-strong)}
.chip.ext{border-style:dashed}
.chip.needs{border-color:color-mix(in oklch,var(--primary) 55%,transparent);color:var(--active-strong);background:color-mix(in oklch,var(--primary) 9%,transparent)}
.ownr{display:inline-flex;align-items:center;gap:6px}
.ownr .av{width:18px;height:18px}

.tls{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.tls::-webkit-scrollbar{width:9px}
.tls::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 25%,transparent);border-radius:9px}
.tl{max-width:760px;margin:0 auto;padding:22px 24px 28px;display:flex;flex-direction:column;gap:18px}
.ti{position:relative;min-width:0}
.ti-me{display:flex;justify-content:flex-end;padding-left:48px}
.mew{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:85%;min-width:0}
.tmeta{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);padding:0 2px}
.bub{padding:9px 14px;border-radius:16px 4px 16px 16px;background:var(--muted);font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.via{display:flex;align-items:flex-start;gap:6px;max-width:100%;font-size:11.5px;line-height:1.4;color:var(--muted-foreground);text-align:right}
.via .smk{margin-top:1px}
.ti-task,.ti-ext{display:flex;gap:11px}
.ti .av{width:24px;height:24px;font-size:9px;margin-top:-1px}
.tb{flex:1;min-width:0}
.th{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;font-size:12px;color:var(--muted-foreground);min-height:20px}
.th b{font-weight:600;color:var(--foreground)}
.txt{margin-top:3px;font-size:14px;line-height:1.55;color:var(--foreground);overflow-wrap:anywhere}
.wk{display:inline-flex;align-items:center;gap:7px;margin-top:7px;font-size:12.5px;font-weight:500}
.wk .pip{width:7px;height:7px;border-radius:50%;background:var(--primary);position:relative;flex:none}
.wk .pip::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--primary);opacity:.5;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
.shim{background:linear-gradient(90deg,var(--muted-foreground) 0%,var(--foreground) 45%,var(--muted-foreground) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.8s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.ti-ext .ebox{flex:1;min-width:0;padding:9px 12px 10px;border-radius:10px;border:1px dashed color-mix(in oklch,var(--muted-foreground) 32%,transparent);background:var(--surface)}
.ti-ext .txt{color:var(--muted-foreground);font-size:13.5px}
.ti-ext .th b{color:var(--muted-foreground)}
.av.ext{border-style:dashed;background:var(--surface);color:var(--muted-foreground)}
.av.ext .smk{width:12px;height:12px}
.ask{flex:1;min-width:0;padding:11px 14px 13px;border-radius:10px;border:1px solid color-mix(in oklch,var(--primary) 45%,var(--border));background:color-mix(in oklch,var(--primary) 5%,var(--background))}
.ask .txt{font-weight:500}
.askb{display:flex;gap:8px;margin-top:11px}
.ask.done{border-color:var(--border);background:var(--surface)}
.ask.done .txt{font-weight:400;color:var(--muted-foreground)}
.tnote{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-foreground);padding-left:35px}
.tnote svg{width:13px;height:13px;color:var(--success-strong)}

.cmp{flex:none;padding:10px 16px 14px 20px}
.cmpb{max-width:760px;margin:0 auto;border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .04);transition:border-color .12s,box-shadow .12s}
.cmpb:focus-within{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 32%,transparent)}
.cmpto{display:flex;align-items:center;gap:7px;padding:8px 12px 0;font-size:11.5px;color:var(--muted-foreground);line-height:1.35}
.cmpb textarea{display:block;width:100%;resize:none;border:0;outline:0;background:none;padding:10px 12px 4px;font:inherit;font-size:14px;line-height:1.5;color:var(--foreground);min-height:44px;max-height:140px}
.cmpb textarea::placeholder{color:var(--muted-foreground)}
.cmpf{display:flex;align-items:center;gap:8px;padding:4px 6px 6px 12px;font-size:11px;color:var(--muted-foreground)}
.cmpf .sp{flex:1}
#right.two .cmpf .kh{display:none}
/* new-session tab: empty state with the composer in the middle of the pane */
.pane.nt{position:relative}
.pane.nt>.back{position:absolute;top:10px;left:10px;z-index:1}
.nsw{flex:1;min-height:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:24px 24px 22vh}
.nsbox{width:100%;max-width:640px;min-width:0}
.nsh{margin:0;font-size:20px;line-height:1.4;font-weight:600;letter-spacing:-.015em;text-align:center}
.nss{margin:4px 0 18px;font-size:13px;line-height:1.5;color:var(--muted-foreground);text-align:center}
.cmpb.ns textarea{padding:14px 14px 6px}
.cmpb.ns .cmpf{gap:6px;padding:6px 8px 8px 10px}
.silab{font-size:12px;color:var(--muted-foreground);white-space:nowrap}
.sipick{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:280px;height:28px;padding:0 6px 0 8px;border:1px solid var(--border);border-radius:7px;background:var(--background);font-size:12.5px;color:var(--foreground);cursor:pointer;transition:background .2s var(--ease) .05s}
.sipick:hover{background:var(--hover);transition:none}
.sipick[aria-expanded="true"]{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 30%,transparent)}
.sipick:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.sipick svg{width:13px;height:13px;color:var(--muted-foreground)}
.spath{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spath .par,.po .par{color:var(--muted-foreground)}
.cmpro{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--muted-foreground)}
.cmpro svg{width:13px;height:13px}
.nopane{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted-foreground);font-size:13px;padding:24px}
.nopane b{display:block;color:var(--foreground);font-size:15px;margin-bottom:6px}

/* drop zone over the editor */
.dz{position:absolute;z-index:20;pointer-events:none;display:grid;place-items:center;border:2px dashed color-mix(in oklch,var(--primary) 60%,transparent);background:color-mix(in oklch,var(--primary) 8%,transparent);border-radius:10px;margin:6px}
.dz[hidden]{display:none}
.dz span{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--foreground);box-shadow:0 1px 2px oklch(0 0 0 / .06)}

/* ============ status bar ============ */
.statusbar{display:flex;align-items:center;gap:2px;padding:0 8px;border-top:1px solid var(--border);background:var(--surface);font-size:11.5px;color:var(--muted-foreground);min-width:0;overflow:hidden}
.sb{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border:0;border-radius:5px;background:none;font-size:11.5px;color:inherit;cursor:pointer;white-space:nowrap}
.sb:hover{background:var(--hover);color:var(--foreground)}
.sb b{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;color:var(--foreground)}
.sb svg{width:13px;height:13px}
.sb .gly{width:12px;height:12px}
.sb .gd{width:6px;height:6px}
.sb .gd.needs{box-shadow:0 0 0 2px color-mix(in oklch,var(--primary) 24%,transparent)}
.sb.n-needs b{color:var(--active-strong)}
.sb[aria-pressed="true"]{background:color-mix(in oklch,var(--primary) 14%,transparent);color:var(--active-strong)}
.sb[aria-pressed="true"] b{color:var(--active-strong)}
.sb.hl{color:var(--foreground);background:var(--hover)}
.sb kbd{padding:1px 4px;font-size:11px}
.statusbar .sp{flex:1}
.sbt{display:inline-flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap}
.sbt svg{width:13px;height:13px}
.sbdiv{width:1px;height:12px;background:var(--border);margin:0 4px;flex:none}
.statusbar .rt{display:contents}

/* ============ overlays ============ */
.menu{position:fixed;z-index:80;min-width:208px;padding:5px;border-radius:9px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -14px oklch(0 0 0 / .3);animation:pop .15s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:13px;text-align:left;cursor:pointer}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi svg{width:14px;height:14px;color:var(--muted-foreground)}
.mi span{flex:1}
.mi kbd{padding:2px 5px;font-size:11px}
.mi.dz-i{color:var(--error-strong)}
.mi.dz-i svg{color:var(--error-strong)}
.msep{height:1px;margin:4px 2px;background:var(--border-subtle)}
.mlab{padding:6px 8px 4px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}

.ovl{position:fixed;inset:0;z-index:90;background:var(--ov);display:flex;justify-content:center;align-items:flex-start;animation:fade .15s var(--ease)}
@keyframes fade{from{opacity:0}}
.pal{margin-top:12vh;width:min(620px,calc(100vw - 32px));max-height:72vh;display:flex;flex-direction:column;border-radius:13px;border:1px solid var(--border);background:var(--card);box-shadow:0 2px 4px oklch(0 0 0 / .06),0 30px 70px -24px oklch(0 0 0 / .45);overflow:hidden;animation:pop .18s var(--ease)}
.palin{flex:none;display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-bottom:1px solid var(--border)}
.palin svg{width:16px;height:16px;color:var(--muted-foreground)}
.palin input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--foreground)}
.palin input::placeholder{color:var(--muted-foreground)}
.palmode{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;background:var(--hover);font-size:12px;font-weight:600;white-space:nowrap}
.pallist{flex:1;min-height:0;overflow-y:auto;padding:6px}
.psec{padding:8px 8px 4px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.pi{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:7px;cursor:pointer;font-size:13.5px;min-width:0}
.pi.on{background:var(--hover)}
.pi .pic{width:18px;display:grid;place-items:center;color:var(--muted-foreground);flex:none}
.pi .pic svg{width:15px;height:15px}
.pi .pl{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .ps{flex:1 1 auto;min-width:0;font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi kbd{flex:none}
.pi .pl .smk{margin-right:5px}
.pi .gly{margin:0 auto}
.palfoot{flex:none;display:flex;gap:14px;align-items:center;height:34px;padding:0 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted-foreground);background:var(--surface)}
.palfoot span{display:inline-flex;align-items:center;gap:5px}
.palfoot kbd{padding:2px 4px;font-size:11px}
.pempty{padding:26px 12px;text-align:center;font-size:13px;color:var(--muted-foreground)}

/* "Start in" picker: a searchable dropdown under the composer's group button */
.pick{position:fixed;z-index:86;display:flex;flex-direction:column;max-height:380px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -14px oklch(0 0 0 / .3);overflow:hidden;animation:pop .15s var(--ease)}
.pickin{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-bottom:1px solid var(--border)}
.pickin svg{width:14px;height:14px;color:var(--muted-foreground)}
.pickin input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:13px;color:var(--foreground)}
.pickin input::placeholder{color:var(--muted-foreground)}
.picklist{flex:1;min-height:0;overflow-y:auto;padding:4px}
.po{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;font-size:13px;cursor:pointer;min-width:0}
.po.on{background:var(--hover)}
.po svg{width:14px;height:14px;color:var(--muted-foreground);flex:none}
.po .pl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po .pck{color:var(--primary)}
.pickfoot{flex:none;padding:7px 10px;border-top:1px solid var(--border-subtle);background:var(--surface);font-size:11.5px;line-height:1.4;color:var(--muted-foreground)}

/* tooltip (the dashboard's Tooltip: foreground fill, background text) */
#tip{position:fixed;z-index:99;pointer-events:none;max-width:280px;padding:5px 9px;border-radius:6px;background:var(--foreground);color:var(--background);font-size:12px;font-weight:500;line-height:1.35;white-space:nowrap;animation:pop .15s var(--ease)}
#tip[hidden]{display:none}

.dlg{margin-top:22vh;width:min(420px,calc(100vw - 32px));padding:20px 20px 16px;border-radius:13px;border:1px solid var(--border);background:var(--card);box-shadow:0 30px 70px -24px oklch(0 0 0 / .45);animation:pop .2s var(--ease)}
.dlg h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.dlg p{margin:8px 0 0;font-size:13.5px;line-height:1.55;color:var(--muted-foreground)}
.dlgb{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

.keys{position:fixed;right:10px;bottom:36px;z-index:85;width:320px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px -16px oklch(0 0 0 / .35);animation:pop .15s var(--ease)}
.keys[hidden]{display:none}
.keys h3{margin:0 0 8px;font-size:13px;font-weight:600}
.keys dl{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;margin:0;font-size:12.5px}
.keys dt{text-align:right}
.keys dd{margin:0;color:var(--foreground)}
.keys p{margin:10px 0 0;font-size:11.5px;color:var(--muted-foreground);line-height:1.45}

#toast{position:fixed;left:50%;bottom:44px;z-index:95;transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100vw - 32px));padding:8px 8px 8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 18px 40px -18px oklch(0 0 0 / .4);font-size:13px;animation:pop .18s var(--ease)}
#toast[hidden]{display:none}
#toast .tmsg{min-width:0}
#toast .btn{flex:none}

/* ============ legacy replica ============ */
#legacy{min-height:0;grid-template-columns:300px minmax(0,1fr)}
.lg-side{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:color-mix(in oklch,var(--card) 40%,transparent)}
.lg-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px}
.lg-h h2{margin:0;font-family:var(--font-mono);font-size:11px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.lg-h .ib{width:24px;height:24px}
.lg-h .ib svg{width:14px;height:14px}
.lg-s{display:flex;align-items:center;gap:4px;padding:0 12px 8px}
.lg-s label{position:relative;flex:1;min-width:0}
.lg-s label svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted-foreground)}
.lg-s input{width:100%;height:32px;padding:0 8px 0 28px;border-radius:8px;border:1px solid transparent;background:color-mix(in oklch,var(--muted) 40%,transparent);font:inherit;font-size:12px;color:var(--foreground);outline:none}
.lg-s .ib{width:32px;height:32px}
.lg-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px}
.lg-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;min-width:0;border:0;background:none;text-align:left;width:100%}
.lg-row:hover{background:color-mix(in oklch,var(--muted) 50%,transparent)}
.lg-row.on{background:var(--muted)}
.lg-dot{width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none;background:color-mix(in oklch,var(--muted-foreground) 30%,transparent)}
.lg-dot.run{background:var(--primary);animation:lgp 2s cubic-bezier(.4,0,.6,1) infinite}
.lg-dot.err{background:var(--error)}
.lg-dot.act{background:color-mix(in oklch,var(--primary) 70%,transparent)}
@keyframes lgp{50%{opacity:.5}}
.lg-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.lg-t b{font-size:14px;font-weight:400;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--foreground)}
.lg-row.on .lg-t b{font-weight:500}
.lg-t span{font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-main{min-height:0;min-width:0;display:flex;flex-direction:column}
.lg-head{flex:none;padding:14px 24px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;min-width:0}
.lg-head h1{margin:0;font-size:16px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-head .mono{font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}
.lg-tl{flex:1;min-height:0;overflow-y:auto}
.lg-tl .inner{max-width:768px;margin:0 auto;padding:24px}
.lg-me{display:flex;justify-content:flex-end;padding-left:40px;padding-bottom:12px}
.lg-me .w{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:85%}
.lg-me .m{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);padding:0 4px}
.lg-me .b{border-radius:16px 4px 16px 16px;background:var(--muted);padding:10px 16px;font-size:14px;line-height:1.6}
.lg-task{display:flex;gap:12px;padding-bottom:24px}
.lg-task .av{width:24px;height:24px;border-radius:50%;font-size:9px}
.lg-task .h{font-size:12px;color:var(--muted-foreground);display:flex;gap:8px;align-items:center}
.lg-task .h b{color:var(--foreground);font-weight:500}
.lg-task .x{margin-top:6px;font-size:14px;line-height:1.6}
.lg-cmp{flex:none;padding:12px 24px 16px}
.lg-cmp .box{max-width:768px;margin:0 auto;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:10px 12px;display:flex;align-items:flex-end;gap:8px}
.lg-cmp textarea{flex:1;border:0;outline:0;resize:none;background:none;font:inherit;font-size:14px;color:var(--foreground);height:44px}

@media (prefers-reduced-motion: reduce){
  .gly.run::before{animation:none}
  .shim{animation:none;color:var(--foreground);background:none}
  .wk .pip::after{animation:none}
  .menu,.pal,.dlg,#toast,.ovl,.keys,.pick,#tip{animation:none}
  .row.flash,.tab.flash{animation:none}
}

/* ============ narrower desktops ============ */
@media (max-width:1359px){
  :root{--tree-w:228px;--list-w:324px}
  .kbtn{width:220px}
  .tl{padding:20px 20px 24px}
}
/* ============ compact single-column fallback ============ */
@media (max-width:1023px){
  .shell,.shell.lc{grid-template-columns:minmax(0,1fr)}
  #tree{display:none}
  #mid{border-right:0}
  #midrail{display:none !important}
  .shell.lc #midhead,.shell.lc #midfoot{display:block}
  .shell.lc #list{display:block}
  #right{display:none}

  .tabs,.dz{display:none !important}
  .egroup+.egroup{display:none}
  .back{display:inline-grid}
  .gselect{display:block;width:calc(100% - 4px);height:32px;margin:10px 0 0;border:1px solid var(--border);border-radius:8px;background:var(--background);color:var(--foreground);font:inherit;font-size:13px;padding:0 8px}
  .hdr .kick,.hdr .lnk span{display:none}
  .kbtn{width:auto;flex:1;max-width:none}
  #legacy{grid-template-columns:minmax(0,1fr)}
  .lg-side{display:none}
  .statusbar .rt{display:none}
}

<script>
"use strict";
/* ============================================================
   Round 3, A+B merged. Mockup only: every action mutates local
   state. Data comes from ../demo-data.js (window.SV2) and nothing else.
   ============================================================ */
const D = window.SV2;
const ME = D.me;

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clip = (s, n) => (s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s);
const nowIso = () => new Date().toISOString();
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const KK = () => (isMac ? "⌘K" : "Ctrl K");

const ICON = {
  chev: '<path d="m9 6 6 6-6 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  folderplus: '<path d="M12 10v6M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  compose: '<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/>',
  chevdown: '<path d="m6 9 6 6 6-6"/>',

  x: '<path d="M18 6 6 18M6 6l12 12"/>',

  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

  nogroup: '<circle cx="12" cy="12" r="8.5" stroke-dasharray="3.2 3"/>',

};
function svg(name, cls) {
  return '<svg class="i ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + "</svg>";
}
const MARK = {
  slack: '<path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zM6.313 15.165a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zM8.834 6.313a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zM18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zM17.688 8.834a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zM15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zM15.165 17.688a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/>',
  telegram: '<path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>',
};
const smk = (src, cls) => '<svg class="smk ' + (cls || "") + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + MARK[src] + "</svg>";
const SRC_LABEL = { dashboard: "Dashboard", slack: "Slack", telegram: "Telegram" };
const SOURCES = ["slack", "telegram"];

/* ---------- time ---------- */
function ago(t) {
  const m = Math.max(0, Math.round((Date.now() - Date.parse(t)) / 60000));
  if (m < 1) return "now";
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h";
  return Math.floor(h / 24) + "d";
}
const agoLong = (t) => (ago(t) === "now" ? "just now" : ago(t) + " ago");
function bucket(t) {
  const d = new Date(t), n = new Date();
  const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (same(d, n)) return "Today";
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (same(d, y)) return "Yesterday";
  return "Earlier";
}
function legacyRel(t) {
  const s = Math.floor((Date.now() - Date.parse(t)) / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d > 0) return d === 1 ? "1 day ago" : d + " days ago";
  if (h > 0) return h === 1 ? "1 hour ago" : h + " hours ago";
  if (m > 0) return m === 1 ? "1 minute ago" : m + " minutes ago";
  return "just now";
}

/* ---------- key paths ---------- */
const segs = (p) => p.split("/").filter(Boolean);
const isSourcePath = (p) => /^shared\/(slack|telegram)\//.test(p);
const isNoGroup = (p) => p === "shared/" || p === "personal/" + ME + "/";
const isOtherPersonal = (p) => p.startsWith("personal/") && !p.startsWith("personal/" + ME + "/");
const isUserPath = (p) => !isNoGroup(p) && !isSourcePath(p) && !isOtherPersonal(p);
const isEditableGroup = (g) => g.endsWith("/") && isUserPath(g);
const person = (id) => D.people[id] || { name: id, initials: id.slice(0, 2).toUpperCase() };
const agent = (id) => D.agents[id] || { name: id, initials: id.slice(0, 2).toUpperCase() };
// Dashboard sessions sit directly at their group key. A trailing thread:/task: segment is not a group.
function groupPathOf(key) {
  const s = segs(key);
  if (s.length && /^(thread|task):/.test(s[s.length - 1])) s.pop();
  return s.length ? s.join("/") + "/" : "shared/";
}
function crumbParts(p) {
  if (isNoGroup(p)) return ["No group"];
  if (isSourcePath(p)) {
    const base = segs(p).slice(0, 3).join("/") + "/";
    const lab = D.labels[base] || (SRC_LABEL[segs(p)[1]] + " › " + segs(p)[2]);
    return lab.split(" › ").concat(segs(p).slice(3));
  }
  if (isOtherPersonal(p)) return ["Shared with me", person(segs(p)[1]).name].concat(segs(p).slice(2));
  const s = segs(p);
  if (s[0] === "personal") return ["~/" + s[2]].concat(s.slice(3));
  return s.slice(1);
}
const crumb = (p) => crumbParts(p).join(" › ");
const shortName = (p) => { const c = crumbParts(p); return c[c.length - 1]; };
function hashName(p) { const n = shortName(p); return n.startsWith("~/") || n.startsWith("#") || isSourcePath(p) || isNoGroup(p) ? n : "#" + n; }
const tagName = (p) => (isSourcePath(p) ? crumbParts(p)[1] : shortName(p));
const slug = (s) => s.trim().toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9._-]/g, "").replace(/^-+|-+$/g, "").slice(0, 48);

/* ---------- data: one flat list of sessions ---------- */
const ALL = [];
D.conversations.forEach((c) => {
  const isThread = /\/thread:[^/]+\/$/.test(c.key);
  c.sessions.forEach((s) => {
    ALL.push({
      ...s, g: groupPathOf(c.key), source: c.source, owner: c.owner, shared: c.shared || null,
      thread: isThread ? c.key : null, threadTitle: isThread ? c.title : null,
      triage: null, read: s.glyph !== "unread", needs: s.glyph === "needs",
      timeline: s.timeline ? s.timeline.map((t) => ({ ...t })) : null,
    });
  });
});
const SESS = {};
ALL.forEach((s) => { SESS[s.id] = s; });
const threadSessions = (key) => ALL.filter((s) => s.thread === key);
const threadTitle = (key) => { const s = ALL.find((x) => x.thread === key); return s ? s.threadTitle : "Thread"; };
const isNestedThread = (s) => !!s.thread && threadSessions(s.thread).length >= 2;
const crumbOf = (s) => crumb(s.g) + (isNestedThread(s) ? " › " + s.threadTitle : "");

/* ---------- state ---------- */
const S = {
  group: "inbox",
  quick: null,
  saved: D.savedGroups.slice(),
  folds: { "shared/swarm-app/": true },
  srcOpen: { slack: false, telegram: false },
  threadFolds: {},
  panes: [{ tabs: [], active: null }],
  fp: 0,
  lastPanes: 1,
  listCollapsed: false,
  listAuto: false,
  focusRow: null,
  anchor: null,
  sel: new Set(),
  flat: [],
  order: [],
  drafts: {},
  flash: new Set(),
  pal: null,
  menu: null,
  confirm: null,
  renaming: null,
  creating: null,
  legacy: false,
  legacySel: null,
  compactDetail: false,
  drag: null,
  dz: null,
  keysOpen: false,
  seq: 0,
  nt: {},      // new-session tabs: id "new:<n>" -> { group: <group key> | "none", draft }
  ntSeq: 0,
  picker: null, // open "Start in" picker: { nt, q, idx, items }
};

/* ---------- glyphs, counts ---------- */
const sFlags = (s) => ({ needs: s.needs, running: s.status === "running", unread: !s.read });
const hasNews = (f) => f.needs || f.unread || f.running;
function glyph(f) {
  const t = [f.needs && "Needs you", f.running && "Running", f.unread && "Unread"].filter(Boolean).join(", ");
  const inner = f.needs ? '<i class="gd needs"></i>' : f.unread ? '<i class="gd unread"></i>' : "";
  return '<span class="gly' + (f.running ? " run" : "") + '"' + (t ? ' title="' + t + '" aria-label="' + t + '"' : ' aria-hidden="true"') + ">" + inner + "</span>";
}
function counts(list) {
  const n = { needs: 0, running: 0, unread: 0 };
  list.forEach((s) => { if (s.needs) n.needs++; if (s.status === "running") n.running++; if (!s.read) n.unread++; });

}

}
const inboxSess = () => ALL.filter((s) => s.triage === null);
const under = (p, direct) => inboxSess().filter((s) => (direct ? s.g === p : s.g.startsWith(p)));
const preferredOf = (list) => list.find((s) => s.needs) || list.find((s) => !s.read) || list[0];
const QUICK = { running: (s) => s.status === "running", needs: (s) => s.needs, unread: (s) => !s.read };
const QUICK_LABEL = { running: "running", needs: "needs you", unread: "unread" };

/* ---------- tree model ---------- */
function userPathSet() {
  const set = new Set(S.saved);
  ALL.forEach((s) => { if (isUserPath(s.g)) set.add(s.g); });
  Array.from(set).forEach((p) => {
    const s = segs(p), min = s[0] === "personal" ? 3 : 2;
    for (let i = min; i < s.length; i++) set.add(s.slice(0, i).join("/") + "/");
  });
  return set;
}
const childrenOf = (set, parent) => Array.from(set).filter((p) => p !== parent && p.startsWith(parent) && segs(p).length === segs(parent).length + 1);
const topUser = (set) => Array.from(set).filter((p) => { const s = segs(p); return s[0] === "shared" ? s.length === 2 : s.length === 3; });
function pathLast(p) { let b = ""; ALL.forEach((s) => { if (s.g.startsWith(p) && s.last > b) b = s.last; }); return b; }
const byActivity = (a, b) => { const la = pathLast(a), lb = pathLast(b); if (la !== lb) return la < lb ? 1 : -1; return crumb(a).localeCompare(crumb(b)); };
// Source channels and their nested threads (a thread with 2+ root sessions).
function channelsOf(src) {
  return Array.from(new Set(ALL.filter((s) => s.source === src && isSourcePath(s.g)).map((s) => s.g))).sort(byActivity);
}
function threadsIn(path) {
  const keys = Array.from(new Set(ALL.filter((s) => s.g === path && s.thread).map((s) => s.thread)));
  return keys.filter((k) => ALL.filter((s) => s.thread === k && s.g === path).length >= 2);
}

/* ---------- list model ---------- */
function listSessions() {
  const g = S.group;
  let arr;
  if (g === "later" || g === "done") arr = ALL.filter((s) => s.triage === g);
  else {
    arr = ALL.filter((s) => s.triage === null);
    if (g === "nogroup") arr = arr.filter((s) => isNoGroup(s.g));
    else if (g.startsWith("sw:")) arr = arr.filter((s) => s.g.startsWith("personal/" + g.slice(3) + "/"));
    else if (g.startsWith("th:")) arr = arr.filter((s) => s.thread === g.slice(3));
    else if (g !== "inbox") arr = arr.filter((s) => s.g.startsWith(g));
  }
  if (S.quick) arr = arr.filter(QUICK[S.quick]);
  return arr.sort((a, b) => (a.last < b.last ? 1 : -1));
}
function listItems() {
  const arr = listSessions();
  const inThread = S.group.startsWith("th:");
  const items = [], seen = new Set();
  arr.forEach((s) => {
    if (!inThread && s.thread) {
      const grp = arr.filter((x) => x.thread === s.thread);
      if (grp.length >= 2) {
        if (!seen.has(s.thread)) { seen.add(s.thread); items.push({ type: "t", key: s.thread, title: s.threadTitle, sessions: grp, last: grp[0].last }); }
        return;
      }
    }
    items.push({ type: "s", s, last: s.last });
  });
  return items;
}
function computeFlat() {
  const rows = [];
  listItems().forEach((it) => {
    if (it.type === "t") {
      rows.push({ k: "t:" + it.key, tkey: it.key });
      if (!S.threadFolds[it.key]) it.sessions.forEach((s) => rows.push({ k: "s:" + s.id, sid: s.id, tkey: it.key }));
    } else rows.push({ k: "s:" + it.s.id, sid: it.s.id });
  });
  return rows;
}
function showTags() {
  const g = S.group;
  if (["inbox", "later", "done"].includes(g) || g.startsWith("sw:")) return true;
  return isUserPath(g) && childrenOf(userPathSet(), g).length > 0;
}
function keysToSids(keys) {
  const list = listSessions();
  return Array.from(new Set(keys.flatMap((k) => {
    if (k.startsWith("t:")) { const inList = list.filter((s) => s.thread === k.slice(2)); return (inList.length ? inList : threadSessions(k.slice(2))).map((s) => s.id); }
    return [k.slice(2)];
  })));
}
const rowSid = (k) => (k.startsWith("t:") ? preferredOf(keysToSids([k]).map((id) => SESS[id])).id : k.slice(2));

/* ---------- panes and tabs ---------- */
// A tab holds a session id, or "new:<n>" for a new-session tab (see S.nt).
const isNT = (id) => typeof id === "string" && id.startsWith("new:");
const ntDom = (id, k) => "nt" + k + "-" + id.slice(4);
const paneOf = (sid) => S.panes.findIndex((p) => p.tabs.includes(sid));
const paneSids = () => S.panes.map((p) => p.active).filter((id) => id && !isNT(id));
const currentSid = () => { const a = S.panes[S.fp] && S.panes[S.fp].active; return a && !isNT(a) ? a : null; };
const totalTabs = () => S.panes.reduce((a, p) => a + p.tabs.length, 0);
function insertAfterActive(p, sid) { const i = p.tabs.indexOf(p.active); p.tabs.splice(i < 0 ? p.tabs.length : i + 1, 0, sid); }

/* ---------- where a new session can start ---------- */
// My groups and subgroups, ~/ personal groups, and No group. Never source groups or Shared with me.
function startTargets() {
  const mine = Array.from(userPathSet()).sort((a, b) => {
    const pa = a.startsWith("personal/"), pb = b.startsWith("personal/");
    if (pa !== pb) return pa ? 1 : -1;
    return crumb(a).localeCompare(crumb(b));
  });
  return mine.map((p) => ({ v: p, label: crumb(p) })).concat([{ v: "none", label: "No group" }]);
}
function normStart(g) {
  if (!g || g === "none" || g === "nogroup") return "none";
  if (!g.endsWith("/")) g += "/";
  return isUserPath(g) && userPathSet().has(g) ? g : "none";
}
// No explicit group: use the group selected in the sidebar, else No group.
const defaultStartGroup = () => normStart(S.group);
const startLabel = (g) => (g === "none" ? "No group" : crumb(g));
function pathHTML(g) {
  if (g === "none") return "No group";
  const c = crumbParts(g);
  return (c.length > 1 ? '<span class="par">' + esc(c.slice(0, -1).join(" › ")) + " › </span>" : "") + esc(c[c.length - 1]);
}

/* ============================================================
   actions
   ============================================================ */
function openSession(sid, where) {
  const s = SESS[sid]; if (!s) return;
  where = where || "current";
  if (where === "split") { openInSplit(sid); return; }
  const at = paneOf(sid);
  if (where === "bg") {
    if (at < 0) { const p = S.panes[S.fp]; insertAfterActive(p, sid); if (!p.active) p.active = sid; }
  } else if (at >= 0) {
    S.fp = at; S.panes[at].active = sid; s.read = true;
  } else {
    const p = S.panes[S.fp];
    // A new-session tab is never replaced. The session opens next to it.
    if (where === "newtab" || !p.active || isNT(p.active)) { insertAfterActive(p, sid); p.active = sid; }
    else { p.tabs[p.tabs.indexOf(p.active)] = sid; p.active = sid; }
    s.read = true;
  }
  if (where !== "bg") S.compactDetail = true;
  if (s.thread) delete S.threadFolds[s.thread];
  S.focusRow = "s:" + sid;
  render();
}
function openInSplit(sid) {
  const s = SESS[sid]; if (!s) return;
  const at = paneOf(sid);
  if (S.panes.length === 1) {
    const p0 = S.panes[0];
    if (at === 0) {
      if (p0.tabs.length === 1) { toast("Open a second session first. Then split."); return; }
      removeFromPane(0, sid);
    }
    S.panes.push({ tabs: [sid], active: sid });
    S.fp = 1;
  } else {
    const other = S.fp === 0 ? 1 : 0;
    if (at === other) S.panes[other].active = sid;
    else if (at === S.fp) {
      if (S.panes[S.fp].tabs.length === 1) { toast("That session is already open in this pane."); return; }
      removeFromPane(S.fp, sid);
      insertAfterActive(S.panes[other], sid); S.panes[other].active = sid;
    } else { insertAfterActive(S.panes[other], sid); S.panes[other].active = sid; }
    S.fp = other;
  }
  s.read = true;
  if (s.thread) delete S.threadFolds[s.thread];
  S.focusRow = "s:" + sid;
  render();
}
function removeFromPane(pi, sid) {
  const p = S.panes[pi];
  const i = p.tabs.indexOf(sid);
  if (i < 0) return;
  p.tabs.splice(i, 1);
  if (p.active === sid) p.active = p.tabs[Math.min(i, p.tabs.length - 1)] || null;
}
function closeTab(pi, sid) {
  removeFromPane(pi, sid);
  if (isNT(sid)) { delete S.nt[sid]; if (S.picker && S.picker.nt === sid) S.picker = null; }
  if (!S.panes[pi].tabs.length && S.panes.length === 2) { S.panes.splice(pi, 1); S.fp = 0; }
  else if (S.fp >= S.panes.length) S.fp = 0;
  const a = S.panes[S.fp].active; if (a && SESS[a]) SESS[a].read = true;
  render();
}
function closePane(pi) {
  if (S.panes.length < 2) return;
  const gone = S.panes[pi], keep = S.panes[pi === 0 ? 1 : 0];
  gone.tabs.forEach((sid) => { if (!keep.tabs.includes(sid)) keep.tabs.push(sid); });
  S.panes = [keep]; S.fp = 0;
  render();
}
function activateTab(pi, sid) {
  S.fp = pi; S.panes[pi].active = sid;
  if (SESS[sid]) { SESS[sid].read = true; S.focusRow = "s:" + sid; }
  if (S.picker && S.picker.nt !== sid) S.picker = null;
  render();
}
function moveTab(from, sid, to, idx) {
  const src = S.panes[from];
  if (!S.panes[to]) {
    if (src.tabs.length < 2) { toast("Open a second tab first. Then drag one to the right edge."); return; }
    S.panes.push({ tabs: [], active: null }); to = S.panes.length - 1;
  }
  const i = src.tabs.indexOf(sid);
  src.tabs.splice(i, 1);
  if (from === to && i < idx) idx--;
  if (src.active === sid) src.active = src.tabs[Math.min(i, src.tabs.length - 1)] || null;
  const dst = S.panes[to];
  dst.tabs.splice(Math.max(0, Math.min(idx, dst.tabs.length)), 0, sid);
  dst.active = sid; S.fp = to;
  if (!src.tabs.length && S.panes.length === 2) { S.panes.splice(from, 1); S.fp = 0; }
  if (SESS[sid]) SESS[sid].read = true;
  S.picker = null;
  render();
}
function setList(collapsed) {
  S.listCollapsed = collapsed; S.listAuto = false;
  render();
  if (!collapsed) listEl.focus({ preventScroll: true });
}

function setRead(sids, val) { sids.forEach((id) => { if (SESS[id]) SESS[id].read = val; }); render(); }
function toggleRead(keys) {
  const sids = keysToSids(keys);
  const anyUnread = sids.some((id) => !SESS[id].read);
  setRead(sids, anyUnread);
  toast(anyUnread ? "Marked read." : "Marked unread.");
}

function triage(keys, kind) {
  const sids = keysToSids(keys);
  if (!sids.length) return;
  const ss = sids.map((id) => SESS[id]);
  const allIn = ss.every((s) => s.triage === kind);
  const prev = ss.map((s) => [s, s.triage]);
  const before = S.flat.map((r) => r.k);
  const fi = before.indexOf(S.focusRow);
  const openHit = ss.some((s) => s.id === currentSid());
  ss.forEach((s) => { s.triage = allIn ? null : kind; });
  S.sel.clear();
  // Keep the cursor where it was: the next row slides up under it, mail style.
  const after = computeFlat().map((r) => r.k);
  let next = null;
  for (let j = fi; j < before.length && j >= 0; j++) { if (after.includes(before[j])) { next = before[j]; break; } }
  if (!next && after.length) next = after[Math.min(Math.max(fi, 0), after.length - 1)];
  S.focusRow = next;
  if (openHit && next && !allIn) { openSession(rowSid(next)); S.focusRow = next; }
  render();
  const n = ss.length, what = n === 1 ? "Session" : n + " sessions";
  const msg = allIn ? what + " moved back to the inbox." : kind === "done" ? what + " marked Done." : what + " moved to Later.";
  toast(msg, "Undo", () => { prev.forEach(([s, t]) => { s.triage = t; }); render(); });
}

function moveSessions(sids, target) {
  const ss = sids.map((id) => SESS[id]).filter(Boolean);
  const blocked = ss.filter((s) => s.shared === "view");
  const ok = ss.filter((s) => s.shared !== "view");
  if (!ok.length) { toast("View-only sessions cannot move."); return; }
  const prev = ok.map((s) => [s, s.g]);
  const base = target === "nogroup" ? "shared/" : target;
  ok.forEach((s) => { s.g = base; });
  S.sel.clear();
  render();
  const name = target === "nogroup" ? "No group" : hashName(target);
  toast("Moved " + plural(ok.length, "session") + " to " + name + "." + (blocked.length ? " View-only ones stayed." : ""), "Undo", () => { prev.forEach(([s, g]) => { s.g = g; }); render(); });
}

/* ---------- new session: a tab with a composer and a "Start in" picker ---------- */
// Opens a "New session" tab in the focused pane (or pane pi) with the group preselected.
// An empty new-session tab in that pane is reused, so repeated clicks do not stack tabs.
function openNewTab(group, pi) {
  if (pi == null || !S.panes[pi]) pi = S.fp;
  S.fp = pi;
  const p = S.panes[pi];
  group = normStart(group);
  let id = p.tabs.find((t) => isNT(t) && S.nt[t] && !S.nt[t].draft.trim());
  if (id) S.nt[id].group = group;
  else { id = "new:" + (++S.ntSeq); S.nt[id] = { group, draft: "" }; insertAfterActive(p, id); }
  p.active = id;
  S.picker = null; S.menu = null;
  S.compactDetail = true;
  render();
  const ta = document.getElementById(ntDom(id, "x"));
  if (ta) { ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
// Send: the tab turns into the running session, and its row lands at the top of the group.
function startNewSession(id) {
  const nt = S.nt[id]; if (!nt) return;
  const text = nt.draft.trim();
  if (!text) { const ta = document.getElementById(ntDom(id, "x")); if (ta) ta.focus(); return; }
  const g = normStart(nt.group), base = g === "none" ? "shared/" : g;
  const first = text.split("\n").map((x) => x.trim()).find(Boolean);
  const sid = "ns" + (++S.seq), at = nowIso();
  const s = {
    id: sid, title: clip(first, 64), status: "running", glyph: "running", agents: ["lead"], tasks: 1, cost: 0,
    created: at, last: at, g: base, source: "dashboard", owner: ME, shared: null, thread: null, threadTitle: null,
    triage: null, read: true, needs: false,
    timeline: [
      { kind: "human", who: ME, at, text },
      { kind: "task", agent: "lead", at, status: "running", text: "", wk: "Lead is picking this up" },
    ],
  };
  ALL.unshift(s); SESS[sid] = s;
  S.panes.forEach((p) => { const i = p.tabs.indexOf(id); if (i >= 0) { p.tabs[i] = sid; if (p.active === id) p.active = sid; } });
  delete S.nt[id];
  S.picker = null;
  // Show the new row at the top of its group, with every parent group unfolded.
  const sg = segs(base);
  for (let i = sg[0] === "personal" ? 3 : 2; i < sg.length; i++) S.folds[sg.slice(0, i).join("/") + "/"] = false;
  S.group = g === "none" ? "nogroup" : g; S.quick = null; S.sel.clear(); S.renaming = null;
  S.focusRow = "s:" + sid;
  S.flash.add(sid); setTimeout(() => { S.flash.delete(sid); }, 1600);
  render();
  const ta = document.getElementById("cmp-" + paneOf(sid));
  if (ta) ta.focus({ preventScroll: true });
  toast("Session started in " + startLabel(g) + ".");
}

/* ---------- "Start in" picker ---------- */
function togglePicker(id) {
  if (S.picker && S.picker.nt === id) { closePicker(true); return; }
  if (!S.nt[id]) return;
  S.menu = null; renderMenu();
  S.picker = { nt: id, q: "", idx: 0 };
  S.picker.idx = Math.max(0, pickItems().findIndex((x) => x.v === S.nt[id].group));
  renderPicker();
  const inp = $("#pick-in"); if (inp) inp.focus();
}
function closePicker(refocus) {
  const id = S.picker && S.picker.nt;
  S.picker = null;
  renderPicker();
  if (refocus && id) { const b = document.getElementById(ntDom(id, "g")); if (b) b.focus(); }
}
function pickItems() {
  const q = S.picker ? S.picker.q : "";
  return startTargets().filter((x) => fuzzy(q, x.label) > 0);
}
function choosePick(v) {
  const id = S.picker && S.picker.nt;
  S.picker = null;
  if (!id || !S.nt[id]) { renderPicker(); return; }
  S.nt[id].group = v;

}
function renderPicker() {
  const el = $("#picker");
  const trig = S.picker ? document.getElementById(ntDom(S.picker.nt, "g")) : null;
  if (!S.picker || !S.nt[S.picker.nt] || !trig || trig.offsetParent === null) {
    S.picker = null; el.innerHTML = "";
    $$(".sipick").forEach((b) => b.setAttribute("aria-expanded", "false"));
    return;
  }
  trig.setAttribute("aria-expanded", "true");
  if (!$("#pick-in")) {
    el.innerHTML = '<div class="pick"><div class="pickin">' + svg("search") +
      '<input id="pick-in" role="combobox" aria-expanded="true" aria-controls="pick-list" aria-autocomplete="list" aria-label="Search groups" placeholder="Search groups" autocomplete="off" spellcheck="false"></div>' +
      '<div class="picklist" id="pick-list" role="listbox" aria-label="Start in"></div>' +
      '<div class="pickfoot">Read-only Slack and Telegram groups are not listed.</div></div>';
    $("#pick-in").addEventListener("input", (e) => { S.picker.q = e.target.value; S.picker.idx = 0; renderPickList(); });
    $("#pick-in").addEventListener("keydown", pickKey);
  }
  renderPickList();
  // Open below the button so the message stays visible. Flip up only when the room below is too small.
  const box = $(".pick", el), r = trig.getBoundingClientRect();
  const w = Math.min(336, innerWidth - 16);
  const floor = innerHeight - 32, below = floor - r.bottom - 6, above = r.top - 14;
  box.style.width = w + "px";
  box.style.maxHeight = "";
  const want = Math.min(box.offsetHeight, 380);
  const down = below >= Math.min(want, 240) || below >= above;
  box.style.maxHeight = Math.min(380, down ? below : above) + "px";
  const h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  box.style.top = (down ? r.bottom + 6 : r.top - 6 - h) + "px";
}
function renderPickList() {
  const P = S.picker; if (!P) return;
  const items = pickItems();
  P.items = items;
  if (P.idx >= items.length) P.idx = Math.max(0, items.length - 1);
  const cur = S.nt[P.nt].group;
  let h = "";
  items.forEach((it, i) => {
    if (it.v === "none") h += i ? '<div class="msep" role="presentation"></div>' : "";
    else if (!i) h += '<div class="psec" role="presentation">My groups</div>';
    h += '<div class="po' + (i === P.idx ? " on" : "") + '" role="option" id="po-' + i + '" data-po="' + i + '" aria-selected="' + (it.v === cur) + '">' +
      svg(it.v === "none" ? "nogroup" : "hash") + '<span class="pl">' + pathHTML(it.v) + "</span>" + (it.v === cur ? svg("check", "pck") : "") + "</div>";
  });

  $("#pick-in").setAttribute("aria-activedescendant", items.length ? "po-" + P.idx : "");
  const on = $(".po.on", $("#pick-list")); if (on) on.scrollIntoView({ block: "nearest" });

function pickKey(e) {
  const P = S.picker; if (!P) return;
  const n = (P.items || []).length;
  if (e.key === "ArrowDown") { e.preventDefault(); P.idx = n ? (P.idx + 1) % n : 0; renderPickList(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); P.idx = n ? (P.idx - 1 + n) % n : 0; renderPickList(); }
  else if (e.key === "Enter") { e.preventDefault(); const it = P.items[P.idx]; if (it) choosePick(it.v); }
  else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closePicker(true); }
  else if (e.key === "Tab") { closePicker(false); }
}

function sendInSession(sid, text) {
  const s = SESS[sid]; if (!s) return;
  if (!s.timeline) s.timeline = timelineOf(s).map((t) => ({ ...t }));
  if (s.source === "slack") s.timeline.push({ kind: "reply", who: ME, at: nowIso(), text });
  else s.timeline.push({ kind: "human", who: ME, at: nowIso(), text });
  s.timeline.push({ kind: "task", agent: s.agents[0] || "lead", at: nowIso(), status: "running", text: "Picked up. Working on it." });
  s.status = "running"; s.last = nowIso(); s.tasks += 1;
  S.drafts[sid] = "";
  render();
  if (s.source === "slack") toast("Posted to the Slack thread by the swarm bot, attributed to you.");
}

function approve(sid, i, ok) {
  const s = SESS[sid];
  s.timeline[i].resolved = ok ? "approved" : "rejected";
  s.needs = false;
  s.timeline.push({ kind: "note", at: nowIso(), text: (ok ? "Approved" : "Rejected") + " by " + person(ME).name + "." });
  s.status = ok ? "running" : "paused";
  s.last = nowIso();
  render();
}

/* ---------- groups ---------- */
function rekeyPrefix(oldP, newP) {
  ALL.forEach((s) => { if (s.g.startsWith(oldP)) s.g = newP + s.g.slice(oldP.length); });
  S.saved = S.saved.map((p) => (p.startsWith(oldP) ? newP + p.slice(oldP.length) : p));
  const nf = {};

function renameGroup(path, name) {

  S.renaming = null; S.treeDraft = null;
  if (!sl) { render(); return; }
  const s = segs(path); s[s.length - 1] = sl;
  const np = s.join("/") + "/";
  if (np === path) { render(); return; }
  if (userPathSet().has(np)) { render(); toast("A group with that name already exists."); return; }
  const old = hashName(path);

  render();
  toast("Renamed " + old + " to " + hashName(np) + ".", "Undo", () => { rekeyPrefix(np, path); render(); });

  if (!sl) { render(); return; }

  if (!userPathSet().has(p)) S.saved.push(p);

function deleteGroup(path) {

  const prevKeys = moved.map((s) => [s, s.g]);
  const prevSaved = S.saved.slice();
  moved.forEach((s) => { s.g = root; });
  S.saved = S.saved.filter((p) => !p.startsWith(path));
  if (S.group.startsWith(path)) S.group = "nogroup";

/* ---------- next unread ---------- */
function nextUnread() {
  const order = listItems().flatMap((it) => (it.type === "t" ? it.sessions : [it.s]));
  const cur = S.focusRow ? SESS[rowSid(S.focusRow)] : null;
  const start = cur ? order.indexOf(cur) : -1;
  const openSid = currentSid();
  const isNews = (s) => (s.needs || !s.read) && s.id !== openSid;
  for (let j = 1; j <= order.length; j++) {
    const s = order[(start + j + order.length) % order.length];
    if (s && isNews(s)) return s;
  }
  return inboxSess().filter(isNews).sort((a, b) => (a.last < b.last ? 1 : -1))[0] || null;
}
function goNextUnread() {
  const s = nextUnread();
  if (!s) { toast("Nothing unread. Inbox clear."); return; }
  if (!listSessions().includes(s)) { S.group = "inbox"; S.quick = null; }
  openSession(s.id);
}

function render() {

  const pc = S.panes.length;
  if (pc !== S.lastPanes) {
    if (pc === 2 && !S.listCollapsed) { S.listCollapsed = true; S.listAuto = true; }
    if (pc === 1 && S.listAuto) { S.listCollapsed = false; S.listAuto = false; }

  }
  $("#app").classList.toggle("is-legacy", S.legacy);
  document.body.classList.toggle("cdetail", S.compactDetail);
  $("#shell").classList.toggle("lc", S.listCollapsed);

  if (S.legacy) renderLegacy();
  else { renderTree(); renderList(); renderMid(); renderRight(); }
  renderStatus();
  renderMenu();
  renderOverlay();
  renderKeys();
  renderPicker();
  restoreScroll(ssnap);

function captureFocus() {

  return { id: a.id, s: a.selectionStart, e: a.selectionEnd };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id);
  if (!el || el.offsetParent === null) return;
  if (document.activeElement !== el) el.focus({ preventScroll: true });
  if (f.s != null && el.setSelectionRange) { try { el.setSelectionRange(f.s, f.e); } catch (e) { /* not a text field */ } }
}
function captureScroll() {
  const m = {};
  $$(".pane[data-sid]").forEach((p) => {
    const sc = $(".tls", p); if (!sc) return;
    m[p.dataset.p] = { sid: p.dataset.sid, top: sc.scrollTop, bottom: sc.scrollHeight - sc.scrollTop - sc.clientHeight < 24 };
  });

}
function restoreScroll(m) {
  $$(".pane[data-sid]").forEach((p) => {
    const sc = $(".tls", p); if (!sc) return;
    const prev = m[p.dataset.p];
    if (prev && prev.sid === p.dataset.sid && !prev.bottom) sc.scrollTop = prev.top;
    else sc.scrollTop = sc.scrollHeight;
  });

  if (S.focusRow && !S.flat.some((r) => r.k === S.focusRow)) S.focusRow = null;

  let h = "", last = "";

      h += '<div class="sec" role="presentation"><span class="lab">' + b + '</span><span class="mono">' + nIn + "</span></div>";

/* fuzzy: subsequence match, bonus for word starts and runs */
function fuzzy(q, text) {
  q = q.trim().toLowerCase();
  if (!q) return 1;
  const t = text.toLowerCase();
  if (t.includes(q)) return 100 - t.indexOf(q);
  let ti = 0, score = 0, prev = -2;
  for (const ch of q.replace(/\s+/g, "")) {
    const i = t.indexOf(ch, ti);
    if (i < 0) return 0;
    score += (i === prev + 1 ? 3 : 1) + (i === 0 || /[\s›/#:~-]/.test(t[i - 1]) ? 2 : 0);
    prev = i; ti = i + 1;
  }
  return score;
}

    text: s.title + " " + crumbOf(s),
    run: (shift) => { closePalette(); openSession(s.id, shift ? "split" : "current"); },

}
function groupTargets(includeNoGroup) {
  const list = Array.from(userPathSet()).sort((a, b) => crumb(a).localeCompare(crumb(b))).map((p) => ({ path: p, label: crumb(p) }));

  return list;
}

  // While typing, every group also offers "New session in <group>".
  if (q.trim()) startTargets().forEach((t) => A.push({ icon: svg("plus"), label: "New session in " + esc(t.label), text: "New session in " + t.label, run: () => { closePalette(); openNewTab(t.v); } }));
  if (cur) A.push({ icon: svg("move"), label: "Move to group…", sub: esc(clip(cur.title, 40)), kbd: "m", run: () => { S.pal = { mode: "group", purpose: "move", keys: ["s:" + cur.id], q: "", idx: 0 }; renderOverlay(); $("#pal-in").focus(); } });
  A.push({ icon: svg("split"), label: "Open in split…", kbd: "v", run: () => { S.pal = { mode: "split", q: "", idx: 0 }; renderOverlay(); $("#pal-in").focus(); } });

  const extra = Array.from(new Set(ALL.map((s) => s.g).filter((p) => isSourcePath(p) || isOtherPersonal(p)))).map((p) => ({ path: p, label: crumb(p) }))
    .concat(Array.from(new Set(ALL.filter(isNestedThread).map((s) => s.thread))).map((k) => ({ path: "th:" + k, label: crumb(threadSessions(k)[0].g) + " › " + threadTitle(k) })));
  const gs = groupTargets(false).concat(extra)
    .map((g) => ({ sect: "Groups", icon: g.path.startsWith("th:") ? svg("thread") : isSourcePath(g.path) ? smk(segs(g.path)[1]) : svg("hash"), label: esc(g.label), score: fuzzy(q, g.label), run: () => { closePalette(); selectGroup(g.path); } }))
