    if (act === "ntpick") togglePicker(ntp.dataset.nt);
    else if (act === "ntstart") startNewSession(ntp.dataset.nt);
    else if (act === "back") { S.compactDetail = false; render(); }
    return;
  }
  const pane = e.target.closest(".pane[data-sid]"); if (!pane) return;
  const sid = pane.dataset.sid, pi = +pane.dataset.p, s = SESS[sid];
  if (act === "approve") approve(sid, +a.dataset.i, true);
  else if (act === "reject") approve(sid, +a.dataset.i, false);
  else if (act === "read") { setRead([sid], !s.read); toast(s.read ? "Marked read." : "Marked unread."); }
  else if (act === "done") triage(["s:" + sid], "done");
  else if (act === "later") triage(["s:" + sid], "later");
  else if (act === "move") openPalette("group", { purpose: "move", keys: ["s:" + sid] });
  else if (act === "crumb") { selectGroup(isNoGroup(s.g) ? "nogroup" : isNestedThread(s) ? "th:" + s.thread : s.g); if (S.listCollapsed) setList(false); }
  else if (act === "thread") { selectGroup("th:" + s.thread); if (S.listCollapsed) setList(false); }
  else if (act === "send") { const ta = $("#cmp-" + pi); const v = ta.value.trim(); if (v) sendInSession(sid, v); }
  else if (act === "back") { S.compactDetail = false; render(); }
});
R.addEventListener("auxclick", (e) => { if (e.button !== 1) return; const tab = e.target.closest(".tab"); if (tab) { e.preventDefault(); closeTab(+tab.dataset.p, tab.dataset.sid); } });
R.addEventListener("keydown", (e) => {
  const tab = e.target.closest(".tab");
  if (tab && e.target === tab && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); activateTab(+tab.dataset.p, tab.dataset.sid); return; }
  if (e.target.matches("textarea[data-nt]")) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); startNewSession(e.target.dataset.nt); }
    return;
  }
  if (!e.target.matches(".cmpb textarea")) return;
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); const v = e.target.value.trim(); if (v) sendInSession(e.target.dataset.sid, v); }
});
R.addEventListener("input", (e) => {
  if (e.target.matches("textarea[data-nt]")) {
    const nt = S.nt[e.target.dataset.nt]; if (nt) nt.draft = e.target.value;
    autoGrow(e.target);
    const b = $('[data-act="ntstart"]', e.target.closest(".pane")); if (b) b.disabled = !e.target.value.trim();
    return;
  }
  if (e.target.matches(".cmpb textarea")) { S.drafts[e.target.dataset.sid] = e.target.value; autoGrow(e.target); }
});
R.addEventListener("dragstart", (e) => {
  const tab = e.target.closest && e.target.closest(".tab"); if (!tab) return;
  S.drag = { tab: tab.dataset.sid, from: +tab.dataset.p };
  tab.classList.add("dragsrc");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", tab.dataset.sid);
  document.body.classList.add("dragging");
});
function showDZ(zone, pi) {
  const dz = $("#dz"); if (!dz) return;
  const er = R.getBoundingClientRect();
  let l = 0, w = er.width;
  if (zone === "split") { l = er.width / 2; w = er.width / 2; }
  else if (S.panes.length === 2) { const g = $('.egroup[data-p="' + pi + '"]', R).getBoundingClientRect(); l = g.left - er.left; w = g.width; }
  Object.assign(dz.style, { left: l + "px", top: "38px", width: w - 12 + "px", height: er.height - 50 + "px" });
  $("span", dz).textContent = zone === "split" ? "Drop to open in split" : S.drag.tab ? "Move here" : "Open here";
  dz.hidden = false;
  S.dz = { zone, pi };
}
R.addEventListener("dragover", (e) => {
  const d = S.drag; if (!d) return;
  const tl = e.target.closest(".tstrip");
  if (tl && d.tab) {
    e.preventDefault();
    const dz = $("#dz"); if (dz) dz.hidden = true;
    $$(".ins-b,.ins-a").forEach((x) => x.classList.remove("ins-b", "ins-a"));
    const tabs = $$(".tab", tl);
    const idx = tabs.filter((t) => e.clientX > t.getBoundingClientRect().left + t.offsetWidth / 2).length;
    if (tabs[idx]) tabs[idx].classList.add("ins-b"); else if (tabs.length) tabs[tabs.length - 1].classList.add("ins-a");
    S.dz = { zone: "strip", pi: +tl.dataset.p, idx };
    return;
  }
  $$(".ins-b,.ins-a").forEach((x) => x.classList.remove("ins-b", "ins-a"));
  const er = R.getBoundingClientRect();
  if (S.panes.length === 1) {
    if (e.clientX > er.left + er.width * 0.6) { e.preventDefault(); showDZ("split", 1); return; }
    if (d.rows) { e.preventDefault(); showDZ("here", 0); return; }
  } else {
    const g = e.target.closest(".egroup");
    const pi = g ? +g.dataset.p : (e.clientX > er.left + er.width / 2 ? 1 : 0);
    if (!(d.tab && pi === d.from)) { e.preventDefault(); showDZ("here", pi); return; }
  }
  const dz = $("#dz"); if (dz) dz.hidden = true;
  S.dz = null;
});
R.addEventListener("dragleave", (e) => { if (!R.contains(e.relatedTarget)) { const dz = $("#dz"); if (dz) dz.hidden = true; $$(".ins-b,.ins-a").forEach((x) => x.classList.remove("ins-b", "ins-a")); S.dz = null; } });
R.addEventListener("drop", (e) => {
  const d = S.drag, z = S.dz;
  if (!d || !z) return;
  e.preventDefault();
  endDrag();
  if (d.tab) {
    if (z.zone === "strip") moveTab(d.from, d.tab, z.pi, z.idx);
    else if (z.zone === "split") moveTab(d.from, d.tab, 1, 0);
    else moveTab(d.from, d.tab, z.pi, S.panes[z.pi].tabs.length);
    return;
  }
  const sid = rowSid(d.rows[0]);
  if (z.zone === "split") openSession(sid, "split");
  else { S.fp = z.pi; openSession(sid, "current"); }
});

// status bar
$("#statusbar").addEventListener("click", (e) => {
  const b = e.target.closest("[data-sb]"); if (!b) return;
  const t = b.dataset.sb;
  if (t === "quick") {
    const k = b.dataset.q;
    if (S.quick === k) S.quick = null;
    else { S.quick = k; S.group = "inbox"; S.sel.clear(); S.focusRow = null; }
    if (S.listCollapsed) { S.listCollapsed = false; S.listAuto = false; }
    render(); listEl.focus({ preventScroll: true });
  } else if (t === "list") setList(!S.listCollapsed);
  else if (t === "keys") { S.keysOpen = !S.keysOpen; renderKeys(); renderStatus(); }
});

// legacy
$("#legacy").addEventListener("click", (e) => { const r = e.target.closest("[data-lg]"); if (r) { S.legacySel = r.dataset.lg; render(); } });

// menus + overlays
$("#menu").addEventListener("click", (e) => {
  const b = e.target.closest("[data-mi]"); if (!b) return;
  const m = S.menu; S.menu = null; renderMenu();
  const a = b.dataset.mi;
  if (m.type === "row") {
    const k = m.k;
    if (a === "open") openRow(k);
    if (a === "newtab") openRow(k, "newtab");
    if (a === "split") openRow(k, "split");
    if (a === "read") toggleRead([k]);
    if (a === "done") triage([k], "done");
    if (a === "later") triage([k], "later");
    if (a === "move") openPalette("group", { purpose: "move", keys: [k] });
  } else {
    if (a === "sub") { S.creating = { parent: m.path }; S.renaming = null; S.treeDraft = null; S.treeFocus = true; S.folds[m.path] = false; render(); }
    if (a === "rename") { S.renaming = m.path; S.creating = null; S.treeDraft = null; S.treeFocus = true; render(); }
    if (a === "delete") { S.confirm = { path: m.path }; render(); $("#dlg-cancel").focus(); }
  }
});
// "Start in" picker
$("#picker").addEventListener("mousedown", (e) => { if (e.target.closest("[data-po]")) e.preventDefault(); });
$("#picker").addEventListener("click", (e) => {
  const o = e.target.closest("[data-po]");
  if (o && S.picker) { const it = S.picker.items[+o.dataset.po]; if (it) choosePick(it.v); }
});
$("#picker").addEventListener("mousemove", (e) => {
  const o = e.target.closest("[data-po]");
  if (o && S.picker && +o.dataset.po !== S.picker.idx) { S.picker.idx = +o.dataset.po; $$(".po").forEach((x) => x.classList.toggle("on", +x.dataset.po === S.picker.idx)); $("#pick-in").setAttribute("aria-activedescendant", "po-" + S.picker.idx); }
});
document.addEventListener("mousedown", (e) => {
  if (S.picker && !e.target.closest("#picker") && !e.target.closest(".sipick")) closePicker(false);
  if (S.menu && !e.target.closest(".menu")) { S.menu = null; renderMenu(); }
  if (S.keysOpen && !e.target.closest("#keys") && !e.target.closest('[data-sb="keys"]')) { S.keysOpen = false; renderKeys(); renderStatus(); }
});
$("#overlay").addEventListener("mousedown", (e) => {
  if (e.target.dataset && e.target.dataset.ovl) { e.preventDefault(); if (S.pal) closePalette(); if (S.confirm) { S.confirm = null; render(); } }
});
$("#overlay").addEventListener("click", (e) => {
  if (e.target.closest("#dlg-cancel")) { S.confirm = null; render(); listEl.focus({ preventScroll: true }); }
  else if (e.target.closest("#dlg-ok")) { deleteGroup(S.confirm.path); listEl.focus({ preventScroll: true }); }
  const pi = e.target.closest("[data-pi]");
  if (pi && S.pal) { const it = S.pal.items[+pi.dataset.pi]; if (it) it.run(e.shiftKey); }
});
$("#overlay").addEventListener("mousemove", (e) => {
  const pi = e.target.closest("[data-pi]");
  if (pi && S.pal && +pi.dataset.pi !== S.pal.idx) { S.pal.idx = +pi.dataset.pi; $$(".pi").forEach((x) => x.classList.toggle("on", +x.dataset.pi === S.pal.idx)); }
});

/* ---------- keyboard ---------- */
document.addEventListener("keydown", (e) => {
  // Cmd+K / Ctrl+K: the one global combo (the dashboard already owns it). No browser-owned combos.
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if (S.pal) closePalette(); else if (!S.legacy) openPalette();
    return;
  }
  if (S.pal) return;
  if (e.key === "Escape") {
    if (S.confirm) { S.confirm = null; render(); listEl.focus({ preventScroll: true }); return; }
    if (S.menu) { S.menu = null; renderMenu(); return; }
    if (S.keysOpen) { S.keysOpen = false; renderKeys(); renderStatus(); return; }
  }
  if (S.confirm || S.legacy) return;
  if (e.metaKey || e.ctrlKey || e.altKey || typing(document.activeElement)) return;
  // The list key: a single unmodified key, outside text fields, shows or hides the list.
  if (e.key === "\\") { e.preventDefault(); setList(!S.listCollapsed); return; }
  // list keys: only when the list itself has focus
  if (document.activeElement !== listEl) return;
  const flat = S.flat;
  const i = flat.findIndex((r) => r.k === S.focusRow);
  const cur = flat[i];
  const targetKeys = () => (S.sel.size ? Array.from(S.sel) : cur ? [cur.k] : []);
  const move = (d) => {
    if (!flat.length) return;
    const ni = i < 0 ? 0 : Math.max(0, Math.min(flat.length - 1, i + d));
    S.focusRow = flat[ni].k;
    renderList();
    const el = $(".row.focus", listEl); if (el) el.scrollIntoView({ block: "nearest" });
  };
  switch (e.key) {
    case "j": case "ArrowDown": move(1); break;
    case "k": case "ArrowUp": move(-1); break;
    case "Enter": case "o": if (cur) openRow(cur.k); break;
    case "x": if (cur) toggleSel(cur.k); break;
    case "e": if (targetKeys().length) triage(targetKeys(), "done"); break;
    case "l": if (targetKeys().length) triage(targetKeys(), "later"); break;
    case "u": if (targetKeys().length) { toggleRead(targetKeys()); S.sel.clear(); render(); } break;
    case "m": if (targetKeys().length) openPalette("group", { purpose: "move", keys: targetKeys() }); break;
    case "v": if (cur) openRow(cur.k, "split"); break;
    case "t": if (cur) openRow(cur.k, "newtab"); break;
    case "n": goNextUnread(); break;
    case "c": openNewTab(defaultStartGroup()); break;
    case "ArrowRight": if (cur && cur.tkey && !cur.sid && S.threadFolds[cur.tkey]) { delete S.threadFolds[cur.tkey]; render(); } break;
    case "ArrowLeft": if (cur && cur.tkey) { S.focusRow = "t:" + cur.tkey; S.threadFolds[cur.tkey] = true; render(); } break;
    case "Escape": if (S.sel.size) { S.sel.clear(); render(); } break;
    default: return;
  }
  e.preventDefault();
});

window.addEventListener("resize", () => { if (S.menu) { S.menu = null; renderMenu(); } if (S.picker) closePicker(false); hideTip(); });

/* ---------- tooltips: [data-tip] shows the dashboard-style tooltip on hover and on keyboard focus ---------- */
const tipEl = $("#tip");
let tipT = null, tipFor = null, tipMute = null;
function showTip(el) {
  if (!el.isConnected || !el.dataset.tip) return;
  tipEl.textContent = el.dataset.tip;
  tipEl.hidden = false;
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let top = r.top - h - 6;
  if (top < 8) top = r.bottom + 6;
  tipEl.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + "px";
  tipEl.style.top = top + "px";
}
function hideTip() { clearTimeout(tipT); tipT = null; tipFor = null; tipEl.hidden = true; }
document.addEventListener("pointerover", (e) => {
  const t = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (t === tipFor) return;
  // After a click the DOM re-renders under a still pointer. Keep the tip closed until the pointer moves away.
  if (tipMute && Math.hypot(e.clientX - tipMute.x, e.clientY - tipMute.y) < 6) { hideTip(); tipFor = t; return; }
  tipMute = null;
  const warm = !tipEl.hidden;
  hideTip();
  if (!t) return;
  tipFor = t;
  tipT = setTimeout(() => showTip(t), warm ? 0 : 300);
});
document.addEventListener("pointermove", (e) => { if (tipMute && Math.hypot(e.clientX - tipMute.x, e.clientY - tipMute.y) >= 6) tipMute = null; });
document.addEventListener("focusin", (e) => {
  const t = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (t && t.matches(":focus-visible")) { hideTip(); tipFor = t; showTip(t); }
});
document.addEventListener("focusout", (e) => { if (tipFor && e.target === tipFor) hideTip(); });
document.addEventListener("pointerdown", (e) => { hideTip(); tipMute = { x: e.clientX, y: e.clientY }; tipFor = e.target.closest ? e.target.closest("[data-tip]") : null; }, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); }, true);

/* ============================================================
   boot
   ============================================================ */
(function boot() {
  const q = new URLSearchParams(location.search);
  applyTheme(q.get("theme") === "dark" ? "dark" : "light");
  (q.get("expand") || "").split(",").map((x) => x.trim().toLowerCase()).filter(Boolean).forEach((k) => { if (k in S.srcOpen) S.srcOpen[k] = true; });
  if (q.get("group")) S.group = q.get("group");
  const open = SESS[q.get("open")] ? q.get("open") : "s1";
  const bg = ALL.find((s) => s.finishesInSeconds);
  S.panes = [{ tabs: [open], active: open }];
  if (bg && bg.id !== open) S.panes[0].tabs.push(bg.id);
  SESS[open].read = true;
  const sp = q.get("split");
  if (sp && SESS[sp] && sp !== open) {
    const p0 = S.panes[0], at = p0.tabs.indexOf(sp);
    if (at >= 0) p0.tabs.splice(at, 1);
    S.panes.push({ tabs: [sp], active: sp });
    SESS[sp].read = true;
  }
  S.focusRow = "s:" + open;
  S.legacy = q.get("legacy") === "1";
  if (S.legacy) S.legacySel = D.legacy.some((x) => x.id === open) ? open : D.legacy[0].id;
  render();
  // ?new=<group key> or ?new=none opens a new-session tab with that group picked.
  const nw = q.get("new");
  if (nw != null && !S.legacy) openNewTab(normStart(nw));
  else if (!S.legacy && !S.listCollapsed) { listEl.focus({ preventScroll: true }); renderMidFoot(); }

  // A background session finishes about 8 s after load: its tab and row light up as unread.
  if (bg) {
    setTimeout(() => {
      const s = bg;
      s.status = "completed"; s.last = nowIso();
      const visible = paneSids().includes(s.id) && !S.legacy;
      s.read = visible;
      S.flash.add(s.id);
      render();
      setTimeout(() => { S.flash.delete(s.id); }, 1600);
      if (!visible && !S.legacy) toast('"' + s.title + '" finished.', "Open", () => openSession(s.id));
    }, (bg.finishesInSeconds || 8) * 1000);
  }
})();
</script>
