<!doctype html>
<!--
  Round 10, phones: three interactive phone frames of index.html side by side. The list, a multi-person session (?open=sB1),
  and a Slack channel thread (?sources=dm,channels&open=sB2). Each frame passes a fake notch (59 px) and home indicator (34 px) and draws them, so the safe-area padding shows. Mockup chrome only.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Swarm · Sessions on a phone · Round 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../session-logs/demo-shared.css" />
<style>
:root{--pw:390px;--ph:844px;--bezel:9px;--hover:oklch(0.943 0.003 286.375)}
html.dark{--hover:oklch(0.274 0.006 286.033)}
html,body{height:100%}
body{overflow-x:hidden;background:var(--surface);font-size:14px}
button{font-family:inherit;color:inherit}
svg.i{width:15px;height:15px;flex:none}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;max-width:1340px;margin:0 auto;padding:18px 24px 0}
.mark{width:20px;height:20px;flex:none;color:var(--foreground)}
.top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.kick{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);border-left:1px solid var(--border);padding-left:12px;white-space:nowrap}
.note{flex:1 1 280px;min-width:0;margin:0;font-size:13px;color:var(--muted-foreground)}
.lnk{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px;font-size:12.5px;font-weight:500;color:var(--muted-foreground);text-decoration:none;border-radius:6px;white-space:nowrap}
.lnk:hover{color:var(--foreground);background:var(--hover)}
.lnk:focus-visible,.seg button:focus-visible,.rst:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
/* the light and dark switch: a segmented control */
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--border);border-radius:9px;background:var(--background)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:0;border-radius:6px;background:none;font-size:12.5px;font-weight:500;color:var(--muted-foreground);cursor:pointer}
.seg button svg{width:14px;height:14px}
.seg button:hover{color:var(--foreground)}
.seg button[aria-pressed="true"]{background:var(--muted);color:var(--foreground)}
/* the stage: the frames at their real size, scaled down to fit the window (no horizontal scroll) */
.stage{position:relative;margin:22px auto 28px}
.frames{position:absolute;left:0;top:0;width:max-content;display:flex;gap:44px;transform-origin:0 0}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px}
.phone{position:relative;padding:var(--bezel);border-radius:50px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .05),0 30px 60px -30px oklch(0 0 0 / .35)}
html.dark .phone{box-shadow:0 1px 2px oklch(0 0 0 / .4),0 30px 60px -30px oklch(0 0 0 / .8)}
.phone iframe{display:block;width:var(--pw);height:var(--ph);border:0;border-radius:41px;background:var(--background)}
/* the device chrome over the frame: the status bar (59 px, with the Dynamic Island) and the home indicator (34 px).
   index.html pads for both through ?sat= and ?sab=. Neither takes a tap. */
.sbar{position:absolute;left:var(--bezel);right:var(--bezel);top:var(--bezel);height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 44px;border-radius:41px 41px 0 0;pointer-events:none;color:var(--foreground);font-size:15px;font-weight:600;letter-spacing:-.01em}
.sbar .isl{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.sbar .glyphs{display:inline-flex;align-items:center;gap:6px}
.sbar svg{width:17px;height:17px}
.hind{position:absolute;left:50%;bottom:calc(var(--bezel) + 8px);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--foreground);opacity:.85;pointer-events:none}
figcaption{display:flex;align-items:center;gap:8px;min-height:28px;font-size:13px;font-weight:500}
figcaption .n{width:20px;height:20px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--border);background:var(--background);font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
figcaption code{font-family:var(--font-mono);font-size:11.5px;font-weight:400;color:var(--muted-foreground)}
.rst{width:26px;height:26px;display:grid;place-items:center;padding:0;border:0;border-radius:7px;background:none;color:var(--muted-foreground);cursor:pointer}
.rst:hover{color:var(--foreground);background:var(--hover)}
.rst svg{width:14px;height:14px}
</style>
</head>
<body>
<header class="top">
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
  <h1>Sessions on a phone</h1>
  <span class="kick">Round 10 · Mobile</span>
  <p class="note">Tap to navigate. Swipe rows left or right. Long-press to select.</p>
  <a class="lnk" href="index.html"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>Desktop view</a>
  <div class="seg" role="group" aria-label="Theme for all three phones">
    <button type="button" data-theme="light" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>Light</button>
    <button type="button" data-theme="dark" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>Dark</button>
  </div>
</header>
<main class="stage" id="stage"><div class="frames" id="frames"></div></main>

<script>
"use strict";
// Each frame is the real index.html at phone width (390 x 844), so every tap, swipe, and sheet works.
// guide=0 keeps the first-visit guide from opening in all three at once. ?firstrun=1 in the Mock menu shows it.
const FRAMES = [
  { q: "", label: "List", code: "index.html" },
  { q: "open=sB1", label: "Multi-person session", code: "?open=sB1" },
  { q: "sources=dm,channels&open=sB2", label: "Slack channel thread", code: "?sources=dm,channels&open=sB2" },
];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const RESET = '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
// The device chrome: the time, signal, Wi-Fi, and battery around the Dynamic Island, and the home indicator.
const G = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>";
const CHROME = '<div class="sbar" aria-hidden="true"><span>9:41</span><span class="isl"></span><span class="glyphs">' +
  G('<path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/>') +
  G('<path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/>') +
  G('<path d="M10 10v4"/><path d="M14 10v4"/><path d="M22 14v-4"/><path d="M6 10v4"/><rect x="2" y="6" width="16" height="12" rx="2"/>') +
  '</span></div><div class="hind" aria-hidden="true"></div>';
let theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
// sat / sab: the notch and the home indicator in px, so index.html pads for them (an iframe has no safe area)
const srcOf = (f) => "index.html?" + [f.q, "guide=0", "sat=59", "sab=34", theme === "dark" ? "theme=dark" : ""].filter(Boolean).join("&");

function build() {
  $("#frames").innerHTML = FRAMES.map((f, i) =>
    '<figure><div class="phone"><iframe id="ph-' + i + '" src="' + esc(srcOf(f)) + '" title="Phone ' + (i + 1) + ": " + esc(f.label) + '"></iframe>' + CHROME + "</div>" +
    '<figcaption><span class="n" aria-hidden="true">' + (i + 1) + "</span>" + esc(f.label) + " <code>" + esc(f.code) + "</code>" +
    '<button class="rst" type="button" data-reset="' + i + '" aria-label="Reset phone ' + (i + 1) + '" title="Reset this phone">' + RESET + "</button></figcaption></figure>").join("");
  fit();
}
// The switch sets ?theme= on all three frames, which reloads them, and on this page.
function setTheme(t) {
  theme = t;
  document.documentElement.classList.toggle("dark", t === "dark");
  document.querySelectorAll("[data-theme]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === t)));
  FRAMES.forEach((f, i) => { const fr = $("#ph-" + i); if (fr) fr.src = srcOf(f); });
  try { history.replaceState(null, "", location.pathname + (t === "dark" ? "?theme=dark" : "")); } catch (e) { /* file:// may refuse */ }
}
// Scale the frames down when the window is narrower (or shorter) than the three phones. Never scale up.
function fit() {
  const fr = $("#frames"), st = $("#stage");
  const w = fr.offsetWidth, h = fr.offsetHeight, top = st.getBoundingClientRect().top + scrollY;
  const k = Math.min(1, (document.documentElement.clientWidth - 32) / w, Math.max(0.45, (innerHeight - top - 28) / h));
  fr.style.transform = k < 1 ? "scale(" + k + ")" : "";
  st.style.width = Math.floor(w * k) + "px";
  st.style.height = Math.ceil(h * k) + "px";
}
document.querySelector(".seg").addEventListener("click", (e) => { const b = e.target.closest("[data-theme]"); if (b && b.dataset.theme !== theme) setTheme(b.dataset.theme); });
$("#frames").addEventListener("click", (e) => {
  const b = e.target.closest("[data-reset]"); if (!b) return;
  const i = +b.dataset.reset, fr = $("#ph-" + i);
  fr.src = "about:blank";
  setTimeout(() => { fr.src = srcOf(FRAMES[i]); }, 30);
});
window.addEventListener("resize", fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
document.documentElement.classList.toggle("dark", theme === "dark");
document.querySelectorAll("[data-theme]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === theme)));
build();
</script>
</body>
</html>
