<!doctype html>
<!--
  Round 10: message anatomy, Copy, and long titles. A person's avatar sits beside the bubble, and the meta row (time, via note, Copy) sits under it.
  The swarm's replies lose the mark and get a footer with the time and Copy. Every title truncates on one line with a tooltip.
  Round 9: polish. The icons, status glyphs, avatars, and motion now match the shipped apps/ui primitives (TaskStatusIcon, StatusBadge, AgentAvatar, lucide, the DESIGN.md motion tokens).
  Every overlay has an exit, sheets drag from anywhere, the tab strip handles overflow, and the phone gets keyboard, scroll-anchor, and tap-target fixes. Layout and behavior stay as in round 8.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Agent Swarm · Sessions · A+B merged</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../session-logs/demo-shared.css" />
<style>
/* ============ local tokens ============ */
:root{
  --hover: oklch(0.943 0.003 286.375);
  --border-subtle: oklch(0.945 0.003 286);
  --on-primary: oklch(0.985 0 0);
  --tree-w: 320px;
  --rail-w: 48px;
  /* the two named curves of DESIGN.md § Motion (globals.css --ease-snappy and --ease-swift) */
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --ease-snappy: cubic-bezier(0.2, 0, 0, 1);
  --ease-swift: cubic-bezier(0.32, 0.72, 0, 1);
  --ov: oklch(0.141 0.005 285.823 / 0.28);
  --input: oklch(0.92 0.004 286.32);
  /* round 9: the pale status set of apps/ui globals.css (2026-08-06), so the chips read as shipped */
  --success: oklch(0.74 0.1 163); --success-strong: oklch(0.5 0.09 163);
  --active: oklch(0.81 0.11 75); --active-strong: oklch(0.55 0.1 68);
  --error: oklch(0.72 0.12 25); --error-strong: oklch(0.51 0.14 25);
  --paused: oklch(0.71 0.1 262); --paused-strong: oklch(0.5 0.1 262);
  --neutral: oklch(0.62 0.014 286);
  /* the saturated stops TaskStatusIcon uses for the done disc and the active ring */
  --success-solid: oklch(0.627 0.194 149.2); --active-solid: oklch(0.666 0.179 58.318);
  /* AgentAvatar colors (action-* tokens) */
  --ag-violet: oklch(0.606 0.25 292.717); --ag-cyan: oklch(0.715 0.143 215.221); --ag-indigo: oklch(0.585 0.233 277.117); --ag-pink: oklch(0.656 0.241 354.308); --ag-blue: oklch(0.623 0.214 259.815);
  /* phone frames in mobile.html pass a fake notch and home indicator (an iframe has no safe area) */
  --sat: 0px; --sab: 0px; --kb: 0px;
}
html.dark{
  --hover: oklch(0.274 0.006 286.033);
  --border-subtle: oklch(1 0 0 / 8%);
  --on-primary: oklch(0.21 0.006 285.885);
  --ov: oklch(0 0 0 / 0.5);
  --input: oklch(1 0 0 / 15%);
  --success: oklch(0.78 0.1 163); --success-strong: oklch(0.78 0.1 163);
  --active: oklch(0.84 0.1 80); --active-strong: oklch(0.84 0.1 80);
  --error: oklch(0.74 0.11 22); --error-strong: oklch(0.74 0.11 22);
  --paused: oklch(0.74 0.09 260); --paused-strong: oklch(0.74 0.09 260);
  --neutral: oklch(0.72 0.012 286);
  --success-solid: oklch(0.723 0.219 149.6); --active-solid: oklch(0.769 0.188 70.08);
  --ag-violet: oklch(0.702 0.183 293.541); --ag-cyan: oklch(0.789 0.154 211.53); --ag-indigo: oklch(0.673 0.182 276.935); --ag-pink: oklch(0.718 0.202 349.761); --ag-blue: oklch(0.707 0.165 254.624);
}
/* one color per person (the dashboard's --color-peer-N, lib/comb/presence.ts peerColor): no amber, no yellow */
:root{
  --peer-1: oklch(0.52 0.16 25); --peer-2: oklch(0.52 0.16 350); --peer-3: oklch(0.52 0.16 320); --peer-4: oklch(0.52 0.16 290);
  --peer-5: oklch(0.52 0.16 260); --peer-6: oklch(0.52 0.1 230); --peer-7: oklch(0.52 0.08 190); --peer-8: oklch(0.52 0.14 150);
  --peer-fg: oklch(0.985 0 0);
}
html.dark{
  --peer-1: oklch(0.79 0.12 25); --peer-2: oklch(0.79 0.13 350); --peer-3: oklch(0.79 0.13 320); --peer-4: oklch(0.79 0.11 290);
  --peer-5: oklch(0.79 0.1 260); --peer-6: oklch(0.79 0.13 230); --peer-7: oklch(0.79 0.13 190); --peer-8: oklch(0.79 0.13 150);
  --peer-fg: oklch(0.141 0.005 285.823);
}
html.dark .btn.primary{color:var(--on-primary)}
html,body{height:100%;overflow:hidden}
body{font-size:14px}
button{font-family:inherit;color:inherit}
kbd{font-family:var(--font-mono);font-size:11px;line-height:1;padding:3px 5px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--muted-foreground);white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:14px;height:14px;flex:none}
.smk{width:12px;height:12px;flex:none;display:inline-block;vertical-align:-2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.btn.sm{height:28px;padding:0 10px;font-size:12px;gap:6px}
.btn.sm svg{width:14px;height:14px}
.btn.danger{color:var(--error-strong);border-color:color-mix(in oklch,var(--error) 35%,var(--border))}
.btn.danger:hover{background:color-mix(in oklch,var(--error) 10%,transparent)}
/* Button press and hover, as the [data-slot="button"] block in globals.css: colors enter at once and release after
   50 ms over 200 ms (the linger), the press scales to .97 in 100 ms and eases back in 200 ms. */
.btn,.ib{transition:background-color .2s var(--ease-snappy) 50ms,color .2s var(--ease-snappy) 50ms,border-color .2s var(--ease-snappy) 50ms,opacity .12s,transform .2s var(--ease-snappy)}
.btn:hover,.ib:hover{transition:background-color 0s,color 0s,border-color 0s,opacity .12s,transform .2s var(--ease-snappy)}
.btn:active,.ib:active{transform:scale(.97);transition-duration:0s,0s,0s,.12s,.1s}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:none;border-radius:8px;color:var(--muted-foreground);cursor:pointer;flex:none}
.ib:hover{background:var(--hover);color:var(--foreground)}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--foreground)}
.ib:focus-visible,.btn:focus-visible,.lnk:focus-visible,.sb:focus-visible,.srcsec:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.ib svg{width:14px;height:14px}
/* TaskStatusIcon (components/shared/task-status-icon.tsx): one 16-grid ring family. Only a live line turns (3 s). */
.tsi{width:14px;height:14px;flex:none;display:block}
.tsi[data-v="active"]{color:var(--active-solid)}
.tsi[data-v="done"]{color:var(--success-solid)}
.tsi[data-v="failed"]{color:var(--error-strong)}
.tsi[data-v="paused"]{color:var(--paused-strong)}
.tsi[data-v="pending"]{color:color-mix(in oklch,var(--neutral) 40%,transparent)}
html.dark .tsi[data-v="active"] .pale{stroke-opacity:.45}
.tsi.live{animation:spin 3s linear infinite}
/* the swarm's mark: lucide Hexagon, a plain outline */
.hx{width:14px;height:14px;flex:none;color:var(--foreground)}
/* AgentAvatar (components/shared/agent-avatar.tsx): a colored disc with the agent's lucide icon, white, stroke 2.25 */
.agav{width:20px;height:20px;flex:none;display:inline-grid;place-items:center;border-radius:50%;background:var(--agc,var(--ag-blue));color:#fff;box-shadow:0 1px 2px oklch(0 0 0 / .08)}
.agav svg{width:12px;height:12px}
.agav.sm{width:24px;height:24px}
.agav.sm svg{width:14px;height:14px}
.lnk{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;font-size:12.5px;font-weight:500;color:var(--primary);cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}

/* ============ app shell ============ */
/* round 9: the global app sidebar in icon mode (shadcn Sidebar collapsible="icon", 3rem). On /sessions the dashboard
   collapses it on mount, so the sessions sidebar and the panes keep their width. A stub: the links go nowhere. */
#app{height:calc(100dvh - var(--kb));display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-rows:46px minmax(0,1fr) 28px;min-width:0}
#app>.hdr,#app>.shell,#app>#legacy,#app>.statusbar{grid-column:2}
.grail{grid-column:1;grid-row:1 / -1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;border-right:1px solid var(--border);background:var(--surface)}
.grail .glogo{width:28px;height:28px;display:grid;place-items:center;margin-bottom:10px;color:var(--foreground)}
.grail .glogo svg{width:20px;height:20px}
.grail .ib{width:32px;height:32px}
.grail .ib svg{width:16px;height:16px}
.grail .ib[aria-current="page"]{background:var(--hover);color:var(--foreground)}
.grail .gsp{flex:1}
.hdr{display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:var(--background);min-width:0}
.hdr .crumb{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.hdr .kick{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);border-left:1px solid var(--border);padding-left:10px;white-space:nowrap}
.hdr .sp{flex:1}
.hdr .lnk{color:var(--muted-foreground);font-size:12.5px;padding:0 6px;height:30px}
.hdr .lnk:hover{color:var(--foreground)}

.shell{min-height:0;min-width:0;display:grid;grid-template-columns:var(--tree-w) minmax(0,1fr)}
#tree{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border)}
#right{min-height:0;min-width:0;display:flex;position:relative;background:var(--background)}
.is-legacy .shell{display:none}
#legacy{display:none}
.is-legacy #legacy{display:grid}

/* ============ sidebar: sections > groups > sessions ============ */
.sbh{flex:none;position:relative;display:flex;align-items:center;gap:2px;height:42px;padding:0 8px 0 16px;border-bottom:1px solid var(--border-subtle)}
.sbh h2{margin:0;flex:1;min-width:0;font-size:13px;font-weight:600;letter-spacing:-.005em}
.sbh .ib{position:relative}
.sbh .ib[aria-pressed="true"],.sbh .ib[aria-expanded="true"]{color:var(--foreground);background:var(--hover)}
.fdot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px var(--surface)}
.bulk{position:absolute;inset:0 0 -1px;z-index:4;display:flex;align-items:center;gap:1px;padding:0 6px 0 14px;background:color-mix(in oklch,var(--primary) 8%,var(--surface));border-bottom:1px solid color-mix(in oklch,var(--primary) 32%,var(--border))}
.bulk .cnt{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap}
.qbar{flex:none;display:flex;align-items:center;gap:8px;margin:8px 8px 2px;height:30px;padding:0 3px 0 10px;border-radius:8px;border:1px solid color-mix(in oklch,var(--primary) 40%,var(--border));background:color-mix(in oklch,var(--primary) 6%,var(--background));font-size:12px}
.qbar svg{width:13px;height:13px;color:var(--primary);flex:none}
.qbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .btn{height:24px;padding:0 8px;font-size:11.5px}
.tscroll{flex:1;min-height:0;overflow-y:auto;padding:6px 0 14px;outline:none;overscroll-behavior:contain}
.tscroll::-webkit-scrollbar{width:8px}
.tscroll::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 25%,transparent);border-radius:9px}
.lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}

/* section headers: MY GROUPS, SHARED WITH ME, SLACK, TELEGRAM. Plain: the title, then the number of sessions on the right. */
.tsec{position:relative;display:flex;align-items:center;gap:6px;height:30px;margin:12px 6px 0;padding:0 8px 0 12px}
.tsec .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsec .tcount{flex:none;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}

/* rows: group rows and session rows share the indent and the guide line */
.tr{position:relative;display:flex;align-items:center;gap:6px;height:28px;margin:0 6px;padding:0 6px 0 calc(6px + var(--lv,0) * 14px);border-radius:6px;font-size:13px;color:var(--foreground);cursor:pointer;user-select:none;transition:background .2s var(--ease) .05s}
.tr:hover{background:var(--hover);transition:none}
/* the linger is for the pointer only: a j/k cursor moves with no trail (DESIGN.md § Motion) */
.tscroll.kb .tr{transition:none}
.kid::before{content:"";position:absolute;left:calc(var(--lv) * 14px);top:0;bottom:0;border-left:1px solid var(--border);pointer-events:none}
.tic{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--muted-foreground)}
.tic svg{width:14px;height:14px}
.tic .smk{width:13px;height:13px;color:var(--foreground)}
.tlbl{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tsp{flex:1 1 0;min-width:0}
.tr.box .tlbl{font-weight:600}
/* the dropdown chevron: only on a group that has subgroups, the one fold control */
.gchev{width:18px;height:18px;flex:none;display:grid;place-items:center;margin-left:-2px;padding:0;border:0;border-radius:4px;background:none;color:var(--muted-foreground);cursor:pointer}
.gchev svg{width:13px;height:13px;transform:rotate(-90deg);transition:transform .15s var(--ease)}
[aria-expanded="true"]>.gchev svg{transform:none}
.gchev:hover{color:var(--foreground);background:color-mix(in oklch,var(--muted-foreground) 18%,var(--hover))}
.glock{flex:none;display:inline-grid;place-items:center;vertical-align:-1px;color:var(--muted-foreground)}
.glock svg{width:12px;height:12px}
.tr.addg{color:var(--muted-foreground)}
.tr.addg:hover{color:var(--foreground)}
.ownav{width:16px;height:16px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;letter-spacing:.02em;background:var(--muted);border:1px solid var(--border);color:var(--foreground)}
/* group actions ("..." and "+"): they appear to the left of the counts and never cover them */
.tacts{position:relative;flex:none;width:0;height:24px}
/* revealed on hover: in at once, out with the row's linger (50 ms, then 200 ms) */
.tacts>span{position:absolute;right:0;top:0;display:flex;gap:1px;padding-left:4px;border-radius:6px;background:var(--hover);opacity:0;pointer-events:none;transition:opacity .2s var(--ease) 50ms}
.tr:hover .tacts>span,.tr:focus-within .tacts>span,.tscroll.kb .tr.focus .tacts>span{opacity:1;pointer-events:auto;transition:none}
.tbtn{width:24px;height:24px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:6px;background:none;color:var(--muted-foreground);cursor:pointer}
.tbtn svg{width:14px;height:14px}
.tbtn:hover{color:var(--foreground);background:color-mix(in oklch,var(--muted-foreground) 18%,var(--hover))}
.tbtn:focus-visible{outline:2px solid var(--ring);outline-offset:-1px}
.tbtn[data-act="gnew"]{color:var(--foreground)}
.tinp{flex:1;min-width:0;height:22px;padding:0 6px;border:1px solid var(--ring);border-radius:5px;background:var(--background);color:var(--foreground);font:inherit;font-size:12.5px;font-weight:500;outline:none;box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 35%,transparent)}
.dragging .tr[data-drop="1"]::after{content:"";position:absolute;inset:1px;border:1px dashed color-mix(in oklch,var(--primary) 55%,transparent);border-radius:6px;pointer-events:none}
.tr.dz-hot{background:color-mix(in oklch,var(--primary) 12%,transparent)}
.tr.dz-hot::after{border-style:solid !important;border-color:var(--primary) !important}

/* counts: the same words as the rows. "3 unread", "1 needs you", a spinner for running */
.cns{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:5px}
.cn{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.cn.u{border:1px solid var(--border);background:var(--background);color:var(--foreground)}
.cn.n{border:1px solid color-mix(in oklch,var(--primary) 50%,transparent);background:color-mix(in oklch,var(--primary) 11%,transparent);color:var(--active-strong)}
.cn.r,.cn.t{padding:0 2px;font-family:var(--font-mono);font-weight:400;color:var(--muted-foreground)}
.cn .tsi{width:12px;height:12px}
.gly{position:relative;width:14px;height:14px;flex:none;display:grid;place-items:center}
.gly .tsi{width:12px;height:12px}
/* needs you: lucide Hourglass in amber (mobile-now.tsx), not a second dot beside the unread dot */
.gly .hg{width:12px;height:12px;color:var(--primary)}
.gd{display:block;width:6px;height:6px;border-radius:50%}
.gd.unread{background:var(--foreground)}
@keyframes spin{to{transform:rotate(360deg)}}
/* a user-initiated reveal (a new row, a moved row): one 600 ms fade back to the element's own background (no "to" frame) */
@keyframes lit{from{background-color:color-mix(in oklch,var(--primary) 22%,transparent)}}

/* session rows: [left slot: unread dot, or a checkbox on hover] [source] title [group label] [people] [activity] [time] */
.tr.ses{height:26px}
.ud{width:6px;height:6px;flex:none;border-radius:50%}
.unread .ud{background:var(--foreground)}
.ls{position:relative;width:16px;height:16px;flex:none;display:grid;place-items:center}
.ls>*{grid-area:1/1}
/* the shadcn Checkbox (to add to components/ui): size-4, rounded 4 px, border-input, checked fills primary with a 14 px check */
.cbx{display:none;width:16px;height:16px;place-items:center;border-radius:4px;border:1px solid var(--input);background:var(--background);color:var(--on-primary);cursor:pointer;box-shadow:0 1px 2px oklch(0 0 0 / .05)}
html.dark .cbx{background:color-mix(in oklch,var(--input) 30%,transparent)}
.cbx svg{width:14px;height:14px;visibility:hidden}
.cbx:hover{border-color:color-mix(in oklch,var(--muted-foreground) 60%,var(--input))}
.ses:hover .cbx,.tscroll.kb .ses.focus .cbx,.tscroll.selmode .ses .cbx{display:grid}
.ses:hover .ud,.tscroll.kb .ses.focus .ud,.tscroll.selmode .ses .ud{display:none}
.ses.sel .cbx{background:var(--primary);border-color:var(--primary)}
.ses.sel .cbx svg{visibility:visible}
.gtag{flex:0 1 auto;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:400;color:var(--muted-foreground)}
.ses .srcm{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--foreground)}
.ses .srcm .smk{width:12px;height:12px}
.ses .stl{flex:1;min-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted-foreground)}
.ses.unread .stl{font-weight:600;color:var(--foreground)}
.tm{flex:none;min-width:22px;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;white-space:nowrap}
.ses.unread .tm{color:var(--foreground)}
.tm.wake{display:inline-flex;align-items:center;gap:3px}
.tm.wake svg{width:12px;height:12px}
.act{flex:none;display:inline-flex;align-items:center}
.npill{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:6px;border:1px solid color-mix(in oklch,var(--primary) 50%,transparent);background:color-mix(in oklch,var(--primary) 11%,transparent);color:var(--active-strong);font-size:11px;font-weight:600;line-height:1;white-space:nowrap}
.ppl{flex:none;display:inline-flex;align-items:center;padding-left:4px}
/* one Avatar per person everywhere: the peer color (--color-peer-N), a ring in the surface color */
.pav{width:16px;height:16px;flex:none;margin-left:-4px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:7.5px;font-weight:700;letter-spacing:0;background:var(--pc,var(--muted));color:var(--peer-fg);box-shadow:0 0 0 2px var(--surface)}
.ses:hover .pav,.ses.open .pav,.tscroll.kb .focus .pav{box-shadow:0 0 0 2px var(--hover)}
.pav.more{background:var(--muted);color:var(--muted-foreground);font-weight:400}
.ses.open{background:var(--hover)}
.ses.open .stl{color:var(--foreground)}
.ses.open::after{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--primary)}
.ses.sel{background:color-mix(in oklch,var(--primary) 13%,transparent)}
.ses.sel:hover{background:color-mix(in oklch,var(--primary) 18%,transparent)}
.tscroll.kb .focus{box-shadow:inset 0 0 0 1.5px var(--ring)}
.tscroll.kb .focus:not(.sel){background:var(--hover)}
.tr.flash{animation:lit .6s var(--ease)}
.tr.more{color:var(--muted-foreground)}
.tr.more .tlbl{font-weight:500}
.tr.more svg{width:14px;height:14px}
/* empty state inside the sidebar: icon and text centered in their block, both ways */
.tempty{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:68px;margin:0 6px;padding:10px 12px 10px calc(12px + var(--lv,0) * 14px);text-align:center;font-size:12px;line-height:1.45;color:var(--muted-foreground)}
.tempty>svg{width:16px;height:16px;margin-bottom:2px}
.tempty b{font-weight:500;color:var(--foreground)}
.tempty kbd{padding:1px 4px}
.tempty .lnk{margin-top:2px;font-size:12px}
.tempty .lnk svg{width:12px;height:12px}
.tempty .btn{margin-top:6px}
.tempty.big{min-height:150px;gap:6px}
.tempty.big>svg{width:20px;height:20px}

/* the one search: a field at the top of the sidebar. "/" focuses it. The ⌘K chip opens the command palette. */
.sqw{flex:none;position:relative;z-index:5;padding:8px 8px 4px}
.sq{display:flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 9px;border:1px solid var(--border);border-radius:8px;background:var(--background);color:var(--muted-foreground);cursor:text;transition:border-color .12s,box-shadow .12s}
.sq:hover{border-color:color-mix(in oklch,var(--muted-foreground) 40%,var(--border))}
.sq:focus-within{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 30%,transparent)}
.sq>svg{width:14px;height:14px;flex:none}
.sq input{flex:1;min-width:0;height:100%;padding:0;border:0;outline:0;background:none;font:inherit;font-size:13px;color:var(--foreground)}
.sq input::placeholder{color:var(--muted-foreground)}
.sq.on{border-color:color-mix(in oklch,var(--primary) 45%,var(--border))}
.sqx{width:22px;height:22px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:none;color:var(--muted-foreground);cursor:pointer}
.sqx[hidden]{display:none}
.sqx svg{width:13px;height:13px}
.sqx:hover{color:var(--foreground);background:var(--hover)}
.sqk{flex:none;display:grid;place-items:center;height:22px;padding:0;border:0;border-radius:5px;background:none;cursor:pointer}
.sqk kbd{padding:2px 5px}
.sqk:hover kbd{color:var(--foreground);border-color:color-mix(in oklch,var(--muted-foreground) 45%,var(--border))}
.sqx:focus-visible,.sqk:focus-visible{outline:2px solid var(--ring);outline-offset:0}
/* search tips: shown while the field has focus and is empty */
/* "/" opens these from the keyboard, so they fade only (no scale): keyboard-initiated actions get no movement */
.sqtips{position:absolute;left:8px;right:8px;top:calc(100% + 2px);padding:5px;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -14px oklch(0 0 0 / .3);animation:fade .1s var(--ease)}
.sqtips[hidden]{display:none}
.sqt{display:flex;align-items:center;gap:10px;width:100%;height:28px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:12.5px;color:var(--muted-foreground);text-align:left;cursor:pointer}
.sqt:hover{background:var(--hover);color:var(--foreground)}
.sqt:focus-visible{outline:none;background:var(--hover);color:var(--foreground);box-shadow:inset 0 0 0 2px color-mix(in oklch,var(--ring) 60%,transparent)}
.sqt code{flex:none;min-width:84px;font-family:var(--font-mono);font-size:11.5px;color:var(--foreground)}
.sqtips .mnote{max-width:none;margin-top:4px}
/* search results: the match is marked, and a match outside the title says where it is */
mark{background:color-mix(in oklch,var(--primary) 24%,transparent);color:inherit;border-radius:2px;padding:0 1px;margin:0 -1px}
.mh{flex:none;font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.pav.hit{border-color:var(--primary);color:var(--active-strong)}
/* "View all N": opens the whole group in a tab */
.tr.more.all{color:var(--foreground)}
.tr.more.all svg{color:var(--muted-foreground)}

/* the resize handle */
.rsz{position:absolute;top:0;bottom:0;right:-4px;width:8px;z-index:6;cursor:col-resize;outline:none;touch-action:none}
.rsz::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .15s var(--ease)}
.rsz:hover::after,.rsz.on::after,.rsz:focus-visible::after{background:var(--primary)}
body.resizing{cursor:col-resize;user-select:none}

/* hover card on a session row: the latest output, read without opening */
#hcard{position:fixed;z-index:75;width:300px;padding:10px 12px 11px;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -14px oklch(0 0 0 / .3);pointer-events:none;transform-origin:left center;animation:pop .15s var(--ease)}
#hcard.kb{animation:fade .1s var(--ease)}
#hcard[hidden]{display:none}
.hc1{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.hc1 span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc1 svg{width:12px;height:12px;flex:none}
.hct{margin-top:5px;font-size:13.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.hcp{margin-top:5px;font-size:12.5px;line-height:1.5;color:var(--muted-foreground);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.hcp b{color:var(--foreground);font-weight:600}
.hcf{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:9px;font-size:11.5px;color:var(--muted-foreground)}
.hcf .mono{font-size:11px}

/* ============ pane 3: editor (tabs + split) ============ */
.egroup{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.egroup+.egroup{border-left:1px solid var(--border)}
.tabs{flex:none;display:flex;align-items:stretch;height:38px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.tstrip{display:flex;align-items:stretch;flex:1;min-width:0}
.tablist{display:flex;align-items:stretch;flex:0 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
/* round 9: an edge fade only while there is more strip on that side */
.tablist.fl{-webkit-mask-image:linear-gradient(to right,transparent,#000 16px);mask-image:linear-gradient(to right,transparent,#000 16px)}
.tablist.fr{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent)}
.tablist.fl.fr{-webkit-mask-image:linear-gradient(to right,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(to right,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.tabnew,.tabmore{align-self:center;margin:0 2px 0 4px}
.tabmore{margin:0 0 0 2px}
.tabmore[hidden]{display:none}
.tablist::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:6px;flex:0 1 auto;min-width:144px;max-width:240px;height:38px;padding:0 5px 0 9px;border-right:1px solid var(--border-subtle);color:var(--muted-foreground);font-size:12.5px;cursor:pointer;user-select:none;background:transparent;outline:none;transition:background .2s var(--ease) .05s}
/* the ring sits inside the tab, so the strip's overflow never clips it */
.tab:focus-visible{box-shadow:inset 0 0 0 2px color-mix(in oklch,var(--ring) 60%,transparent)}
.tab:hover{color:var(--foreground);background:color-mix(in oklch,var(--hover) 70%,transparent);transition:none}
.tab.on{background:var(--background);color:var(--foreground)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--background)}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--border)}
.egroup.focused .tab.on::before{background:var(--primary)}
.tab .ud{width:6px;height:6px}
.tab .tic{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--muted-foreground)}
.tab .tic svg{width:14px;height:14px}
.tab .tic .smk{width:12px;height:12px}
.tab.on .tic{color:var(--foreground)}
.tab .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.unread .tt{font-weight:600;color:var(--foreground)}
/* needs you on a tab: a 7 px amber dot, so the title keeps its width */
.tab .ndot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--active-solid)}
.tab .x{width:20px;height:20px;flex:none;display:grid;place-items:center;border:0;padding:0;border-radius:6px;background:none;color:var(--muted-foreground);cursor:pointer;opacity:0;transition:opacity .2s var(--ease) 50ms}
.tab .x svg{width:12px;height:12px}
.tab .x:hover{background:color-mix(in oklch,var(--muted-foreground) 18%,transparent);color:var(--foreground)}
.tab.on .x,.tab:hover .x,.tab .x:focus-visible{opacity:1}
.tab:hover .x{transition:none}
.tab.ins-b{box-shadow:inset 2px 0 0 var(--primary)}
.tab.ins-a{box-shadow:inset -2px 0 0 var(--primary)}
.tab.dragsrc{opacity:.5}
.tab.flash{animation:lit .6s var(--ease)}
.tabacts{display:flex;align-items:center;gap:1px;padding:0 6px;flex:none;border-left:1px solid var(--border-subtle)}

/* the pane is a size container: the header meta line drops items when the pane is narrow (round 8) */
.pane{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;container:pane / inline-size}
.dh{position:relative;flex:none;padding:10px 16px 10px 20px;border-bottom:1px solid var(--border)}
/* header row 1: the crumb (and the thread link or "Shared by"), then presence, People, triage, and Share */
.dh1{display:flex;align-items:center;gap:8px;min-height:28px;min-width:0}
.dcrumb{display:flex;align-items:center;gap:6px;min-width:0;flex:0 1 auto;background:none;border:0;border-radius:6px;padding:2px 4px;margin:-2px -4px;cursor:pointer;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);text-align:left;outline:none}
.dcrumb:focus-visible{box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 60%,transparent)}
.dcrumb svg{width:12px;height:12px;flex:none}
.dcrumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcrumb:hover span{color:var(--foreground);text-decoration:underline;text-underline-offset:3px}
.dh1 .lnk{flex:0 1 auto;min-width:0;font-size:11.5px;white-space:nowrap}
.dh1 .lnk svg{width:12px;height:12px;flex:none}
.dh1 .lnk span{overflow:hidden;text-overflow:ellipsis}
.dshr{flex:0 1 auto;min-width:0;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dshr::before{content:"·";margin-right:8px}
.dsp{flex:1 1 0;min-width:0}
.dacts{display:flex;align-items:center;gap:1px;flex:none}
.dvr{width:1px;height:16px;flex:none;margin:0 2px;background:var(--border)}
.back{display:none}
/* header row 2: the title (it truncates), then the meta line on the right */
.dtitle{margin:0;font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* round 9: the meta line gives way before the title does. The title keeps at least 55 % (or 22rem). */
.dmeta{display:flex;align-items:center;flex:0 1 auto;min-width:0;overflow:hidden;gap:10px;font-size:12px;color:var(--muted-foreground);white-space:nowrap}
.dmeta .mono{font-size:11.5px}
@container pane (max-width:1039px){ .dmeta .m-start{display:none} }
@container pane (max-width:879px){ .dmeta .m-cost{display:none} }
@container pane (max-width:719px){ .dmeta .m-ws,.dmeta .m-wake{display:none} }
@container pane (max-width:599px){ .dmeta .m-tasks,.dmeta .hof span{display:none} }
/* rename: a pencil on hover or focus, and an inline input (as shipped in [rootTaskId]/page.tsx) */
/* round 10: a 0 basis, so a 120-character title takes only the room the meta line leaves (never more than its share) */
.dtw{flex:1 1 0;min-width:min(55%,22rem);display:flex;align-items:center;gap:2px}
.dtw .dtitle{flex:0 1 auto;min-width:0}
.dren{width:24px;height:24px;opacity:0;transition:opacity .2s var(--ease) 50ms}
.dren svg{width:14px;height:14px}
.dh:hover .dren,.dren:focus-visible{opacity:1;transition:none}
.dtin{flex:1;min-width:0;height:30px;margin:-2px 0 -2px -7px;padding:0 6px;border:1px solid var(--ring);border-radius:7px;background:var(--background);color:var(--foreground);font:inherit;font-size:17px;font-weight:600;letter-spacing:-.015em;outline:none;box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 30%,transparent)}
.dtin::placeholder{color:var(--muted-foreground);font-weight:500}
/* .av: initials chips, kept for the frozen Legacy replica only */
.av{width:20px;height:20px;flex:none;display:grid;place-items:center;font-size:8.5px;font-weight:700;letter-spacing:.02em;border:1px solid var(--border);background:var(--muted);color:var(--foreground)}
/* agents in a stack (AvatarStack, -space-x-1.5) */
.avs{display:inline-flex;align-items:center}
.avs .agav{box-shadow:0 0 0 2px var(--background)}
.avs .agav+.agav{margin-left:-6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--border);color:var(--muted-foreground);white-space:nowrap}
/* StatusBadge (size sm): an outline badge, the TaskStatusIcon at 14 px, the label in the tone of the state */
.chip.st{gap:6px;padding:0 6px;font-size:9px;font-weight:500;letter-spacing:.06em}
.chip.st .tsi{width:14px;height:14px}
.chip.ok{color:var(--success-strong)}
.chip.run{color:var(--active-strong)}
.chip.err{color:var(--error-strong)}
.chip.pause{color:var(--paused-strong)}
.chip.ext{border-style:dashed}
/* triage is where the session is filed, not its status: muted sentence case with the action's icon (Archive, AlarmClock) */
.tri{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted-foreground);white-space:nowrap}
.tri svg{width:12px;height:12px}
.chip.needs{border-color:color-mix(in oklch,var(--primary) 55%,transparent);color:var(--active-strong);background:color-mix(in oklch,var(--primary) 9%,transparent)}

/* overflow-anchor off: the app decides (follow the newest line, or hold still for a click-driven expand) */
.tls{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none}
.tls::-webkit-scrollbar{width:9px}
.tls::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 25%,transparent);border-radius:9px}
.tl{max-width:760px;margin:0 auto;padding:22px 24px 28px;display:flex;flex-direction:column;gap:18px}
.ti{position:relative;min-width:0}
.tmeta{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);padding:0 2px;white-space:nowrap}
.bub{padding:9px 14px;border-radius:16px 4px 16px 16px;background:var(--muted);font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.th{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;font-size:12px;color:var(--muted-foreground);min-height:20px}
.th b{font-weight:600;color:var(--foreground)}
.txt{margin-top:3px;font-size:14px;line-height:1.55;color:var(--foreground);overflow-wrap:anywhere}
/* the live lead line: the turning active ring and .shimmer-text, the one liveness vocabulary (StatusLine) */
.wk{display:inline-flex;align-items:center;gap:8px;margin-top:7px;font-size:12.5px;font-weight:500}
.shim{background:linear-gradient(90deg,var(--muted-foreground) 0%,var(--foreground) 50%,var(--muted-foreground) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shim 2s linear infinite}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.ask{min-width:0;padding:11px 14px 13px;border-radius:10px;border:1px solid color-mix(in oklch,var(--primary) 45%,var(--border));background:color-mix(in oklch,var(--primary) 5%,var(--background))}
.ask .txt{font-weight:500}
.askb{display:flex;gap:8px;margin-top:11px}
.ask.done{border-color:var(--border);background:var(--surface)}
.ask.done .txt{font-weight:400;color:var(--muted-foreground)}
.tnote{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-foreground)}
.tnote svg{width:13px;height:13px;color:var(--success-strong)}

/* human messages: the avatar beside the bubble, then the meta row under it. Other people on the left, mine on the right.
   Round 10: the avatar centers on the bubble's first line: 9 px padding + half of a 14 x 1.55 line - half of 24 px. */
.ti-hm{display:flex;align-items:flex-start;gap:10px;min-width:0}
.ti-hm.o{padding-right:48px}
.ti-hm.me{flex-direction:row-reverse;padding-left:48px}
.hav{width:24px;height:24px;flex:none;margin-top:8px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.02em;background:var(--pc,var(--muted));color:var(--peer-fg)}
.o>.hav{margin-top:9px} /* the bubble of other people has a 1 px border */
.hav.sl{background:var(--surface);border:1px dashed color-mix(in oklch,var(--muted-foreground) 45%,transparent);color:var(--muted-foreground)}
.hw{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;max-width:85%}
.me .hw{align-items:flex-end}
/* one row under the bubble, on its outer edge: the time (and the name of other people), a via note, then Copy */
.hmeta{display:flex;align-items:flex-start;gap:6px;max-width:100%;min-width:0;min-height:16px;font-size:11.5px;line-height:16px;color:var(--muted-foreground)}
.me .hmeta{justify-content:flex-end;text-align:right}
.hmeta .tmeta{flex:none;padding:0;line-height:16px}
.hsep{flex:none}
.hvia{flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.hvia .smk{margin-right:5px;vertical-align:-2px}
.bub.o{border-radius:4px 16px 16px 16px;background:var(--card);border:1px solid var(--border)}
.bub.sl{background:var(--surface);border:1px dashed color-mix(in oklch,var(--muted-foreground) 32%,transparent);color:var(--muted-foreground);font-size:13.5px}
/* the swarm's reply: no name, no avatar, no mark (round 10). The text, then a footer with the time and Copy. */
.ltx{font-size:14px;line-height:1.6;color:var(--foreground);overflow-wrap:anywhere}
.lfoot{display:flex;align-items:center;gap:6px;min-height:16px;margin-top:5px;color:var(--muted-foreground)}
.lfoot .tmeta{padding:0;line-height:16px}
.lfoot .chip{letter-spacing:.07em;margin:-2px 0}
.ti-lead>.wk:first-child{margin-top:0}
/* an approval keeps the swarm mark and the time above its card */
.lmeta{display:flex;align-items:center;gap:6px;min-height:20px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.lmeta .hx{width:14px;height:14px;flex:none;color:var(--foreground)}
/* Copy (round 10, OutcomeCopyShell): 24 px, a 12 px icon, always mounted. Only its opacity changes (150 ms), so
   nothing moves when it shows. The -4 px margins keep a 16 px row. Hover-only on desktop, muted on swarm replies. */
.cpy{position:relative;width:24px;height:24px;flex:none;display:inline-grid;place-items:center;margin:-4px -4px -4px -2px;padding:0;border:0;border-radius:6px;background:none;color:var(--muted-foreground);cursor:pointer;opacity:0;transition:opacity .15s var(--ease-snappy),background-color .2s var(--ease-snappy) 50ms,color .2s var(--ease-snappy) 50ms}
.cpy svg{width:12px;height:12px}
.ti-hm:hover .cpy,.stx:hover .cpy,.cpy.on{opacity:.7}
.cpy.ld{opacity:.6}
.cpy:hover{opacity:1;background:var(--hover);color:var(--foreground);transition:opacity .15s var(--ease-snappy),background-color 0s,color 0s}
.cpy:focus-visible{opacity:1;outline:2px solid var(--ring);outline-offset:1px}
@media (hover:none){ .cpy.hv{opacity:.7} }
/* a step output: the text, with Copy at its top right (the text keeps clear of it) */
.stx{position:relative;padding-right:26px}
.stx>.cpy{position:absolute;top:-2px;right:0;margin:0}
.steps{display:flex;flex-direction:column;gap:2px;margin-top:9px;padding:1px 0 1px 12px;border-left:2px solid var(--border)}
/* AnimatedReveal speed="fast": the wrapper of a folded block grows (150 ms) and shrinks (120 ms), ease-snappy */
.rv[hidden]{display:none}
.rv.anim{overflow:hidden}
.ti-lead.nolead .steps,.ti-lead.nolead .wsum{margin-top:0}
/* round 8: the worker steps under a reply fold into one line. A click opens the steps (the block below). */
.wsum{display:flex;align-items:center;gap:7px;width:fit-content;max-width:100%;min-width:0;min-height:26px;margin:7px 0 0 -4px;padding:2px 8px 2px 4px;border:0;border-radius:7px;background:none;font:inherit;font-size:12.5px;color:var(--muted-foreground);text-align:left;cursor:pointer;transition:background .2s var(--ease) .05s}
.wsum:hover{background:var(--hover);color:var(--foreground);transition:none}
.wsum:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.wsum>svg.i{width:12px;height:12px;flex:none;transform:rotate(-90deg);transition:transform .15s var(--ease)}
.wsum[aria-expanded="true"]>svg.i{transform:none}
.wsum .wtx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsum .wtx b{font-weight:600;color:var(--foreground)}
.wsum .wtx.shim b{color:inherit;-webkit-text-fill-color:transparent}
.wsum .wx{flex:none;white-space:nowrap}
.wsum .wx.bad{color:var(--error-strong)}
.wavs{display:inline-flex;flex:none}
.wavs .agav{box-shadow:0 0 0 2px var(--background)}
.wavs .agav+.agav{margin-left:-6px}
.wsum:hover .wavs .agav{box-shadow:0 0 0 2px var(--hover)}
.wsum+.rv>.steps{margin-top:4px}
.st{min-width:0;padding:4px 0}
.sth{display:flex;align-items:center;gap:6px;width:100%;min-width:0;min-height:22px;padding:0;border:0;background:none;font:inherit;font-size:12.5px;color:var(--muted-foreground);text-align:left}
button.sth{cursor:pointer;border-radius:5px}
button.sth:hover .sout,button.sth:hover>svg{color:var(--foreground)}
button.sth:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.sth>svg.i{width:12px;height:12px;flex:none;transform:rotate(-90deg);transition:transform .15s var(--ease)}
.sth[aria-expanded="true"]>svg.i{transform:none}
.sth b{flex:none;font-weight:600;color:var(--foreground)}
.sth .sdot{flex:none}
.sth .sty{flex:none;font-family:var(--font-mono);font-size:11.5px}
.sth .sout{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sth .sout.bad{color:var(--error-strong)}
.sth .stm{flex:none;margin-left:auto;padding-left:8px;font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.sic{width:16px;height:16px;flex:none;display:grid;place-items:center}
.sic svg{width:14px;height:14px}
.stx{margin:2px 0 0 22px;font-size:13.5px;line-height:1.55;color:var(--foreground);overflow-wrap:anywhere}
.tries{margin:6px 0 2px 22px;padding:8px 10px;list-style:none;display:flex;flex-direction:column;gap:8px;border-radius:8px;background:var(--surface);border:1px solid var(--border-subtle)}
.tries li{min-width:0}
.tries .tth{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground)}
.tries .tth .tsi{width:12px;height:12px}
.tries .tth b{font-weight:600;color:var(--error-strong)}
.tries .ttx{margin-top:2px;font-size:13px;line-height:1.5;color:var(--foreground);overflow-wrap:anywhere}
/* an internal handoff (Handoffs on): a quiet row in the steps */
.st.int .sth{color:var(--muted-foreground)}
.st.int .sic{color:var(--muted-foreground)}
.st.int .itx{min-width:0;font-size:12.5px;line-height:1.45;white-space:normal;overflow-wrap:anywhere}
.st.int .chip{flex:none;height:18px;padding:0 6px;border-style:dashed}
/* Round 10: "Lena is typing" is a bubble row at the end of the timeline, in the flow: it takes its own space, so it
   covers nothing. Other people's bubble (background, radius, padding) holds three dots that pulse in turn (1.2 s).
   It fades in (150 ms) and out (100 ms, its space folds at the same time), on ease-snappy. The words are in the
   always-mounted .typing live region (screen readers only). */
.ti-typing{opacity:0;transition:opacity .1s var(--ease-snappy)}
.ti-typing.on{opacity:1;transition-duration:.15s}
.tybub{display:flex;align-items:center;gap:4px;box-sizing:content-box;height:1.55em;color:var(--muted-foreground)}
.tybub i{width:6px;height:6px;flex:none;border-radius:50%;background:currentColor;opacity:.3;animation:tydot 1.2s ease-in-out infinite}
.tybub i:nth-child(2){animation-delay:.2s}
.tybub i:nth-child(3){animation-delay:.4s}
@keyframes tydot{0%,70%,100%{opacity:.3}35%{opacity:1}}
/* the shipped "Latest" pill (session-conversation.tsx). Round 10: its bottom edge sits 10 px above the composer box
   (the composer wrapper's top padding), centered on the timeline column. It moves up as the composer grows, so it
   never covers it, and it paints over the typing bubble. Fades 150 ms in, 100 ms out. */
.latest{position:absolute;left:calc(50% - var(--sbw,0px) / 2);bottom:100%;z-index:2;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border:1px solid var(--border);border-radius:999px;background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 8px 20px -10px oklch(0 0 0 / .3);font:inherit;font-size:12px;font-weight:500;color:var(--foreground);cursor:pointer;translate:-50% 0;opacity:0;pointer-events:none;transition:opacity .1s var(--ease-snappy)}
.latest.on{opacity:1;pointer-events:auto;transition-duration:.15s}
.latest svg{width:14px;height:14px}
.latest:hover{background:var(--hover)}
.latest:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
/* my own message, just sent: a small enter (user-initiated). Polled and incoming items never animate. */
.ti-hm.fresh .bub{animation:own-in .15s var(--ease-snappy) both}
@keyframes own-in{from{opacity:0;transform:translateY(4px)}}

/* ============ sharing and presence (as shipped in #2249) ============ */
/* header row 2 (round 8): the title on the left, the meta line on the right */
.dh2{display:flex;align-items:center;gap:16px;margin-top:5px;min-width:0;min-height:30px}
/* header row 1, right side: the people here now, the People pill, triage, and the owner's Share icon */
.dside{display:flex;align-items:center;gap:6px;flex:none}
.pres{display:flex;align-items:center;padding-left:6px}
.pa{position:relative;width:24px;height:24px;flex:none;margin-left:-6px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.02em;background:var(--pc,var(--muted));color:var(--peer-fg);box-shadow:0 0 0 2px var(--background);outline:none;cursor:default}
.pa:focus-visible{box-shadow:0 0 0 2px var(--background),0 0 0 4px color-mix(in oklch,var(--ring) 60%,transparent)}
.pa.more{background:var(--muted);color:var(--foreground);font-weight:400}
/* the Handoffs toggle: end of the meta line, only when the session has internal handoffs */
.hof{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 2px;border:0;border-radius:4px;background:none;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground);cursor:pointer;white-space:nowrap}
.hof:hover,.hof[aria-pressed="true"]{color:var(--foreground)}
.hof:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.hof svg{width:12px;height:12px}
/* the People pill: the users icon and how many people, no word */
.pbtn .pcnt{font-family:var(--font-mono);font-size:11.5px;color:var(--foreground);font-variant-numeric:tabular-nums}
/* the read-only notice in place of the composer */
.cmpro.ro{border-radius:12px;background:color-mix(in oklch,var(--muted) 40%,transparent);padding:13px 16px;font-size:13.5px}
.cmpro.ro svg{width:15px;height:15px}
/* the Share dialog (share-session-dialog.tsx): add people, each person's access, general access. Every change saves at once. */
.sdlg{position:relative;margin-top:13vh;width:min(448px,calc(100vw - 32px));display:flex;flex-direction:column;gap:16px;padding:20px 22px 18px 24px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:0 2px 4px oklch(0 0 0 / .06),0 30px 70px -24px oklch(0 0 0 / .45);animation:pop .2s var(--ease)}
.ovl.still,.sdlg.still,.dlg.still,.menu.still{animation:none !important}
.sdh{display:flex;align-items:center;gap:8px;min-width:0}
.sdh h3{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdh .ib{margin-right:-6px}
.sdsec{display:flex;flex-direction:column;gap:4px;min-width:0}
.sdlab{margin:0;font-size:12px;font-weight:500;color:var(--muted-foreground)}
.sdl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.sdp{display:flex;align-items:center;gap:10px;min-width:0;padding:6px 0}
.sav{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;font-weight:700;background:var(--pc,var(--muted));color:var(--peer-fg)}
.sdw{display:flex;flex-direction:column;flex:1;min-width:0}
.sdw .nm{font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdw .em{font-size:12px;line-height:1.35;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdown{flex:none;padding:0 8px;font-size:12px;color:var(--muted-foreground)}
/* a select that looks like the dashboard's SelectTrigger (size sm) */
.selw{position:relative;display:inline-flex;flex:none}
.selw>svg{position:absolute;right:8px;top:50%;width:13px;height:13px;margin-top:-6.5px;color:var(--muted-foreground);pointer-events:none}
.ssel{appearance:none;-webkit-appearance:none;height:28px;width:120px;padding:0 26px 0 10px;border:1px solid var(--border);border-radius:7px;background:var(--background);font:inherit;font-size:12px;color:var(--foreground);cursor:pointer;box-shadow:0 1px 2px oklch(0 0 0 / .04)}
.ssel:hover{background:var(--hover)}
.ssel:focus-visible{outline:none;border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 35%,transparent)}
.ssel option{color:var(--foreground);background:var(--card)}
.ssel option.rm{color:var(--error-strong)}
.selw.ghost .ssel{width:auto;height:28px;padding:0 26px 0 6px;border-color:transparent;box-shadow:none;background:transparent;font-size:14px}
.selw.ghost .ssel:hover{background:var(--muted)}
.sdga{display:flex;align-items:center;gap:10px;min-width:0}
.gico{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--muted);color:var(--muted-foreground)}
.gico svg{width:14px;height:14px}
.gcol{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.gcol .sdesc{padding:0 6px;font-size:12px;color:var(--muted-foreground)}
.sdf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.sdf .btn svg{width:13px;height:13px}
/* "Add people…": a searchable person picker (SearchableSelect) */
.sdadd{position:relative}
.sdtrig{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px 0 12px;border:1px solid var(--border);border-radius:8px;background:var(--background);font:inherit;font-size:14px;color:var(--muted-foreground);cursor:pointer;box-shadow:0 1px 2px oklch(0 0 0 / .04);text-align:left}
.sdtrig span{flex:1;min-width:0}
.sdtrig svg{width:14px;height:14px}
.sdtrig:hover{background:var(--hover)}
.sdtrig:focus-visible,.sdtrig[aria-expanded="true"]{outline:none;border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 32%,transparent)}
.sdpop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:3;display:flex;flex-direction:column;max-height:240px;border-radius:8px;transform-origin:top center;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -14px oklch(0 0 0 / .3);overflow:hidden;animation:pop .15s var(--ease)}
.sdopts{flex:1;min-height:0;overflow-y:auto;padding:4px}
.sdopts .po{height:36px}
.sdopts .po .sav{width:22px;height:22px;font-size:9.5px}
.sdopts .po .pl{flex:0 1 auto}
.sdopts .po .hint{flex:1;min-width:0;font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdopts .pempty{padding:16px 10px}
/* People popover: share level on the right, the "Everyone" row, and "Share…" for the owner */
.prow .lvl{flex:none;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}
.pava.pc{background:var(--pc);border-color:transparent;color:var(--peer-fg);font-family:var(--font-mono)}
.pava.gl svg{width:14px;height:14px;color:var(--muted-foreground)}
.vnow.typ{color:var(--foreground)}

.cmp{position:relative;flex:none;padding:10px 16px 14px 20px}
.cmpb{max-width:760px;margin:0 auto;border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .04);transition:border-color .12s,box-shadow .12s}
.cmpb:focus-within{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 32%,transparent)}
.cmpto{display:flex;align-items:center;gap:7px;padding:8px 12px 0;font-size:11.5px;color:var(--muted-foreground);line-height:1.35}
.cmpb textarea{display:block;width:100%;resize:none;border:0;outline:0;background:none;padding:10px 12px 4px;font:inherit;font-size:14px;line-height:1.5;color:var(--foreground);min-height:44px;max-height:140px}
.cmpb textarea::placeholder{color:var(--muted-foreground)}
.cmpf{display:flex;align-items:center;gap:8px;padding:4px 6px 6px 12px;font-size:11px;color:var(--muted-foreground)}
.cmpf .sp{flex:1}
#right.two .cmpf .kh{display:none}
/* new-session tab: empty state with the composer in the middle of the pane */
.pane.nt{position:relative}
.pane.nt>.back{position:absolute;top:10px;left:10px;z-index:1}
.nsw{flex:1;min-height:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:24px}
.nsbox{width:100%;max-width:640px;min-width:0}
.nsh{margin:0;font-size:20px;line-height:1.4;font-weight:600;letter-spacing:-.015em;text-align:center}
.nss{margin:4px 0 18px;font-size:13px;line-height:1.5;color:var(--muted-foreground);text-align:center}
.cmpb.ns textarea{padding:14px 14px 6px}
.cmpb.ns .cmpf{gap:6px;padding:6px 8px 8px 10px}
.silab{font-size:12px;color:var(--muted-foreground);white-space:nowrap}
.sipick{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:280px;height:28px;padding:0 6px 0 8px;border:1px solid var(--border);border-radius:7px;background:var(--background);font-size:12.5px;color:var(--foreground);cursor:pointer;transition:background .2s var(--ease) .05s}
.sipick:hover{background:var(--hover);transition:none}
.sipick[aria-expanded="true"]{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 30%,transparent)}
.sipick:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.sipick svg{width:13px;height:13px;color:var(--muted-foreground)}
.spath{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spath .par,.po .par{color:var(--muted-foreground)}
.cmpro{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--muted-foreground)}
.cmpro svg{width:13px;height:13px}
.nopane{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted-foreground);font-size:13px;padding:24px}
.nopane b{display:block;color:var(--foreground);font-size:15px;margin-bottom:6px}

/* group tab ("View all"): the whole group, newest first, with its own search, status pills, and paging */
.pane.gt{position:relative}
.gtw{width:100%;max-width:920px;margin:0 auto;padding:0 24px}
.gth{position:relative;flex:none;border-bottom:1px solid var(--border)}
.gth .gtw{display:flex;align-items:center;gap:8px;min-height:52px;min-width:0}
.gth .gic{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--muted-foreground)}
.gth .gic svg{width:16px;height:16px}
.gth .gic .smk{width:14px;height:14px;color:var(--foreground)}
.gtt{margin:0;min-width:0;font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtt .par{font-weight:500;color:var(--muted-foreground)}
.gtn{flex:none;margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
/* the bulk bar spans the header, and its content lines up with the centered column */
.gth .bulk{padding-left:max(24px,calc((100% - 920px) / 2 + 24px));padding-right:max(18px,calc((100% - 920px) / 2 + 18px))}
.gtbar{flex:none}
.gtbar .gtw{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding-top:12px;padding-bottom:6px}
.gtbar .sq{width:300px;max-width:100%}
/* round 9: the status filter is the SegmentedControl (size sm): exclusive options in one bordered track */
.pills{display:inline-flex;align-items:center;gap:2px;height:28px;padding:2px;border:1px solid var(--border);border-radius:8px;background:color-mix(in oklch,var(--muted) 40%,transparent)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:100%;padding:0 8px;border:0;border-radius:5px;background:none;font-size:12px;font-weight:500;color:var(--muted-foreground);cursor:pointer;white-space:nowrap;outline:none;transition:color .2s var(--ease) 50ms,background-color .2s var(--ease) 50ms}
.pill:hover{color:var(--foreground);transition:none}
.pill b{font-family:var(--font-mono);font-weight:400;font-size:11px;font-variant-numeric:tabular-nums;opacity:.8}
.pill[aria-checked="true"]{background:var(--primary);color:var(--on-primary);box-shadow:0 1px 2px oklch(0 0 0 / .08)}
html.dark .pill[aria-checked="true"]{color:var(--on-primary)}
.pill:focus-visible{box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 60%,transparent)}
.gtlist{padding:4px 0 20px}
.gtlist .tr{margin:0}
.gtlist .tr.ses{height:32px;padding-left:8px;padding-right:8px}
.gtlist .gtag{max-width:170px}
.gtlist .ses.open::after{left:0}
.gtlist .gtag{font-weight:400}
.gtfoot{display:flex;align-items:center;gap:12px;margin-top:8px;padding:12px 8px 0;border-top:1px solid var(--border-subtle);font-size:12px;color:var(--muted-foreground)}
.gtfoot .mono{font-size:11.5px}
.gtfoot .btn{margin-left:auto}
.gtlist .tempty{min-height:220px;margin:0}

/* drop zone over the editor */
.dz{position:absolute;z-index:20;pointer-events:none;display:grid;place-items:center;border:2px dashed color-mix(in oklch,var(--primary) 60%,transparent);background:color-mix(in oklch,var(--primary) 8%,transparent);border-radius:10px;margin:6px}
.dz[hidden]{display:none}
.dz span{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--foreground);box-shadow:0 1px 2px oklch(0 0 0 / .06)}

/* ============ status bar ============ */
.statusbar{display:flex;align-items:center;gap:2px;padding:0 8px;border-top:1px solid var(--border);background:var(--surface);font-size:11.5px;color:var(--muted-foreground);min-width:0;overflow:hidden}
.sb{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border:0;border-radius:5px;background:none;font-size:11.5px;color:inherit;cursor:pointer;white-space:nowrap}
.sb:hover{background:var(--hover);color:var(--foreground)}
.sb b{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;color:var(--foreground)}
.sb svg{width:12px;height:12px}
.sb .gly{width:12px;height:12px}
.sb .gly svg{width:12px;height:12px}
.sb .gd{width:6px;height:6px}
.sb.n-needs b{color:var(--active-strong)}
.sb[aria-pressed="true"]{background:color-mix(in oklch,var(--primary) 14%,transparent);color:var(--active-strong)}
.sb[aria-pressed="true"] b{color:var(--active-strong)}
.sb.hl{color:var(--foreground);background:var(--hover)}
.sb kbd{padding:1px 4px;font-size:11px}
.statusbar .sp{flex:1}
.sbt{display:inline-flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap}
.sbt svg{width:12px;height:12px}
.sbdiv{width:1px;height:12px;background:var(--border);margin:0 4px;flex:none}
.statusbar .rt{display:contents}
/* the "Mock" menu: mockup chrome to switch variants, not part of the design */
.sb.mock{gap:7px}
.sb.mock .mtag{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:4px;border:1px dashed color-mix(in oklch,var(--muted-foreground) 55%,transparent);font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.sb.mock svg{width:12px;height:12px;transform:rotate(180deg)}
.sb.mock[aria-expanded="true"]{background:var(--hover);color:var(--foreground)}
.menu .mi .mq{flex:none;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.menu .mi .mck{width:14px;flex:none;display:grid;place-items:center;color:var(--primary)}
.menu .mi .mck svg{color:var(--primary)}

/* ============ overlays ============ */
.menu{position:fixed;z-index:80;min-width:208px;padding:5px;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -14px oklch(0 0 0 / .3);animation:pop .15s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
/* Round 9: every overlay leaves. A closed overlay moves into an .xghost layer (ids stripped, inert) and runs its exit
   there with the Web Animations API (see ghostOut), so the next render never waits on it. CSS entrances stay off in
   the ghost. Menus, popovers, tooltips: 100 ms. Dialogs: 150 ms. Phone sheets: 250 ms on the swift curve. */
.xghost{position:fixed;inset:0;z-index:96;pointer-events:none}
.xghost,.xghost *{animation:none !important;transition:none !important}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:13px;text-align:left;cursor:pointer}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi svg{width:14px;height:14px;color:var(--muted-foreground)}
.mi span{flex:1}
.menu.tabsm{max-width:360px}
.mi .mtl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi kbd{padding:2px 5px;font-size:11px}
.mi.dz-i{color:var(--error-strong)}
.mi.dz-i svg{color:var(--error-strong)}
.msep{height:1px;margin:4px 2px;background:var(--border-subtle)}
.mlab{padding:6px 8px 4px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}

.ovl{position:fixed;inset:0;z-index:90;background:var(--ov);display:flex;justify-content:center;align-items:flex-start;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}}
.pal{margin-top:12vh;width:min(620px,calc(100vw - 32px));max-height:72vh;display:flex;flex-direction:column;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:0 2px 4px oklch(0 0 0 / .06),0 30px 70px -24px oklch(0 0 0 / .45);overflow:hidden;animation:pop .2s var(--ease)}
.palin{flex:none;display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-bottom:1px solid var(--border)}
.palin svg{width:16px;height:16px;color:var(--muted-foreground)}
.palin input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--foreground)}
.palin input::placeholder{color:var(--muted-foreground)}
.palmode{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;background:var(--hover);font-size:12px;font-weight:600;white-space:nowrap}
/* round 10: the move chip carries a session title. It takes at most 60 % of the field row, and the title truncates. */
#pal-mode{display:flex;flex:0 1 auto;min-width:0;max-width:60%}
.palmode{max-width:100%;min-width:0}
.palmode>span{flex:none}
/* the quotes hug the title: no flex gap on either side of it */
.palmode .pmt{flex:0 1 auto;min-width:0;margin-left:-5px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.palmode .pmt+span{margin-left:-5px}
.pallist{flex:1;min-height:0;overflow-y:auto;padding:6px}
.psec{padding:8px 8px 4px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.pi{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:7px;cursor:pointer;font-size:13.5px;min-width:0}
.pi.on{background:var(--hover)}
.pi .pic{width:18px;display:grid;place-items:center;color:var(--muted-foreground);flex:none}
.pi .pic svg{width:15px;height:15px}
.pi .pl{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* round 10: an action label ("Move to group…") keeps its width, so a long session title in the sub line truncates first */
.pi .pl.fix{flex-shrink:0;max-width:75%}
.pi .ps{flex:1 1 auto;min-width:0;font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi kbd{flex:none}
.pi .pl .smk{margin-right:5px}
.pi .gly{margin:0 auto}
.palfoot{flex:none;display:flex;gap:14px;align-items:center;height:34px;padding:0 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted-foreground);background:var(--surface)}
.palfoot span{display:inline-flex;align-items:center;gap:5px}
.palfoot kbd{padding:2px 4px;font-size:11px}
.pempty{padding:26px 12px;text-align:center;font-size:13px;color:var(--muted-foreground)}

/* "Start in" picker: a searchable dropdown under the composer's group button */
.pick{position:fixed;z-index:86;display:flex;flex-direction:column;max-height:380px;border-radius:8px;transform-origin:top left;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -14px oklch(0 0 0 / .3);overflow:hidden;animation:pop .15s var(--ease)}
.pickin{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-bottom:1px solid var(--border)}
.pickin svg{width:14px;height:14px;color:var(--muted-foreground)}
.pickin input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:13px;color:var(--foreground)}
.pickin input::placeholder{color:var(--muted-foreground)}
.picklist{flex:1;min-height:0;overflow-y:auto;padding:4px}
.po{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;font-size:13px;cursor:pointer;min-width:0}
.po.on{background:var(--hover)}
.po svg{width:14px;height:14px;color:var(--muted-foreground);flex:none}
.po .pl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po .pck{color:var(--primary)}
.pickfoot{flex:none;padding:7px 10px;border-top:1px solid var(--border-subtle);background:var(--surface);font-size:11.5px;line-height:1.4;color:var(--muted-foreground)}

/* tooltip (the dashboard's Tooltip: foreground fill, background text). A key shows as a chip after the name. */
#tip{position:fixed;z-index:99;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:320px;padding:4px 5px 4px 9px;border-radius:6px;background:var(--foreground);color:var(--background);font-size:12px;font-weight:500;line-height:1.35;white-space:normal;animation:pop .15s var(--ease)}
#tip kbd{white-space:nowrap}
#tip>span{min-width:0;overflow-wrap:anywhere} /* a long branch name or URL in a title wraps inside the 320 px tip */
#tip.nokey{padding:5px 9px}
#tip[hidden]{display:none}
#tip kbd{background:color-mix(in oklch,var(--background) 14%,transparent);border-color:color-mix(in oklch,var(--background) 30%,transparent);color:var(--background);padding:2px 5px}

.dlg{margin-top:22vh;width:min(420px,calc(100vw - 32px));padding:20px 20px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:0 30px 70px -24px oklch(0 0 0 / .45);animation:pop .2s var(--ease)}
.dlg h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.dlg p{margin:8px 0 0;font-size:13.5px;line-height:1.55;color:var(--muted-foreground)}
.dlgb{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted-foreground)}
.btn.ghost:hover{background:var(--hover);color:var(--foreground)}

/* Later (snooze) menu and the source filter menu */
.mi .mt{flex:none;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.mi.chk{cursor:pointer}
.mi.chk input{width:15px;height:15px;margin:0;flex:none;accent-color:var(--primary)}
.mi.chk input:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.mi.chk .smk{width:13px;height:13px;color:var(--foreground)}
/* a disabled row: an operator setting the user cannot change here */
.mi.off{cursor:default;color:var(--muted-foreground);white-space:nowrap}
.mi.off:hover{background:none}
.mi.off:focus-visible{background:var(--hover)}
.mnote{display:flex;gap:7px;max-width:250px;margin:5px 2px 1px;padding:8px 7px 3px;border-top:1px solid var(--border-subtle);font-size:11.5px;line-height:1.45;color:var(--muted-foreground)}
/* a note that fills the menu's width without making the menu wider */
.mnote.fill{max-width:none;width:0;min-width:calc(100% - 4px)}
.mnote.solo{max-width:270px;margin-top:0;padding:4px 7px 5px 8px;border-top:0}
.mnote svg{width:13px;height:13px;flex:none;margin-top:1px}
.snzpick{display:flex;gap:6px;padding:2px 4px 6px 8px}
.snzpick input{flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:7px;background:var(--background);color:var(--foreground);font:inherit;font-size:12.5px;color-scheme:light}
html.dark .snzpick input{color-scheme:dark}
.snzpick input:focus{outline:2px solid var(--ring);outline-offset:-1px}
.snzpick .btn{height:30px}

/* People popover */
.menu.ppop{width:330px;padding:5px;outline:none}
.prow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;min-width:0}
.prow .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.prow .nm{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;min-width:0}
.prow .nm .you{font-weight:400;color:var(--muted-foreground)}
.prow .sub{font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .when{flex:none;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.pava{position:relative;width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.02em;background:var(--muted);border:1px solid var(--border);color:var(--foreground)}
/* presence uses the peer's own color (PresenceDots in components/comb/presence-avatars.tsx), never the green of "done" */
.vdot{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;background:var(--vc,var(--muted-foreground));box-shadow:0 0 0 2px var(--card)}
.vnow{display:inline-flex;align-items:center;gap:4px;flex:none;margin-left:4px;font-size:11px;font-weight:500;color:var(--muted-foreground);white-space:nowrap}
.vnow i{width:6px;height:6px;border-radius:50%;background:var(--vc,var(--muted-foreground))}
.pbtn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 8px;border:1px solid var(--border);border-radius:999px;background:var(--background);font-size:12px;font-weight:500;color:var(--foreground);cursor:pointer;white-space:nowrap;transition:background .2s var(--ease) .05s}
.pbtn:hover{background:var(--hover);transition:none}
.pbtn:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.pbtn[aria-expanded="true"]{border-color:var(--ring)}
.pbtn svg{width:14px;height:14px;color:var(--muted-foreground)}
.pbtn .ppl{padding-left:4px}
.pbtn .pav{box-shadow:0 0 0 1.5px var(--background)}

/* first-visit guide */
.gov{position:fixed;inset:0;z-index:88;background:var(--ov);animation:fade .15s var(--ease)}
.guide{position:fixed;z-index:92;width:min(430px,calc(100vw - 32px));padding:18px 20px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:0 2px 4px oklch(0 0 0 / .06),0 30px 70px -24px oklch(0 0 0 / .45);outline:none;animation:pop .2s var(--ease)}
.gstep{display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.gdots{display:inline-flex;gap:4px}
.gdots i{width:6px;height:6px;border-radius:50%;background:var(--border)}
.gdots i.on{background:var(--primary)}
.guide h3{margin:10px 0 0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.guide p{margin:6px 0 0;font-size:13.5px;line-height:1.55;color:var(--muted-foreground)}
.gvis{margin-top:12px;padding:5px 0;border-radius:9px;border:1px solid var(--border-subtle);background:var(--surface)}
.gvis .tr{cursor:default}
.gvis .tr:hover{background:none}
.gvis .ses:hover .ud{display:block}
.gvis .ses.sel,.gvis .ses.sel:hover{background:color-mix(in oklch,var(--primary) 13%,transparent)}
.gvis .ses.sel .cbx{display:grid}
.gvis .ses.sel .ud{display:none}
.gvis .glab{flex:none;font-size:11px;color:var(--muted-foreground)}
.gkeys{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:7px 10px;align-items:center;margin:12px 0 0;font-size:12.5px}
.gkeys dt{text-align:right;white-space:nowrap}
.gkeys dd{margin:0}
.gfoot{display:flex;align-items:center;gap:6px;margin-top:18px}
.gfoot label{display:inline-flex;align-items:center;gap:7px;margin-right:auto;font-size:12px;color:var(--muted-foreground);cursor:pointer}
.gfoot input{width:15px;height:15px;margin:0;accent-color:var(--primary)}
.gfoot .btn{height:30px}
.ghl{position:relative;z-index:89 !important;outline:2px solid var(--primary) !important;outline-offset:-2px;pointer-events:none}
.ghl.pad{background:var(--card);border-radius:7px}

/* Round 9: bottom left, over the session sidebar (sonner position "bottom-left"), never over the composer. No
   transform for placement, so the entrance cannot shift it. */
#toast{position:fixed;left:calc(var(--rail-w) + 12px);bottom:40px;z-index:95;display:flex;align-items:center;gap:12px;max-width:min(400px,calc(100vw - var(--rail-w) - 24px));padding:8px 8px 8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 18px 40px -18px oklch(0 0 0 / .4);font-size:13px;transform-origin:left bottom;animation:pop .2s var(--ease)}
#toast[hidden]{display:none}
#toast .tmsg{min-width:0}
#toast .tq{display:flex;white-space:nowrap}
#toast .tq>span{flex:none}
#toast .tq>.tqt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
#toast .btn{flex:none}

/* ============ legacy replica ============ */
#legacy{min-height:0;grid-template-columns:300px minmax(0,1fr)}
.lg-side{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:color-mix(in oklch,var(--card) 40%,transparent)}
.lg-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px}
.lg-h h2{margin:0;font-family:var(--font-mono);font-size:11px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.lg-h .ib{width:24px;height:24px}
.lg-h .ib svg{width:14px;height:14px}
.lg-s{display:flex;align-items:center;gap:4px;padding:0 12px 8px}
.lg-s label{position:relative;flex:1;min-width:0}
.lg-s label svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted-foreground)}
.lg-s input{width:100%;height:32px;padding:0 8px 0 28px;border-radius:8px;border:1px solid transparent;background:color-mix(in oklch,var(--muted) 40%,transparent);font:inherit;font-size:12px;color:var(--foreground);outline:none}
.lg-s .ib{width:32px;height:32px}
.lg-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px}
.lg-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;min-width:0;border:0;background:none;text-align:left;width:100%}
.lg-row:hover{background:color-mix(in oklch,var(--muted) 50%,transparent)}
.lg-row.on{background:var(--muted)}
.lg-dot{width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none;background:color-mix(in oklch,var(--muted-foreground) 30%,transparent)}
.lg-dot.run{background:var(--primary);animation:lgp 2s cubic-bezier(.4,0,.6,1) infinite}
.lg-dot.err{background:var(--error)}
.lg-dot.act{background:color-mix(in oklch,var(--primary) 70%,transparent)}
@keyframes lgp{50%{opacity:.5}}
.lg-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.lg-t b{font-size:14px;font-weight:400;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--foreground)}
.lg-row.on .lg-t b{font-weight:500}
.lg-t span{font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-main{min-height:0;min-width:0;display:flex;flex-direction:column}
.lg-head{flex:none;padding:14px 24px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;min-width:0}
.lg-head h1{margin:0;font-size:16px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-head .mono{font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}
.lg-tl{flex:1;min-height:0;overflow-y:auto}
.lg-tl .inner{max-width:768px;margin:0 auto;padding:24px}
.lg-me{display:flex;justify-content:flex-end;padding-left:40px;padding-bottom:12px}
.lg-me .w{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:85%}
.lg-me .m{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);padding:0 4px}
.lg-me .b{border-radius:16px 4px 16px 16px;background:var(--muted);padding:10px 16px;font-size:14px;line-height:1.6}
.lg-task{display:flex;gap:12px;padding-bottom:24px}
.lg-task .av{width:24px;height:24px;border-radius:50%;font-size:9px}
.lg-task .h{font-size:12px;color:var(--muted-foreground);display:flex;gap:8px;align-items:center}
.lg-task .h b{color:var(--foreground);font-weight:500}
.lg-task .x{margin-top:6px;font-size:14px;line-height:1.6}
.lg-cmp{flex:none;padding:12px 24px 16px}
.lg-cmp .box{max-width:768px;margin:0 auto;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:10px 12px;display:flex;align-items:flex-end;gap:8px}
.lg-cmp textarea{flex:1;border:0;outline:0;resize:none;background:none;font:inherit;font-size:14px;color:var(--foreground);height:44px}
/* Reduced motion is gentler, not zero (DESIGN.md § Motion): movement goes, fades stay. demo-shared.css zeroes every
   duration with a * rule, so these rules (one class more specific, also !important) put the durations back and swap
   each entrance for a plain fade. Exits run through ghostOut, which fades instead of moving. Loops stay still. */
@media (prefers-reduced-motion: reduce){
  .tsi.live{animation:none !important}
  .shim{animation:none !important;-webkit-text-fill-color:currentColor;color:var(--foreground);background:none}
  html :is(.menu,.pick,#tip,#hcard,.sqtips,.sdpop,#toast,.pal,.dlg,.sdlg,.guide){animation-name:fade !important}
  html :is(.menu,.pick,#tip,#hcard,.sqtips,.sdpop){animation-duration:.15s !important}
  html :is(#toast,.pal,.dlg,.sdlg,.guide,.ovl,.gov){animation-duration:.2s !important}
  html :is(.tr,.tab,.wsum,.pill,.pbtn,.sipick,.sb,.tacts>span,.tab .x,.dren){transition-duration:.2s !important}
  html :is(.btn,.ib){transition-duration:.2s,.2s,.2s,.12s,0s !important}
  html :is(.btn,.ib):active{transform:none}
  html :is(.ti-typing,.latest){transition-duration:.15s !important}
  html .ti-typing:not(.on){transition-duration:.1s !important}
  .tybub i{animation:none !important;opacity:.55}
  html .cpy{transition-duration:.15s,.2s,.2s !important}
  .sth>svg,.wsum>svg{transition:none}
  .tr.flash,.tab.flash{animation:none}
  .ti-hm.fresh .bub{animation:none}
}

/* ============ narrower desktops ============ */
@media (max-width:1359px){
  .tl{padding:20px 20px 24px}
  .gtw{padding:0 20px}
}
