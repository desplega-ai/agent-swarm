/* ============ compact single-column fallback ============ */
@media (max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr)}
  #tree{border-right:0}
  .rsz,#hcard{display:none !important}
  #right{display:none}
  .cdetail #tree{display:none}
  .cdetail #right{display:flex}
  .tabs,.dz{display:none !important}
  .egroup+.egroup{display:none}
  .back{display:inline-grid}
  .hdr .kick,.hdr .lnk span{display:none}
  #legacy{grid-template-columns:minmax(0,1fr)}
  .lg-side{display:none}
  .statusbar .rt{display:none}
}
/* ============ phones (under 768 px, as useIsMobile in apps/ui): two screens, push navigation, sheets, and touch (round 8, polished in round 9) ============ */
@media (max-width:767px){
  /* safe areas: the real insets, or the fake ones mobile.html passes in (?sat= / ?sab=). The keyboard takes the bottom one. */
  :root{--sa-t:max(env(safe-area-inset-top,0px),var(--sat));--sa-b:max(env(safe-area-inset-bottom,0px),var(--sab))}
  html.kbup{--sa-b:0px}
  html,body{overscroll-behavior:none}
  body{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  #app{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
  #app>.shell,#app>#legacy{grid-column:1}
  /* no app header, rail, status bar, tabs, split, tooltips, hover cards, or key hints on a phone */
  .hdr,.grail,.statusbar,#tip,#hcard,.tabs,.dz,.qbar,.sqk,.sqtips,.tacts,.kh,.mi kbd,.pi kbd,.palfoot,.palin kbd,.rsz,.gth .bulk,.sbh .bulk{display:none !important}
  /* two screens: the list (the sidebar at full width), and the detail, which slides in from the right.
     300 ms in, 250 ms back, on the swift curve. The browser's own back swipe skips it (body.m-instant). */
  .shell{position:relative;display:block;overflow:hidden}
  #tree,#right{position:absolute;inset:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  #tree{display:flex;transition:transform .25s var(--ease-swift),visibility 0s}
  #right{display:flex;transform:translateX(100%);visibility:hidden;box-shadow:-1px 0 0 var(--border),-18px 0 36px -18px oklch(0 0 0 / .3);transition:transform .25s var(--ease-swift),visibility 0s linear .25s}
  .cdetail #tree{display:flex;transform:translateX(-24%);visibility:hidden;transition:transform .3s var(--ease-swift),visibility 0s linear .3s}
  .cdetail #right{display:flex;transform:none;visibility:visible;transition:transform .3s var(--ease-swift),visibility 0s}
  .pane.m-in{animation:mpush .3s var(--ease-swift)}
  .pane.m-back{animation:mpop .25s var(--ease-swift)}
  body.m-instant #tree,body.m-instant #right,body.m-instant .pane{transition:none !important;animation:none !important}

  /* list screen: a large title with the filter, New session, and "⋯", then the search field */
  .sbh{height:auto;min-height:56px;padding:var(--sa-t) 6px 0 16px;border-bottom:0;gap:0}
  .sbh h2{font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* search mode: no large title, the field moves up next to Cancel (iOS Mail) */
  body.msearch .sbh{min-height:0;height:0;padding-top:var(--sa-t);overflow:visible}
  body.msearch .sbh>:not(.mcancel){display:none}
  body.msearch .sbh .mcancel{position:absolute;right:6px;top:calc(var(--sa-t) + 6px);z-index:6}
  body.msearch .sqw{padding:calc(var(--sa-t) + 8px) 88px 8px 16px}
  body.msearch .sqchips{margin-right:-88px;padding-right:88px}
  .sbh h2.msm{font-size:16px;font-weight:600;letter-spacing:-.01em;text-align:center}
  .sbh .ib{width:44px;height:44px;border-radius:12px;color:var(--foreground)}
  .sbh .ib svg{width:20px;height:20px}
  .sbh .fdot{top:10px;right:10px}
  .mcancel{flex:none;height:44px;padding:0 10px;border:0;border-radius:10px;background:none;font:inherit;font-size:16px;font-weight:500;color:var(--active-strong);cursor:pointer}
  .mcancel:active{background:var(--hover)}
  .mcancel.strong{font-weight:600}
  /* selection mode: Select all, the count, Cancel. The search field steps aside. */
  .sbh.msel{display:grid;grid-template-columns:1fr auto 1fr;padding-right:6px;padding-left:6px}
  .sbh.msel .mcancel:first-child{justify-self:start}
  .sbh.msel .mcancel:last-child{justify-self:end}
  body.mselon #sqw{display:none}
  .sqw{padding:2px 16px 8px}
  .sq{height:40px;padding:0 4px 0 12px;border-radius:11px;border-color:transparent;background:var(--muted)}
  .sq:hover{border-color:transparent}
  .sq:focus-within{background:var(--background)}
  .sq>svg{width:16px;height:16px}
  .sq input{font-size:16px}
  .sqx{width:44px;height:40px;border-radius:9px;margin-right:-4px}
  .sqx svg{width:16px;height:16px}
  .sqchips{display:flex;gap:8px;margin:10px -16px 0;padding:2px 16px 4px;overflow-x:auto;scrollbar-width:none}
  .sqchips::-webkit-scrollbar{display:none}
  .sqchips[hidden]{display:none}
  .sqchip{position:relative;flex:none;height:34px;padding:0 13px;border:1px solid var(--border);border-radius:999px;background:var(--background);font-family:var(--font-mono);font-size:13px;color:var(--foreground);cursor:pointer}
  .sqchip::after{content:"";position:absolute;inset:-5px -3px}
  .sqchip:active,.sqchip[aria-pressed="true"]{border-color:color-mix(in oklch,var(--primary) 50%,transparent);background:color-mix(in oklch,var(--primary) 11%,transparent);color:var(--active-strong)}

  /* rows: taller, full width, no hover. Session rows have two lines and always show their counts.
     Named sizes only: 16 px titles (text-base), 13 px second lines (text-data), 11 px labels (text-meta). */
  .tscroll{position:relative;padding:0 0 calc(28px + var(--sa-b));-webkit-overflow-scrolling:touch}
  body.mselon .tscroll{padding-bottom:calc(92px + var(--sa-b))}
  .tsec{height:34px;margin:16px 0 0;padding:0 16px}
  .tsec .lab,.tsec .tcount{font-size:11px}
  /* no tree guides on a phone, and at most one indent step: the list reads flat */
  .tr{height:46px;margin:0;padding:0 14px 0 calc(16px + min(var(--lv,0),1) * 12px);gap:10px;border-radius:0;font-size:16px;-webkit-touch-callout:none}
  .tr:hover{background:none}
  .tr:active{background:var(--hover);transition:none}
  .kid::before{display:none}
  .tic{width:20px;height:20px}
  .tic svg{width:18px;height:18px}
  .tic .smk{width:16px;height:16px}
  .gchev{width:34px;height:34px;margin:0 -8px 0 -6px}
  .gchev svg{width:16px;height:16px}
  .cn{height:22px;padding:0 8px;border-radius:6px;font-size:13px}
  .cn.r,.cn.t{font-size:13px}
  .cn .tsi{width:14px;height:14px}
  .tr.more{height:46px;font-size:16px}
  .tr.more svg{width:16px;height:16px}
  .tr.more.all .tlbl{flex:1}
  .tinp{height:34px;font-size:16px}
  .tempty{margin:0;font-size:13px}
  .tr.ses{height:auto;min-height:62px;align-items:flex-start;padding-top:10px;padding-bottom:10px;touch-action:pan-y}
  .ses .ls{width:16px;height:22px}
  .ses .ud{width:8px;height:8px}
  .ses:hover .cbx{display:none}
  .ses:hover .ud{display:block}
  .tscroll.selmode .ses .cbx{display:grid}
  .tscroll.selmode .ses .ud{display:none}
  .cbx{width:20px;height:20px;border-radius:5px}
  .cbx svg{width:16px;height:16px}
  .ses .srcm{width:16px;height:16px}
  .ses .srcm .smk{width:14px;height:14px}
  .ses .stl{min-width:0}
  .ses.open{background:none}
  .ses.open .stl{color:var(--muted-foreground)}
  .ses.unread.open .stl{color:var(--foreground)}
  .ses.open::after{display:none}
  .ses.sel,.ses.sel:hover{background:color-mix(in oklch,var(--primary) 13%,transparent)}
  .mbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .ml1{display:flex;align-items:center;gap:8px;min-width:0;min-height:22px}
  .ml1 .stl{font-size:16px;line-height:1.35}
  .ml1 .act .tsi{width:16px;height:16px}
  .ml2{display:flex;align-items:center;gap:6px;min-width:0;min-height:24px;font-size:13px;line-height:1.3;color:var(--muted-foreground)}
  .ml2 .gtag{max-width:46%;font-size:13px}
  .ml2 .tm{min-width:0;text-align:left;font-family:var(--font-sans);font-size:13px;color:var(--muted-foreground)}
  .ml2 .mh{font-size:13px}
  .ml2 .pav{width:24px;height:24px;font-size:11px;font-weight:600;margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
  .mdot{flex:none}
  /* search suggestions after with: or in: (44 px rows, a tap completes the token) */
  .tr.sug{height:48px;gap:12px}
  .tr.sug .pav{width:28px;height:28px;margin:0;font-size:11px;font-weight:600}
  .tr.sug .tic{color:var(--muted-foreground)}
  .tr.sug .tlbl{font-weight:500}
  .tr.sug .par{color:var(--muted-foreground);font-weight:400}
  /* swipe a row: the action color shows behind it. Past 80 px it fills and the label turns bold. */
  .swbg{position:absolute;left:0;right:0;z-index:0;display:flex;align-items:center;padding:0 22px;background:var(--muted);color:var(--muted-foreground);font-size:14px;font-weight:600;pointer-events:none}
  .swbg span{display:inline-flex;align-items:center;gap:8px}
  .swbg svg{width:20px;height:20px;transition:transform .15s var(--ease-snappy)}
  .swbg[data-dir="done"]{justify-content:flex-end}
  .swbg[data-dir="done"] .swl,.swbg[data-dir="later"] .swr{display:none}
  .swbg.arm[data-dir="done"]{background:var(--success-strong);color:var(--on-primary)}
  .swbg.arm[data-dir="later"]{background:var(--primary);color:var(--on-primary)}
  .swbg.arm svg{transform:scale(1.15)}
  .tr.swiping{z-index:1;background:var(--surface) !important;transition:none}
  .tr.swiping.snap{transition:transform .2s var(--ease-swift)}
  /* selection mode: the bottom bar. In 200 ms, out in 150 ms (snappy). */
  #msel{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;align-items:stretch;gap:2px;padding:5px max(6px,env(safe-area-inset-left,0px)) calc(5px + var(--sa-b));border-top:1px solid var(--border);background:var(--card);box-shadow:0 -8px 24px -16px oklch(0 0 0 / .3);animation:sheetup .2s var(--ease-snappy)}
  #msel[hidden]{display:none}
  #msel button{flex:1;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;border:0;border-radius:10px;background:none;font:inherit;font-size:13px;font-weight:500;color:var(--foreground);cursor:pointer}
  #msel button svg{width:20px;height:20px}
  #msel button:active{background:var(--hover)}

  /* detail screen: back, the title (tap to rename), People, and "⋯". One meta line under it. */
  .mhd{flex:none;padding-top:var(--sa-t);border-bottom:1px solid var(--border);background:var(--background)}
  .mtop{display:flex;align-items:center;gap:2px;min-height:52px;padding:0 6px 0 4px}
  .mtop .ib{width:44px;height:44px;border-radius:12px;color:var(--foreground)}
  .mtop .ib svg{width:22px;height:22px}
  .mttl{flex:1;min-width:0;margin:0;font-size:16px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
  .mttl>span,.mttl>button{display:block;width:100%;height:44px;padding:0 4px;border:0;border-radius:8px;background:none;font:inherit;color:inherit;line-height:44px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mttl>button{cursor:pointer}
  .mttl>button:active{background:var(--hover)}
  /* rename on a phone: Cancel, the field, Save. Touch keyboards have no Escape, and a blur cancels. */
  .mtop.mren{gap:4px;padding:0 6px}
  .mtop .dtin{flex:1;height:44px;margin:0;font-size:16px;letter-spacing:0;border-radius:10px}
  .mtop .mcancel{padding:0 8px}
  .mcancel.save{color:var(--primary);font-weight:600}
  .mcancel[aria-disabled="true"]{opacity:.45}
  .mtop .pbtn{position:relative;flex:none;height:32px;margin:0 2px;padding:0 11px 0 9px;font-size:13px}
  .mtop .pbtn::after{content:"";position:absolute;inset:-6px -2px}
  .mtop .pbtn svg{width:16px;height:16px}
  .mtop .pbtn .pcnt{font-size:13px}
  .pdot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--vc,var(--muted-foreground));box-shadow:0 0 0 2px var(--background)}
  .mmeta{display:flex;align-items:center;gap:10px;min-width:0;padding:0 16px 11px 52px;font-size:13px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden}
  .mmeta .mono{font-size:13px}
  .mmeta .tri{font-size:13px}
  .tls{-webkit-overflow-scrolling:touch}
  .tl{padding:16px 16px 28px;gap:16px}
  .ti-hm{gap:8px}
  .ti-hm.o{padding-right:0}
  .ti-hm.me{padding-left:0}
  /* my own messages: no avatar and no name (right alignment already says it), only the time */
  .ti-hm.me>.hav{display:none}
  .ti-hm.me .hw{max-width:88%}
  /* the avatar on the first line of a 16 px bubble: 9 px padding + 12.4 px - 12 px, plus the 1 px border */
  .hav{margin-top:9px}
  .o>.hav{margin-top:10px}
  .bub,.ltx,.txt{font-size:16px}
  .bub.sl{font-size:16px}
  .tmeta,.lmeta{font-size:11px}
  .th{font-size:13px}
  .hmeta{min-height:18px;font-size:13px;line-height:18px}
  .hmeta .tmeta,.lfoot .tmeta{line-height:18px}
  .lfoot{min-height:18px;margin-top:6px}
  /* touch: Copy is always visible (70 %, the swarm's 60 %), with a 44 px hit area */
  .cpy{margin-top:-3px;margin-bottom:-3px}
  .cpy.hv{opacity:.7}
  .cpy.ld{opacity:.6}
  .cpy::after{content:"";position:absolute;inset:-10px}
  .stx>.cpy{top:0;margin:0}
  /* the folded worker line spans the row and is a 44 px target */
  .wsum{width:100%;min-height:44px;margin-left:0;padding:4px 8px 4px 4px;font-size:13px}
  .sth{min-height:30px;font-size:13px}
  .stx{font-size:16px}
  .askb .btn{height:44px;padding:0 16px;font-size:16px}
  /* the composer bar is the top edge here: the Latest pill sits 10 px above it */
  .latest{bottom:calc(100% + 10px)}
  .latest{height:32px;font-size:13px}
  .latest::after{content:"";position:absolute;inset:-6px -4px}
  .cmp{padding:8px 10px calc(8px + var(--sa-b));border-top:1px solid var(--border-subtle);background:var(--background)}
  /* the composer is ComposerDock in bar mode: attach, the text (it grows), and a round 44 px ArrowUp send */
  .cmpb{display:flex;flex-wrap:wrap;align-items:flex-end;padding:0;border-radius:22px}
  .cmpto{flex:0 0 100%;min-width:0;padding:6px 14px 2px;font-size:13px;white-space:nowrap}
  .cmpto span{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .cmpb textarea{order:2;flex:1;width:auto;min-width:0;min-height:44px;padding:11px 4px 9px;font-size:16px;line-height:1.45}
  .cmpf{display:contents}
  .cmpf .sp,.cmpf .kh{display:none}
  .cmpf .ib{order:1;width:44px !important;height:44px !important;border-radius:50%}
  .cmpf .ib svg{width:20px;height:20px}
  .cmpf .btn{order:3;flex:none;width:44px;height:44px;padding:0;justify-content:center;border-radius:50%;font-size:0;gap:0}
  .cmpf .btn svg{width:20px;height:20px}
  .cmpf .btn[aria-disabled="true"]{opacity:.5}
  .cmpro{font-size:13px}
  .cmpro.ro{font-size:16px}

  /* New session: full screen. Start in (a sheet), a large text box, and Send in the top bar. */
  .pane.mnt{display:flex;flex-direction:column}
  .mnt .msend{flex:none;height:44px;margin-right:2px;padding:0 16px;border-radius:999px;font-size:16px}
  .mstart{flex:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border:0;border-bottom:1px solid var(--border-subtle);background:none;font:inherit;font-size:16px;color:var(--foreground);text-align:left;cursor:pointer}
  .mstart:active{background:var(--hover)}
  .mstart .silab{font-size:16px}
  .mstart .spath{flex:1;min-width:0}
  .mstart svg{width:16px;height:16px;flex:none;color:var(--muted-foreground)}
  .mnt textarea{flex:1;min-height:0;width:100%;padding:16px;resize:none;border:0;outline:0;background:none;font:inherit;font-size:16px;line-height:1.5;color:var(--foreground)}
  .mnt textarea::placeholder{color:var(--muted-foreground)}
  .mnhint{flex:none;margin:0;padding:10px 16px calc(12px + var(--sa-b));border-top:1px solid var(--border-subtle);font-size:13px;line-height:1.45;color:var(--muted-foreground)}

  /* group screen ("View all N") */
  .gth .gtw{min-height:52px;padding:var(--sa-t) 16px 0 4px;gap:6px}
  .gth .back{width:44px;height:44px;border-radius:12px;color:var(--foreground)}
  .gth .back svg{width:22px;height:22px}
  .gtt{font-size:16px}
  .gtbar .gtw{flex-direction:column;align-items:stretch;gap:10px;padding:12px 16px 8px}
  .gtbar .sq{width:100%}
  .gtq{font-size:16px !important}
  .pills{height:44px;max-width:100%;overflow-x:auto;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex:1 0 auto;padding:0 12px;border-radius:7px;font-size:13px}
  .pill b{font-size:13px}
  .gtlist{-webkit-overflow-scrolling:touch}
  body.mselon .gtlist{padding-bottom:calc(92px + var(--sa-b))}
  .gtlist .gtw{position:relative;padding:0}
  .gtlist .tr.ses{height:auto;padding-left:16px;padding-right:14px}
  .gtfoot{padding:14px 16px 0;font-size:13px}
  .gtfoot .mono{font-size:13px}
  .gtfoot .btn{height:44px;font-size:16px}

  /* sheets, not popovers: a rounded top, a grab handle, at most 85 % of the height, above the keyboard.
     400 ms up and 250 ms down on the swift curve (DESIGN.md: the large-surface exception). They drag from anywhere. */
  .sov{position:fixed;inset:0;z-index:79;background:var(--ov);animation:fade .4s var(--ease-swift)}
  #picker .sov{z-index:85}
  .sheet{position:fixed !important;left:0 !important;right:0 !important;top:auto !important;bottom:var(--kb) !important;width:auto !important;min-width:0 !important;max-width:none !important;max-height:calc(85dvh - var(--kb));margin:0 !important;border-radius:16px 16px 0 0 !important;border-bottom:0 !important;box-shadow:0 -12px 40px -14px oklch(0 0 0 / .38) !important;outline:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:sheetup .4s var(--ease-swift)}
  .sgrab{position:sticky;top:0;z-index:2;display:block;flex:none;height:26px;background:var(--card);touch-action:none;cursor:grab}
  .sgrab::before{content:"";position:absolute;left:50%;top:9px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:color-mix(in oklch,var(--muted-foreground) 38%,transparent)}
  .menu.sheet{padding:0 8px calc(10px + var(--sa-b));overflow-y:auto}
  .menu.sheet .sgrab{margin:0 -8px}
  .sheet .mi{height:50px;padding:0 12px;gap:14px;border-radius:10px;font-size:16px}
  .sheet .mi svg{width:20px;height:20px}
  .sheet .mi.chk input{width:20px;height:20px}
  .sheet .mi .mt,.sheet .mi .mq{font-size:13px}
  .sheet .mi:active{background:var(--hover)}
  /* an operator setting: two lines that wrap, never a clipped one */
  .sheet .mi.off{height:auto;min-height:50px;padding-top:10px;padding-bottom:10px;white-space:normal;align-items:flex-start;line-height:1.35}
  .sheet .mi.off .mof{display:flex;flex-direction:column;gap:2px;min-width:0}
  .sheet .mi.off .mof small{font-size:13px;color:var(--muted-foreground)}
  .sheet .mi.off svg{margin-top:1px}
  /* the Handoffs row: a Switch at the right edge, the whole row flips it */
  .mi .msw{position:relative;flex:none;width:44px;height:26px;border-radius:999px;background:var(--input);transition:background-color .15s var(--ease-snappy)}
  .mi .msw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--background);box-shadow:0 1px 2px oklch(0 0 0 / .2);transition:transform .15s var(--ease-snappy)}
  .mi[aria-checked="true"] .msw{background:var(--primary)}
  .mi[aria-checked="true"] .msw::after{transform:translateX(18px)}
  .sheet .mlab{padding:8px 12px 6px}
  .sheet .msep{margin:6px 4px}
  .sheet .mnote,.sheet .mnote.fill,.sheet .mnote.solo{width:auto;min-width:0;max-width:none;margin:8px 4px 2px;padding:10px 8px 4px;font-size:13px}
  .sheet .mnote.solo{border-top:0;padding-top:4px}
  .sttl{margin:0 4px 6px;padding:0 8px 10px;border-bottom:1px solid var(--border-subtle);font-size:13px;line-height:1.4;color:var(--muted-foreground);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sttl b{font-weight:600;color:var(--foreground)}
  .sheet .scancel{justify-content:center;margin-top:8px;background:var(--muted);font-weight:600}
  .sheet .scancel span{flex:none}
  .sheet .snzpick{padding:4px 4px 8px 12px}
  .sheet .snzpick input,.sheet .snzpick .btn{height:44px;font-size:16px}
  .sheet .mtag{display:inline-flex;align-items:center;height:16px;margin-right:6px;padding:0 5px;border-radius:4px;border:1px dashed color-mix(in oklch,var(--muted-foreground) 55%,transparent);letter-spacing:.06em}
  .sheet .prow{padding:9px 10px}
  .sheet .prow .nm{font-size:16px}
  .sheet .prow .sub{font-size:13px}
  .sheet .pava{width:32px;height:32px;font-size:11px}
  .sheet .agav.sm{width:32px;height:32px}
  .sheet .agav.sm svg{width:16px;height:16px}
  .sheet.still,.ovl.still,.sov.still{animation:none !important}
  .pal.sheet{display:flex;flex-direction:column}
  .palin{height:52px;padding:0 16px}
  .palin input{font-size:16px}
  .pallist{padding:4px 8px calc(10px + var(--sa-b))}
  .pi{height:50px;border-radius:10px;font-size:16px}
  .pi:active{background:var(--hover)}
  .psec{padding:10px 10px 4px}
  .sdlg.sheet{gap:14px;padding:0 18px calc(16px + var(--sa-b));overflow-y:auto}
  .sdlg.sheet.addv{max-height:calc(92dvh - var(--kb));gap:10px}
  .sdlg .sgrab{margin:0 -18px -8px}
  .sdh .ib{width:44px;height:44px}
  .sdh .ib.sdback{margin:0 0 0 -10px}
  .sdh .ib svg{width:20px;height:20px}
  .sdh h3{font-size:16px}
  .sdtrig{height:44px;font-size:16px}
  .ssel,.selw.ghost .ssel{height:38px;font-size:16px}
  .ssel{width:132px}
  .sdf .btn{height:44px;padding:0 16px;font-size:16px}
  .sdlab,.sdw .em,.gcol .sdesc{font-size:13px}

  /* the toast: above the composer or the selection bar when one shows, else near the bottom edge */

  .ga-sw .ga-row{animation:gaswipe 2.8s cubic-bezier(.4,0,.2,1) 2}
  .ga-sw.r .ga-row{animation-name:gaswipe-r;animation-delay:1.4s}
  @keyframes gaswipe{0%,18%{transform:none}40%,62%{transform:translateX(-96px)}84%,100%{transform:none}}
  @keyframes gaswipe-r{0%,18%{transform:none}40%,62%{transform:translateX(96px)}84%,100%{transform:none}}

  .guide.sheet .gdots{position:relative;margin-right:auto;gap:8px}
  .guide.sheet .gdots i{width:7px;height:7px}
  .guide.sheet .gdots i.on{background:var(--border)}

  .is-legacy #legacy{display:flex;flex-direction:column}

  .mlg .ib{width:44px;height:44px;color:var(--foreground)}
  .mlg .ib svg{width:22px;height:22px}
  .mlg b{flex:1;min-width:0;font-size:16px;font-weight:600}

  .mlg-sw .ssel{width:100%;height:44px;font-size:16px}

  .lg-head{flex-wrap:wrap;gap:6px 10px;padding:12px 16px}
  .lg-head h1{flex:1 1 100%}
  .lg-me{padding-left:24px}
  .lg-tl .inner{padding:16px}
  .lg-cmp{padding:8px 12px calc(8px + var(--sa-b))}
  .lg-cmp textarea{font-size:16px}
}
@keyframes sheetup{from{transform:translateY(100%)}}
@keyframes toastup{from{opacity:0;transform:translateY(12px)}}
@keyframes mpush{from{transform:translateX(24%);opacity:0}}
@keyframes mpop{from{transform:translateX(-18%);opacity:0}}
/* Reduced motion on a phone: the push is a 150 ms cross-fade, sheets and bars fade, rows snap. */
@media (max-width:767px) and (prefers-reduced-motion: reduce){
  #tree,#right,.cdetail #tree,.cdetail #right{transform:none !important}
  html #right{opacity:0;transition:opacity .15s var(--ease-snappy),visibility 0s linear .15s !important}
  html .cdetail #right{opacity:1;transition:opacity .15s var(--ease-snappy),visibility 0s !important}
  html #tree,html .cdetail #tree{transition:visibility 0s linear .15s !important}
  html :is(.pane.m-in,.pane.m-back){animation-name:fade !important;animation-duration:.15s !important}
  html :is(.sheet,.sov){animation-name:fade !important;animation-duration:.4s !important}
  html #msel{animation-name:fade !important;animation-duration:.2s !important}
  html #toast{animation-name:fade !important;animation-duration:.2s !important}
  .tr.swiping.snap,.swbg svg,.guide.sheet .gdots .gpill,.mi .msw,.mi .msw::after{transition:none !important}
  .ga-sw .ga-row{animation:none !important}
}

function openSession(sid, where) {

  if (where === "bg") {
    if (at < 0) { const p = S.panes[S.fp]; insertAfterActive(p, sid); if (!p.active) p.active = sid; }
  } else if (at >= 0) {
    S.fp = at; S.panes[at].active = sid; s.read = true;
  } else {
    const p = S.panes[S.fp];
    // A new-session tab and a group tab are never replaced. The session opens next to them.
    if (where === "newtab" || !p.active || isNT(p.active) || isGT(p.active)) { insertAfterActive(p, sid); p.active = sid; }
    else { p.tabs[p.tabs.indexOf(p.active)] = sid; p.active = sid; }

function openInSplit(sid) {

    const p0 = S.panes[0];
    if (at === 0) {
      if (p0.tabs.length === 1) { toast("Open a second session first. Then split."); return; }
      removeFromPane(0, sid);
    }
    S.panes.push({ tabs: [sid], active: sid });
    S.fp = 1;
  } else {

// Same one-line rows as the sidebar, newest first, with a search box scoped to the group,

const GTF = { all: () => true, unread: (s) => !s.read, running: (s) => s.status === "running", needs: (s) => s.needs };

  if (!S.gt[id]) {
    S.gt[id] = { ctx, q: "", f: "all", limit: PAGE, cur: null, kb: false, anchor: null };
    const first = gtView(id).shown[0];
    S.gt[id].cur = first ? first.s.id : null; // the cursor starts on the newest row
  }
  const at = paneOf(id);
  if (at >= 0) { S.fp = at; S.panes[at].active = id; }
  else { const p = S.panes[S.fp]; insertAfterActive(p, id); p.active = id; }
  S.menu = null; S.picker = null;

// What a group tab shows right now: the group's list, then its search, then the status pill, then the page.
function gtView(id) {
  const g = S.gt[id];
  const base = ctxList(g.ctx);
  const pq = parseQuery(g.q);
  const hits = pq.empty ? base.map((s) => ({ s, why: null })) : base.map((s) => ({ s, why: matchQ(s, pq) })).filter((h) => h.why);
  const n = { all: hits.length, unread: 0, running: 0, needs: 0 };
  hits.forEach((h) => { ["unread", "running", "needs"].forEach((f) => { if (GTF[f](h.s)) n[f]++; }); });
  const filt = hits.filter((h) => GTF[g.f](h.s));
  return { g, base, pq, n, filt, shown: filt.slice(0, g.limit) };
}

function sendInSession(sid, text) {
  const s = SESS[sid]; if (!s) return;
  if (!s.timeline) s.timeline = timelineOf(s).map((t) => ({ ...t }));
  // fresh: my own bubble gets one small enter on the next render only (the sender's optimistic item)
  const mine = s.source === "slack" ? { kind: "reply", who: ME, at: nowIso(), text, fresh: true } : { kind: "human", who: ME, via: "dashboard", at: nowIso(), text, fresh: true };
  s.timeline.push(mine);
  follow.pin = sid; // the sender follows the conversation: the timeline scrolls to the new bubble
  // Every message goes to the lead, which answers as the swarm.
  const lead = { kind: "lead", at: nowIso(), status: "running", text: "", wk: "Working on it" };
  s.timeline.push(lead);
  s.status = "running"; s.last = nowIso(); s.tasks += 1;
  S.drafts[sid] = "";
  render();
  delete mine.fresh;
  simulateTurn(s, lead, text);
  if (s.source === "slack") toast("Posted to " + (isDmSess(s) ? "your Slack DM" : "the Slack thread") + " by the swarm bot, attributed to you.");
}

/* ---------- live simulation: every turn has the prod shape (round 8) ---------- */
// The swarm's reply shows as working. About 2 s later it says what it does next and a worker starts.
// About 6 s after that the worker finishes, a follow-up (hidden) wakes the lead, and the swarm posts the result.
const SIM_PICK = [[/research|compare|find|why|look/i, "researcher", "research"], [/write|draft|copy|post|text/i, "writer", "content"], [/review|check|audit/i, "reviewer", "review"]];
const firstLine = (t) => String(t || "").split("\n").map((x) => x.trim()).find(Boolean) || "";
function simulateTurn(s, lead, text) {
  const m = SIM_PICK.find((x) => x[0].test(text) && D.agents[x[1]]);
  const a = m ? m[1] : "coder", type = m ? m[2] : "implementation", name = agent(a).name;
  s.sim = (s.sim || 0) + 1;
  setTimeout(() => {
    const at = nowIso();
    lead.status = "completed"; lead.text = "On it. Sending it to the " + name + ".";
    const w = { kind: "work", agent: a, taskType: type, at, status: "running", text: "Working on: " + clip(firstLine(text), 72) };
    s.timeline.push(w);
    s.tasks += 1; s.last = at;
    if (!s.agents.includes(a)) s.agents.push(a);
    render();
    setTimeout(() => {
      w.text = "Done: " + clip(firstLine(text), 80);
      s.sim -= 1;
      finishTurn(s, "Done. The " + name + " finished the work. Open the step above for the details.", [w]);
    }, 6000);
  }, 2000);
}
// The end of a turn: the running steps finish, one follow-up per worker, then the swarm's result.
// The session stays running while another simulated turn or an older step is still going.
function finishTurn(s, text, items) {
  if (!s.timeline) s.timeline = timelineOf(s).map((t) => ({ ...t }));
  const at = nowIso(), ran = [];
  (items || s.timeline.filter((t) => t.status === "running")).forEach((t) => {
    t.status = "completed";
    const n = normItem(t);
    if (n.kind === "work") ran.push(n.agent);
    else if (!t.text) t.text = "Picked this up.";
  });
  ran.forEach((a) => s.timeline.push({ kind: "internal", type: "follow-up", at, text: agent(a).name + " finished. The lead read the result." }));
  s.timeline.push({ kind: "lead", at, status: "completed", text: text || "Done." });
  s.tasks += ran.length + 1; s.last = at;
  if (!s.sim && !s.timeline.some((t) => t.status === "running")) s.status = "completed";
  // A finished session I am not looking at turns unread, and a toast offers to open it.
  const visible = paneSids().includes(s.id) && !S.legacy;
  // A finished turn is a data change (in the app it arrives with the 5 s poll): no flash, no entrance.
  if (!visible) s.read = false;
  render();
  if (!visible && !S.legacy && s.status === "completed") toast({ pre: "\"", title: s.title, post: "\" finished." }, "Open", () => openSession(s.id));
}

/* ---------- rename a session (as shipped: PATCH /api/tasks/{id}/title, at most 120 characters) ---------- */
const TITLE_MAX = 120;
// Who started a session: the requester, else the author of the first message, else the owner.
function starterOf(s) {
  const x = INVOLVED[s.id];
  if (x && x.requester) return x.requester;
  const h = timelineOf(s).map(normItem).find((t) => t.kind === "human" || t.kind === "reply");
  return h ? h.who : s.owner;
}
// The owner and people with Can edit. A Slack or Telegram session: only the person who started it.
function canRename(s) {

}
// With no name, a session shows its first message.
const titleFallback = (s) => firstLine(firstMsg(s)) || s.title;
function startRename(sid, pi) {
  const s = SESS[sid];
  if (!canRename(s) || S.legacy) return;
  if (pi == null || !S.panes[pi] || S.panes[pi].active !== sid) pi = S.panes.findIndex((p) => p.active === sid);
  if (pi < 0) return;

}
// Enter or blur saves, Escape cancels. An empty name clears it, and the session falls back to its first message.
function endRename(save, refocus) {
  const T = S.titleEdit; if (!T) return;
  S.titleEdit = null;
  const s = SESS[T.sid];
  let changed = false;
  if (save && s) {
    const v = T.draft.trim().slice(0, TITLE_MAX);
    const next = v || titleFallback(s);
    changed = next !== s.title || !v !== !!s.untitled;
    s.title = next; s.untitled = !v;
  }
  render();
  if (refocus) { const b = $('.egroup[data-p="' + T.pi + '"] [data-act="rename"]'); if (b) b.focus({ preventScroll: true }); }
  if (changed) toast("Renamed");
}

function approve(sid, i, ok) {

  s.timeline[i].resolved = ok ? "approved" : "rejected";
  s.needs = false;
  s.timeline.push({ kind: "note", at: nowIso(), text: (ok ? "Approved" : "Rejected") + " by " + person(ME).name + "." });
  s.status = ok ? "running" : "paused";
  s.last = nowIso();
  render();
}

/* ---------- groups ---------- */

/* ---------- group tab: rows, pills, paging, and keys ---------- */
function gtOf(el) {
  const p = el && el.closest(".pane[data-gt]");
  return p ? { id: p.dataset.gt, pi: +p.dataset.p, g: S.gt[p.dataset.gt] } : null;
}
const gtIds = (G) => gtView(G.id).shown.map((h) => h.s.id);
function revealGt(G) {

  if (el) el.scrollIntoView({ block: "nearest" });
}
function gtRange(G, sid) {
  const ids = gtIds(G), a = ids.indexOf(G.g.anchor), b = ids.indexOf(sid);
  if (a < 0 || b < 0) { toggleSel(sid); return; }
  ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach((id) => S.sel.add(id));
  render();
}
function gtClick(e, G) {
  if (!G || !G.g) return;
  const g = G.g;
  const b = e.target.closest("[data-bulk]");
  if (b) { bulkAction(b, "#gtl-" + G.pi); return; }
  const pill = e.target.closest("[data-gtf]");
  if (pill) { hideTip(); g.f = pill.dataset.gtf; g.limit = PAGE; render(); return; }
  const a = e.target.closest("[data-act]"), act = a && a.dataset.act;
  if (act === "gtmore") { g.limit += PAGE; render(); return; }
  if (act === "gtclear") { hideTip(); g.q = ""; g.limit = PAGE; render(); const i = $("#gtq-" + G.pi); if (i) i.focus(); return; }
  if (act === "back") { goBack(); return; }
  const row = e.target.closest(".ses"); if (!row) return;
  const sid = row.dataset.sid;
  g.cur = sid;
  if (isPhone() && S.sel.size) { toggleSel(sid); return; }
  // The checkbox selects without opening. Shift selects a range. A plain click opens a session tab.
  if (act === "sel") { hideTip(); if (e.shiftKey && g.anchor) gtRange(G, sid); else { g.anchor = sid; toggleSel(sid); } return; }
  if (e.metaKey || e.ctrlKey) { g.anchor = sid; toggleSel(sid); return; }
  if (e.shiftKey && g.anchor) { gtRange(G, sid); return; }
  g.anchor = sid;

}
function gtSearchKey(e) {
  const G = gtOf(e.target); if (!G || !G.g) return;
  const g = G.g, list = $("#gtl-" + G.pi);
  if (e.key === "Escape") {
    e.preventDefault(); e.stopPropagation(); hideTip();
    if (g.q) { g.q = ""; g.limit = PAGE; render(); } else if (list) list.focus({ preventScroll: true });
  } else if (e.key === "ArrowDown" || e.key === "Enter") {
    const ids = gtIds(G); if (!ids.length) return;
    e.preventDefault(); e.stopPropagation();
    g.cur = ids[0]; g.kb = true;
    if (e.key === "Enter") { openSession(ids[0]); return; }
    render();
    const l = $("#gtl-" + G.pi); if (l) { l.focus({ preventScroll: true }); l.classList.add("kb"); }
    revealGt(G);
  }
}
function gtKey(e, list) {
  const G = gtOf(list); if (!G || !G.g) return;
  const g = G.g, ids = gtIds(G);
  const i = ids.indexOf(g.cur);
  const targets = () => (S.sel.size ? Array.from(S.sel) : g.cur ? [g.cur] : []);
  const go = (ni) => {
    if (!ids.length) return;
    g.cur = ids[Math.max(0, Math.min(ids.length - 1, ni))]; g.kb = true;
    render(); revealGt(G);
  };
  // Mail-style triage: when the row under the cursor leaves the list, the cursor moves to the next row.
  const stepPast = (t) => { if (t.includes(g.cur)) g.cur = ids.find((id, j) => j > i && !t.includes(id)) || ids.slice(0, Math.max(0, i)).reverse().find((id) => !t.includes(id)) || null; };
  switch (e.key.length === 1 ? e.key.toLowerCase() : e.key) {
    case "j": case "ArrowDown": go(i < 0 ? 0 : i + 1); break;
    case "k": case "ArrowUp": go(i < 0 ? 0 : i - 1); break;
    case "Home": go(0); break;
    case "End": go(ids.length - 1); break;
    case "Enter": case "o": if (g.cur) openSession(g.cur); break;
    case "t": if (g.cur) openSession(g.cur, "newtab"); break;
    case "v": if (g.cur) openSession(g.cur, "split"); break;
    case "x": if (g.cur) { g.kb = true; g.anchor = g.cur; toggleSel(g.cur); } break;
    case "e": { const t = targets(); if (t.length) { g.kb = true; stepPast(t); markDone(t); } break; }
    case "u": { const t = targets(); if (t.length) { toggleRead(t); S.sel.clear(); render(); } break; }
    case "m": { const t = targets(); if (t.length) openPalette("group", { purpose: "move", sids: t }); break; }
    case "l": {
      const t = targets(); if (!t.length) break;
      if (t.every((id) => SESS[id].triage === "later")) { stepPast(t); unsnooze(t); break; }
      const el = document.getElementById(rowId("t|" + g.ctx + "|" + g.cur)), r = (el || list).getBoundingClientRect();
      openMenu({ type: "snooze", sids: t, x: r.left + 40, y: r.bottom + 2, ret: "#gtl-" + G.pi });
      break;
    }
    default: return;
  }
  e.preventDefault();
}

  const done = s.triage === "done" ? svg("inbox") + "Inbox" : "Done" + svg("done");

  return '<span class="swl">' + later + '</span><span class="swr">' + done + "</span>";
}
function startSwipe(t) {
  const s = SESS[t.sid]; if (!s) { t.mode = "scroll"; return; }
  hideTip(); hideCard();
  const bg = document.createElement("div");
  bg.className = "swbg";
  bg.setAttribute("aria-hidden", "true");
  bg.innerHTML = swipeLabels(s);
  bg.style.top = t.row.offsetTop + "px";
  bg.style.height = t.row.offsetHeight + "px";
  t.row.parentElement.insertBefore(bg, t.row);
  t.row.classList.add("swiping");
  t.bg = bg;
  try { t.row.setPointerCapture(t.pid); } catch (err) { /* the pointer is gone */ }
}
function moveSwipe(t, dx) {
  const w = t.row.offsetWidth;
  // Past the threshold the row follows the finger more slowly, so the end of the drag feels firm.
  const a = Math.abs(dx), eased = a <= SWIPE_AT ? a : SWIPE_AT + (a - SWIPE_AT) * 0.6;
  t.dx = Math.sign(dx) * Math.min(w, eased);
  t.row.style.transform = "translateX(" + t.dx + "px)";
  t.bg.dataset.dir = t.dx < 0 ? "done" : "later";
  const arm = Math.abs(t.dx) >= SWIPE_AT;
  if (arm !== t.bg.classList.contains("arm")) { t.bg.classList.toggle("arm", arm); if (arm && navigator.vibrate) { try { navigator.vibrate(8); } catch (err) { /* no haptics */ } } }
}
function endSwipe(t, cancelled) {
  const row = t.row, bg = t.bg, sid = t.sid, s = SESS[sid];
  const go = !cancelled && Math.abs(t.dx) >= SWIPE_AT, done = t.dx < 0;
  const clean = () => { row.classList.remove("swiping", "snap"); row.style.transform = ""; if (bg) bg.remove(); };
  const ms = RMOTION.matches ? 0 : 200;
  row.classList.add("snap");
  if (go && done) {
    // Done: the row leaves to the left (200 ms swift), then it collapses (150 ms snappy), so the rows below glide up
    // instead of jumping. In React: AnimatePresence with an exit of { height: 0, opacity: 0 }.
    row.style.transform = "translateX(-100%)";
    setTimeout(() => {
      if (!ms || !row.animate) { clean(); markDone([sid]); return; }
      const cs = getComputedStyle(row), h = row.offsetHeight;
      row.style.minHeight = "0";
      row.animate([{ height: h + "px", paddingTop: cs.paddingTop, paddingBottom: cs.paddingBottom, opacity: 1 }, { height: "0px", paddingTop: "0px", paddingBottom: "0px", opacity: 0 }], { duration: 150, easing: SNAPPY, fill: "forwards" });
      if (bg) bg.animate([{ height: h + "px", opacity: 1 }, { height: "0px", opacity: 0 }], { duration: 150, easing: SNAPPY, fill: "forwards" });
      setTimeout(() => markDone([sid]), 150);
    }, ms);
    return;
  }
  row.style.transform = "";
  setTimeout(clean, ms);
  if (go && s) { if (s.triage === "later") unsnooze([sid]); else openMenu({ type: "snooze", sids: [sid] }); }
}
function longPress(t) {
  if (tp !== t || t.mode) return;
  t.mode = "long";
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) { /* no haptics */ } }
  if (t.ses) { S.sel.add(t.sid); hideTip(); render(); return; }
  // A group row: "New session here" (and the group actions for my own groups).
  const r = rowOf(t.row.dataset.k);
  if (!r || r.t !== "g" || !r.newIn) { t.mode = "scroll"; return; }
  openMenu(r.editable ? { type: "group", path: r.id } : { type: "group", path: r.newIn, label: r.label, only: true });
}

// Sheets drag down to close, from anywhere (vaul handleOnly={false}): the handle, the title row, or the body while
// it is scrolled to the top and the finger moves down. The backdrop dims with the distance. Past 80 px, a quarter of
// the height, or a flick, the sheet goes (a flick closes faster, 150 to 250 ms). Else it springs back (250 ms swift).
let sd = null;
const sheetScroller = (sh) => sh.querySelector(".pallist,.picklist,.sdaddv .sdopts") || sh;
document.addEventListener("pointerdown", (e) => {
  if (!isPhone() || sd) return;
  const sh = e.target.closest(".sheet"); if (!sh) return;
  if (e.target.closest("input,textarea,select,.gcards")) return;
  const grab = !!e.target.closest(".sgrab");
  if (grab) e.preventDefault();
  sd = { sh, y0: e.clientY, x0: e.clientX, t0: Date.now(), dy: 0, pid: e.pointerId, on: grab, grab, bd: sheetBackdrop(sh) };
  if (grab) startSheetDrag(sd, e);
});
function sheetBackdrop(sh) { return sh.closest(".ovl") || (sh.previousElementSibling && sh.previousElementSibling.classList.contains("sov") ? sh.previousElementSibling : null); }
function startSheetDrag(d, e) {
  d.on = true;
  d.h = d.sh.offsetHeight;
  const tf = getComputedStyle(d.sh).transform;
  d.base = tf && tf !== "none" ? new DOMMatrix(tf).m42 : 0;
  d.sh.style.animation = "none";
  d.sh.style.transition = "none";
  d.sh.style.transform = "translateY(" + d.base + "px)";
  try { d.sh.setPointerCapture(e.pointerId); } catch (err) { /* the pointer is gone */ }
}
document.addEventListener("pointermove", (e) => {
  const d = sd; if (!d || e.pointerId !== d.pid) return;
  const dy = e.clientY - d.y0, dx = e.clientX - d.x0;
  if (!d.on) {
    // the body: only a downward drag from the top of its scroll, and only once it is clearly vertical
    if (Math.abs(dy) < 4 && Math.abs(dx) < 4) return;
    const sc = sheetScroller(d.sh);
    if (dy > 0 && Math.abs(dy) > Math.abs(dx) && sc.scrollTop <= 0) startSheetDrag(d, e);
    else { sd = null; return; }
  }
  d.dy = Math.max(0, dy);
  d.sh.style.transform = "translateY(" + (d.base + d.dy) + "px)";
  if (d.bd) d.bd.style.opacity = String(Math.max(0, 1 - d.dy / Math.max(1, d.h)));
}, { passive: false });
// On a touch screen, stop the page from panning while the sheet follows the finger.
document.addEventListener("touchmove", (e) => { if (sd && sd.on && e.cancelable) e.preventDefault(); }, { passive: false });
function endSheetDrag(e) {
  const d = sd; if (!d || e.pointerId !== d.pid) return;
  sd = null;
  if (!d.on) return;
  // the click that ends a drag must not tap the item under the finger
  if (d.dy > 4) { const eat = (ev) => { ev.stopPropagation(); ev.preventDefault(); }; document.addEventListener("click", eat, { capture: true, once: true }); setTimeout(() => document.removeEventListener("click", eat, true), 300); }
  const v = d.dy / Math.max(1, Date.now() - d.t0); // px per ms
  const fast = d.dy > 24 && v > 0.6;
  if (d.dy >= Math.min(80, d.h * 0.25) || fast) { sheetOut(fast ? Math.min(250, Math.max(150, (d.h - d.dy) / v)) : 250); return; }
  d.sh.style.transition = "transform .25s var(--ease-swift)";
  d.sh.style.transform = "";
  if (d.bd) { d.bd.style.transition = "opacity .25s var(--ease-swift)"; d.bd.style.opacity = ""; }
  setTimeout(() => { if (!sd) { d.sh.style.transition = ""; if (d.bd) d.bd.style.transition = ""; } }, 260);
}
document.addEventListener("pointerup", endSheetDrag);
document.addEventListener("pointercancel", endSheetDrag);
// Close the open sheet. Its exit (slide down, backdrop fade) runs in ghostOut, the same for every close path.
function sheetOut(ms) {
  sheetMs = ms || 250;
  closeTopSheet();
  sheetMs = 250;
}
function closeTopSheet() {
  if (S.share) closeShare();
  else if (S.pal) closePalette();
  else if (S.picker) closePicker(false);
  else if (S.menu) closeMenu(false);
  else if (S.guide != null) closeGuide(false);
}
// Crossing the 768 px line switches the layout: menus close, and the rows and headers render for the new size.
PHONE_MQ.addEventListener("change", () => { S.menu = null; S.picker = null; menuBuilt = null; $("#guide").innerHTML = ""; render(); });

/* ============================================================
   boot
   ============================================================ */
(function boot() {
  const q = new URLSearchParams(location.search);
  applyTheme(q.get("theme") === "dark" ? "dark" : "light");
  renderRail();
  // ?sat= and ?sab= (the mobile.html frames): a fake notch and home indicator, since an iframe has no safe area
  ["sat", "sab"].forEach((k) => { const v = parseInt(q.get(k) || "", 10); if (v > 0) document.documentElement.style.setProperty("--" + k, Math.min(80, v) + "px"); });
  // The keyboard: on iOS the visual viewport shrinks and the layout does not. --kb is the covered height, so the
  // app, the composer, and the sheets stay above the keyboard. Android Chrome resizes (interactive-widget) and gets 0.
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const upd = () => {
      const kb = isPhone() ? Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop)) : 0;
      document.documentElement.style.setProperty("--kb", kb + "px");
      document.documentElement.classList.toggle("kbup", kb > 80);
    };
    vv.addEventListener("resize", upd); vv.addEventListener("scroll", upd); upd();
  }
  try { const w = +localStorage.getItem("sv2-tree-w"); if (w) setTreeW(w); } catch (e) { /* storage off */ }
  const list = (k) => (q.get(k) || "").split(",").map((x) => x.trim().toLowerCase()).filter((x) => SOURCES.includes(x));
  // ?expand=slack opens every group in that source section (they start open; this survives from round 2).
  list("expand").forEach((k) => { channelsOf(k).forEach((p) => { S.open[p] = true; }); });
  list("hide").forEach((k) => { S.hideSrc[k] = true; });
  const open = SESS[q.get("open")] ? q.get("open") : "s1";
  const bg = ALL.find((s) => s.finishesInSeconds);
  S.panes = [{ tabs: [open], active: open }];
  if (bg && bg.id !== open) S.panes[0].tabs.push(bg.id);
  SESS[open].read = true;
  const sp = q.get("split");
  if (sp && SESS[sp] && sp !== open) {
    const p0 = S.panes[0], at = p0.tabs.indexOf(sp);
    if (at >= 0) p0.tabs.splice(at, 1);
    S.panes.push({ tabs: [sp], active: sp });
    SESS[sp].read = true;
  }
  S.legacy = q.get("legacy") === "1";
  if (S.legacy) S.legacySel = D.legacy.some((x) => x.id === open) ? open : D.legacy[0].id;
  // ?q=<query> lands on a sidebar search (with:lena, is:unread, ...).
  if (q.get("q")) S.q = q.get("q");
  // A phone opens on the list. A deep link to a session (?open=) lands on its detail screen, and back returns to the list.
  if (isPhone()) { S.compactDetail = !!SESS[q.get("open")]; S.msearch = !!S.q; }
  // ?scale=N: put the cursor on the big group, northwind › pricing.
  const big = "g|shared/northwind/pricing/";
  if (SCALE && !FIRSTRUN && !S.q) S.focusRow = big;
  render();
  if (q.get("group") && !S.legacy) revealGroup(q.get("group"));
  // ?new=<group key> or ?new=none opens a new-session tab with that group picked.
  // ?view=<container> opens a group tab, as "View all" does (?view=inbox, ?view=shared/northwind/pricing/).
  const nw = q.get("new"), vw = q.get("view");
  if (nw != null && !S.legacy) openNewTab(normStart(nw));
  else if (vw && !S.legacy && (["inbox", "later", "done", "nogroup"].includes(vw) || vw.endsWith("/") || vw.startsWith("th:"))) openGroupTab(vw);
  else if (!S.legacy) {
    treeEl.focus({ preventScroll: true });
    // The big group (and its parent row, for context) scrolls to the top of the sidebar,
    // so its 10 rows, "Show 10 more", and "View all" show.
    const el = S.focusRow === big && (document.getElementById(rowId("g|shared/northwind/")) || document.getElementById(rowId(big)));
    if (el) treeEl.scrollTop += el.getBoundingClientRect().top - treeEl.getBoundingClientRect().top - 4;
    else revealRow(S.focusRow);
  }

  // First visit: the guide. ?guide=1 forces it, ?guide=0 skips it for a deep link. The first-run variant always opens it.
  const gq = q.get("guide");
  if (!S.legacy && (gq === "1" || (gq !== "0" && (FIRSTRUN || !guideStored())))) openGuide(0);

  // A background session finishes about 8 s after load: its worker step completes, a follow-up wakes the lead,
  // and the swarm posts its result. The tab and row light up as unread when it is not on screen.
  if (bg) {
    setTimeout(() => {
      const w = timelineOf(bg).map(normItem).filter((t) => t.kind === "work" && t.status === "running").pop();
      finishTurn(bg, w ? "Done. The " + agent(w.agent).name + " finished the last step. Open it above for the details." : "Done.");
    }, (bg.finishesInSeconds || 8) * 1000);
  }
  // Later: wake snoozed sessions on time.
  setInterval(tickWake, 1000);
})();
