<!doctype html>
<!--
  Round 5, "A+B merged": the session list lives inside the sidebar. Inbox, Later, and Done are flat lists with a group label on each row, groups nest with a "#" and a dropdown chevron, and external sources show only what the operator setting SESSIONS_EXTERNAL_SOURCES allows (the page opens in "dm": DMs with the swarm, no channel threads).
  Plain headers, a hover checkbox in the unread-dot slot, and no Next bar make the sidebar quieter, but select and next-unread are now less visible: they rely on hover, the x and n keys, and Cmd+K.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Swarm · Sessions · A+B merged</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../session-logs/demo-shared.css" />
<style>
/* ============ local tokens ============ */
:root{
  --hover: oklch(0.943 0.003 286.375);
  --border-subtle: oklch(0.945 0.003 286);
  --on-primary: oklch(0.985 0 0);
  --tree-w: 320px;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --ov: oklch(0.141 0.005 285.823 / 0.28);
}
html.dark{
  --hover: oklch(0.274 0.006 286.033);
  --border-subtle: oklch(1 0 0 / 8%);
  --on-primary: oklch(0.21 0.006 285.885);
  --ov: oklch(0 0 0 / 0.5);
}
html.dark .btn.primary{color:var(--on-primary)}
html,body{height:100%;overflow:hidden}
body{font-size:14px}
button{font-family:inherit;color:inherit}
kbd{font-family:var(--font-mono);font-size:11px;line-height:1;padding:3px 5px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--muted-foreground);white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:15px;height:15px;flex:none}
.smk{width:13px;height:13px;flex:none;display:inline-block;vertical-align:-2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.btn.sm{height:28px;padding:0 10px;font-size:12px;gap:6px}
.btn.sm svg{width:13px;height:13px}
.btn.danger{color:var(--error-strong);border-color:color-mix(in oklch,var(--error) 35%,var(--border))}
.btn.danger:hover{background:color-mix(in oklch,var(--error) 10%,transparent)}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:none;border-radius:7px;color:var(--muted-foreground);cursor:pointer;flex:none;transition:background .15s var(--ease),color .15s var(--ease)}
.ib:hover{background:var(--hover);color:var(--foreground);transition-duration:0s}
.ib:focus-visible,.btn:focus-visible,.tab:focus-visible,.lnk:focus-visible,.sb:focus-visible,.srcsec:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.ib svg{width:15px;height:15px}
.lnk{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;font-size:12.5px;font-weight:500;color:var(--primary);cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}

/* ============ app shell ============ */
#app{height:100dvh;display:grid;grid-template-rows:46px minmax(0,1fr) 28px;min-width:0}
#app.is-legacy{grid-template-rows:46px minmax(0,1fr)}
.hdr{display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;border-bottom:1px solid var(--border);background:var(--background);min-width:0}
.hdr .mark{width:20px;height:20px;flex:none;color:var(--foreground)}
.hdr .crumb{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.hdr .kick{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground);border-left:1px solid var(--border);padding-left:10px;white-space:nowrap}
.hdr .sp{flex:1}
.kbtn{display:flex;align-items:center;gap:8px;height:30px;width:280px;max-width:32vw;padding:0 6px 0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted-foreground);font-size:12.5px;cursor:pointer;min-width:0}
.kbtn:hover{border-color:color-mix(in oklch,var(--muted-foreground) 40%,var(--border))}
.kbtn span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .lnk{color:var(--muted-foreground);font-size:12.5px;padding:0 6px;height:30px}
.hdr .lnk:hover{color:var(--foreground)}

.shell{min-height:0;min-width:0;display:grid;grid-template-columns:var(--tree-w) minmax(0,1fr)}
#tree{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border)}
#right{min-height:0;min-width:0;display:flex;position:relative;background:var(--background)}
.is-legacy .shell,.is-legacy .statusbar{display:none}
#legacy{display:none}
.is-legacy #legacy{display:grid}

/* ============ sidebar: sections > groups > sessions ============ */
.sbh{flex:none;position:relative;display:flex;align-items:center;gap:2px;height:42px;padding:0 8px 0 16px;border-bottom:1px solid var(--border-subtle)}
.sbh h2{margin:0;flex:1;min-width:0;font-size:13px;font-weight:600;letter-spacing:-.005em}
.sbh .ib{position:relative}
.sbh .ib[aria-pressed="true"],.sbh .ib[aria-expanded="true"]{color:var(--foreground);background:var(--hover)}
.fdot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px var(--surface)}
.bulk{position:absolute;inset:0 0 -1px;z-index:4;display:flex;align-items:center;gap:1px;padding:0 6px 0 14px;background:color-mix(in oklch,var(--primary) 8%,var(--surface));border-bottom:1px solid color-mix(in oklch,var(--primary) 32%,var(--border))}
.bulk .cnt{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap}
.qbar{flex:none;display:flex;align-items:center;gap:8px;margin:8px 8px 2px;height:30px;padding:0 3px 0 10px;border-radius:8px;border:1px solid color-mix(in oklch,var(--primary) 40%,var(--border));background:color-mix(in oklch,var(--primary) 6%,var(--background));font-size:12px}
.qbar svg{width:13px;height:13px;color:var(--primary);flex:none}
.qbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .btn{height:24px;padding:0 8px;font-size:11.5px}
.tscroll{flex:1;min-height:0;overflow-y:auto;padding:6px 0 14px;outline:none;overscroll-behavior:contain}
.tscroll::-webkit-scrollbar{width:8px}
.tscroll::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 25%,transparent);border-radius:9px}
.lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}

/* section headers: MY GROUPS, SHARED WITH ME, SLACK, TELEGRAM. Plain: the title, then the number of sessions on the right. */
.tsec{position:relative;display:flex;align-items:center;gap:6px;height:30px;margin:12px 6px 0;padding:0 8px 0 12px}
.tsec .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsec .tcount{flex:none;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}

/* rows: group rows and session rows share the indent and the guide line */
.tr{position:relative;display:flex;align-items:center;gap:6px;height:28px;margin:0 6px;padding:0 6px 0 calc(6px + var(--lv,0) * 14px);border-radius:6px;font-size:13px;color:var(--foreground);cursor:pointer;user-select:none;transition:background .2s var(--ease) .05s}
.tr:hover{background:var(--hover);transition:none}
.kid::before{content:"";position:absolute;left:calc(var(--lv) * 14px);top:0;bottom:0;border-left:1px solid var(--border);pointer-events:none}
.tic{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--muted-foreground)}
.tic svg{width:14px;height:14px}
.tic .smk{width:13px;height:13px;color:var(--foreground)}
.tlbl{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tsp{flex:1 1 0;min-width:0}
.tr.box .tlbl{font-weight:600}
/* the dropdown chevron: only on a group that has subgroups, the one fold control */
.gchev{width:18px;height:18px;flex:none;display:grid;place-items:center;margin-left:-2px;padding:0;border:0;border-radius:4px;background:none;color:var(--muted-foreground);cursor:pointer}
.gchev svg{width:13px;height:13px;transform:rotate(-90deg);transition:transform .15s var(--ease)}
[aria-expanded="true"]>.gchev svg{transform:none}
.gchev:hover{color:var(--foreground);background:color-mix(in oklch,var(--muted-foreground) 18%,var(--hover))}
.glock{flex:none;display:inline-grid;place-items:center;vertical-align:-1px;color:var(--muted-foreground)}
.glock svg{width:12px;height:12px}
.tr.addg{color:var(--muted-foreground)}
.tr.addg:hover{color:var(--foreground)}
.ownav{width:16px;height:16px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;letter-spacing:.02em;background:var(--muted);border:1px solid var(--border);color:var(--foreground)}
/* group actions ("..." and "+"): they appear to the left of the counts and never cover them */
.tacts{position:relative;flex:none;width:0;height:22px}
.tacts>span{position:absolute;right:0;top:0;display:flex;gap:1px;padding-left:4px;border-radius:5px;background:var(--hover);opacity:0;pointer-events:none}
.tr:hover .tacts>span,.tr:focus-within .tacts>span,.tscroll.kb .tr.focus .tacts>span{opacity:1;pointer-events:auto}
.tbtn{width:22px;height:22px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:none;color:var(--muted-foreground);cursor:pointer}
.tbtn svg{width:14px;height:14px}
.tbtn:hover{color:var(--foreground);background:color-mix(in oklch,var(--muted-foreground) 18%,var(--hover))}
.tbtn:focus-visible{outline:2px solid var(--ring);outline-offset:-1px}
.tbtn[data-act="gnew"]{color:var(--foreground)}
.tinp{flex:1;min-width:0;height:22px;padding:0 6px;border:1px solid var(--ring);border-radius:5px;background:var(--background);color:var(--foreground);font:inherit;font-size:12.5px;font-weight:500;outline:none;box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 35%,transparent)}
.dragging .tr[data-drop="1"]::after{content:"";position:absolute;inset:1px;border:1px dashed color-mix(in oklch,var(--primary) 55%,transparent);border-radius:6px;pointer-events:none}
.tr.dz-hot{background:color-mix(in oklch,var(--primary) 12%,transparent)}
.tr.dz-hot::after{border-style:solid !important;border-color:var(--primary) !important}

/* counts: the same words as the rows. "3 unread", "1 needs you", a spinner for running */
.cns{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:5px}
.cn{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.cn.u{border:1px solid var(--border);background:var(--background);color:var(--foreground)}
.cn.n{border:1px solid color-mix(in oklch,var(--primary) 50%,transparent);background:color-mix(in oklch,var(--primary) 11%,transparent);color:var(--active-strong)}
.cn.r,.cn.t{padding:0 2px;font-family:var(--font-mono);font-weight:400;color:var(--muted-foreground)}
.cn .spin{width:10px;height:10px;border-width:1.5px}
.spin{display:inline-block;width:12px;height:12px;flex:none;border-radius:50%;border:1.6px solid color-mix(in oklch,var(--primary) 22%,transparent);border-top-color:var(--primary);border-right-color:var(--primary);animation:spin 1.1s linear infinite}
.gly{position:relative;width:14px;height:14px;flex:none;display:grid;place-items:center}
.gly .spin{width:11px;height:11px}
.gd{display:block;width:7px;height:7px;border-radius:50%}
.gd.needs{background:var(--primary);box-shadow:0 0 0 2.5px color-mix(in oklch,var(--primary) 24%,transparent)}
.gd.unread{background:var(--foreground)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lit{0%{background-color:color-mix(in oklch,var(--primary) 22%,transparent)}100%{background-color:transparent}}

/* session rows: [left slot: unread dot, or a checkbox on hover] [source] title [group label] [people] [activity] [time] */
.tr.ses{height:26px}
.ud{width:7px;height:7px;flex:none;border-radius:50%}
.unread .ud{background:var(--foreground)}
.ls{position:relative;width:16px;height:16px;flex:none;display:grid;place-items:center}
.ls>*{grid-area:1/1}
.cbx{display:none;width:14px;height:14px;place-items:center;border-radius:4px;border:1.5px solid var(--muted-foreground);background:var(--background);color:var(--on-primary);cursor:pointer}
.cbx svg{width:10px;height:10px;stroke-width:3.2;visibility:hidden}
.cbx:hover{border-color:var(--foreground)}
.ses:hover .cbx,.tscroll.kb .ses.focus .cbx,.tscroll.selmode .ses .cbx{display:grid}
.ses:hover .ud,.tscroll.kb .ses.focus .ud,.tscroll.selmode .ses .ud{display:none}
.ses.sel .cbx{background:var(--primary);border-color:var(--primary)}
.ses.sel .cbx svg{visibility:visible}
.gtag{flex:none;max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:500;color:var(--muted-foreground)}
.ses .srcm{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--foreground)}
.ses .srcm .smk{width:12px;height:12px}
.ses .stl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted-foreground)}
.ses.unread .stl{font-weight:600;color:var(--foreground)}
.tm{flex:none;min-width:22px;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;white-space:nowrap}
.ses.unread .tm{color:var(--foreground)}
.tm.wake{display:inline-flex;align-items:center;gap:3px}
.tm.wake svg{width:11px;height:11px}
.act{flex:none;display:inline-flex;align-items:center}
.npill{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;border:1px solid color-mix(in oklch,var(--primary) 50%,transparent);background:color-mix(in oklch,var(--primary) 11%,transparent);color:var(--active-strong);font-size:11px;font-weight:600;line-height:1;white-space:nowrap}
.fmk{width:15px;height:15px;flex:none;display:grid;place-items:center;border-radius:50%;background:color-mix(in oklch,var(--error) 16%,transparent);color:var(--error-strong)}
.fmk svg{width:11px;height:11px;stroke-width:3}
.ppl{flex:none;display:inline-flex;align-items:center;padding-left:4px}
.pav{width:17px;height:17px;flex:none;margin-left:-4px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:700;letter-spacing:.02em;background:var(--card);border:1px solid color-mix(in oklch,var(--muted-foreground) 40%,transparent);box-shadow:0 0 0 1.5px var(--surface);color:var(--foreground)}
.ses:hover .pav,.ses.open .pav,.tscroll.kb .focus .pav{box-shadow:0 0 0 1.5px var(--hover)}
.pav.more{font-family:var(--font-mono);font-weight:400;color:var(--muted-foreground);background:var(--background)}
.ses.open{background:var(--hover)}
.ses.open::after{content:"";position:absolute;left:-6px;top:5px;bottom:5px;width:2px;border-radius:2px;background:var(--primary)}
.ses.sel{background:color-mix(in oklch,var(--primary) 13%,transparent)}
.ses.sel:hover{background:color-mix(in oklch,var(--primary) 18%,transparent)}
.tscroll.kb .focus{box-shadow:inset 0 0 0 1.5px var(--ring)}
.tscroll.kb .focus:not(.sel){background:var(--hover)}
.tr.flash{animation:lit 1.5s var(--ease)}
.tr.more{color:var(--muted-foreground)}
.tr.more .tlbl{font-weight:500}
.tr.more svg{width:13px;height:13px}
/* empty state inside the sidebar: icon and text centered in their block, both ways */
.tempty{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:68px;margin:0 6px;padding:10px 12px 10px calc(12px + var(--lv,0) * 14px);text-align:center;font-size:12px;line-height:1.45;color:var(--muted-foreground)}
.tempty>svg{width:16px;height:16px;margin-bottom:2px}
.tempty b{font-weight:500;color:var(--foreground)}
.tempty kbd{padding:1px 4px}
.tempty .lnk{margin-top:2px;font-size:12px}
.tempty .lnk svg{width:12px;height:12px}

/* the resize handle */
.rsz{position:absolute;top:0;bottom:0;right:-4px;width:8px;z-index:6;cursor:col-resize;outline:none;touch-action:none}
.rsz::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .15s var(--ease)}
.rsz:hover::after,.rsz.on::after,.rsz:focus-visible::after{background:var(--primary)}
body.resizing{cursor:col-resize;user-select:none}

/* hover card on a session row: the latest output, read without opening */
#hcard{position:fixed;z-index:75;width:300px;padding:10px 12px 11px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -14px oklch(0 0 0 / .3);pointer-events:none;animation:pop .15s var(--ease)}
#hcard[hidden]{display:none}
.hc1{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.hc1 span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc1 svg{width:12px;height:12px;flex:none}
.hct{margin-top:5px;font-size:13.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.hcp{margin-top:5px;font-size:12.5px;line-height:1.5;color:var(--muted-foreground);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.hcp b{color:var(--foreground);font-weight:600}
.hcf{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:9px;font-size:11.5px;color:var(--muted-foreground)}
.hcf .mono{font-size:11px}

/* ============ pane 3: editor (tabs + split) ============ */
.egroup{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.egroup+.egroup{border-left:1px solid var(--border)}
.tabs{flex:none;display:flex;align-items:stretch;height:38px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0}
.tstrip{display:flex;align-items:stretch;flex:1;min-width:0}
.tablist{display:flex;align-items:stretch;flex:0 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabnew{align-self:center;margin:0 2px 0 4px;width:26px;height:26px}
.tabnew svg{width:14px;height:14px}
.tablist::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:6px;flex:0 1 auto;min-width:112px;max-width:240px;height:38px;padding:0 5px 0 9px;border-right:1px solid var(--border-subtle);color:var(--muted-foreground);font-size:12.5px;cursor:pointer;user-select:none;background:transparent;outline-offset:-2px;transition:background .2s var(--ease) .05s}
.tab:hover{color:var(--foreground);background:color-mix(in oklch,var(--hover) 70%,transparent);transition:none}
.tab.on{background:var(--background);color:var(--foreground)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--background)}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--border)}
.egroup.focused .tab.on::before{background:var(--primary)}
.tab .ud{width:6px;height:6px}
.tab .tic{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--muted-foreground)}
.tab .tic svg{width:13px;height:13px}
.tab .tic .smk{width:12px;height:12px}
.tab.on .tic{color:var(--foreground)}
.tab .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.unread .tt{font-weight:600;color:var(--foreground)}
.tab .npill{height:17px;padding:0 5px;font-size:10.5px}
.tab .x{width:20px;height:20px;flex:none;display:grid;place-items:center;border:0;padding:0;border-radius:5px;background:none;color:var(--muted-foreground);cursor:pointer;opacity:0}
.tab .x svg{width:12px;height:12px}
.tab .x:hover{background:color-mix(in oklch,var(--muted-foreground) 18%,transparent);color:var(--foreground)}
.tab.on .x,.tab:hover .x,.tab .x:focus-visible{opacity:1}
.tab.ins-b{box-shadow:inset 2px 0 0 var(--primary)}
.tab.ins-a{box-shadow:inset -2px 0 0 var(--primary)}
.tab.dragsrc{opacity:.5}
.tab.flash{animation:lit 1.5s var(--ease)}
.tabacts{display:flex;align-items:center;gap:1px;padding:0 6px;flex:none;border-left:1px solid var(--border-subtle)}
.tabacts .ib{width:26px;height:26px}
.tabacts .ib svg{width:14px;height:14px}

.pane{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.dh{position:relative;flex:none;padding:12px 16px 10px 20px;border-bottom:1px solid var(--border)}
.dh1{display:flex;align-items:center;gap:6px;min-height:28px;min-width:0}
.dcrumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);text-align:left}
.dcrumb svg{width:12px;height:12px}
.dcrumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcrumb:hover span{color:var(--foreground);text-decoration:underline;text-underline-offset:3px}
.dacts{display:flex;align-items:center;gap:1px;flex:none}
.back{display:none}
.dtitle{margin:4px 0 0;font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.015em;overflow-wrap:anywhere}
.dmeta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:7px;font-size:12px;color:var(--muted-foreground)}
.dmeta .mono{font-size:11.5px}
.dmeta .lnk{font-size:12px}
.dmeta .lnk svg{width:12px;height:12px}
.avs{display:inline-flex;gap:3px}
.av{width:20px;height:20px;flex:none;display:grid;place-items:center;font-size:8.5px;font-weight:700;letter-spacing:.02em;border:1px solid var(--border);background:var(--muted);color:var(--foreground)}
.av.ag{border-radius:6px}
.av.pp{border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--border);color:var(--muted-foreground);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{border-color:color-mix(in oklch,var(--success) 38%,transparent);color:var(--success-strong)}
.chip.run{border-color:color-mix(in oklch,var(--active) 45%,transparent);color:var(--active-strong)}
.chip.err{border-color:color-mix(in oklch,var(--error) 38%,transparent);color:var(--error-strong)}
.chip.pause{border-color:color-mix(in oklch,var(--paused) 38%,transparent);color:var(--paused-strong)}
.chip.ext{border-style:dashed}
.chip.needs{border-color:color-mix(in oklch,var(--primary) 55%,transparent);color:var(--active-strong);background:color-mix(in oklch,var(--primary) 9%,transparent)}
.ownr{display:inline-flex;align-items:center;gap:6px}
.ownr .av{width:18px;height:18px}

.tls{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.tls::-webkit-scrollbar{width:9px}
.tls::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted-foreground) 25%,transparent);border-radius:9px}
.tl{max-width:760px;margin:0 auto;padding:22px 24px 28px;display:flex;flex-direction:column;gap:18px}
.ti{position:relative;min-width:0}
.ti-me{display:flex;justify-content:flex-end;padding-left:48px}
.mew{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:85%;min-width:0}
.tmeta{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);padding:0 2px}
.bub{padding:9px 14px;border-radius:16px 4px 16px 16px;background:var(--muted);font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.via{display:flex;align-items:flex-start;gap:6px;max-width:100%;font-size:11.5px;line-height:1.4;color:var(--muted-foreground);text-align:right}
.via .smk{margin-top:1px}
.ti-task,.ti-ext{display:flex;gap:11px}
.ti .av{width:24px;height:24px;font-size:9px;margin-top:-1px}
.tb{flex:1;min-width:0}
.th{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;font-size:12px;color:var(--muted-foreground);min-height:20px}
.th b{font-weight:600;color:var(--foreground)}
.txt{margin-top:3px;font-size:14px;line-height:1.55;color:var(--foreground);overflow-wrap:anywhere}
.wk{display:inline-flex;align-items:center;gap:7px;margin-top:7px;font-size:12.5px;font-weight:500}
.wk .pip{width:7px;height:7px;border-radius:50%;background:var(--primary);position:relative;flex:none}
.wk .pip::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--primary);opacity:.5;animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
.shim{background:linear-gradient(90deg,var(--muted-foreground) 0%,var(--foreground) 45%,var(--muted-foreground) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.8s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.ti-ext .ebox{flex:1;min-width:0;padding:9px 12px 10px;border-radius:10px;border:1px dashed color-mix(in oklch,var(--muted-foreground) 32%,transparent);background:var(--surface)}
.ti-ext .txt{color:var(--muted-foreground);font-size:13.5px}
.ti-ext .th b{color:var(--muted-foreground)}
.av.ext{border-style:dashed;background:var(--surface);color:var(--muted-foreground)}
.av.ext .smk{width:12px;height:12px}
.ask{flex:1;min-width:0;padding:11px 14px 13px;border-radius:10px;border:1px solid color-mix(in oklch,var(--primary) 45%,var(--border));background:color-mix(in oklch,var(--primary) 5%,var(--background))}
.ask .txt{font-weight:500}
.askb{display:flex;gap:8px;margin-top:11px}
.ask.done{border-color:var(--border);background:var(--surface)}
.ask.done .txt{font-weight:400;color:var(--muted-foreground)}
.tnote{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-foreground);padding-left:35px}
.tnote svg{width:13px;height:13px;color:var(--success-strong)}

.cmp{flex:none;padding:10px 16px 14px 20px}
.cmpb{max-width:760px;margin:0 auto;border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .04);transition:border-color .12s,box-shadow .12s}
.cmpb:focus-within{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 32%,transparent)}
.cmpto{display:flex;align-items:center;gap:7px;padding:8px 12px 0;font-size:11.5px;color:var(--muted-foreground);line-height:1.35}
.cmpb textarea{display:block;width:100%;resize:none;border:0;outline:0;background:none;padding:10px 12px 4px;font:inherit;font-size:14px;line-height:1.5;color:var(--foreground);min-height:44px;max-height:140px}
.cmpb textarea::placeholder{color:var(--muted-foreground)}
.cmpf{display:flex;align-items:center;gap:8px;padding:4px 6px 6px 12px;font-size:11px;color:var(--muted-foreground)}
.cmpf .sp{flex:1}
#right.two .cmpf .kh{display:none}
/* new-session tab: empty state with the composer in the middle of the pane */
.pane.nt{position:relative}
.pane.nt>.back{position:absolute;top:10px;left:10px;z-index:1}
.nsw{flex:1;min-height:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:24px}
.nsbox{width:100%;max-width:640px;min-width:0}
.nsh{margin:0;font-size:20px;line-height:1.4;font-weight:600;letter-spacing:-.015em;text-align:center}
.nss{margin:4px 0 18px;font-size:13px;line-height:1.5;color:var(--muted-foreground);text-align:center}
.cmpb.ns textarea{padding:14px 14px 6px}
.cmpb.ns .cmpf{gap:6px;padding:6px 8px 8px 10px}
.silab{font-size:12px;color:var(--muted-foreground);white-space:nowrap}
.sipick{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:280px;height:28px;padding:0 6px 0 8px;border:1px solid var(--border);border-radius:7px;background:var(--background);font-size:12.5px;color:var(--foreground);cursor:pointer;transition:background .2s var(--ease) .05s}
.sipick:hover{background:var(--hover);transition:none}
.sipick[aria-expanded="true"]{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 30%,transparent)}
.sipick:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.sipick svg{width:13px;height:13px;color:var(--muted-foreground)}
.spath{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spath .par,.po .par{color:var(--muted-foreground)}
.cmpro{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--muted-foreground)}
.cmpro svg{width:13px;height:13px}
.nopane{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted-foreground);font-size:13px;padding:24px}
.nopane b{display:block;color:var(--foreground);font-size:15px;margin-bottom:6px}

/* drop zone over the editor */
.dz{position:absolute;z-index:20;pointer-events:none;display:grid;place-items:center;border:2px dashed color-mix(in oklch,var(--primary) 60%,transparent);background:color-mix(in oklch,var(--primary) 8%,transparent);border-radius:10px;margin:6px}
.dz[hidden]{display:none}
.dz span{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--foreground);box-shadow:0 1px 2px oklch(0 0 0 / .06)}

/* ============ status bar ============ */
.statusbar{display:flex;align-items:center;gap:2px;padding:0 8px;border-top:1px solid var(--border);background:var(--surface);font-size:11.5px;color:var(--muted-foreground);min-width:0;overflow:hidden}
.sb{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border:0;border-radius:5px;background:none;font-size:11.5px;color:inherit;cursor:pointer;white-space:nowrap}
.sb:hover{background:var(--hover);color:var(--foreground)}
.sb b{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;color:var(--foreground)}
.sb svg{width:13px;height:13px}
.sb .gly{width:12px;height:12px}
.sb .gd{width:6px;height:6px}
.sb .gd.needs{box-shadow:0 0 0 2px color-mix(in oklch,var(--primary) 24%,transparent)}
.sb.n-needs b{color:var(--active-strong)}
.sb[aria-pressed="true"]{background:color-mix(in oklch,var(--primary) 14%,transparent);color:var(--active-strong)}
.sb[aria-pressed="true"] b{color:var(--active-strong)}
.sb.hl{color:var(--foreground);background:var(--hover)}
.sb kbd{padding:1px 4px;font-size:11px}
.statusbar .sp{flex:1}
.sbt{display:inline-flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap}
.sbt svg{width:13px;height:13px}
.sbdiv{width:1px;height:12px;background:var(--border);margin:0 4px;flex:none}
.statusbar .rt{display:contents}

/* ============ overlays ============ */
.menu{position:fixed;z-index:80;min-width:208px;padding:5px;border-radius:9px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -14px oklch(0 0 0 / .3);animation:pop .15s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border:0;border-radius:6px;background:none;font-size:13px;text-align:left;cursor:pointer}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi svg{width:14px;height:14px;color:var(--muted-foreground)}
.mi span{flex:1}
.mi kbd{padding:2px 5px;font-size:11px}
.mi.dz-i{color:var(--error-strong)}
.mi.dz-i svg{color:var(--error-strong)}
.msep{height:1px;margin:4px 2px;background:var(--border-subtle)}
.mlab{padding:6px 8px 4px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}

.ovl{position:fixed;inset:0;z-index:90;background:var(--ov);display:flex;justify-content:center;align-items:flex-start;animation:fade .15s var(--ease)}
@keyframes fade{from{opacity:0}}
.pal{margin-top:12vh;width:min(620px,calc(100vw - 32px));max-height:72vh;display:flex;flex-direction:column;border-radius:13px;border:1px solid var(--border);background:var(--card);box-shadow:0 2px 4px oklch(0 0 0 / .06),0 30px 70px -24px oklch(0 0 0 / .45);overflow:hidden;animation:pop .18s var(--ease)}
.palin{flex:none;display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-bottom:1px solid var(--border)}
.palin svg{width:16px;height:16px;color:var(--muted-foreground)}
.palin input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--foreground)}
.palin input::placeholder{color:var(--muted-foreground)}
.palmode{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;background:var(--hover);font-size:12px;font-weight:600;white-space:nowrap}
.pallist{flex:1;min-height:0;overflow-y:auto;padding:6px}
.psec{padding:8px 8px 4px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.pi{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:7px;cursor:pointer;font-size:13.5px;min-width:0}
.pi.on{background:var(--hover)}
.pi .pic{width:18px;display:grid;place-items:center;color:var(--muted-foreground);flex:none}
.pi .pic svg{width:15px;height:15px}
.pi .pl{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .ps{flex:1 1 auto;min-width:0;font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi kbd{flex:none}
.pi .pl .smk{margin-right:5px}
.pi .gly{margin:0 auto}
.palfoot{flex:none;display:flex;gap:14px;align-items:center;height:34px;padding:0 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted-foreground);background:var(--surface)}
.palfoot span{display:inline-flex;align-items:center;gap:5px}
.palfoot kbd{padding:2px 4px;font-size:11px}
.pempty{padding:26px 12px;text-align:center;font-size:13px;color:var(--muted-foreground)}

/* "Start in" picker: a searchable dropdown under the composer's group button */
.pick{position:fixed;z-index:86;display:flex;flex-direction:column;max-height:380px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 14px 34px -14px oklch(0 0 0 / .3);overflow:hidden;animation:pop .15s var(--ease)}
.pickin{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-bottom:1px solid var(--border)}
.pickin svg{width:14px;height:14px;color:var(--muted-foreground)}
.pickin input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:13px;color:var(--foreground)}
.pickin input::placeholder{color:var(--muted-foreground)}
.picklist{flex:1;min-height:0;overflow-y:auto;padding:4px}
.po{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;font-size:13px;cursor:pointer;min-width:0}
.po.on{background:var(--hover)}
.po svg{width:14px;height:14px;color:var(--muted-foreground);flex:none}
.po .pl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po .pck{color:var(--primary)}
.pickfoot{flex:none;padding:7px 10px;border-top:1px solid var(--border-subtle);background:var(--surface);font-size:11.5px;line-height:1.4;color:var(--muted-foreground)}

/* tooltip (the dashboard's Tooltip: foreground fill, background text). A key shows as a chip after the name. */
#tip{position:fixed;z-index:99;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:320px;padding:4px 5px 4px 9px;border-radius:6px;background:var(--foreground);color:var(--background);font-size:12px;font-weight:500;line-height:1.35;white-space:normal;animation:pop .15s var(--ease)}
#tip kbd{white-space:nowrap}
#tip.nokey{padding:5px 9px}
#tip[hidden]{display:none}
#tip kbd{background:color-mix(in oklch,var(--background) 14%,transparent);border-color:color-mix(in oklch,var(--background) 30%,transparent);color:var(--background);padding:2px 5px}

.dlg{margin-top:22vh;width:min(420px,calc(100vw - 32px));padding:20px 20px 16px;border-radius:13px;border:1px solid var(--border);background:var(--card);box-shadow:0 30px 70px -24px oklch(0 0 0 / .45);animation:pop .2s var(--ease)}
.dlg h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.dlg p{margin:8px 0 0;font-size:13.5px;line-height:1.55;color:var(--muted-foreground)}
.dlgb{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted-foreground)}
.btn.ghost:hover{background:var(--hover);color:var(--foreground)}

/* Later (snooze) menu and the source filter menu */
.mi .mt{flex:none;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.mi.chk{cursor:pointer}
.mi.chk input{width:15px;height:15px;margin:0;flex:none;accent-color:var(--primary)}
.mi.chk input:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.mi.chk .smk{width:13px;height:13px;color:var(--foreground)}
/* a disabled row: an operator setting the user cannot change here */
.mi.off{cursor:default;color:var(--muted-foreground);white-space:nowrap}
.mi.off:hover{background:none}
.mi.off:focus-visible{background:var(--hover)}
.mnote{display:flex;gap:7px;max-width:250px;margin:5px 2px 1px;padding:8px 7px 3px;border-top:1px solid var(--border-subtle);font-size:11.5px;line-height:1.45;color:var(--muted-foreground)}
/* a note that fills the menu's width without making the menu wider */
.mnote.fill{max-width:none;width:0;min-width:calc(100% - 4px)}
.mnote.solo{max-width:270px;margin-top:0;padding:4px 7px 5px 8px;border-top:0}
.mnote svg{width:13px;height:13px;flex:none;margin-top:1px}
.snzpick{display:flex;gap:6px;padding:2px 4px 6px 8px}
.snzpick input{flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:7px;background:var(--background);color:var(--foreground);font:inherit;font-size:12.5px;color-scheme:light}
html.dark .snzpick input{color-scheme:dark}
.snzpick input:focus{outline:2px solid var(--ring);outline-offset:-1px}
.snzpick .btn{height:30px}

/* People popover */
.menu.ppop{width:330px;padding:5px;outline:none}
.prow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;min-width:0}
.prow .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.prow .nm{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;min-width:0}
.prow .nm .you{font-weight:400;color:var(--muted-foreground)}
.prow .sub{font-size:11.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .when{flex:none;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.pava{position:relative;width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.02em;background:var(--muted);border:1px solid var(--border);color:var(--foreground)}
.pava.ag{border-radius:7px;font-family:var(--font-mono);font-weight:400}
.vdot{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 0 2px var(--card)}
.vnow{display:inline-flex;align-items:center;gap:4px;flex:none;margin-left:4px;font-size:11px;font-weight:600;color:var(--success-strong);white-space:nowrap}
.vnow i{width:6px;height:6px;border-radius:50%;background:var(--success)}
.pbtn{display:inline-flex;align-items:center;gap:7px;height:28px;margin-right:4px;padding:0 9px 0 7px;border:1px solid var(--border);border-radius:7px;background:var(--background);font-size:12px;font-weight:500;color:var(--foreground);cursor:pointer;white-space:nowrap;transition:background .2s var(--ease) .05s}
.pbtn:hover{background:var(--hover);transition:none}
.pbtn:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.pbtn[aria-expanded="true"]{border-color:var(--ring)}
.pbtn svg{width:14px;height:14px;color:var(--muted-foreground)}
.pbtn .ppl{padding-left:4px}
.pbtn .pav{box-shadow:0 0 0 1.5px var(--background)}

/* first-visit guide */
.gov{position:fixed;inset:0;z-index:88;background:var(--ov);animation:fade .15s var(--ease)}
.guide{position:fixed;z-index:92;width:min(430px,calc(100vw - 32px));padding:18px 20px 14px;border-radius:13px;border:1px solid var(--border);background:var(--card);box-shadow:0 2px 4px oklch(0 0 0 / .06),0 30px 70px -24px oklch(0 0 0 / .45);outline:none;animation:pop .2s var(--ease)}
.gstep{display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.gdots{display:inline-flex;gap:4px}
.gdots i{width:6px;height:6px;border-radius:50%;background:var(--border)}
.gdots i.on{background:var(--primary)}

.gvis{margin-top:12px;padding:5px 0;border-radius:9px;border:1px solid var(--border-subtle);background:var(--surface)}
.gvis .tr{cursor:default}
.gvis .tr:hover{background:none}
.gvis .ses:hover .ud{display:block}
.gvis .ses.sel,.gvis .ses.sel:hover{background:color-mix(in oklch,var(--primary) 13%,transparent)}
.gvis .ses.sel .cbx{display:grid}
.gvis .ses.sel .ud{display:none}
.gvis .glab{flex:none;font-size:11px;color:var(--muted-foreground)}
.gkeys{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:7px 10px;align-items:center;margin:12px 0 0;font-size:12.5px}
.gkeys dt{text-align:right;white-space:nowrap}
.gkeys dd{margin:0}
.gfoot{display:flex;align-items:center;gap:6px;margin-top:18px}
.gfoot label{display:inline-flex;align-items:center;gap:7px;margin-right:auto;font-size:12px;color:var(--muted-foreground);cursor:pointer}
.gfoot input{width:15px;height:15px;margin:0;accent-color:var(--primary)}
.gfoot .btn{height:30px}
.ghl{position:relative;z-index:89 !important;outline:2px solid var(--primary) !important;outline-offset:-2px;pointer-events:none}
.ghl.pad{background:var(--card);border-radius:7px}

#toast{position:fixed;left:50%;bottom:44px;z-index:95;transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100vw - 32px));padding:8px 8px 8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .06),0 18px 40px -18px oklch(0 0 0 / .4);font-size:13px;animation:pop .18s var(--ease)}
#toast[hidden]{display:none}
#toast .tmsg{min-width:0}
#toast .btn{flex:none}

/* ============ legacy replica ============ */
#legacy{min-height:0;grid-template-columns:300px minmax(0,1fr)}
.lg-side{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:color-mix(in oklch,var(--card) 40%,transparent)}
.lg-h{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px}
.lg-h h2{margin:0;font-family:var(--font-mono);font-size:11px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.lg-h .ib{width:24px;height:24px}
.lg-h .ib svg{width:14px;height:14px}
.lg-s{display:flex;align-items:center;gap:4px;padding:0 12px 8px}

.lg-s input{width:100%;height:32px;padding:0 8px 0 28px;border-radius:8px;border:1px solid transparent;background:color-mix(in oklch,var(--muted) 40%,transparent);font:inherit;font-size:12px;color:var(--foreground);outline:none}
.lg-s .ib{width:32px;height:32px}
.lg-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 12px;display:flex;flex-direction:column;gap:2px}
.lg-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;min-width:0;border:0;background:none;text-align:left;width:100%}
.lg-row:hover{background:color-mix(in oklch,var(--muted) 50%,transparent)}
.lg-row.on{background:var(--muted)}
.lg-dot{width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none;background:color-mix(in oklch,var(--muted-foreground) 30%,transparent)}
.lg-dot.run{background:var(--primary);animation:lgp 2s cubic-bezier(.4,0,.6,1) infinite}
.lg-dot.err{background:var(--error)}
.lg-dot.act{background:color-mix(in oklch,var(--primary) 70%,transparent)}
@keyframes lgp{50%{opacity:.5}}
.lg-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.lg-t b{font-size:14px;font-weight:400;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--foreground)}

.lg-t span{font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-main{min-height:0;min-width:0;display:flex;flex-direction:column}
.lg-head{flex:none;padding:14px 24px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;min-width:0}

.lg-me{display:flex;justify-content:flex-end;padding-left:40px;padding-bottom:12px}
.lg-me .w{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:85%}
.lg-me .m{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);padding:0 4px}
.lg-me .b{border-radius:16px 4px 16px 16px;background:var(--muted);padding:10px 16px;font-size:14px;line-height:1.6}

/* ---------- time ---------- */
function ago(t) {
  const m = Math.max(0, Math.round((Date.now() - Date.parse(t)) / 60000));

  const h = Math.floor(m / 60);
  if (h < 24) return h + "h";
  return Math.floor(h / 24) + "d";

  const s = Math.floor((Date.now() - Date.parse(t)) / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);

/* ---------- people ---------- */
// People involved: the requester, Slack authors, people it is shared with, and people viewing it now.
function peopleOf(s) {
  const m = new Map();
  const add = (id, src, at) => {
    if (!id) return null;

    if (!p) { p = { id, src: [], last: null, viewing: false }; m.set(id, p); }
    if (src && !p.src.includes(src)) p.src.push(src);
    if (at && (!p.last || at > p.last)) p.last = at;
    return p;
  };
  const x = INVOLVED[s.id] || {};
  if (x.requester) add(x.requester, SRC_LABEL[s.source], s.created);
  else if (s.source === "dashboard") add(s.owner, "Dashboard", s.created);
  (s.timeline || []).forEach((t) => {
    if (t.kind === "slack") add(t.who, "Slack", t.at);
    else if (t.kind === "human" || t.kind === "reply") add(t.who, "Dashboard", t.at);

  if (s.owner !== ME && s.shared) { add(s.owner, "Dashboard"); add(ME, SHARE_LABEL[s.shared]); }
  (x.shared || []).forEach(([id, mode]) => add(id, SHARE_LABEL[mode]));
  (x.viewing || []).forEach((id) => { add(id).viewing = true; });

  if (sum < s.tasks && s.agents.length) c[s.agents[0]] += s.tasks - sum;

}

/* ---------- Later: wake times ---------- */
const pad2 = (n) => String(n).padStart(2, "0");
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const hm = (d) => pad2(d.getHours()) + ":" + pad2(d.getMinutes());
// Short form for a row: "in 9s", "in 40m", "18:00", "Thu 09:00", "Oct 28".
function fmtWake(t) {
  const d = new Date(t), now = new Date(), ms = d - now;
  if (ms < 60e3) return "in " + Math.max(0, Math.ceil(ms / 1000)) + "s";
  if (ms < 3600e3) return "in " + Math.ceil(ms / 60e3) + "m";
  if (d.toDateString() === now.toDateString()) return hm(d);
  if (ms < 6 * 864e5) return DOW[d.getDay()] + " " + hm(d);
  return d.toLocaleDateString("en", { month: "short", day: "numeric" });
}
// Menu form: "18:00" today, else "Thu 09:00".
function fmtMenu(t) {

}

function whenPhrase(t) {

  if (d.toDateString() === now.toDateString()) return "at " + hm(d);
  if (ms < 6 * 864e5) return "on " + DOW[d.getDay()] + " at " + hm(d);

}

  const eve = new Date(now); eve.setHours(18, 0, 0, 0);

/* ---------- tree model ---------- */
function userPathSet() {
  const set = new Set(S.saved);
  ALL.forEach((s) => { if (isUserPath(s.g)) set.add(s.g); });
  Array.from(set).forEach((p) => {
    const s = segs(p), min = s[0] === "personal" ? 3 : 2;
    for (let i = min; i < s.length; i++) set.add(s.slice(0, i).join("/") + "/");
  });
  return set;
}
const childrenOf = (set, parent) => Array.from(set).filter((p) => p !== parent && p.startsWith(parent) && segs(p).length === segs(parent).length + 1);
const topUser = (set) => Array.from(set).filter((p) => { const s = segs(p); return s[0] === "shared" ? s.length === 2 : s.length === 3; });
function pathLast(p) { let b = ""; ALL.forEach((s) => { if (s.g.startsWith(p) && s.last > b) b = s.last; }); return b; }
const byActivity = (a, b) => { const la = pathLast(a), lb = pathLast(b); if (la !== lb) return la < lb ? 1 : -1; return crumb(a).localeCompare(crumb(b)); };

function channelsOf(src) {

const LOCK = '<span class="glock" role="img" aria-label="Only you" data-tip="Only you">' + svg("lock") + "</span>";

/* ---------- sidebar model: sections > groups > sessions, as one flat row list ---------- */
// Row kinds: "g" a group or a box (Inbox, Later, Done, No group), "s" a session, "more" a "Show N more" row,
// "empty" a centered empty state, "sec" a plain section header (title and session count), "add" the "New group" row,
// "create" a new-group input. A session can show in two places (Inbox and its group), so its row key carries its container.
// Inbox, Later, and Done are flat: one row per session, with its group as a label. Nesting is only under groups.
const CAP = 8; // a long list shows its newest rows first, then "Show N more"
const quickOK = (s) => !S.quick || QUICK[S.quick](s);

function buildTree() {
  const rows = [];
  const inbox = inboxSess();
  const G = (o) => { const open = !!S.open[o.id]; rows.push(Object.assign({ t: "g", k: "g|" + o.id, open }, o)); return open; };
  // empty: { icon, title, hint, newIn } for the centered empty state when the list has no rows.
  const fill = (ctx, list, lv, kind, empty) => {
    const vis = list.filter(quickOK);
    if (!vis.length) {
      if (S.quick && list.length) rows.push({ t: "empty", lv, icon: "filter", title: "No " + QUICK_LABEL[S.quick] + " sessions here." });
      else if (empty) rows.push(Object.assign({ t: "empty", lv }, empty));
      return;
    }
    const all = S.showAll[ctx] || vis.length <= CAP + 2;
    (all ? vis : vis.slice(0, CAP)).forEach((s) => rows.push({ t: "s", k: "s|" + ctx + "|" + s.id, s, lv, ctx, kind }));

  if (G({ id: "later", kind: "box", lv: 0, label: "Later", icon: svg("clock"), cn: counts(later), plain: true })) fill("later", later, 1, "later", { icon: "clock", title: "Nothing snoozed.", hint: "Press <kbd>l</kbd> on a session." });
  if (G({ id: "done", kind: "box", lv: 0, label: "Done", icon: svg("done"), cn: counts(done), plain: true })) fill("done", done, 1, "done", { icon: "done", title: "Nothing Done yet.", hint: "Press <kbd>e</kbd> on a session." });
  if (G({ id: "nogroup", kind: "box", lv: 0, label: "No group", icon: svg("nogroup"), cn: counts(nog), newIn: "none", drop: true })) fill("nogroup", nog.slice().sort(byNewest), 1, "nogroup", { icon: "nogroup", title: "Every session has a group." });

    const op = !!S.open[p];
    G({ id: p, kind: "user", lv, label: shortName(p), icon: svg("hash"), kids: kids.length > 0, lock: lockClash(p), cn: counts(op ? direct : inbox.filter((s) => s.g.startsWith(p))), editable: true, newIn: p, drop: true });

      if (!op) return;
      Array.from(new Set(ALL.filter((s) => s.g.startsWith(base)).map((s) => s.g))).forEach((p) => {
        const list = inbox.filter((s) => s.g === p);
        if (G({ id: p, kind: "opath", lv: 1, label: segs(p).slice(2).join(" › "), icon: svg("hash"), cn: counts(list) })) fill(p, list.slice().sort(byNewest), 2, "group", { icon: "inbox", title: "Nothing in your Inbox here." });

/* ---------- panes and tabs ---------- */
// A tab holds a session id, or "new:<n>" for a new-session tab (see S.nt).
const isNT = (id) => typeof id === "string" && id.startsWith("new:");

const paneOf = (sid) => S.panes.findIndex((p) => p.tabs.includes(sid));
const paneSids = () => S.panes.map((p) => p.active).filter((id) => id && !isNT(id));
const currentSid = () => { const a = S.panes[S.fp] && S.panes[S.fp].active; return a && !isNT(a) ? a : null; };
const totalTabs = () => S.panes.reduce((a, p) => a + p.tabs.length, 0);

/* ---------- where a new session can start ---------- */
// My groups and subgroups, my personal groups, and No group. Never source groups or Shared with me.
function startTargets() {
  const mine = Array.from(userPathSet()).sort((a, b) => {
    const pa = a.startsWith("personal/"), pb = b.startsWith("personal/");
    if (pa !== pb) return pa ? 1 : -1;

}
function normStart(g) {

}
// No explicit group: use the group selected in the sidebar, else No group.
const defaultStartGroup = () => normStart(S.group);
const startLabel = (g) => (g === "none" ? "No group" : crumb(g));
function pathHTML(g) {
  if (g === "none") return "No group";
  const c = crumbParts(g);
  return (c.length > 1 ? '<span class="par">' + esc(c.slice(0, -1).join(" › ")) + " › </span>" : "") + esc(c[c.length - 1]) + (lockClash(g) ? " " + LOCK : "");

/* ============================================================
   actions
   ============================================================ */
function openSession(sid, where) {

  where = where || "current";

  const at = paneOf(sid);
  if (where === "bg") {
    if (at < 0) { const p = S.panes[S.fp]; insertAfterActive(p, sid); if (!p.active) p.active = sid; }
  } else if (at >= 0) {
    S.fp = at; S.panes[at].active = sid; s.read = true;
  } else {
    const p = S.panes[S.fp];

    if (where === "newtab" || !p.active || isNT(p.active)) { insertAfterActive(p, sid); p.active = sid; }
    else { p.tabs[p.tabs.indexOf(p.active)] = sid; p.active = sid; }

  }

  render();
}
function openInSplit(sid) {
  const s = SESS[sid]; if (!s) return;
  const at = paneOf(sid);
  if (S.panes.length === 1) {
    const p0 = S.panes[0];
    if (at === 0) {
      if (p0.tabs.length === 1) { toast("Open a second session first. Then split."); return; }
      removeFromPane(0, sid);
    }
    S.panes.push({ tabs: [sid], active: sid });
    S.fp = 1;
  } else {
    const other = S.fp === 0 ? 1 : 0;

    else if (at === S.fp) {
      if (S.panes[S.fp].tabs.length === 1) { toast("That session is already open in this pane."); return; }
      removeFromPane(S.fp, sid);
      insertAfterActive(S.panes[other], sid); S.panes[other].active = sid;
    } else { insertAfterActive(S.panes[other], sid); S.panes[other].active = sid; }
    S.fp = other;

  S.compactDetail = true;
  render();
}
function removeFromPane(pi, sid) {

}
function closeTab(pi, sid) {

  if (S.menu && S.menu.type === "people" && S.menu.sid === sid) S.menu = null;
  if (!S.panes[pi].tabs.length && S.panes.length === 2) { S.panes.splice(pi, 1); S.fp = 0; }
  else if (S.fp >= S.panes.length) S.fp = 0;

  render();
}

  gone.tabs.forEach((sid) => { if (!keep.tabs.includes(sid)) keep.tabs.push(sid); });
  S.panes = [keep]; S.fp = 0;

}

function moveTab(from, sid, to, idx) {

const whatOf = (n) => (n === 1 ? "Session" : n + " sessions");

/* ---------- Later = snooze. The session wakes back in the Inbox as unread. ---------- */
function notifyState() { try { return "Notification" in window ? Notification.permission : "unsupported"; } catch (e) { return "unsupported"; } }

function askNotify() {

}

/* ---------- new session: a tab with a composer and a "Start in" picker ---------- */

  S.flat.forEach((r) => { if (r.t === "s" && !seen.has(r.s.id)) { seen.add(r.s.id); order.push(r.s); } });
  const cur = S.flat.find((r) => r.k === S.focusRow);
  const start = cur && cur.t === "s" ? order.indexOf(cur.s) : -1;
  const openSid = currentSid();
  const isNews = (s) => (s.needs || !s.read) && s.id !== openSid && s.triage === null && shown(s);
  for (let j = 1; j <= order.length; j++) {

$("#guide").addEventListener("change", (e) => { if (e.target.id === "gd-off") S.guideOff = e.target.checked; });
$("#guide").addEventListener("mousedown", (e) => { if (e.target.dataset && e.target.dataset.gov) e.preventDefault(); });

/* ---------- keyboard ---------- */
function treeKey(e) {
  const flat = S.flat;
  const i = flat.findIndex((r) => r.k === S.focusRow);
  const cur = flat[i];
  const curSid = cur && cur.t === "s" ? cur.s.id : null;
  const targets = () => (S.sel.size ? Array.from(S.sel) : curSid ? [curSid] : []);
  const go = (ni) => {
    if (!flat.length) return;
    S.focusRow = flat[Math.max(0, Math.min(flat.length - 1, ni))].k;
    renderTree(); revealRow(S.focusRow); peekCard();
  };
  const fold = (r) => r && r.t === "g";
  S.kb = true; treeEl.classList.add("kb");
  switch (e.key) {
    case "j": case "ArrowDown": go(i < 0 ? 0 : i + 1); break;
    case "k": case "ArrowUp": go(i < 0 ? 0 : i - 1); break;
    case "Home": go(0); break;
    case "End": go(flat.length - 1); break;
    case "Enter": case "o":
      if (!cur) break;
      if (cur.t === "s") openSession(cur.s.id);
      else if (cur.t === "more") { S.showAll[cur.ctx] = true; render(); }
      else if (cur.t === "add") startCreate("shared/");
      else { S.open[cur.id] = !S.open[cur.id]; render(); }
      break;
    case "ArrowRight": if (fold(cur)) { if (!cur.open) { S.open[cur.id] = true; render(); } else go(i + 1); } break;
    case "ArrowLeft":
      if (fold(cur) && cur.open) { S.open[cur.id] = false; render(); }
      else if (cur) { for (let j = i - 1; j >= 0; j--) { if (fold(flat[j]) && flat[j].lv < cur.lv) { go(j); break; } } }
      break;
    case "x": if (curSid) toggleSel(curSid); break;
    case "e": if (targets().length) { const adv = advInfo(); markDone(targets()); applyAdv(adv); } break;
    case "l":
      if (!targets().length) break;
      if (targets().every((id) => SESS[id].triage === "later")) unsnooze(targets());
      else openSnoozeAtRow(targets(), advInfo());
      break;
    case "u": if (targets().length) { toggleRead(targets()); S.sel.clear(); render(); } break;
    case "m": if (targets().length) openPalette("group", { purpose: "move", sids: targets() }); break;
    case "v": if (curSid) openSession(curSid, "split"); break;
    case "t": if (curSid) openSession(curSid, "newtab"); break;
    case "n": goNextUnread(); break;
    case "c": openNewTab(startFromRow(cur)); break;
    case "ContextMenu": {
      if (!cur) break;
      const el = document.getElementById(rowId(cur.k)), r = el ? el.getBoundingClientRect() : { left: 40, bottom: 120 };
      if (cur.t === "s") openMenu({ type: "row", sids: S.sel.has(curSid) ? Array.from(S.sel) : [curSid], sid: curSid, x: r.left + 24, y: r.bottom + 2, ret: "#tscroll" });
      else if (cur.t === "g" && cur.editable) openMenu({ type: "group", path: cur.id, x: r.left + 24, y: r.bottom + 2, ret: "#tscroll" });
      break;
    }
    case "Escape": if (S.sel.size) { S.sel.clear(); render(); } break;
    default: return;
  }
  e.preventDefault();
}
document.addEventListener("keydown", (e) => {
  // Cmd+K / Ctrl+K: the one global combo (the dashboard already owns it). No browser-owned combos.
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "k") {
    e.preventDefault();
    if (S.pal) closePalette();
    else if (!S.legacy) { if (S.guide != null) closeGuide(false); openPalette(); }
    return;
  }
  if (S.pal) return;
  if (S.guide != null) { guideKey(e); return; }
  if (e.key === "Escape") {
    if (S.confirm) { S.confirm = null; render(); treeEl.focus({ preventScroll: true }); return; }
    if (S.menu) { e.preventDefault(); closeMenu(true); return; }
    hideCard();
    if (S.sel.size && !S.legacy && !typing(document.activeElement)) { e.preventDefault(); S.sel.clear(); render(); return; }
  }
  if (S.confirm || S.legacy) return;
  if (e.metaKey || e.ctrlKey || e.altKey || typing(document.activeElement)) return;
  if (e.key === "?") { e.preventDefault(); openGuide(KEYS_STEP); return; }
  if (S.menu) return;
  // sidebar keys: only when the sidebar itself has focus
  if (document.activeElement === treeEl) treeKey(e);
});

window.addEventListener("resize", () => {
  if (S.menu) { S.menu = null; renderMenu(); syncMenuTriggers(); }
  if (S.picker) closePicker(false);
  hideTip(); hideCard();
  if (S.guide != null) renderGuide();
});

/* ---------- tooltips: [data-tip] (and [data-kbd]) show on hover and on keyboard focus ---------- */
const tipEl = $("#tip");
let tipT = null, tipFor = null, tipMute = null;
function showTip(el) {
  if (!el.isConnected || !el.dataset.tip || S.drag) return;
  tipEl.innerHTML = "<span>" + esc(el.dataset.tip) + "</span>" + (el.dataset.kbd ? "<kbd>" + esc(el.dataset.kbd) + "</kbd>" : "");
  tipEl.classList.toggle("nokey", !el.dataset.kbd);
  tipEl.hidden = false;
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let top = r.top - h - 6;
  if (top < 8) top = r.bottom + 6;
  tipEl.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + "px";
  tipEl.style.top = top + "px";
}
function hideTip() { clearTimeout(tipT); tipT = null; tipFor = null; tipEl.hidden = true; }
document.addEventListener("pointerover", (e) => {
  const t = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (t === tipFor) return;
  // After a click the DOM re-renders under a still pointer. Keep the tip closed until the pointer moves away.
  if (tipMute && Math.hypot(e.clientX - tipMute.x, e.clientY - tipMute.y) < 6) { hideTip(); tipFor = t; return; }
  tipMute = null;
  const warm = !tipEl.hidden;
  hideTip();
  if (!t) return;
  tipFor = t;
  tipT = setTimeout(() => showTip(t), warm ? 0 : 300);
});
document.addEventListener("pointermove", (e) => { if (tipMute && Math.hypot(e.clientX - tipMute.x, e.clientY - tipMute.y) >= 6) tipMute = null; });
document.addEventListener("focusin", (e) => {
  const t = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (t && t !== treeEl && t.matches(":focus-visible")) { hideTip(); tipFor = t; showTip(t); }
});
document.addEventListener("focusout", (e) => { if (tipFor && e.target === tipFor) hideTip(); });
document.addEventListener("pointerdown", (e) => { hideTip(); tipMute = { x: e.clientX, y: e.clientY }; tipFor = e.target.closest ? e.target.closest("[data-tip]") : null; }, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); }, true);

/* ============================================================
   boot
   ============================================================ */
(function boot() {
  const q = new URLSearchParams(location.search);
  applyTheme(q.get("theme") === "dark" ? "dark" : "light");
  try { const w = +localStorage.getItem("sv2-tree-w"); if (w) setTreeW(w); } catch (e) { /* storage off */ }
  const list = (k) => (q.get(k) || "").split(",").map((x) => x.trim().toLowerCase()).filter((x) => SOURCES.includes(x));
  // ?expand=slack opens every group in that source section (they start open; this survives from round 2).
  list("expand").forEach((k) => { channelsOf(k).forEach((p) => { S.open[p] = true; }); });
  list("hide").forEach((k) => { S.hideSrc[k] = true; });
  const open = SESS[q.get("open")] ? q.get("open") : "s1";
  const bg = ALL.find((s) => s.finishesInSeconds);
  S.panes = [{ tabs: [open], active: open }];
  if (bg && bg.id !== open) S.panes[0].tabs.push(bg.id);
  SESS[open].read = true;
  const sp = q.get("split");
  if (sp && SESS[sp] && sp !== open) {
    const p0 = S.panes[0], at = p0.tabs.indexOf(sp);
    if (at >= 0) p0.tabs.splice(at, 1);
    S.panes.push({ tabs: [sp], active: sp });
    SESS[sp].read = true;
  }
  S.legacy = q.get("legacy") === "1";
  if (S.legacy) S.legacySel = D.legacy.some((x) => x.id === open) ? open : D.legacy[0].id;
  render();
  if (q.get("group") && !S.legacy) revealGroup(q.get("group"));
  // ?new=<group key> or ?new=none opens a new-session tab with that group picked.
  const nw = q.get("new");
  if (nw != null && !S.legacy) openNewTab(normStart(nw));
  else if (!S.legacy) { treeEl.focus({ preventScroll: true }); revealRow(S.focusRow); }

  // First visit: the guide. ?guide=1 forces it, ?guide=0 skips it for a deep link.
  const gq = q.get("guide");
  if (!S.legacy && (gq === "1" || (gq !== "0" && !guideStored()))) openGuide(0);

  // A background session finishes about 8 s after load: its tab and row light up as unread.
  if (bg) {
    setTimeout(() => {
      const s = bg;
      s.status = "completed"; s.last = nowIso();
      const visible = paneSids().includes(s.id) && !S.legacy;
      s.read = visible;
      S.flash.add(s.id);
      render();
      setTimeout(() => { S.flash.delete(s.id); }, 1600);
      if (!visible && !S.legacy) toast('"' + s.title + '" finished.', "Open", () => openSession(s.id));
    }, (bg.finishesInSeconds || 8) * 1000);
  }
  // Later: wake snoozed sessions on time.
  setInterval(tickWake, 1000);
})();
</script>
