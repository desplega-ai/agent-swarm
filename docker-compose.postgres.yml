# Postgres as the storage engine of the API (instead of the SQLite file).
# Usage (include both files for every Compose command):
#   docker compose -f docker-compose.example.yml -f docker-compose.postgres.yml --env-file .env up -d
# Procedure, the db-query reader role and the move of an existing SQLite
# database: runbooks/postgres.md
#
# - One API process per database: keep a single `api` service. A second API on
#   the same database waits, then stops with a clear error.
# - The `swarm_api_data` volume stays: it holds the encryption key file and the
#   page-session secret. Keep the same encryption key when you move a database.
# - db-query stays off until you set DATABASE_QUERY_URL to a restricted role
#   (runbooks/postgres.md, "db-query reader role").

services:
  api:
    environment:
      # The API URL-encodes DATABASE_PASSWORD into DATABASE_URL, so any password works.
      DATABASE_URL: postgres://swarm@postgres:5432/swarm
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DATABASE_QUERY_URL: ${DATABASE_QUERY_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Postgres 16 with pgvector (memory vector search).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: swarm
      # Byte text order and ASCII case folding, like SQLite (runbooks/postgres.md).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - swarm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  swarm_postgres:
