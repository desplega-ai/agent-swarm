<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// TLA+ races reel. Deterministic: render(f) draws frame f from scratch (except particles, which are pure functions of f too).
const qs = new URLSearchParams(location.search);
const W = +qs.get("w") || 1920, H = +qs.get("h") || 1080;
const PORT = H > W;
const S = Math.min(W, H) / 1080;
const FPS = 30, N = 720;
const cv = document.getElementById("c");
cv.width = W; cv.height = H;
let ctx = cv.getContext("2d");
const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H;
const tctx = tmp.getContext("2d");

// ---------- palette + type ----------
const C = {
  bg: "#07070a", ink: "#f3efe6", dim: "#77747c", faint: "#3a3940",
  amber: "#f6a723", amberHi: "#ffd27a", red: "#ff4b4b", green: "#34e38a", cyan: "#7fd6ff",
};
const G = "SG", M = "JB", I = "IS"; // Space Grotesk, JetBrains Mono, Instrument Serif Italic
const font = (fam, px, w = 400) => fam === I ? `italic ${px}px ${I}` : `${w} ${px}px ${fam}`;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

// ---------- facts (injected) ----------
let F, TILES, TRACE, STATES_TODAY, STATES_SIMPLE, VIEWS, GREENS, AMBERS;
function initFacts(facts) {
  F = facts;
  const hb = F.hbFixes.filter((h) => h.state === "MERGED" && h.testOnMain);
  TILES = [
    ...hb.map((h) => ({ tag: `HEARTBEAT · BUG ${h.bug}`, title: h.bugTitle, pinned: "failing", end: "green", pr: h.pr, prState: "merged" })),
    ...F.cx.filter((c, i) => F.cx.findIndex((x) => x.id === c.id) === i).map((c0) => {
      const same = F.cx.filter((x) => x.id === c0.id), c = { ...c0, failing: same.some((x) => x.failing) };
      const fl = F.flips.find((x) => x.id === c.id);
      const end = !c.failing ? "green" : fl && fl.state === "OPEN" ? "amber" : "red";
      return { tag: `WORKFLOWS · ${c.id}`, title: c.title, pinned: "test.failing", end, pr: fl ? fl.pr : null, prState: fl ? fl.state.toLowerCase() : null };
    }),
  ];
  const b1 = hb.find((h) => h.bug === 1) || hb[0];
  TRACE = { title: b1.bugTitle, inv: b1.invariant, steps: b1.trace, bug: b1.bug };
  STATES_TODAY = num(F.heartbeat.states[0]);
  STATES_SIMPLE = num(F.heartbeat.states[2]);
  VIEWS = num(F.heartbeat.statusViews[2]);

// ---------- state graph ----------
const MAXD = 9;
let NODES = [], EDGES = [], LEAF = -1;

    for (const id of front) {

      if (d === MAXD) k = Math.min(k, 2);

        const n = { d, p: id, kids: [], j: r() };
        NODES.push(n); NODES[id].kids.push(NODES.length - 1); next.push(NODES.length - 1);

    front = next;
  }
  // radial layout by leaf count
  const leaves = (i) => (NODES[i].leaves = NODES[i].kids.length ? NODES[i].kids.reduce((s, k) => s + leaves(k), 0) : 1);
  leaves(0);
  const place = (i, a0, a1) => {
    const n = NODES[i]; n.a = (a0 + a1) / 2 + (n.d ? (n.j - 0.5) * 0.004 : 0);
    n.r = n.d === 0 ? 0 : 58 * Math.pow(n.d, 0.93) * (1 + (n.j - 0.5) * 0.06);
    let a = a0; for (const k of n.kids) { const span = ((a1 - a0) * NODES[k].leaves) / n.leaves; place(k, a, a + span); a += span; }

  const byD = {}; NODES.forEach((n, i) => (byD[n.d] = byD[n.d] || []).push(i));
  for (let d = 2; d < MAXD; d++) {
    const arr = byD[d].slice().sort((a, b) => NODES[a].a - NODES[b].a);
    for (let q = 0; q + 1 < arr.length; q++) {

}
let PATH = [];
const rot = (f) => 0.09 * (Math.min(f, 165) / FPS) - 0.35;

// ---------- layout ----------
const L = PORT
  ? { treeX: W / 2, treeY: H * 0.545, fit: W * 0.37, textX: W / 2, align: "center", hexR: 128 * S }
  : { treeX: W * 0.70, treeY: H * 0.52, fit: H * 0.42, textX: 128 * S, align: "left", hexR: 140 * S };

// ---------- text ----------
function parse(markup) { // "*word*" = accent
  const out = []; let acc = false;
  for (const raw of markup.split(" ")) {
    let w = raw, a = acc;
    if (w.startsWith("*")) { a = true; w = w.slice(1); acc = true; }
    if (w.endsWith("*") || w.match(/\*[.,:!]$/)) { w = w.replace("*", ""); acc = false; }
    out.push({ w, a });
  }
  return out;
}
function kinetic(markup, o) {
  const f = o.f, size = o.size * S, lh = size * (o.lh || 1.08);
  const words = parse(markup).map((t) => {
    const fnt = t.a && o.accent !== false ? font(I, size * 1.14) : font(o.fam || G, size, o.weight || 500);
    ctx.font = fnt; return { ...t, fnt, wd: ctx.measureText(t.w).width, sp: ctx.measureText(" ").width };
  });

  for (const w of words) { if (w.w === "|") { lines.push([]); lw = 0; continue; } if (lw + w.wd > maxW && lines.at(-1).length) { lines.push([]); lw = 0; } lines.at(-1).push(w); lw += w.wd + w.sp; }

    let x = o.align === "center" ? o.x - tw / 2 : o.x;
    const y = o.y + li * lh;

      const s0 = o.start + k * (o.stagger ?? 3);
      const pin = eOutExpo(prog(f, s0, s0 + 20));
      const pout = o.end != null ? eInCubic(prog(f, o.end + k * 1.5, o.end + k * 1.5 + 10)) : 0;
      if (pin > 0 && pout < 1) {
        ctx.save();
        ctx.beginPath(); ctx.rect(x - size, y - size * 1.02, w.wd + size * 2, size * 1.34); ctx.clip();

        ctx.globalAlpha = (o.alpha ?? 1) * pin * (1 - pout);

}
function mono(text, x, y, o = {}) {
  ctx.save(); ctx.font = font(M, (o.size || 14) * S, o.weight || 500);
  ctx.fillStyle = o.color || C.dim; ctx.globalAlpha = o.alpha ?? 1; ctx.textAlign = o.align || "left";

  ctx.fillText(t, x, y);

// ---------- background / hud / texture ----------
const grain = document.createElement("canvas"); grain.width = grain.height = 256;
{ const g = grain.getContext("2d"), id = g.createImageData(256, 256), r = rng(3); for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); }

  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // dot grid, slow drift
  const sp = 44 * S, ox = (f * 0.35) % sp, oy = (f * 0.18) % sp;
  ctx.fillStyle = "rgba(255,255,255,0.045)";
  for (let x = -sp + ox; x < W + sp; x += sp) for (let y = -sp + oy; y < H + sp; y += sp) ctx.fillRect(x, y, 1.6 * S, 1.6 * S);
  const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(W, H) * 0.55);
  g.addColorStop(0, hexA(glowColor, 0.16 * gAmt)); g.addColorStop(1, hexA(glowColor, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function finish(f) {

  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.6)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

  ctx.save(); ctx.globalAlpha = 0.055; ctx.globalCompositeOperation = "overlay";
  const r = rng(f * 13 + 1); const p = ctx.createPattern(grain, "repeat");
  ctx.translate(-r() * 256, -r() * 256); ctx.fillStyle = p; ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}
const SECTIONS = [[0, "01", "SEARCH"], [180, "02", "COUNTEREXAMPLE"], [300, "03", "PINNED"], [420, "04", "FIXED"], [540, "05", "SIMPLER"], [645, "06", "AGENT SWARM"]];
function hud(f) {
  const a = eOutCubic(prog(f, 4, 22));
  const m = 40 * S, top = 44 * S, bot = H - 36 * S;
  ctx.save(); ctx.globalAlpha = a * 0.9;
  mono("AGENT SWARM — TLA+ / RACES", m, top, { size: 12, track: 2.2, color: C.dim });
  const sec = SECTIONS.filter((s) => f >= s[0]).at(-1);
  const since = f - sec[0];
  mono(`${sec[1]} / ${sec[2]}`, m, bot, { size: 12, track: 2.2, color: C.dim, type: since * 1.6 + 3 });
  const s = Math.floor(f / FPS), fr = f % FPS;
  const tc = `00:00:${String(s).padStart(2, "0")}:${String(fr).padStart(2, "0")}`;
  mono(`REC  ${tc}`, W - m, top, { size: 12, track: 2.2, align: "right", color: C.dim });
  ctx.fillStyle = C.red; ctx.globalAlpha = a * (Math.floor(f / 15) % 2 ? 0.35 : 1);
  ctx.font = font(M, 12 * S, 500); ctx.letterSpacing = `${2.2 * S}px`;
  const tw = ctx.measureText(`REC  ${tc}`).width;
  ctx.beginPath(); ctx.arc(W - m - tw - 12 * S, top - 4.5 * S, 3.5 * S, 0, 7); ctx.fill();
  // progress
  ctx.globalAlpha = a * 0.9; const pw = 150 * S;
  ctx.fillStyle = C.faint; ctx.fillRect(W - m - pw, bot - 4 * S, pw, 1.5 * S);
  ctx.fillStyle = C.amber; ctx.fillRect(W - m - pw, bot - 4 * S, pw * (f / (N - 1)), 1.5 * S);
  // provenance
  mono(`facts read live · origin/main @ ${F.mainSha}`, W / 2, bot, { size: 11, track: 1.6, align: "center", color: C.faint, alpha: a });
  // corner ticks
  ctx.strokeStyle = hexA(C.ink, 0.22); ctx.lineWidth = 1.2 * S; const k = 14 * S, c = 22 * S;
  for (const [x, y, sx, sy] of [[c, c, 1, 1], [W - c, c, -1, 1], [c, H - c, 1, -1], [W - c, H - c, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, y + sy * k); ctx.lineTo(x, y); ctx.lineTo(x + sx * k, y); ctx.stroke();

}
function glitch(f, amt, seed) {
  if (amt < 0.02) return;

  const r = rng(seed * 997 + f);
  const n = Math.floor(4 + amt * 14);
  for (let i = 0; i < n; i++) {
    const y = r() * H, h = (6 + r() * 60) * S, dx = (r() - 0.5) * 140 * S * amt;
    ctx.drawImage(tmp, 0, y, W, h, dx, y, W, h);

  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.28 * amt;

}

// ---------- tree drawing ----------
const DCOL = Array.from({ length: MAXD + 1 }, (_, d) => d < 5 ? mix("#ffd27a", "#f6a723", d / 5) : mix("#f6a723", "#e2551c", (d - 5) / 4));
const NCOL = DCOL.map((c, d) => (d < 3 ? "#fff1cf" : c));
function treeCam(f, zoomOverride) {

  const fitZoom = L.fit / (58 * Math.pow(MAXD + 0.5, 0.93));
  const z = zoomOverride ?? L.fit / (58 * Math.pow(Math.max(1.4, front + 0.7), 0.93));

function tp(n, cam, cx = L.treeX, cy = L.treeY) {

function drawTree(f, o) {
  const cam = o.cam, dim = o.dim ?? 1, birthOf = o.birth || ((n) => n.birth);
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";

  for (const [a, b, cross] of EDGES) {
    const A = NODES[a], B = NODES[b];
    const bb = birthOf(B), p = eOutCubic(prog(f, bb - 7, bb));

// ---------- scene 1: search (0-180) ----------
function drawPath(f, cam) {

  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round"; ctx.lineJoin = "round";

function opener(f) {

  if (col > 0.6) { ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = "#fff1cf"; ctx.globalAlpha = (col - 0.6) * 2.5; ctx.beginPath(); ctx.arc(rx, ry, 9 * S, 0, 7); ctx.fill(); ctx.restore(); }
}
function scene1(f) {

  // beat pulse glow at tree center

}
function scene3(f) {

// ---------- scene 5: collapse to the simpler design (540-645) ----------
function hexVerts(cx, cy, r, n, rotA = 0) { return Array.from({ length: n }, (_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n + rotA; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }); }

  ctx.save(); ctx.globalAlpha = a; ctx.font = font(M, (PORT ? 92 : 104) * S, 600); ctx.fillStyle = rp > 0.98 ? mix(C.ink, C.amberHi, pulse(f, 628, 12)) : C.ink; ctx.textAlign = al;

  if (rp > 0.5) mono(`was ${fmt(today)}`, cx, y0 + (PORT ? 225 : 250) * S, { size: 15, track: 1.6, color: C.faint, alpha: a * prog(f, 618, 630), align: al });
}
// The Agent Swarm logo (apps/ui/public/logo.png == docs-site/public/logo.png == agent-swarm.dev/logo.png).
// 512px source, #CE9010. Center hex is pointy-top; stroke midline radius 163.4px, stroke ~20.8px (measured).
let LOGO = null;
const LOGO_COL = "#ce9010", LOGO_MID = 163.4 / 512, LOGO_STROKE = 20.8 / 512;
function markTarget() { return PORT ? { x: W / 2, y: H * 0.37, r: 94 * S } : { x: W / 2 - 362 * S, y: H * 0.47, r: 88 * S }; }
function hexMark(f, V0) {
  // the collapsed graph: VIEWS nodes on a ring; the ring settles onto the logo's center hex, then the honeycomb arrives
  const ringP = eOutCubic(prog(f, 612, 640));
  if (ringP <= 0) return;
  const endP = eIO(prog(f, 638, 664));
  const T = markTarget();
  const cx = lerp(L.treeX, T.x, endP), cy = lerp(L.treeY, T.y, endP), r = lerp(L.hexR, T.r, endP);
  const spin = eIO(prog(f, 638, 684)) * (Math.PI / 3);

  const D = T.r / LOGO_MID; // logo draw size at which its center hex == our ring
  const mk = eOutCubic(prog(f, 660, 684)); // ring -> logo

  }
  const fi = Math.floor(segs), fr = segs - fi;

  }

}

// ---------- scene 6: end card (645-720) ----------
function scene6(f) {
  const lx = PORT ? W / 2 : W / 2 - 190 * S, ly = PORT ? H * 0.575 : H * 0.47 + 36 * S;
  const al = PORT ? "center" : "left";

  mono("AGENT-SWARM.DEV", PORT ? W / 2 : lx + 6 * S, ly + 124 * S, { size: 15, track: 4.5, color: C.amber, align: al, type: (f - 684) * 1.3 });

}

// ---------- master ----------
function shake(f) {

}

}
window.__ready = (async () => {})();
